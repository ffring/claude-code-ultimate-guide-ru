  - "Отменена проверка v2.1.268 правил запрета чтения и редактирования для неанализируемых строк Bash (`eval`, `env -C`); такие команды запрашивают снова, а не отклоняются."
  - "Автоматический режим на Bedrock, Vertex и Foundry по умолчанию использует локальный классификатор; установите `CLAUDE_CODE_AUTO_MODE_SERVER=1` для серверного классификатора платформы."

- version: "2.1.272"
  date: "2026-09-14"
  highlights:
  - "Исправлены ошибки и повышена надежность; восходящий поток не предоставляет никаких дополнительных подробностей"

- version: "2.1.271"
  date: "2026-09-14"
  highlights:
  - "⭐ Добавлена ​​команда `allowed_domains` для каждой команды в Bash, PowerShell и Monitor в автоматическом режиме с песочницей: хосты, необходимые команде, проверяются с ее помощью и открываются только для нее."
  - "Добавлен `omitClaudeMd` во внешний вид агента и `--agents` JSON, что позволяет пользовательским и подключаемым субагентам работать без пользовательских, проектных и локальных файлов CLAUDE.md; файлы управляемой политики все еще загружаются"
  - "Добавлен `--accept-command <sha256>` в `claude plugin install`/`update`, быстрый режим в удаленных сеансах и поддержка мыши на панели `/config`."
  - "Исправлен нечитаемый корпоративный `managed-mcp.json`, который игнорировался: теперь он сохраняет эксклюзивный контроль над MCP и предупреждает при запуске, а также около 80 дополнительных исправлений в MCP, возобновлении, перехватах и ​​рендеринге терминала."
  breaking:
  - "У мониторных часов всегда есть крайний срок (максимум 30 минут, 10 при запуске `-p` с одним запросом); опция `persistent` без тайм-аута удалена."
  - "В автоматическом режиме встроенные команды оболочки `!` навыка или косой черты следуют правилам разрешения режима по умолчанию, а не классификатору."
  - "Размер динамического рабочего процесса по умолчанию невелик в планах Pro, а рекомендуемый размер среднего размера снижается с 15 до 10 агентов."

- version: "2.1.270"
  date: "2026-09-12"
  highlights:
  - "Исправлены команды git только для чтения в Bash, которые неожиданно запрашивали разрешение после того, как сеанс работал некоторое время (регресс в версии 2.1.269)."

- version: "2.1.269"
  date: "2026-09-11"
  highlights:

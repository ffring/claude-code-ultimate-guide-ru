  - "Безопасность: режим фиксированного плана, автоматический запуск команд Bash для изменения файлов (`touch`, `rm`) без запроса разрешения и создание рабочего дерева после зафиксированной символической ссылки `.claude/worktrees` для создания файлов вне репозитория."
  breaking:

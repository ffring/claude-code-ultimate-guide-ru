  - "Добавлен `/output-style [name]` для вывода списка и переключения стилей в терминале, удаленном управлении, облаке и безголовых сеансах."
  - "Исправлена ​​недействительность кэша подсказок после прерванных или ограниченных ходов, а также зависание `/goal` после ошибок или ограничений."
  - "Исправления безопасности касаются разрешений архивов плагинов, мест назначения записи Bash `tee` и отмены правил разрешений, пересекающих источники настроек."

- version: "2.1.268"
  date: "2026-09-10"
  highlights:
  - "Исправлены ошибки HTTP 400 на сторонних конечных точках, совместимых с Anthropic, представленных в версии 2.1.265."
  - "Добавлен 300-секундный крайний срок WebFetch; `CLAUDE_CODE_WEBFETCH_DEADLINE_MS` переопределяет его (0 отключает)"
  - "⭐ Исправления безопасности охватывают правила разрешения символических путей, определения ненадежных товарищей по команде и секреты, показанные в диагностике MCP/plugin."
  - "Улучшена стабильность кэша подсказок в Bedrock, Vertex и Foundry; Изменения `/plugin` теперь применяются при закрытии его меню."
  breaking:
  - "Обычные правила `WebFetch` deny/ask больше не запрещают чтение или обновление артефакта; используйте `Artifact` или `WebFetch(domain:claude.ai)`."

- version: "2.1.267"
  date: "2026-09-09"
  highlights:

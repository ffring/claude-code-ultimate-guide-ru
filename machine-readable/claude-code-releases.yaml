- version: "2.1.243"
  date: "2026-08-24"
  highlights:
  - "В `/usage` добавлена ​​разбивка циклов: количество запусков для каждого цикла, общее количество жетонов, жетонов за запуск и последний запуск."
  - "Добавлен параметр `modelPicker` для управления средством выбора `/model` с упорядоченным помеченным списком моделей."
  - "Добавлены настройки `promptCacheTtl` и `subagentPromptCacheTtl`, чтобы пользователи API-ключа и облачных провайдеров могли сохранять 1-часовой кеш подсказок в основном разговоре, в то время как субагенты остаются на 5 минут."
  - "Добавлен вход без ключа в `/login` → Консоль Anthropic для организаций, которые не допускают использование ключей API."

- version: "2.1.241"
  date: "2026-08-22"
  highlights:

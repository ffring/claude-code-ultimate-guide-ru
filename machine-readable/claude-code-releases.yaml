- version: "2.1.248"
  date: "2026-08-27"
  highlights:
  - "⭐ Добавлен `--restricted` (или `CLAUDE_CODE_RESTRICTED=1`): удаляет инструменты, запускающие команды или код, и `WebFetch`, сохраняет файловые инструменты внутри рабочего каталога, отказывается от `bypassPermissions`, игнорирует настройки user/project/local."
  - "Добавлен межсессионный обмен сообщениями (`SendMessage`/`ListAgents`) между сеансами на одном компьютере в Bedrock, Vertex и Foundry, а также при отключенной телеметрии."
  - "Исправлена ​​ошибка кэширования подсказок (и потеря контекста расширенного мышления) примерно раз в час в длительных сеансах, вызванная повторной отрисовкой определений инструментов после обновления токена OAuth."
  - "Добавлен `experimental.cacheTtl` (`\"5m\"` или `\"1h\"`) в заголовок агента для TTL кэша подсказок для каждого агента."

- version: "2.1.247"
  date: "2026-08-26"
  highlights:
  - "Добавлен инструмент `SendFeedback`: Claude может составить отчет об отзывах, который вы сможете просмотреть и отправить из `/feedback`."
  - "Изменено окно автосжатия по умолчанию в Sonnet 5 на полный контекст 1M, автоматическое сжатие при ~967K токенов вместо ~934K."
  - "Добавлен `/claude-api cost-optimize` для профилирования расходов проекта Claude API и работы с рычагами затрат."
  - "Исправлена ​​смерть субагентов при модели первого вызова 404: теперь они используют цепочку резервных моделей сеанса."

- version: "2.1.246"
  date: "2026-08-25"
  highlights:

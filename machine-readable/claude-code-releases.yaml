  - "⭐ Исправлены одновременные сеансы, которые молча отменяли изменения `~/.claude.json` друг друга, сбрасывали доверие к рабочему пространству и теряли состояние MCP/project."
  - "Исправлены правила запрета Bash `Read()`, не охватывающие файлы, переданные в качестве значений опции (`--ignore-revs-file=.env`) или операнды `git diff`/`git grep`."

- version: "2.1.258"
  date: "2026-09-01"
  highlights:

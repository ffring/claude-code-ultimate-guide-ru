  - "В `/permissions` добавлена ​​вкладка «Автоматический режим» для просмотра и редактирования правил классификатора автоматического режима."
  - "Исправлен инструмент записи, сообщающий «Недостаточно памяти» или зависающий на долгое время после перезаписи очень большого существующего файла, даже если файл был записан."
  - "Улучшены неинтерактивные сеансы (`-p`, SDK, облачные сеансы) для автоматического продолжения ответа, прерываемого в середине потока из-за ошибки сервера, потери соединения или зависания."

- version: "2.1.245"
  date: "2026-08-25"
  highlights:

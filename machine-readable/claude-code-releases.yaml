- version: "2.1.240"
  date: "2026-08-22"
  highlights:
  - "Исправлены ошибки и повышена надежность"

- version: "2.1.239"
  date: "2026-08-21"
  highlights:
  - "⭐ Исправлена ​​потоковая передача Bedrock за прокси-серверами, которые удаляли заголовок Content-Type ответа, что автоматически удваивало тарифицируемые вызовы API путем повторного запуска каждого хода без потоковой передачи."
  - "Windows: теперь доступен межсессионный обмен сообщениями, поэтому сеансы Claude Code на ваших машинах могут отправлять друг другу сообщения с помощью `SendMessage` и находить друг друга с помощью `ListAgents`, как в macOS и Linux."
  - "Смета затрат (`/cost`, строка состояния, `--max-budget-usd`) теперь включает надбавку за логический вывод в размере 1,1 × только для США для рабочих областей размещения данных."
  - "Добавлен `/claude-api upgrade` для миграции проектов Python с `anthropic` 0.x на 1.x."

- version: "2.1.238"
  date: "2026-08-20"
  highlights:
  - "Добавлен параметр `keybindingFlavor`: установите его на `\"readline\"`, чтобы Ctrl+W в командной строке удалял обратно к предыдущему пробелу, как в Bash."
  - "Торговые площадки плагинов: `headersHelper` на URL-адресе торговой площадки или в записи каталога запускает команду, которая создает недолговечные заголовки HTTP для выборки каталога и архива."
  - "Исправлен неограниченный рост памяти в длительных интерактивных сеансах: результаты инструмента субагента теперь публикуются, как только они покидают последнее окно отображения."
  - "Добавлен `claude self-hosted-runner --defer-shutdown-max-min` для корректного использования SIGTERM и `--proxy-authorization-command`/`--proxy-authorization-file` для выходных прокси, требующих свежевыданного заголовка."

- version: "2.1.237"
  date: "2026-08-19"
  highlights:
  - "Добавлен встроенный стиль вывода «Краткий»: Claude приводит результаты и пропускает преамбулу и повествование, которые можно выбрать в разделе «Стиль вывода» в `/config`."
  - "Исправлено кэширование запросов для сеансов, выполняемых через шлюз LLM или пользовательский базовый URL-адрес."

- version: "2.1.236"
  date: "2026-08-19"
  highlights:
  - "Добавлен `ANTHROPIC_DEFAULT_MODEL`: устанавливает модель начала новых сеансов, в то время как выбор `/model` по-прежнему переопределяет ее и сохраняется при перезапусках (в отличие от `ANTHROPIC_MODEL`)."
  - "Добавлен `notify_when_idle` в межсессионный `SendMessage`: другой сеанс на машине отправляет одно уведомление, когда он в следующий раз переходит в режим ожидания, согласие и одноразовый опрос, без опроса (macOS и Linux)"
  - "Песочница на macOS: правила запрета чтения с подстановочными знаками, такие как `**/.env`, теперь имеют приоритет внутри разрешенных регионов чтения, охватывают соответствующие каталоги и сохраняются при переименовании запрещенного файла."
  - "Автоматический режим: разрешающие правила `Monitor` отменяются во время работы автоматического режима, Bedrock/Vertex/Foundry получает те же значения классификатора по умолчанию с оценкой серьезности, что и Claude API, а проверка статуса git больше не доверяет `status.showUntrackedFiles=no`."

- version: "2.1.235"
  date: "2026-08-18"
  highlights:

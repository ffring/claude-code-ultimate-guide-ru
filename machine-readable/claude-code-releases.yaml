  - "Добавлены настройки `bashOutputMaxChars`/`taskOutputMaxChars` для увеличения пределов встроенного вывода command/background-task до 128 тыс. символов."
  - "Исправлено возобновление сеанса с потерей вывода перехватчика и другого контекста вокруг параллельных вызовов инструментов, что изменило возобновленный запрос."
  - "Улучшено сообщение безопасности «опасный-`rm`», теперь оно также позволяет перехватывать `rm -rf` в позиционных параметрах и внутри цитируемых скриптов `sh -c`."

- version: "2.1.260"
  date: "2026-09-03"
  highlights:
  - "⭐ Добавлена ​​панель `/diff`, показывающая незафиксированные изменения рядом с разговором в полноэкранном режиме как изменения Claude."
  - "⭐ Исправления безопасности: правила разрешений `Edit`/`Write`/`Read` с круглыми скобками в пути были автоматически удалены (оставляя папки «только для чтения» доступными для записи); один некомпилируемый шаблон разрешений нарушил работу каждого репозитория редактирования файлов"
  - "Добавлена ​​подсказка о вероятной причине промахов в кэше запросов в `/cost` и поле `prompt_cache` строки состояния."
  - "Исправлены агенты `model: fable`, игнорирующие тег `[1m]` на `ANTHROPIC_DEFAULT_FABLE_MODEL`, тихо работающие с окном контекста 200 КБ вместо 1 М."

- version: "2.1.259"
  date: "2026-09-02"

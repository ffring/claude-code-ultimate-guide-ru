  - "Добавлен инструмент EndConversation, позволяющий Claude завершать сеансы с крайне злоупотребляющими пользователями или попытками взлома, а также периодический контрольный сигнал прогресса для длительных вызовов инструментов, которые ранее молчали."
  - "OpenTelemetry: добавлены атрибуты журнала `message.uuid`, `client_request_id` и `tool_source` для корреляции на уровне сообщений, а также `CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH` для настройки предела усечения содержимого в 60 КБ."
  - "Исправлены ошибки жизненного цикла фонового сеанса: бездействующие сеансы поддерживают работу демона, завершенные сеансы невозможно удалить с помощью `claude rm`, а смещенный демон удаляет управляющий сокет своего преемника."
  breaking:
  - "Single-segment `dir/**` хук `if:` условия теперь совпадают только `<cwd>/dir`; писать `**/dir/**` для сопоставления любой глубины (`deny`/`ask` правила разрешений сохраняют соответствие любой глубины)"
  - "Команды `file`, использующие `-m`/`--magic-file` или `-f`/`--files-from`, теперь требуют разрешения, а не автоматически разрешаются только для чтения."
  - "Команды `docker` (включая прокладку Podman), содержащие флаги перенаправления демона (`--url`, `--connection`, `--identity`, удаленный режим Podman), теперь запрашивают разрешение."


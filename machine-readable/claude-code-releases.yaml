  - "⭐ Безопасность: в автоматический режим добавлено правило Containment Escape, запрещающее выборку облачных метаданных, уклонение от исходящего трафика и охват нескольких клиентов."
  - "Добавлен однократный запрос автоматического режима перед чтением первого файла за пределами рабочих каталогов (`permissions.blockReadsOutsideWorkingDirectories`)."
  - "Изменен `defaultMode: \"bypassPermissions\"` в настройках project/local, чтобы он игнорировался, как `\"auto\"`; вместо этого установите его в пользовательских или управляемых настройках"

- version: "2.1.252"

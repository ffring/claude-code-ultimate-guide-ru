# ════════════════════════════════════════════════════════════════
# SUMMARY - Key Breaking Changes by Area
# ════════════════════════════════════════════════════════════════
breaking_summary:
  urls:
  - "OAuth/API Console: console.anthropic.com → platform.claude.com (v2.1.0, v2.1.7)"
  windows:
  - "Managed settings: C:\\ProgramData\\ClaudeCode → C:\\Program Files\\ClaudeCode (v2.0.58, deprecated v2.1.2)"
  sdk:
  - "Removed legacy SDK entrypoint → @anthropic-ai/claude-agent-sdk (v2.0.25)"
  - "Minimum zod peer dependency: ^4.0.0 (v2.1.0)"
  shortcuts:
  - "Removed # shortcut for quick memory (v2.0.70)"
  - "`modelPicker:setAsDefault` keybinding renamed to `modelPicker:thisSessionOnly` (v2.1.153)"
  security:
  - "Fixed missing permission-denial telemetry for managed `PreToolUse` hooks (v2.1.326) and a security issue in zstd response decoding (v2.1.325)."
  - "MCP OAuth requests no longer send secrets such as refresh tokens to another host on a redirect, read-only Bash commands no longer run outside the sandbox without a prompt, Bash permission checks judge writes from the right folder, and deny rules cover the file a `cp` or `mv` into a directory writes (v2.1.321); Monitor's WebSocket watch follows every Bash rule and an exact ask rule is refused under a broader deny (v2.1.319); a web or shell tool call that would send the account email address asks first (v2.1.317)"
  - "`--restricted` sessions no longer upload files from outside the working directories under a Read allow rule, PowerShell hooks that start with a type cast, `param`, `using` or an attribute block on exit code 2, and the Claude apps gateway checks every model a request names (v2.1.316); sandbox protections apply to worktrees entered by `claude -p --resume` or `--continue`, Bash-matching hooks run on Monitor tool commands, `--setting-sources` exclusions hold for auto mode rules and permission consents, and remote-only `forceRemoteSettingsRefresh` no longer lapses when the stored copy expires (v2.1.314)"
  - "Sandboxed Bash no longer runs the shell's startup files outside the sandbox, macOS `denyWrite` globs apply through symlinked folders, sandboxed commands and auto-accepted edits can no longer modify the `--mcp-config` file, Bash permission checks no longer trust a variable from a failable redirect or skip a wrapped `cd` before git, `Edit(path)` deny rules block subshell redirects, and Linux sandbox write denies hold after the session ends (v2.1.309); Windows hooks whose command is only quoted strings fail closed without Git Bash (v2.1.310); `rm -r` of a mounted drive gets the safety prompt (v2.1.304)"
  - "A sandboxed command can no longer write into a `--plugin-dir` folder, reach macOS denied paths through a symlink or keep glob grants after a symlink swap, plan mode no longer runs writes a hook allowed, third-party gateway API keys stay out of Anthropic requests, MCP servers wait for policy checks and allow rules match only the named server, and Windows guard hooks fail closed without Git for Windows (v2.1.299); hook `updatedInput` is validated like Claude's own input and a login refused by `forceLoginOrgUUID` no longer leaves its token stored (v2.1.300)"
  - "Bash commands that assign and use `BASH_ARGV0` prompt instead of auto-approving, managed `PreToolUse` deny hooks with `\"continue\": false` end the turn, cloud sessions run auto mode checks on Claude in Chrome actions and Git Bash `rm -rf /c/Users/<name>` asks in bypass mode (v2.1.296); `--tools` and `--restricted` cover built-in tools registered after launch, Chrome `host:80` deny rules apply to `http://` pages and mod guard hooks no longer see truncated tool input (v2.1.295); instruction-style `prompt` and `agent` hooks block what they describe (v2.1.294)"
  - "Symlinked writes are checked at their actual destination (v2.1.280); background sessions require workspace trust, child sessions inherit setting-source restrictions, NUL permission rules match nothing and command-substitution-only recursive rm prompts (v2.1.281)"
  - "A `sandbox.excludedCommands` glob no longer exempts a whole compound Bash command when one part matches, and subagent results reach the main agent under a header marking them as subagent output (v2.1.277); plugin and marketplace URLs no longer show passwords or tokens, and sandboxed Bash can write to project folders named `hooks/` or `config/` (v2.1.275)"
  - "Unanalyzable Bash commands no longer skip the prompt under `permissions.blockReadsOutsideWorkingDirectories`, and managed MCP restrictions apply alongside server-managed settings (v2.1.273); MCP-config secrets no longer shown in connection errors and worktree-isolated nested shell expansions refused (v2.1.274)"
  - "Per-command `allowed_domains` scope host access to the reviewed command in auto mode with sandboxing (v2.1.271); plugin archive access and Bash tee destination checks corrected (v2.1.269); symlinked-path rules and MCP/plugin secret redaction corrected (v2.1.268); unreadable managed allowlists fail closed (v2.1.267)"
  - "Windows NT-namespace (`\\??\\`) paths bypassing UNC path validation, an NTLM credential-leak vector, rejected in Bash paths (v2.1.233) then across remote reads, session restore, CLAUDE.md includes, workflow scripts, and uploads (v2.1.234)"
  - "Plugin shell-form command injection via `${user_config.*}` fixed, now rejected (v2.1.207)"
  - "Command injection fix in bash processing (v2.1.2)"
  - "Wildcard permission rules compound commands fix (v2.1.7)"
  - "Shell line continuation permission bypass fix (v2.1.6)"
  - "Sandbox-excluded commands bypass with autoAllowBashIfSandboxed (v2.1.34)"
  - "Heredoc delimiter command smuggling prevention (v2.1.38)"
  installation:
  - "npm installations deprecated - use native installer (v2.1.15)"
  - "Self-hosted runner on Windows requires an explicit `--base-dir`; no default checkout directory (v2.1.229)"
  models:
  - "Fast mode for Opus 4.8 deprecated October 30, 2026 and scheduled for removal November 30, 2026, with no fallback to standard Opus 4.8 after removal; migrate to Opus 5.5 (v2.1.316)"
  - "Opus 4 and Opus 4.1 removed from Claude Code first-party API — auto-migrated to Opus 4.6 (v2.1.68)"
  - "Opus 4.7 removed from fast mode; `/fast` applies to Opus 5 and Opus 4.8 only (v2.1.219)"
  behavior:
  - "More `rm` commands aimed at the root, home, a top-level folder or the working folder ask or are refused; `deniedMcpServers` name entries hide only the named claude.ai connector (deny its exact URL to block all). (v2.1.330)"
  - "In Code Mode, a `PreToolUse` hook that errors no longer refuses a script's tool call (`\"onFailure\": \"block\"` restores refusal); most scheduled tasks saved by earlier versions need scheduling again in new signed-in sessions. (v2.1.329)"
  - "Managed `PostToolUse` hooks skip calls refused before they ran, Code Mode skips `UserPromptSubmit` hooks on script output, and a `PermissionRequest` rewrite to a sandbox-excluded command runs outside the sandbox. (v2.1.328)"
  - "`permissions.blockReadsOutsideWorkingDirectories` asks about or refuses more Bash commands, some symbolic links are refused, and auto mode ignores more run-any-package allow rules such as `Bash(pnpm dlx *)`. (v2.1.327)"
  - "More shell calls can ask for approval or be denied, hook `decision: block` applies in more cases, and a proxy must accept CONNECT for Remote Control. (v2.1.326)"
  - "Unrecognized model IDs default to 1M context (`CLAUDE_CODE_DISABLE_1M_CONTEXT=1` keeps 200K). The v1 MCP client is removed and `MCP_SDK_GENERATION=v1` selects v2 compatibility mode. (v2.1.323)"
  - "Auto mode with telemetry or feature flags off, including behind LLM gateways, no longer falls back to the built-in classifier (`CLAUDE_CODE_AUTO_MODE_SERVER=0` keeps it); self-paced `/loop` ends without a fallback wakeup (`CLAUDE_CODE_LOOP_KEEPALIVE=1` keeps it). (v2.1.319)"
  - "Claude Code no longer installs or updates the IDE extension when started in an IDE terminal. (v2.1.318)"
  - "The Read tool's \"file unchanged\" stub is removed: reading an unchanged file again returns its content. (v2.1.317)"
  - "Server-managed settings for Team and Enterprise logins apply without an approval prompt; a stored copy that does not verify is refused. (v2.1.316)"
  - "The `claude_code.safety_event` OpenTelemetry event is no longer sent; unrecognized model names on Bedrock, Vertex, Foundry and Mantle get the shorter system prompt (`CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=0` keeps the full one); prompt and agent hooks run at most 24 at a time per session. (v2.1.312)"
  - "Bedrock, Mantle, Vertex and Foundry load model settings from a signed file on downloads.claude.ai (`CLAUDE_CODE_MODEL_CATALOG=off` turns this off); JSON output escapes DEL, C1 control and Unicode format characters as `\\uXXXX`. (v2.1.311)"
  - "Older CLI versions skip settings files containing `\"attribution\": false`; keep the object form in files shared across versions. (v2.1.281)"
  - "Server-side auto mode review now also gates read-only and sandboxed shell commands; `CLAUDE_CODE_AUTO_MODE_SERVER=0` also opts out on direct Anthropic API connections, where the local classifier counts toward usage. (v2.1.281)"
  - "Dangerous-rm prompts in auto and bypass modes deny after two unanswered minutes; `CLAUDE_CODE_DISABLE_DANGEROUS_RM_TIMEOUT=1` disables the timeout. (v2.1.281)"
  - "Self-hosted runner wrappers and command hooks that append system prompts must use `--system-prompt-file` or `--append-system-prompt-file`. (v2.1.281)"
  - "Pro and Team Standard default to Opus instead of Sonnet; newly released models no longer inherit effort levels saved before effort became per-model. (v2.1.280)"
  - "`PermissionRequest` no longer runs agent-type hooks; use command or HTTP hooks. (v2.1.280)"
  - "Marketplaces with names imitating reserved marketplace names are refused and existing ones stop loading. (v2.1.280)"
  - "Dialog confirmation uses Enter/Esc instead of stray y/n keys; explicit confirm:yes/confirm:no bindings restore y/n. Fullscreen ctrl+l/cmd+k redraws instead of clearing the transcript. (v2.1.280)"
  - "Auto mode defaults to the server-side classifier on the Claude API, Enterprise, Bedrock, Vertex, Foundry and gateways; `CLAUDE_CODE_AUTO_MODE_SERVER=0` opts out on the cloud providers and gateways (v2.1.278)"
  - "TaskOutput tool removed; background task output is read with Read, and `taskOutputMaxChars` and `TASK_MAX_OUTPUT_LENGTH` have no effect (v2.1.277)"
  - "`\"type\": \"sdk\"` MCP entries outside an SDK host application are skipped with a warning (v2.1.274)"
  - "Bedrock, Vertex, Foundry and telemetry-disabled installs default to the v2 MCP client and MCP 2026-07-28 negotiation; opt out with `MCP_SDK_GENERATION=v1` or `MCP_PROTOCOL_NEGOTIATION=legacy` (v2.1.274)"
  - "`/code-review` uses inline review prompts instead of many review subagents for models without tuned settings (v2.1.274)"
  - "Plugin and marketplace clones leave Git LFS files as pointers; run `git lfs pull` (v2.1.274)"
  - "Auto mode on Bedrock, Vertex and Foundry uses the local classifier by default; `CLAUDE_CODE_AUTO_MODE_SERVER=1` restores the server-side classifier (v2.1.273)"
  - "Unanalyzable Bash lines (`eval`, `env -C`) prompt again instead of being denied by Read/Edit deny rules, reverting v2.1.268 (v2.1.273)"
  - "Plain `WebFetch` deny/ask rules no longer gate Artifact reads or updates; use `Artifact` or `WebFetch(domain:claude.ai)`. (v2.1.268)"
  - "Managed `forceLoginGatewayUrl` now selects gateway authentication at startup; leftover claude.ai credentials or API keys are not used. (v2.1.265)"
  - "ultrathink/think keywords now cosmetic only — thinking default with Opus 4.5 (v2.0.67)"
  - "ultrathink keyword re-introduced — now enables high effort for next turn (v2.1.68)"
  - "Dynamic workflow trigger keyword renamed `workflow` → `ultracode` (v2.1.160)"
  - "'default' permission mode renamed 'Manual' across CLI/VS Code/JetBrains — `--permission-mode manual` and `defaultMode: manual` now accepted alongside `default` (v2.1.200)"
  - "Task tool's `mode` parameter deprecated (now ignored); subagents inherit the parent session's permission mode (v2.1.212)"
  - "Subagent nesting disabled by default (v2.1.217), then restored to depth 3; set `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=1` to disable (v2.1.219)"
  - "Skills with `context: fork` run in the background by default; opt out with `background: false` (v2.1.218)"
  - "`/deep-research` starts only when invoked manually; Claude no longer launches it on its own (v2.1.218)"
  - "Dynamic workflows default to a medium size guideline (fewer than 15 agents); change with Dynamic workflow size in `/config` (v2.1.219)"
  - "Removed the 200-subagent-per-session spawn cap; concurrency and depth limits still apply (v2.1.224)"
  - "`/feedback` transcript share also uploads the last request's system prompt (including `CLAUDE.md`), tool definitions, and model parameters, with consent; secrets stay redacted (v2.1.224)"
  - "Write tool lets newer models overwrite a file they have not read this session, matching Edit; older models still require the read (v2.1.228)"
  - "`/commit-push-pr` no longer auto-approves git/gh commands carrying `--force`, `--amend`, `--no-verify` (v2.1.229)"
  - "Subagent forking on by default: `subagent_type: \"fork\"` inherits the full conversation and prompt cache, and non-teammate agent spawns run in the background (v2.1.232)"
  - "Todo/task tools (TaskCreate/Get/Update/List, TodoWrite) no longer available on Opus 4.8, Sonnet 5, Fable 5, Mythos 5, and newer models; set `CLAUDE_CODE_ENABLE_TODO_TOOLS=1` to restore (v2.1.233)"
  - "Reverted the v2.1.232 Bash permission changes for Cygwin-style symlinks on Windows and for input redirections (`< file`); a narrower version returns later (v2.1.233)"
  - "Removed the \"Default teammate model\" setting from `/config`; agent-team teammates use the leader's model unless the spawn names one (v2.1.234)"
  - "Claude Code continues a session automatically when a claude.ai usage limit resets; turn it off in `/config` (v2.1.234)"
  - "`defaultMode: \"bypassPermissions\"` in `.claude/settings.json` or `.claude/settings.local.json` is now ignored, like `\"auto\"`; set it in user or managed settings, or pass `--permission-mode` (v2.1.257)"
  syntax:
  - "Indexed argument syntax changed: $ARGUMENTS.0 → $ARGUMENTS[0] (v2.1.19)"
  - "`Write(path)`, `NotebookEdit(path)`, and `Glob(path)` permission rules now warn at startup — use `Edit(path)` or `Read(path)` (v2.1.210)"
  - "Monitor watches always have a deadline (30 min max, 10 in `-p` runs); the no-timeout `persistent` option is removed (v2.1.271)"
  - "In auto mode, inline `!` shell commands in skills and slash commands follow default-mode permission rules instead of the classifier (v2.1.271)"
  - "Single-segment `dir/**` hook `if:` conditions match only `<cwd>/dir` — write `**/dir/**` for any-depth matching (`deny`/`ask` permission rules keep any-depth) (v2.1.214)"
  - "`file -m`/`--magic-file`/`-f`/`--files-from` and `docker` daemon-redirect flags (`--url`, `--connection`, `--identity`) now require permission (v2.1.214)"
  agents:
  - "Agent markdown files reject agent names containing `:`, reserved for plugin namespacing (v2.1.218)"
  plugins:
  - "`${user_config.*}` in shell-form plugin commands rejected; use exec form or `$CLAUDE_PLUGIN_OPTION_<KEY>` (v2.1.207)"
  - "Plugin option values (`pluginConfigs`) no longer read from project-level `.claude/settings.json` (v2.1.207)"
  - "`sandbox.ripgrep` honored only from user, managed, and `--settings` settings; project settings can no longer override it (v2.1.232)"


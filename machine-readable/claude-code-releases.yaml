  - "Добавлен `--system-prompt-snapshot off` для повторного отображения системного приглашения для каждого запроса во время итерации приглашения."
  - "Исправлены потери кэша подсказок и мышления при переподключении инструментов, переключении моделей и возобновлении session/subagent."
  - "Исправления безопасности отклоняют нечитаемые управляемые списки разрешений hook/channel и закрывают обход сдерживания обратной косой черты на рынке."

- version: "2.1.266"
  date: "2026-09-08"
  highlights:

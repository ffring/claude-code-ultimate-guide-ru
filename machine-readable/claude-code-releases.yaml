  - "Добавлено ограничение в 1 ГБ для результатов инструмента, сохраняемых на диск, при этом сокращение отображается в предварительном просмотре беседы."
  - "Исправлено повторное использование кэша подсказок возобновленного субагента и сохранены прерванные вызовы инструментов после сбоя процесса."
  - "Исправления безопасности закрывают обходы сдерживания обратной косой черты плагина и предотвращают запуск фильтров git clean во вложенном репозитории во время зондирования status/diff."
  breaking:
  - "Управляемый `forceLoginGatewayUrl` теперь выбирает аутентификацию шлюза при запуске; оставшиеся учетные данные claude.ai или ключи API не используются."

- version: "2.1.263"
  date: "2026-09-06"
  highlights:
  - "Исправлены ошибки и повышена надежность; восходящий поток не предоставляет никаких дополнительных подробностей"

- version: "2.1.261"
  date: "2026-09-04"
  highlights:

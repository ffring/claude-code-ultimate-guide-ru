  - "⭐ Исправления безопасности: замена символических ссылок в обход проверок разрешений файлового инструмента, пути команд магазина плагинов, выходящие из каталога плагинов, перенаправление выходных файлов Bash в песочнице."
  - "Изменен `CLAUDE_CODE_SUBAGENT_MODEL`, чтобы установить значение по умолчанию, а не переопределять `model:` на уровне агента и переопределения для каждого появления."

- version: "2.1.250"
  date: "2026-08-27"
  highlights:

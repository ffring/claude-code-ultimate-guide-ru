latest: "2.1.330"
updated: "2026-11-21"

# ════════════════════════════════════════════════════════════════
# RELEASES (newest first, condensed highlights only)
# ════════════════════════════════════════════════════════════════
releases:

  # ─────────────────────────────────────────────────────────────
  # 2.1.x Series (January-August 2026)
  # ─────────────────────────────────────────────────────────────

- version: "2.1.330"
  date: "2026-11-20"
  highlights:
  - "⭐ После `claude auth login` организации, управляемые в консоли администрирования предприятия Anthropic, применяют свои настройки и своего облачного провайдера или шлюз."
  - "Добавлен мольберт, встроенный мод, рисующий диаграммы по запросу и по результатам метрик MCP (автоматические диаграммы можно отключить в `/config`)"
  - "Повторяющиеся запланированные задачи и `/loop` выполняются до 30 дней вместо 7, пока их сеанс продолжает работать."
  - "Исправлен `ExitWorktree`, удаляющий рабочее дерево, которое использовал другой запущенный сеанс, и восстановлена ​​автоматическая повторная попытка `max_tokens`, удаленная в версии 2.1.329."
  breaking:
  - "Другие команды `rm`, направленные в корневую, домашнюю папку, папку верхнего уровня или рабочую папку, требуют одобрения и отклоняются там, где никто не может ответить. Записи имени `deniedMcpServers` скрывают только именованный соединитель claude.ai; запретить его точный URL-адрес, чтобы заблокировать каждый соединитель по этому URL-адресу."

- version: "2.1.329"
  date: "2026-11-19"
  highlights:
  - "В диалоговом окне доверия указывается, где объявлены перехватчики папки, а неинтерактивные хосты предупреждают, когда управляемые перехватчики не загружаются."
  - "`/tasks` перечисляет запланированные задачи, пробуждения `/loop`, цель и развилки; Режим кода может работать с включенными событиями и метриками OpenTelemetry."
  - "`/code-review` без цели проверяет всю ветку на соответствие ветке по умолчанию."
  breaking:
  - "В режиме кода перехватчик `PreToolUse`, вызывающий ошибки, больше не отклоняет вызов инструмента сценария; установите `\"onFailure\": \"block\"` на хук, который должен отказаться. В новых сеансах входа в систему большинство запланированных задач, сохраненных в более ранних версиях, необходимо снова запланировать."

- version: "2.1.328"
  date: "2026-11-18"
  highlights:
  - "⭐ Автоматический режим для Opus 4.6 и Sonnet 4.6 на Amazon Bedrock, платформе агентов Google Cloud, Microsoft Foundry и шлюзе приложений Claude."
  - "Перехватчики `mcp_tool` принимают `\"onFailure\": \"block\"`, а `/status` и `claude doctor` помечают экспортер OpenTelemetry без конечной точки."
  - "`/code-review` сообщает только об ошибках и нарушениях CLAUDE.md, помеченных как «Важные», «Ранее существующие» или «Nit»; `/simplify` занимается очисткой"
  breaking:
  - "Управляемые перехватчики `PostToolUse` больше не срабатывают в случае отклонения вызовов до их выполнения, а в режиме кода больше не выполняются перехватчики `UserPromptSubmit` при выводе сценариев (используйте `PostToolUse` с `updatedToolOutput`). Команда, которую перехватчик `PermissionRequest` перезаписывает в команду, исключенную из песочницы, выполняется за пределами песочницы."

- version: "2.1.327"
  date: "2026-11-17"
  highlights:
  - "`claude mcp add-json <name> -` считывает сервер JSON со стандартного ввода, поэтому токены не попадают в командную строку."
  - "`/status` перечисляет неработающие файлы агентов, навыков, команд и стилей вывода, недоступную песочницу, игнорируемые настройки разрешений и средства сопоставления перехватчиков, которые никогда не совпадают."
  - "Claude приказывают не сохранять файлы, которые могут содержать секреты, а Claude в Chrome отказывается загружать некоторые файлы учетных данных."
  breaking:
  - "`permissions.blockReadsOutsideWorkingDirectories` запрашивает или отклоняет дополнительные команды Bash, проверки путей отклоняют некоторые символические ссылки, а некоторые пути больше не считаются внутри рабочего каталога. Автоматический режим игнорирует дополнительные правила, разрешающие запуск любого пакета, например `Bash(pnpm dlx *)`. `ExitWorktree` запрашивает это перед удалением рабочего дерева, в котором могут содержаться несохраненные работы."

- version: "2.1.326"
  date: "2026-11-16"
  highlights:
  - "⭐ Режим кода может работать вместе с командами агентов."
  - "При запуске предупреждается о неправильных правилах инструмента, а `/status` сообщает, когда поставщик или среда отключает функции."
  - "Исправлена ​​отсутствующая телеметрия об отказе в разрешении для управляемых перехватчиков `PreToolUse` и усилены проверки в песочнице."
  - "Исправлена ​​ошибка, из-за которой в фоновых сеансах терялся настроенный шлюз, а при возобновлении сеансов терялась история разговоров."
  breaking:
  - "Для большего количества вызовов оболочки и PowerShell может потребоваться одобрение или отказ, включая некоторые вызовы в режиме обхода разрешений. Хук, возвращающий `decision: block`, теперь может блокироваться в большем количестве случаев."
  - "Для удаленного управления теперь требуется, чтобы прокси-сервер принимал туннели CONNECT. Перехватчики HTTP игнорируют настроенные заголовки `Content-Length` и `Transfer-Encoding`."

- version: "2.1.325"
  date: "2026-11-13"
  highlights:
  - "Исправлена ​​проблема безопасности при декодировании ответа zstd."
  - "Исправлены субагенты, использующие неправильную модель в режиме планирования, и сбои уплотнения на многих сторонних шлюзах и Foundry."
  - "Исправлены фоновые сеансы, получавшие учетные данные из оболочки службы, и возобновленные сеансы, терявшие последние ходы после внезапного выхода."

- version: "2.1.323"
  date: "2026-11-12"
  highlights:
  - "⭐ Представлен экспериментальный режим кода, в котором Claude вызывает инструменты из JavaScript."
  - "Плагины могут объявлять диапазон версий Claude Code, а `claude plugin validate` теперь проверяет типы перехватчиков TypeScript."
  - "Добавлен 30-секундный контрольный сигнал прогресса во время длинных перехватов в сеансах `claude -p` и SDK, а также поддержка DOCX для ресурсов артефактов."
  breaking:
  - "Нераспознанные идентификаторы моделей теперь по умолчанию относятся к контекстному окну 1M. Установите `CLAUDE_CODE_DISABLE_1M_CONTEXT=1`, чтобы сохранить значение по умолчанию 200K, когда это необходимо меньшей сторонней модели."
  - "Удален клиент v1 MCP. `MCP_SDK_GENERATION=v1` теперь выбирает режим совместимости v2. Завершение входа в MCP с помощью инструмента требует подтверждения, в том числе в автоматическом режиме и режиме обхода."
  - "Вне режимов автоматического и обходного режима `/security-review` запрашивает это перед запуском. Песочница Bash блокирует создание, перемещение и удаление рабочих деревьев на macOS и Linux."

- version: "2.1.322"
  date: "2026-11-10"
  highlights:
  - "Добавлен быстрый режим для Vertex AI в регионах мира, США и ЕС, с возможностью возврата к стандартной скорости, если Vertex отказывается от нее."

- version: "2.1.321"
  date: "2026-11-09"
  highlights:
  - "⭐ Добавлен Claude Fable 5.2 (`claude-fable-5-2`), теперь модель Fable по умолчанию, с контекстом 1M по цене 8/40 долларов США за Mtok и чтением кэша $0.20/Mtok."
  - "Добавлен `--settings <file>` в `claude remote-control`, применяемый к каждому запускаемому сеансу (измененный файл применяется после перезапуска `claude remote-control`)"
  - "Исправлены запросы MCP OAuth, отправляющие секреты, такие как токены обновления на другой хост при перенаправлении, команда Bash только для чтения, выполняемая вне песочницы без запроса, проверки разрешений Bash при оценке записи из неправильной папки, а также запретные правила и запросы защищенных файлов, пропускающие файл, который `cp` или `mv` записывает в каталог."
  - "Исправлены Edit и NotebookEdit на сетевых путях (общие ресурсы UNC, папки WSL, монтирования `/net`), изменяющие неправильное соответствие, заменяющие весь файл пустым `old_string` или перезаписывающие первую ячейку записной книжки; быстрый режим теперь сначала пробует стандартную скорость на той же модели, когда быстрое обслуживание ограничено по скорости или не работает."

- version: "2.1.319"
  date: "2026-11-06"
  highlights:
  - "⭐ Добавлен `permissions.denyInsteadOfPrompting`: вызов инструмента, ожидающего запроса разрешения, отклоняется, и ход продолжается в терминальных сеансах, субагентах и ​​товарищах по команде."
  - "Добавлены задачи MCP в терминал: вызов инструмента на сервер MCP запускается при переходе задачи в фоновый режим, а Claude получает результат по завершении (вместо этого `CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND` ждет, `CLAUDE_CODE_DISABLE_MCP_TASKS=1` их выключает), плюс `CLAUDE_CODE_DISABLE_FEATURE_FLAGS` и `/claude-api latency-optimize`"
  - "Изменена загрузка вложенных навыков: при включенной песочнице Bash папки `.claude/skills` под стартовой папкой загружаются только при запуске или `/cd` там; `which` с флагами вне набора поиска теперь запрашивает, а точное правило запроса Bash или PowerShell отклоняется, когда более широкое правило запрета охватывает команду."
  - "В `/tasks` добавлена ​​строка «Ранее в этом сеансе», в которой перечислены завершенные субагенты, которые можно повторно открыть и отправить сообщение даже после перезапуска."
  breaking:
  - "Автоматический режим с отключенными телеметрией или флагами функций, в том числе за шлюзами LLM, больше не обращается к встроенному классификатору: вызовы, которые сервер не может проверить, запрашиваются или отклоняются; установите `CLAUDE_CODE_AUTO_MODE_SERVER=0`, чтобы сохранить встроенный классификатор (Bedrock, Vertex и Foundry не изменились)."
  - "`/loop` в самостоятельном темпе заканчивается, когда ход заканчивается без перепланирования вместо планирования резервного пробуждения; `CLAUDE_CODE_LOOP_KEEPALIVE=1` сохраняет старое поведение. `shortcuts_list` и `shortcuts_execute` были удалены из встроенного Claude в инструментах Chrome."

- version: "2.1.318"
  date: "2026-11-03"
  highlights:
  - "Добавлены результаты `loginExpiresAt` в `claude auth status`, `credential_expires_at` в `claude -p` JSON и предупреждение stderr в текстовом выводе `claude -p`, начиная за 10 дней до окончания сохраненного входа в систему claude.ai."
  - "Добавлена ​​опция `effort` к `$.model.fork` и `assume_role` мода на `mantle`, расположенных выше шлюза приложений Claude."
  - "Изменены записи URL-адресов `deniedMcpServers`, чтобы также блокировать предоставляемые Anthropic серверы и соединители облачных сеансов, чьи восходящие URL-адреса совпадают, фоновые субагенты для перемещения команды оболочки в фоновый режим через 3 минуты для всех поставщиков и субагенты для остановки вместо переключения моделей, когда переключатель помеченных сообщений установлен в положение «Спрашивать каждый раз»."
  - "Улучшено то, как `~/.claude.json`, файлы настроек и сохраненный логин сохраняются в общих сетевых домашних каталогах, а автоматические запуски (приложения `claude -p`, SDK) больше не перезаписывают `~/.claude.json`, если ничего не изменилось."
  breaking:
  - "Claude Code больше не устанавливает и не обновляет расширение IDE при запуске в терминале IDE; используйте `/ide` с внешнего терминала или из окна расширений редактора. Исправление версии 2.1.288, которое позволяло раньше думать при возобновлении разговора, начатого в версии 2.1.286 или ранее, было удалено, поэтому можно отказаться от размышлений."

- version: "2.1.317"
  date: "2026-11-02"
  highlights:
  - "Добавлена ​​проверка, которая запрашивает перед тем, как вызов веб-инструмента или инструмента оболочки отправит адрес электронной почты вашей учетной записи в сеть, и `onFailure: \"block\"` для обратных вызовов агента SDK."
  - "Добавлены `anthropic.plan`, `anthropic.seat_type`, `anthropic.provider` и `anthropic.custom_base_url` в метрики, события и интервалы OTel, а также отчет о затратах (`GET /v1/organizations/analytics/cost`) для администратора шлюза приложений Claude API."
  - "Изменены подагенты и товарищи по команде в модели, отличной от основного диалога, чтобы использовать сохраненный уровень усилий этой модели или его уровень по умолчанию, а также SendMessage для работающего фонового агента, чтобы он приходил раньше, перемещая его работающую команду в фоновый режим."
  - "Из инструмента чтения удалена заглушка «файл не изменился с момента последнего чтения»: повторное чтение неизмененного файла возвращает его содержимое."

- version: "2.1.316"
  date: "2026-10-31"
  highlights:
  - "Добавлен `CLAUDE_CODE_SUBAGENT_EFFORT` для установки уровня усилий, с которым будут работать субагенты, когда ничего другого не названо, `CLAUDE_CODE_DISABLE_ULTRATHINK` для отключения ключевого слова `ultrathink`, а также объединенные групповые бюджеты плюс `managed.policy_mode: layered` на шлюзе приложений Claude."
  - "Исправлены сеансы `--restricted`, загружающие файлы из-за пределов рабочих каталогов в соответствии с правилом разрешения чтения, перехваты PowerShell не блокируются при коде выхода 2, когда команда начинается с приведения типа, `param`, `using` или атрибута, а шлюз приложений Claude не проверяет каждую модель и имена запросов на соответствие `availableModels`, `deniedModels` и `models`."
  - "Исправлены команды оболочки, которые оставались запущенными на macOS и Linux, когда Claude Code завершает работу сам по себе, сценарии инструментов Bash останавливались после их первой команды при экспорте `SHELLOPTS`, а субагенты перемещались в основную модель, когда их разбудило фоновое задание или сообщение."
  - "Изменены управляемые сервером настройки для входов в группы и предприятия, чтобы они применялись без запроса на утверждение (сохраненная копия, которая не проверяется, отклоняется), а `ultrathink` в VS Code запускался в свою очередь при усилии `xhigh`, как в терминале."
  breaking:
  - "Быстрый режим для Opus 4.8 устарел с 30 октября 2026 г., его удаление запланировано на 30 ноября 2026 г. После удаления запросы быстрого режима в Opus 4.8 возвращают ошибку и не возвращаются к стандартному Opus 4.8; перейдите на Opus 5.5, чтобы сохранить ускорение."

- version: "2.1.314"
  date: "2026-10-30"
  highlights:
  - "⭐ Добавлены `permissions.blockWritesOutsideWorkingDirectories`: Write, Edit и NotebookEdit запрещают пути за пределами рабочих каталогов в каждом режиме разрешений."
  - "Добавлено сжатие простоя в VS Code и вкладка Claude Desktop Code для более 200 тысяч разговоров с токенами, остающихся бездействующими, список IdP `groups` в восходящих потоках шлюза приложений Claude и журналирование `guardrail_trace` в своих восходящих потоках Bedrock."
  - "Исправлена ​​защита песочницы, не применимая к рабочему дереву, введенному `claude -p --resume` или `--continue`, перехватчики Bash, не работающие по командам инструмента Monitor, файл, исключенный с помощью `--setting-sources`, который все еще предоставляет правила автоматического режима и разрешения, а также прекращение действия `forceRemoteSettingsRefresh` только для удаленного доступа после истечения срока действия сохраненной копии."
  - "Исправлены сбои «Неверный уровень усилий», когда администратор ограничивает усилия модели (Claude Code снижает усилия и повторяет попытки), `claude -p` выходит из 0 без вывода при неудачном запуске (теперь он выходит из 1), а «Продолжить автоматически при достижении лимита использования» продолжается более трех раз без подсказки."
  breaking:
  - "Хуки, соответствующие Bash, теперь также выполняются для команд оболочки, запускаемых инструментом Monitor; они могут блокировать или спрашивать, но не утверждать или переписывать эти команды. Вывод каждого перехватчика PreCompact сокращается до 10 000 символов. Если установлен `CI`, `claude ultrareview` и `claude remote-control` сразу отказываются от доступа к ненадежной папке вместо запроса."

- version: "2.1.312"
  date: "2026-10-27"
  highlights:
  - "Добавлен `oidc.user_id_claim` в шлюз приложений Claude, чтобы идентифицировать людей по утверждению id_token, отличному от `sub`, например `oid` Microsoft Entra ID, и щелкнуть для отправки сообщений в очереди в полноэкранном режиме."
  - "Исправлена ​​ошибка, из-за которой Claude перезаписывал очень большой CLAUDE.md, файл правил или @-included файл после просмотра только его начала (теперь Write просит прочитать весь файл или редактировать его на месте), а навыки для каждого каталога и `paths:` не обнаруживались после того, как Bash `cd` углубился в репозиторий git."
  - "Исправлены управляемые настройки и политика организации, которые не загружались до конца сеанса после входа в систему через расширение VS Code, а также команда с недопустимым именем, останавливающая загрузку всех команд."
  - "Изменены перехватчики подсказок и агентов, чтобы одновременно запускалось не более 24 за сеанс плюс 12 просроченных, а также `autoCompactWindow` субагента для уменьшения окна, установленного `CLAUDE_CODE_AUTO_COMPACT_WINDOW`."
  breaking:

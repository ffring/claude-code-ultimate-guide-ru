questions:
- id: 15-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какова основная философия использования дополнительных инструментов искусственного интеллекта с Claude Code?
  options:
    a: Замените Claude Code более качественными инструментами.
    b: 'Увеличение, а не замена: подбирайте правильный инструмент для каждого шага'
    c: Используйте как можно больше инструментов одновременно
    d: Избегайте использования Claude Code для задач кодирования.
  correct: b
  explanation: |-
    Философия — «увеличение, а не замена».

    Claude Code преуспевает в контекстуальном рассуждении и реализации, но имеет пробелы:
    - Нет поиска в Интернете в режиме реального времени с проверкой источника.
    - Нет генерации изображения
    - Нет поколения PowerPoint/slide
    - Нет синтеза звука

    Цель состоит в том, чтобы подобрать правильный инструмент для каждого этапа вашего рабочего процесса.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: Введение
    anchor: "#introduction"
- id: 15-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Когда следует использовать Perplexity вместо Claude Code?
  options:
    a: При реализации функций в вашей кодовой базе
    b: Когда вам нужно глубокое исследование с использованием более 100 проверенных источников
    c: При редактировании нескольких файлов
    d: При запуске тестов
  correct: b
  explanation: |-
    Недоумение превосходит исследования с проверенными источниками.

    Используйте Недоумение для:
    - «Какая последняя версия API для X?» (информация в реальном времени)
    - «Сравнить 5 библиотек для аутентификации» (сравнение источников)
    - Режим глубоких исследований синтезирует более 100 источников.

    Используйте Claude Code для:
    - Реализация в вашей кодовой базе
    - Контекстное объяснение кода
    - Редактирование нескольких файлов
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 1. Недоумение ИИ
    anchor: "#1-perplexity-ai-research-sourcing"
- id: 15-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков рекомендуемый конвейер исследования-кода?
  options:
    a: Claude Code -> Недоумение -> Реализация
    b: Perplexity Deep Research -> Экспорт spec.md -> Claude Code реализует
    c: Поиск в Google -> Скопировать код -> Вставить в проект.
    d: Попросите Claude Code сначала выполнить поиск в Интернете.
  correct: b
  explanation: |-
    Конвейер «От исследования к коду»:

    1. ПУТЕШЕСТВИЕ (глубокое исследование)
       - Исследование лучших практик с источниками
       - Результат: спецификация на 2000 слов с цитатами.

    2. Экспортировать как spec.md.

    3. КОД КЛОДА
       - «Реализовать следуя spec.md»
       - Результат: Рабочая реализация с тестами.

    Это гарантирует, что внедрение основано на проверенной и актуальной информации.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: Рабочий процесс интеграции
    anchor: "#integration-workflow"
- id: 15-004
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой инструмент лучше всего подходит для преобразования скриншота пользовательского интерфейса в код React?
  options:
    a: Растерянность
    b: Claude Code напрямую
    c: Gemini -> затем Claude Code для доработки
    d: НоутбукLM
  correct: c
  explanation: |-
    Gemini — выбор гида для визуального понимания:

    Конвейер визуального преобразования в код:
    1. GEMINI: загрузить скриншот -> получить JSX + Tailwind (верность 90%+)
    2. КОД CLAUDE: Уточните для вашего проекта
       - Добавить типы TypeScript
       - Подключение к вашим компонентам
       - Интеграция с вашим государственным управлением

    Один только Claude Code имеет ограниченное понимание изображений по сравнению с Gemini.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 2. Гугл Gemini
    anchor: "#2-google-gemini-visual-understanding"
- id: 15-005
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой инструмент следует использовать для создания презентаций PowerPoint на основе документации по коду?
  options:
    a: Claude Code
    b: Растерянность
    c: Кими (Moonshot AI)
    d: Gemini
  correct: c
  explanation: |-
    Кими (kimi.ai) из Moonshot AI специализируется на генерации PPTX:

    Features:
    - Собственный экспорт PPTX (настоящие слайды, без уценки)
    - 128 тысяч+ контекстов токенов (целые кодовые базы)
    - Макеты с учетом кода и подсветкой синтаксиса.
    - Отлично подходит для колод заинтересованных сторон с техническим содержанием

    Рабочий процесс: Claude Code генерирует сводку -> Кими создает презентацию.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 3. Кими
    anchor: "#3-kimi-pptx-long-document-generation"
- id: 15-006
  difficulty: senior
  profiles:
  - senior
  - power
  question: В чем заключается уникальная функция NotebookLM для адаптации разработчиков?
  options:
    a: Выполнение кода
    b: Обзор аудио — генерирует пояснения в стиле подкаста из документов.
    c: Сотрудничество в режиме реального времени
    d: Интеграция с Git
  correct: b
  explanation: |-
    Функция обзора аудио NotebookLM:

    - Загрузите более 50 файлов документации
    - Создает 10-15-минутный «подкаст»
    - Два хоста AI обсуждают вашу кодовую базу.
    - Идеально подходит для адаптации или проверки больших систем.

    Workflow:
    1. Экспортируйте документы в combined-docs.md.
    2. Загрузите в NotebookLM.
    3. Создать обзор аудио
    4. Слушайте во время поездки на работу
    5. Вернитесь к Claude Code с более глубоким пониманием.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 4. НоутбукLM
    anchor: "#4-notebooklm-synthesis-audio"
- id: 15-007
  difficulty: power
  profiles:
  - power
  question: Каков правильный порядок этапов в полном конвейере рабочего процесса?
  options:
    a: Реализация -> Планирование -> Доставка
    b: Планирование (Perplexity/Gemini/NotebookLM) -> Реализация (Claude Code) -> Доставка (Кими)
    c: Доставка -> Планирование -> Реализация
    d: Все инструменты одновременно
  correct: b
  explanation: |-
    Полный трубопровод состоит из 3 этапов:

    ЭТАП ПЛАНИРОВАНИЯ:
    - Недоумение: Глубокие исследования -> spec.md
    - Gemini: Анализ диаграммы -> русалка + план
    - NotebookLM: Синтез документов -> обзор аудио

    ЭТАП РЕАЛИЗАЦИИ:
    - Claude Code: многофайловая реализация.
    - IDE + Copilot: встроенное автозаполнение.

    ЭТАП ПОСТАВКИ:
    - Claude Code: PR-описание, примечания к выпуску.
    - Кими: колода заинтересованных сторон (presentation.pptx)
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 8. Оркестрация рабочего процесса
    anchor: "#8-workflow-orchestration"
- id: 15-008
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Для чего лучше всего использовать v0.dev в экосистеме искусственного интеллекта?
  options:
    a: Бэкенд-разработка API
    b: Запросы к базе данных
    c: Быстрое прототипирование пользовательского интерфейса с помощью Shadcn/Tailwind
    d: Аудит безопасности
  correct: c
  explanation: |-
    v0.dev превосходно справляется с быстрым прототипированием пользовательского интерфейса:

    - Генерирует компоненты React + Shadcn + Tailwind
    - Предварительный просмотр в браузере
    - Быстрая итерация дизайна пользовательского интерфейса.

    Workflow:
    1. v0: Подсказка -> Получить предварительный просмотр компонента.
    2. Экспортный код
    3. Claude Code: адаптируйтесь под свой проект.
       - Добавить типы TypeScript
       - Подключитесь к своим API
       - Интеграция с вашей дизайн-системой
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 7. Прототипы пользовательского интерфейса (v0, Bolt, Lovable)
    anchor: "#7-ui-prototypers-v0-bolt-lovable"
- id: 15-009
  difficulty: senior
  profiles:
  - senior
  - power
  question: Чем Claude WebSearch отличается от Perplexity Pro для проведения исследований?
  options:
    a: Claude WebSearch имеет больше источников (100+)
    b: Они идентичны по функционалу
    c: "Claude WebSearch: 5-10 источников, быстрый поиск. Perplexity Pro: более 100 источников, комплексное исследование"
    d: Perplexity не может получить доступ к данным в реальном времени
  correct: c
  explanation: |-
    Comparison:

    | Особенность | Claude Веб-поиск | Недоумение Про |
    |---------|-----------------|----------------|
    | Количество источников | ~5-10 | 100+ (Глубокие исследования) |
    | Проверка источника | Базовый | Полные цитаты |
    | Лучшее для | Быстрый поиск | Комплексное исследование |
    | Стоимость | Включено | $20/month |

    Рекомендация: используйте Claude WebSearch для быстрой проверки фактов.
    Используйте Perplexity Deep Research перед важными реализациями.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: Сравнение
    anchor: "#comparison-claude-websearch-vs-perplexity"
- id: 15-010
  difficulty: power
  profiles:
  - power
  question: Какова рекомендация по ежемесячной стоимости «минимального стека» для инструментов искусственного интеллекта?
  options:
    a: $200+/month — все подписки Pro
    b: $40-70/month - Claude Code + Perplexity Pro, бесплатные уровни для отдыха
    c: $0 — только бесплатные уровни
    d: $500+/month — корпоративные планы
  correct: b
  explanation: |-
    Рекомендуемые стеки подписки:

    Минимальный стек ($40-70/month):
    - Claude Code (оплата по факту использования): 20–50 долларов США.
    - Перплексити Про: 20 долларов.
    - Все остальное: уровни бесплатного пользования (NotebookLM, Kimi, Gemini бесплатно)

    Сбалансированный стек ($80-110/month):
    - Добавьте Gemini Advanced (20 долларов США) и Cursor Pro (20 долларов США).

    Советы по оптимизации затрат:
    - Используйте Haiku для простых задач.
    - Пакетные исследовательские сеансы в Perplexity
    - Регулярно проверяйте использование контекста (/context)
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 9. Стоимость и стратегия подписки
    anchor: "#9-cost-subscription-strategy"
- id: 15-011
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какую экономию средств обеспечивает переход от Claude Code к LM Studio?
  options:
    a: Экономия 20-30% на затратах API
    b: Экономия 50 %, но более медленное выполнение
    c: Экономия 80–90 % за счет планирования с помощью Opus и последующего бесплатного выполнения с помощью локального LLM.
    d: Никакой экономии, но лучшая конфиденциальность
  correct: c
  explanation: "Мост Claude Code — LM Studio обеспечивает экономию средств на 80–90 %. Стратегия: используйте Opus на этапе планирования (~ 0,50-2 доллара США за сеанс), затем выполните реализацию с помощью бесплатного локального LLM через LM Studio. Скрипт моста транслирует план Claude в локальные инструкции LLM. Компромисс: местные LLM менее эффективны, но бесплатны."
  doc_reference:
    file: examples/scripts/bridge.py
    section: LM Студия Бридж
    anchor: "#lm-studio-bridge"
- id: 15-012
  difficulty: power
  profiles:
  - power
  question: Каковы три задокументированные внешние системы оркестрации для многоагентного Claude Code?
  options:
    a: LangChain, AutoGPT, CrewAI
    b: Vercel AI SDK, Машины Fly.io, Железная дорога
    c: Газовый городок (Стив Йегге), мультиклод (длоренк), агент-чат (Джастин Абрамс)
    d: Kubernetes, Docker Создание, Терраформирование
  correct: c
  explanation: |-
    Три документированные внешние системы оркестрации:

    1. **Gas Town** (Стив Йегге) — многоагентная координация с общим контекстом.
    2. **multiclaude** (dlorenc) — параллельные экземпляры Claude Code с распределением задач
    3. **agent-chat** (Джастин Абрамс) — Протокол межагентской связи

    Это инструменты, созданные сообществом, а не официальные продукты Anthropic. Каждый решает многоагентную координацию по-своему.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 8.1 Многоагентные системы оркестровки
    anchor: "#81-multi-agent-orchestration-systems"
- id: 15-013
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие три области должны проверять субагенты при оценке скелетного проекта перед его разветвлением?
  options:
    a: Производительность, стоимость, масштабируемость
    b: Пользовательский интерфейс, API, База данных
    c: Безопасность, архитектура, опыт разработчиков (DX)
    d: Тесты, Документация, CI/CD
  correct: c
  explanation: |-
    При оценке скелетного проекта используются 3 специализированных субагента:

    1. **Security** — Аудит зависимостей, управление секретами, шаблоны аутентификации, известные уязвимости.
    2. **Architecture** — оценка организации кода, шаблонов, масштабируемости и удобства сопровождения.
    3. **Developer Experience (DX)** — проверка сложности настройки, качества документации, инструментов, проблем с внедрением.

    Каждый агент выставляет оценку и рекомендации перед принятием решения о форке.
  doc_reference:
    file: guide/workflows/skeleton-projects.md
    section: "Этап 1. Найдите и оцените скелет"
    anchor: "#phase-1-find-and-evaluate-a-skeleton"
- id: 15-014
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое RTK (Rust Token Killer) и как он работает?
  options:
    a: Линтер на основе Rust, который удаляет неиспользуемые токены кода перед компиляцией.
    b: Инструмент, который сжимает ответы API для снижения затрат на выставление счетов.
    c: Прокси-сервер CLI, который фильтрует выходные данные команд до того, как они достигнут контекста Claude, сокращая выходные данные bash до 90 % (что, согласно README, не то же самое, что снижение счета на 90 %).
    d: Плагин, который заменяет подробные сообщения об ошибках краткими описаниями в IDE.
  correct: c
  explanation: |-
    RTK — это прокси-сервер **CLI** (двоичный файл Rust, 82 094 звезды на 30 сентября 2026 г.), который фильтрует выходные данные команд **до того, как** они достигают контекста Claude. Пример: `rtk git status` снижает типичную выходную мощность `git status` примерно на 76%; `rtk git log` на ~92%. Поддерживает git, Cargo, pnpm, vitest, prisma, docker, mypy, aws, psql и другие. Использует установку с перехватом (`rtk init --global`), поэтому команды автоматически перезаписываются прозрачно. `rtk gain` показывает аналитику экономии токенов. TOML Filter DSL позволяет добавлять собственные фильтры для любой команды без написания Rust. Ключевое отличие: RTK **снижает потребление токена** (предварительная обработка); такие инструменты, как ccusage **monitor** (постобработка). Раскрытие информации: автор этого руководства является основным участником RTK.
    ---
  doc_reference:
    file: guide/ecosystem/third-party-tools.md
    section: RTK (Убийца жетонов ржавчины)
    anchor: "#rtk-rust-token-killer"
- id: 15-015
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как руководство противопоставляет Claude Code и основную философию Google Antigravity?
  options:
    a: Claude Code ориентирован на терминал (предсказуемый, собственный для конвейера); Антигравитация - сначала агент IDE (более высокая автономность, экспериментальная)
    b: Claude Code предназначен только для облака; Антигравитация работает полностью в автономном режиме
    c: Claude Code поддерживает только модели Claude; Антигравитация не зависит от модели
    d: Claude Code предназначен для корпоративных команд; Антигравитация для одиночных разработчиков.
  correct: a
  explanation: |-
    Claude Code — это **, ориентированный на терминал, CLI-native**: оптимизирован для предсказуемости, явного утверждения каждого редактирования и глубокой интеграции с существующими рабочими процессами разработчиков (CI/CD, автономные конвейеры). Google Антигравитация — это **agent-first IDE** (форк VS Code), который делает автономных агентов основным интерфейсом с более высокой автономностью и пользовательским интерфейсом в стиле управления полетами. Итог руководства: Claude Code оптимизирует **для предсказуемости и интеграции рабочих процессов**; Антигравитация оптимизирует **максимальную автономию агента с экспериментальными компромиссами**. Антигравитация рекомендуется для быстрого прототипирования или для разработчиков, не использующих CLI; Claude Code для производственного кода, CI/CD и групповой стандартизации.
    ---
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: Гугл Антигравитация
    anchor: "#61-google-antigravity-agent-first-ide"
- id: 15-016
  difficulty: junior
  profiles:
  - junior
  - pm
  question: Начиная с какого выпуска Claude Code Claude в Chrome перешёл из скользящей бета-версии в общедоступную версию?
  options:
    a: v2.0.72, выпуск, в котором впервые был представлен Claude в Chrome.
    b: v2.1.170, несвязанный выпуск, охватывающий модельную линейку Fable.
    c: v2.1.198, та же версия, в которой субагенты по умолчанию работают в фоновом режиме.
    d: v2.1.197, выпуск, в котором Claude Sonnet 5 стал моделью по умолчанию.
  correct: c
  explanation: "Версия 2.1.198 включила оба изменения в один и тот же выпуск: Claude в Chrome стал общедоступным, а субагенты по умолчанию начали работать в фоновом режиме. Claude в Chrome изначально был запущен в бета-версии версии 2.0.72. Опция d называет реальную версию (Sonnet 5 в качестве модели по умолчанию), которая не связана со статусом инструмента браузера."
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 15-017
  difficulty: intermediate
  profiles:
  - power
  - pm
  question: И приложения MCP, и генеративный шаблон пользовательского интерфейса Vercel AI SDK позволяют модели создавать интерактивный интерфейс, но на разных уровнях стека. В чем ключевое архитектурное различие между ними?
  options:
    a: Для Vercel AI SDK требуется схема и средство рендеринга на стороне клиента, а для приложений MCP вообще нет этапа проверки.
    b: Приложения MCP переносят обработанную полезную нагрузку HTML/iframe обратно через ответ инструмента, в то время как Vercel AI SDK передает компоненты React непосредственно с сервера, поэтому клиент никогда не анализирует промежуточный формат.
    c: Приложения MCP предназначены только для React, как и Vercel AI SDK; единственная разница в том, какая компания является автором спецификации
    d: Приложения MCP работают только внутри Claude Desktop, а подход Vercel AI SDK работает на каждом клиенте MCP.
  correct: b
  explanation: "MCP Apps — это расширение уровня протокола: ответ инструмента несет полезную нагрузку HTML/iframe, которую обрабатывает клиент. Шаблон Vercel AI SDK полностью пропускает этот промежуточный формат, сервер выбирает и передает компоненты React напрямую, поэтому клиенту нечего анализировать. Вариант c является ложным, Vercel SDK предназначен только для React, а приложения MCP уже поставляются для нескольких клиентов, включая Claude Desktop, VS Code, ChatGPT и Goose. Вариант d меняет местами, какой из них является многоклиентским."
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: "7.1 Генеративный пользовательский интерфейс: форматы интерактивного вывода, управляемые агентом"
    anchor: "#71-generative-ui-agent-driven-interactive-output-formats"
- id: 15-018
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: В трехуровневой модели руководства по базе знаний группы примерно при каком размере корпуса добавление уровня RAG уровня 3, доступного агенту в качестве сервера MCP, начинает перевешивать чтение файлов напрямую или подключение к живому источнику?
  options:
    a: от 10 до 50 документов
    b: Порога размера нет; RAG должен быть по умолчанию с первого дня для любой базы знаний команды.
    c: Примерно от 100 до 1000 документов.
    d: От 5 000 до 10 000 документов
  correct: c
  explanation: В руководстве указано, что пересечение составляет примерно от 100 до 1000 документов, в зависимости от размера документа и того, насколько должен охватывать каждый запрос. Ниже этого диапазона прямое чтение файла или живой соединитель обеспечивают точность чтения реального документа. Руководство явно предостерегает от добавления RAG по умолчанию, поскольку это инфраструктура с затратами на обслуживание, что исключает вариант б.
  doc_reference:
    file: guide/ecosystem/team-knowledge-base.md
    section: "Уровень 3: RAG в масштабе"
    anchor: "#tier-3-rag-at-scale"
- id: 15-019
  difficulty: power
  profiles:
  - power
  question: Уровень шлюза Claude Code добавил платформу Claude на AWS в качестве дополнительной опции восходящего поставщика в версии 2.1.198. Что еще изменилось в том же примечании к выпуску?
  options:
    a: Переменная среды ANTHROPIC_BASE_URL устарела в пользу блока конфигурации JSON.
    b: Поддержка Bedrock и Vertex AI была удалена в пользу anthropicAws.
    c: Новая косая черта /gateway заменила /model для переключения провайдера.
    d: Ответы «модель не найдена» теперь ускоряют цепочку аварийного переключения, а не останавливают ее.
  correct: d
  explanation: В том же примечании к выпуску говорится, что ответы «модель не найдена» теперь продвигают цепочку отработки отказа, а это означает, что отсутствующая модель у одного поставщика больше не приводит к тупику поиска шлюза. Ничто в этом выпуске не осуждает ANTHROPIC_BASE_URL, не удаляет поддержку Bedrock или Vertex и не вводит команду /gateway.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 15-020
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое Google Антигравитация и чем она отличается от традиционных IDE?
  options:
    a: Внутренняя среда тестирования Google, имитирующая проверки кода в условиях невесомости.
    b: IDE с упором на агентов, где ИИ управляет исполнением и проверкой со стороны людей, а не наоборот.
    c: Расширение VSCode, которое интегрирует модель Google Gemini в редактор.
    d: Замена Google для GitHub Copilot с использованием другого пользовательского интерфейса предложений.
  correct: b
  explanation: Google Антигравитация — это агент IDE, который инвертирует традиционную модель IDE. В классических IDE задействованы человеческие силы и помощь искусственного интеллекта. В «Антигравитации» агент управляет исполнением, а человек проверяет, одобряет и управляет. Человек становится рецензентом, а не машинисткой. Это представляет собой сдвиг парадигмы от кодирования с помощью ИИ к кодированию под руководством ИИ под контролем человека, модели, к которой уже приближается агентный режим Claude Code.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: 6.1 Google Антигравитация (Agent-First IDE)
    anchor: "#61-google-antigravity-agent-first-ide"
- id: 15-021
  difficulty: power
  profiles:
  - power
  question: Что показывают исследования о комплексном обучении AGENTS.md, в частности об обновлениях, создаваемых людьми, а не обновлениях, генерируемых LLM?
  options:
    a: Обновления, созданные LLM, всегда лучше, поскольку они более последовательные и полные.
    b: Обновления AGENTS.md, курируемые людьми, дают повышение производительности на +4%; Обновления, созданные с помощью LLM, дают -3% производительности при +20% увеличении затрат.
    c: Оба метода дают одинаковые результаты, поэтому для автоматизации предпочтительнее генерация LLM.
    d: Обновления, курируемые людьми, только лучше для младших разработчиков; Сгенерированные LLM превосходят старшие кодовые базы
  correct: b
  explanation: "AGENTS.md Исследование сложного обучения показывает резкое расхождение: курируемые людьми обновления AGENTS.md (на основе реальных отзывов и корректировок сеанса) обеспечивают повышение производительности агентов на +4 % при выполнении контрольных задач. LLM-auto-generated AGENTS.md обновления приводят к снижению производительности на -3% и увеличению затрат на +20%, поскольку автоматически создаваемые правила имеют тенденцию к чрезмерному уточнению, конфликтам или добавлению шума. Вывод: инвестировать время человеческого анализа в AGENTS.md/CLAUDE.md обслуживание. Это усугубляет."
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: AGENTS.md для комплексного обучения
    anchor: "#agentsmd-for-compound-learning"

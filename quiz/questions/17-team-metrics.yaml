category: Командные метрики для разработки с использованием искусственного интеллекта
category_id: 17
source_file: guide/ops/team-metrics.md
questions:
- id: 17-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Каковы пять текущих показателей доставки программного обеспечения DORA?
  options:
    a: Время выполнения изменения, частота развертывания, время восстановления после неудачного развертывания, частота неудачных изменений, частота переработок развертывания
    b: Частота развертывания, время выполнения изменений, частота неудачных изменений, среднее время восстановления (MTTR)
    c: Скорость спринта, сюжетные очки, количество ошибок, покрытие тестами
    d: Строки кода, NPS, время безотказной работы, удовлетворенность разработчиков
  correct: a
  explanation: Текущая модель DORA имеет пять показателей доставки программного обеспечения. Пропускная способность учитывает время выполнения изменений, частоту развертывания и время восстановления после неудачного развертывания. Нестабильность использует частоту неудачных изменений и частоту переработок развертывания. DORA сузил исторический показатель MTTR до восстановления после неудачного развертывания в 2023 году и добавил коэффициент повторной обработки развертывания в 2024 году.
  doc_reference:
    file: guide/ops/team-metrics.md
    section: Фонд DORA
    anchor: "#the-dora-foundation"
- id: 17-003
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Какие основные методологические изменения были внесены в отчет DORA за 2025 год?
  options:
    a: "Добавлен пятый показатель: Индекс счастья разработчиков."
    b: Отказ от 4-уровневой модели Elite/High/Medium/Low в пользу 7 организационных архетипов в 8 измерениях.
    c: Частота развертывания заменена частотой развертывания флагов функций.
    d: Введены тесты, специфичные для ИИ, которые заменяют исходные четыре показателя.
  correct: b
  explanation: 'В отчете DORA за 2025 год четырехуровневая модель (Elite/High/Medium/Low) была отменена и теперь определены 7 организационных архетипов (например, «Преуспевающие достижения», «Борьба с трудностями», «Сбалансированные исполнители»), измеряемые по 8 измерениям: производительность, стабильность, производительность команды, производительность продукта, индивидуальная эффективность, время на ценную работу, трения и выгорание. Вывод: перестаньте гоняться за «Элитой» как за конечной точкой. Это может сосуществовать с выгоранием и высоким трением. Определите свой архетип и улучшите самые слабые стороны.'
  doc_reference:
    file: guide/ops/team-metrics.md
    section: От четырех ключей к пяти показателям
    anchor: "#from-four-keys-to-five-metrics"
- id: 17-004
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Каковы 5 измерений структуры SPACE?
  options:
    a: Скорость, производительность, точность, совместная работа, эффективность
    b: Satisfaction/Well-being, Производительность, Активность, Communication/Collaboration, Efficiency/Flow
    c: Безопасность, производительность, доступность, емкость, опыт
    d: Спринты, PR, Автоматизация, Качество кода, Инженерный долг
  correct: b
  explanation: "SPACE (разработан GitHub, Microsoft и Университетом Виктории, 2021 г.) охватывает: (S) Удовлетворенность и благополучие: удовлетворенность разработчиков и сигналы выгорания. (P) Производительность: качество и надежность выполненной работы (CFR, коэффициент устранения ошибок). (A) Деятельность: объем результатов работы (частота развертывания, пропускная способность). (C) Коммуникация и сотрудничество: задержка при проверке PR, разрешение межкомандных зависимостей. (E) Эффективность и поток: глубокая работоспособность, частота переключения контекста, трение. DORA измеряет систему доставки; ПРОСТРАНСТВО измеряет людей внутри него."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: "За пределами DORA: SPACE Framework"
    anchor: "#beyond-dora-the-space-framework"
- id: 17-005
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Что такое «ловушка скорости» в командах, дополненных искусственным интеллектом?
  options:
    a: Слишком частое развертывание и срыв производства с каждым выпуском
    b: Достижение высоких показателей DORA при одновременном низком уровне удовлетворенности, благополучия и эффективности (больше развертываний, но за счет здоровья и качества разработчиков)
    c: Использование ИИ для создания отчетов о скорости, которые завышают фактическую производительность команды
    d: Скорость спринта становится бессмысленной, когда весь код пишет ИИ
  correct: b
  explanation: "Ловушка скорости: команды могут получить «высокий» уровень частоты развертывания DORA, одновременно получая при этом низкие показатели удовлетворенности, благополучия и эффективности. Симптомы: разработчики работают по ночам, чтобы выполнить обязательства по спринту, пропускают обсуждения дизайна, потому что ИИ делает кодирование достаточно быстрым, чтобы обойти планирование, накапливают когнитивный долг из-за проверки кода ИИ, который они не до конца понимают. SPACE улавливает это; DORA нет. Запуск обеих платформ дает вам полную картину. Команда с сильным DORA + слабым SPACE является ведущим индикатором будущей деградации DORA."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: Скоростная ловушка
    anchor: "#the-velocity-trap"
- id: 17-006
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Что является предупреждающим сигналом, когда время проверки PR с помощью ИИ на 30% быстрее, чем время проверки PR вручную?
  options:
    a: Нормально и ожидаемо, код ИИ проще и быстрее просматривать.
    b: Желтый флаг, указывающий на возможное штампование; Код, сгенерированный ИИ, требует как минимум такого же тщательного изучения, как и код, написанный вручную.
    c: Положительный признак того, что качество кода AI выше.
    d: Приемлемо только в том случае, если процент неудачных изменений также ниже.
  correct: b
  explanation: "Если запросы, созданные искусственным интеллектом, объединяются на 30%+ быстрее, чем созданные вручную, это желтый флаг, указывающий на штампование. Код, сгенерированный ИИ, требует как минимум такого же тщательного анализа, как и код, написанный вручную, а возможно и больше, потому что он может быть совершенно неверным в неочевидных отношениях. Отслеживайте CFR отдельно для кода, созданного ИИ, и кода, написанного вручную: если CFR, сгенерированный ИИ, существенно выше (более 2–3 процентных пунктов), ваша дисциплина проверки упала, а не качество инструментов ИИ."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: Метрики, специфичные для искусственного интеллекта
    anchor: "#ai-specific-metrics"
- id: 17-007
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Какова формула коэффициента устранения ошибок и какое пороговое значение сигнализирует о проблеме в процессе контроля качества?
  options:
    a: "bugs_in_prod / total_bugs_filed; порог: >10%"
    b: "bugs_before_prod / bugs_in_prod; порог: >5%"
    c: "bugs_in_prod/(bugs_before_prod + bugs_in_prod); порог: >20%"
    d: "total_bugs/развертываний; порог: >1 на развертывание"
  correct: c
  explanation: "Коэффициент устранения ошибок = bugs_in_prod / (bugs_before_prod + bugs_in_prod). Пример: 4 ошибки на стадии разработки + 16 ошибок на этапе подготовки к выпуску = вероятность побега 20%. Порог: >20 % означает, что процессы контроля качества и проверки постоянно не выявляют проблемы до того, как их увидят пользователи. Учитывая развитие с помощью искусственного интеллекта, за этим показателем стоит внимательно следить. Более быстрая генерация кода в сочетании с более свободной проверкой может повысить процент ускользания ошибок, даже если абсолютное количество ошибок остается неизменным. Сопряжение с CFR, сегментированным по AI и ручному происхождению кода."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: Метрики продукта
    anchor: "#product-metrics-the-often-missing-layer"
- id: 17-008
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Какая метрика должна заменить скорость спринта и почему?
  options:
    a: "Подсчет PR: более объективно, чем стори-пойнты"
    b: "Время цикла + частота развертывания: скорость можно изменить в течение двух спринтов, изменив методы оценки, в то время как время цикла сложнее подделать."
    c: "Строки кода: более измеримые и последовательные"
    d: Очки истории нормализованы по размеру команды
  correct: b
  explanation: "Скорость спринта следует заменить временем цикла + частотой развертывания. Скорость можно использовать в течение двух спринтов, изменив методы оценки (команды завышают значения баллов, чтобы выглядеть быстрее). Время цикла (фиксация на запуск) сложнее подделать. Таблица показателей тщеславия руководства: Скорость спринта → Время цикла + Частота развертывания. Строки кода → Частота устранения ошибок. Только NPS → CSAT + Время окупаемости. Commits/day → Время подготовки к изменениям. Story Points → Пропускная способность (функции реализованы). % покрытия кода → Оценка мутационного тестирования + Коэффициент устранения ошибок."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: Показатели тщеславия, которые следует отбросить
    anchor: "#vanity-metrics-to-drop"
- id: 17-009
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Что такое тест из 4 вопросов, позволяющий решить, стоит ли добавлять метрику в набор отслеживания?
  options:
    a: Это бесплатно? Это автоматизировано? Хорошо ли это выглядит в отчетах? Заботится ли руководство?
    b: Сможете ли вы принять меры за 2 недели? Объясняет ли оно почему (а не только что)? Связано ли это с бизнес-результатами? Можно ли его измерить автоматически?
    c: Это метрика DORA? Появляется ли оно в рамках SPACE? Это отраслевой стандарт? Не требует ли он специального кода?
    d: Отслеживает ли он индивидуальную производительность? Доступно ли оно в GitHub? Можно ли его экспортировать в CSV? Он ходит ежедневно?
  correct: b
  explanation: "Тест из 4 вопросов: (1) Сможете ли вы выполнить задание в течение 2 недель? Если нет, то это показатель отчетности, а не показатель управления. (2) Объясняет ли это почему, а не только что? Если это число изменится, знаете ли вы, что исследовать? (3) Коррелирует ли это с бизнес-результатами? Частота развертываний коррелирует с доходом от SaaS; строки кода ничего не коррелируют. (4) Можно ли измерить его автоматически? Если его сбор требует ручной работы, от него отказываются в течение 3 месяцев. Правило: меньше трёх ответов «да», отбросьте метрику."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: Тест из 4 вопросов
    anchor: "#the-4-question-test"
- id: 17-010
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Какова рекомендуемая разница в инструментах измерения показателей между командой из 5 человек и командой из 25 человек?
  options:
    a: Оба должны использовать LinearB, поскольку он масштабируется от маленьких до больших команд.
    b: "5 человек: GitHub Insights + электронная таблица (специальная панель мониторинга не требуется). 25 человек: LinearB или Faros.ai для автоматизированного DORA, сегментировано по отряду."
    c: "5 человек: метрики не нужны. 25 человек: полное SPACE + DORA + панель показателей AI"
    d: Оба должны использовать одни и те же инструменты, но с разной частотой обновления.
  correct: b
  explanation: "Команда из 5 человек: GitHub Insights + общая таблица. Никакой специальной панели управления, поскольку накладные расходы того не стоят. Просматривайте показатели ежемесячно. Команда из 25 человек: LinearB или Faros.ai для автоматизированного DORA (подключается к GitHub + CI/CD), GitHub Analytics для показателей вклада ИИ, PostHog или Amplitude для показателей продукта. Критично для 25 человек: отслеживайте DORA для каждого отряда, а не только для каждой организации, поскольку глобальные средние значения скрывают проблемы на уровне отряда (команда из трех отрядов, в которой 80% инцидентов происходят из одного отряда, в целом покажет «средний» CFR и пропустит сигнал)."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: По размеру команды
    anchor: "#by-team-size"
- id: 17-011
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какая метрика DORA подвергается наибольшему риску при внедрении ИИ без дисциплины проверки?
  options:
    a: "Частота развертываний: ИИ генерирует слишком много развертываний."
    b: "Время восстановления неудачного развертывания: реагирование на инциденты ИИ делает восстановление слишком медленным"
    c: "Частота неудачных изменений: ИИ генерирует синтаксически правильный, но слегка неправильный код; проверка штампов приводит к увеличению CFR в течение 6-12 месяцев"
    d: "Время выполнения: ИИ замедляет очереди на проверку, генерируя более крупные различия."
  correct: c
  explanation: 'Процент неудачных изменений — это показатель, который подвергается наибольшему риску, когда внедрение ИИ опережает дисциплину проверки. ИИ генерирует синтаксически правильный, структурно правдоподобный код, который все же может содержать незначительные поведенческие ошибки. Команды, которые рассматривают PR-отзывы об искусственном интеллекте как «меньший риск» и проверяют проверки, видят, что CFR постепенно растет в течение 6-12 месяцев. Провал происходит постепенно: каждый отдельный PR по ИИ выглядит хорошо, но в производстве проявляется совокупное снижение контроля. Отслеживайте CFR отдельно для кода, созданного искусственным интеллектом, и кода, написанного вручную; если AI CFR существенно выше, усильте процесс проверки.'
  doc_reference:
    file: guide/ops/team-metrics.md
    section: DORA в контексте дополненного ИИ
    anchor: "#dora-in-an-ai-augmented-context"
- id: 17-012
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Какова рекомендуемая трехэтапная схема реализации программы показателей?
  options:
    a: "Этап 1. Наймите инженера по метрикам. Этап 2. Приобретение корпоративного инструментария. Этап 3: Отчет перед советом директоров."
    b: "Этап 1 (недели 1–2): инструмент DORA (частота развертывания + время выполнения заказа). Этап 2 (недели 3–4): Базовый уровень и установление внутренних целей по улучшению. Этап 3 (месяц 2+): уровень продукта и показателей, специфичных для ИИ."
    c: "Этап 1: Отслеживайте все. Этап 2: Удалите то, что бесполезно. Этап 3: Автоматизируйте оставшуюся часть."
    d: "Этап 1: КОСМИЧЕСКОЕ исследование. Этап 2: Инструментарий DORA. Этап 3: показатели вклада ИИ."
  correct: b
  explanation: "Трехэтапная дорожная карта: Этап 1 (недели 1–2): подключите CI/CD к инструменту показателей, сначала автоматизируйте частоту развертывания + время выполнения (минимальная настройка вручную), установите действующий базовый уровень. Этап 2 (недели 3–4): определите исходный уровень на основе реальных данных, установите внутренние цели по улучшению (пока не отраслевые сравнения), запустите первый импульс удовлетворенности разработчиков. Этап 3 (месяц 2+): добавьте показатели продукта (время окупаемости, функция CSAT) и сигналы, специфичные для ИИ (% кода AI, CFR по происхождению). Пересматривайте и сокращайте ежеквартально: любой показатель, по которому не было принято решение в течение 3 месяцев, является показателем отчетности, а не показателем управления."
  doc_reference:
    file: guide/ops/team-metrics.md
    section: Дорожная карта реализации
    anchor: "#implementation-roadmap"

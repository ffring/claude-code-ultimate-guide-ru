questions:
- id: 16-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой термин использует Мартин Фаулер для описания агентурного снаряжения?
  options:
    a: Детерминированная оболочка
    b: Оболочка вывода
    c: Кибернетический губернатор
    d: Песочница выполнения
  correct: c
  explanation: "Фаулер определяет систему управления как «кибернетический регулятор», который сочетает в себе прямую и обратную связь для регулирования поведения агента в направлении желаемого состояния. Этот термин пришел из теории управления: кибернетический регулятор корректирует входные данные на основе выходных данных, чтобы поддерживать стабильное поведение. Другие параметры описывают связанные концепции (песочница, оболочки вывода), но не являются определениями Фаулера."
  doc_reference:
    file: guide/core/agent-harness.md
    section: Основная претензия
    anchor: "#the-core-claim"
- id: 16-002
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какие три свойства, согласно arXiv 2605.18747 («Код как обвязка агента»), отличают жгут от простой оболочки LLM?
  options:
    a: Надежность, масштабируемость, безопасность
    b: Исполняемость, проверяемость, государственность
    c: Наблюдаемость, отслеживаемость, возможность восстановления
    d: Детерминизм, повторяемость, проверяемость
  correct: b
  explanation: "В документе формализуются три свойства: исполняемость (система может проверять, что на самом деле сделал агент, а не только то, что он заявил), возможность проверки (сбои создают действенные диагностические данные, а не требуют реконструкции сеанса) и сохранение состояния (состояние сеанса выводится наружу, поэтому агент может возобновить работу после сброса контекста). Другие варианты описывают желаемые качества системы, но не являются определением трех свойств, приведенным в статье."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 1. Три основополагающих свойства
    anchor: "#1-three-foundational-properties"
- id: 16-003
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Согласно внутренним данным Anthropic, приведенным в руководстве, какое сокращение токенов достигается при динамической отправке инструментов по сравнению со статической загрузкой всех схем инструментов?
  options:
    a: 37%
    b: 60%
    c: 22%
    d: 50%
  correct: a
  explanation: "Внутренние данные Anthropic свидетельствуют о сокращении использования токенов на 37 % за счет динамической отправки инструментов по сравнению с загрузкой всех схем при каждом вызове. Логика интуитивно понятна: предоставление модели 40 схем инструментов, когда только 4 подходят для текущей задачи, увеличивает шум и стоимость. В руководстве отмечается, что это число не воспроизводится независимо, но утверждение о направлении заслуживает доверия."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 2.3 Реестр инструментов
    anchor: "#23-tool-registry"
- id: 16-004
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой принцип регулирует разрешения на границе делегирования субагента согласно руководству?
  options:
    a: Наследование ролей
    b: Изоляция контекста
    c: Доверительное делегирование
    d: Принцип наименьших привилегий
  correct: d
  explanation: "На границе делегирования применяется принцип наименьших привилегий: субагенты получают только минимальные разрешения, необходимые для их конкретной задачи, а не полный набор разрешений агента-организатора. Это предотвращает цепочки повышения привилегий, в которых подзадача с низкой чувствительностью получает доступ к возможностям, которые должны быть ограничены оркестратором. Наследование ролей и делегирование доверия описывают шаблоны, которые, как прямо сказано в руководстве, не следует использовать здесь."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 2.4 Управление субагентами
    anchor: "#24-sub-agent-management"
- id: 16-005
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Какие три условия представляют собой угрозу безопасности «Lethal Trifecta» в агентских системах?
  options:
    a: Слабые подсказки, недостающие инструменты, отсутствие песочницы
    b: Частные данные + ненадежный контент + возможность внешней связи
    c: Без аутентификации, без ограничения скорости, без ведения журнала аудита.
    d: Большое контекстное окно, публичное развертывание, отсутствие проверки человеком
  correct: b
  explanation: "Саймон Уиллисон придумал этот термин, чтобы описать: доступ к личным данным + доступ к ненадежному контенту + возможность внешнего общения. Любые два из трех являются управляемыми. Все три вместе, без структурной изоляции, создают путь эксфильтрации: злоумышленник внедряет инструкции в данные, которые будет читать агент, агент обрабатывает эти инструкции, используя свой доступ к личным данным, а затем использует свои коммуникационные возможности для эксфильтрации. GitHub Security задокументировал реальные атаки с использованием вредоносного содержимого репозитория."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 3. Смертельная тройка – модель безопасности
    anchor: "#3-the-lethal-trifecta-security-model"
- id: 16-006
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Кто придумал термин «Смертельная тройка» в 2025 году?
  options:
    a: Мартин Фаулер
    b: Адди Османи
    c: Саймон Уиллисон
    d: Джеффри Литт
  correct: c
  explanation: Саймон Уиллисон ввел термин «Смертельная троица» в 2025 году для описания сценария эксфильтрации с тремя условиями. Мартин Фаулер определил концепцию «кибернетического губернатора» для ремней безопасности. Адди Османи внес свой вклад в разработку литературы по агентному программному обеспечению. И Фаулер, и Уиллисон упоминаются в разделе, посвященном агентам, в руководстве, но по разным понятиям.
  doc_reference:
    file: guide/core/agent-harness.md
    section: 3. Смертельная тройка – модель безопасности
    anchor: "#3-the-lethal-trifecta-security-model"
- id: 16-007
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Согласно внутренним данным Anthropic (апрель 2026 г.), какой процент запросов на разрешения агентов в производстве утверждается без надлежащего рассмотрения?
  options:
    a: 42%
    b: 67%
    c: 78%
    d: 93%
  correct: d
  explanation: "В документации по модели совместной ответственности Anthropic (апрель 2026 г.) сообщается, что 93 % запросов на разрешения агентов одобряются без надлежащего рассмотрения. Это не критика вовлеченных людей: это структурное следствие объема и когнитивной нагрузки. Когда человек утверждает 50 диалогов с разрешениями в час, индивидуальное одобрение становится формальностью. Масштабируемая защита — это структурная изоляция и проверка вторым агентом, а не проверка человеком."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 3. Смертельная тройка – модель безопасности
    anchor: "#why-human-review-alone-fails"
- id: 16-008
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какой файл `gh aw compile` создает в агентских рабочих процессах GitHub?
  options:
    a: .agent.yml
    b: .lock.yml
    c: workflow-compiled.yaml
    d: agents-hardened.json
  correct: b
  explanation: "`gh aw compile` берет определение рабочего процесса агента в Markdown и создает `.lock.yml`, который представляет собой защищенный файл GitHub Actions со свойствами безопасности, встроенными во время компиляции. Это ключевое архитектурное решение: безопасность обеспечивается во время компиляции, а не добавляется позже в качестве уровня политики. Скомпилированный `.lock.yml` обеспечивает контекст агента только для чтения и маршрутизирует запись через задание проверки безопасных выходов."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 4. Агентские шаблоны CI/CD
    anchor: "#github-agentic-workflows"
- id: 16-009
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков предельный размер журнала для функции GitLab Duo Fix CI/CD Pipeline?
  options:
    a: 50 КиБ
    b: 500 КиБ
    c: 150 КиБ
    d: 1 МиБ
  correct: c
  explanation: "GitLab Duo считывает до 150 КиБ журналов конвейера при диагностике сбоев. Конвейеры с подробным выводом за пределами этого порога получают усеченный контекст, что ухудшает качество диагностики. Это ключевое ограничение, которое следует понимать перед маршрутизацией всех сбоев CI через GitLab Duo: подробные программы запуска тестов, сборки Docker и пакеты интеграции регулярно превышают этот предел. Руководство рекомендует знать этот предел при оценке инструмента для вашего конвейера."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 4. Агентские шаблоны CI/CD
    anchor: "#gitlab-duo"
- id: 16-010
  difficulty: senior
  profiles:
  - senior
  - power
  question: Задание GitHub Agentic Workflows Safe Outputs проверяет созданные агентом различия с помощью трех инструментов, прежде чем они коснутся производственных поверхностей. Что это за три инструмента?
  options:
    a: Семгреп + ТрюфельХог + ЛамаГард
    b: SonarQube + GitLeaks + ContentSafety
    c: CodeQL + обнаружение секретов + ограждения
    d: Bandit + trufflesecurity + OpenAI Модерация
  correct: a
  explanation: "Safe Outputs запускает Semgrep (SAST, статический анализ уязвимостей безопасности), TruffleHog (обнаружение секретов) и LlamaGuard (обнаружение вредоносного контента) для различий, созданных агентом. Это этап проверки, который отделяет генерацию агента от рабочей поверхности: агент создает разницу, Safe Outputs проверяет ее, и применяются только проходящие различия. Он выполняется как отдельное задание от основного контекста выполнения агента."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 4. Агентские шаблоны CI/CD
    anchor: "#github-agentic-workflows"
- id: 16-011
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какого диапазона улучшения корректности достигает шаблон создатель-проверяющий по сравнению с самопроверкой в ​​документированных реализациях?
  options:
    a: от +3 до +8%
    b: от +30 до +50%
    c: от +5 до +10%
    d: от +12 до +26%
  correct: d
  explanation: "Независимая проверка повышает правильность на +12–26 % по сравнению с самопроверкой в ​​документированных реализациях, включая Microsoft Agent Framework, AutoGen Studio, Google ADK и агентов тестирования Playwright. Диапазон варьируется в зависимости от типа задачи и реализации, но направленный эффект одинаков. Структурная причина: модель, проверяющая свои собственные выходные данные, несет в себе те же предвзятости и контекст, что и генерирующая модель, поэтому она систематически пропускает тот же класс ошибок."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 8. Шаблон «Создатель-проверяющий»
    anchor: "#8-creator-verifier-pattern"
- id: 16-012
  difficulty: senior
  profiles:
  - senior
  - power
  question: Почему самопроверка структурно терпит неудачу в системе создатель-проверяющий?
  options:
    a: Модель верификатора медленнее генератора
    b: Генератор и верификатор имеют одни и те же предубеждения и контекст, пропуская один и тот же класс ошибок.
    c: Самопроверка увеличивает задержку сверх допустимых порогов.
    d: У верификатора нет доступа к исходным требованиям.
  correct: b
  explanation: "Модель, создавшая выходные данные, несет в себе те же предвзятости и контекст, что и модель, которая их анализирует. Свежий экземпляр модели, учитывая только артефакт и критерии успеха, структурно отличается от самопроверки, поскольку он еще не придерживается пути рассуждения, который привел к получению результата. Вот почему шаблон не требует общего контекста между создателем и проверяющим: общий контекст — это механизм, который вновь вводит одни и те же «слепые зоны»."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 8. Шаблон «Создатель-проверяющий»
    anchor: "#8-creator-verifier-pattern"
- id: 16-013
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Каков статус по соглашению OTel GenAI пролетов `gen_ai.client` по состоянию на май 2026 г.?
  options:
    a: Экспериментальный
    b: Устарело
    c: Стабильный
    d: Черновик
  correct: c
  explanation: "С мая 2026 года диапазоны `gen_ai.client` отмечены как «Стабильные» в соглашениях OTel GenAI. Это означает, что производственные жгуты могут безопасно зависеть от атрибутов `gen_ai.request.model`, `gen_ai.usage.input_tokens` и `gen_ai.usage.output_tokens`, не ожидая критических изменений. В этом отличие от диапазонов `gen_ai.agent`, которые все еще являются экспериментальными и перед стабилизацией атрибуты могут быть переименованы или реструктурированы."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 6. Стек наблюдаемости
    anchor: "#otel-genai-conventions-may-2026-status"
- id: 16-014
  difficulty: power
  profiles:
  - senior
  - power
  question: Каковы практические последствия того, что диапазоны `gen_ai.agent` будут помечены как экспериментальные в соглашениях OTel GenAI с мая 2026 года?
  options:
    a: Экспериментальная (атрибуты могут быть переименованы перед стабилизацией)
    b: Стабильно с 2024 года
    c: Устарело в пользу gen_ai.client
    d: Черновик (пока нет производственных реализаций)
  correct: a
  explanation: "Диапазоны `gen_ai.agent` являются экспериментальными, что означает, что такие атрибуты, как `gen_ai.agent.name` и `gen_ai.agent.id`, могут быть переименованы или реструктурированы до стабилизации спецификации. Сегодня производственные системы, использующие промежутки агентов, должны планировать затраты на переназначение, когда произойдет стабилизация. OpenInference (Arize) и OpenLLMetry (Traceloop) обеспечивают стабильный уровень схемы поверх развивающейся спецификации OTel для покрытия этих затрат, поэтому руководство рекомендует их для наблюдения за производственным агентом."
  doc_reference:
    file: guide/core/agent-harness.md
    section: 6. Стек наблюдаемости
    anchor: "#otel-genai-conventions-may-2026-status"
- id: 16-015
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: На каком уровне по шкале зрелости контекстной инженерии L0-L5 плоский CLAUDE.md начинает ухудшаться примерно после 100 строк?
  options:
    a: Уровень 0
    b: Уровень 1
    c: Уровень 2
    d: Уровень 3
  correct: b
  explanation: 'Уровень 1 — «Плоская конфигурация»: один CLAUDE.md без структуры. Режим отказа заключается в том, что правила накапливаются, а их соблюдение ухудшается примерно после 100 строк. Уровень 0 вообще не имеет конфигурации. Уровень 2 добавляет структурированные разделы, но по-прежнему хранится в одном файле для каждой области. Порог деградации ~100 строк — один из немногих эмпирически наблюдаемых пределов в контекстной инженерии, соответствующий убывающей отдаче длинных списков правил перед фрагментированием или определением пути.'
  doc_reference:
    file: guide/core/context-engineering.md
    section: 9. Оценка зрелости
    anchor: "#9-maturity-assessment"
- id: 16-016
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: В чем ключевое структурное различие между уровнем 2 и уровнем 3 по шкале зрелости контекстной инженерии?
  options:
    a: На уровне 3 есть канареечные тесты; Уровень 2 нет
    b: Уровень 3 использует профили; Уровень 2 использует одну конфигурацию
    c: Уровень 3 имеет обнаружение дрейфа CI; Уровень 2 нет
    d: Уровень 3 использует модули с областью действия; Уровень 2 использует структурированные разделы в одном файле.
  correct: d
  explanation: Уровень 2 «Структурированная конфигурация» объединяет правила в четкие разделы с разделением global/project, но все находится в корневых файлах CLAUDE.md. Уровень 3 «Модульная конфигурация» переносит правила, специфичные для подсистемы, в модули области действия (.claude/rules/) с намеренным многоуровневым расположением. Корень CLAUDE.md на уровне L3 не превышает 150 строк. Канарские тесты и профили относятся к функциям L4 и L5 соответственно.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 9. Оценка зрелости
    anchor: "#9-maturity-assessment"
- id: 16-017
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Что требует уровень 4 («Измеренная конфигурация») и чего не требует уровень 3 («Модульная конфигурация»)?
  options:
    a: Канарские тесты и отслеживание соблюдения режима (привычка измерения)
    b: Модули с областью действия
    c: Сборка профиля команды
    d: Обнаружение дрейфа CI
  correct: a
  explanation: Уровень 4 добавляет канареечные тесты, которые проверяют ключевые соглашения, отслеживают частоту нарушений важных правил и аудит контекста после основных этапов. В руководстве отмечается, что переход с уровня L3 на уровень L4 требует привычки к измерению, а не дополнительной настройки. Обнаружение дрейфа CI и сборка профиля относятся к функциям уровня 5. Модули с ограниченным объемом пути являются критерием выпуска 3-го уровня.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 9. Оценка зрелости
    anchor: "#9-maturity-assessment"
- id: 16-018
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Каков документально подтвержденный режим отказа уровня 2 («Структурированная конфигурация») по шкале зрелости?
  options:
    a: Правила превышают 100 строк, и соблюдение требований ухудшается.
    b: Не существует механизма проверки соблюдения правил.
    c: Работает для индивидуальных разработчиков, но не работает в масштабе команды.
    d: Контекстное окно исчерпывается слишком быстро
  correct: c
  explanation: Уровень 2 хорошо работает в одиночном контексте, поскольку один разработчик контролирует всю конфигурацию и интуитивно знает, что означает каждый раздел. Это нарушает масштаб команды, поскольку несколько разработчиков, редактирующих один и тот же корень CLAUDE.md, создают трения в координации, конфликтующие соглашения и потерю общей ментальной модели. Ухудшение ~100 строк — это режим отказа L1. Отсутствие проверки — это режим отказа L3. Исчерпание контекста обрабатывается на уровне оптимизации токена, а не на модели зрелости.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 9. Оценка зрелости
    anchor: "#9-maturity-assessment"
- id: 16-019
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Каковы пять категорий сигналов в таксономии сигналов ACE-v2?
  options:
    a: Ошибки, предупреждения, повторные попытки, тайм-ауты, отмены
    b: LLM, инструменты, память, контекст, вывод
    c: Ввод, обработка, вывод, обратная связь, эскалация
    d: Синтаксические, семантические, процедурные, выравнивание, производительность
  correct: d
  explanation: "ACE-v2 заменяет плоскую оценку трения пятью типизированными категориями: синтаксическая (ошибка инструмента, сбой синтаксического анализа, неправильно сформированный вызов), семантическая (вывод отклонен пользователем, повторная попытка с пояснением), процедурная (конфликт правил, отсутствующий шаг, неправильная фаза выполнения), выравнивание (нарушение тона, изменение вне области видимости, галлюцинаторное утверждение) и производительность (переполнение токена, переполнение контекста, принудительная промежуточная задача /compact). Каждому событию присваивается одна категория, которая определяет, где куратор будет искать первопричину."
  doc_reference:
    file: guide/core/context-engineering.md
    section: 10. Таксономия сигналов и причинная атрибуция
    anchor: "#10-signal-taxonomy-and-causal-attribution"
- id: 16-020
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: В таксономии сигналов ACE-v2 к какой категории относится «нарушение записи перед чтением»?
  options:
    a: Синтаксический
    b: процедурный
    c: Семантический
    d: Выравнивание
  correct: b
  explanation: "Нарушение записи перед чтением является процедурным сигналом: оно представляет собой конфликт правил или отсутствие шага в последовательности фаз выполнения. Процедурные события возникают из-за того, что агент пропускает или неправильно упорядочивает шаги, которые конфигурация определяет как необходимые. Syntactic будет неверным вызовом инструмента. Семантически это будет означать, что пользователь отклоняет вывод. Выравнивание будет нарушением тона или выходом за рамки изменения."
  doc_reference:
    file: guide/core/context-engineering.md
    section: 10. Таксономия сигналов и причинная атрибуция
    anchor: "#signal-categories"
- id: 16-021
  difficulty: senior
  profiles:
  - senior
  - power
  question: Почему фиксированный показатель трения (ошибки x 3 + повторы x 2) вводит куратора в заблуждение в ACE-v2?
  options:
    a: Необработанный объем указывает на самый шумный инструмент, а не на самую действенную причину
    b: Ошибки формулы x 3 + повторные попытки x 2 ошибки перевеса
    c: Фиксированные оценки не могут отслеживать тенденции с течением времени.
    d: Формула не учитывает результаты LLM в качестве судьи.
  correct: a
  explanation: За десять недель работы ACE-v1 в проекте Aristote инструмент Bash сгенерировал 3377 повторных попыток против 597 для чтения и 254 для редактирования. Необработанный том указал на Bash как на основную проблему, но на самом деле в конфигурации отсутствовали инструкции по пакетной обработке. Плоская оценка привела к тому, что куратор расставил приоритеты не на том слое. Типизированные сигналы исправляют это, фиксируя, какие файлы правил и навыки были активны в момент трения, а не только какой инструмент сработал.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 10. Таксономия сигналов и причинная атрибуция
    anchor: "#10-signal-taxonomy-and-causal-attribution"
- id: 16-022
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Что генерирует куратор ACE-v2 для замыкания цикла обратной связи вместо простого отчета?
  options:
    a: Отчет в виде простого текста, в котором суммируются закономерности разногласий.
    b: Заявка Jira для инженеров на рассмотрение
    c: PR Git с различиями в конфигурации, доказательствами разногласий, канареечными результатами и примечанием об эскалации.
    d: Автоматическая фиксация непосредственно в файлах конфигурации
  correct: c
  explanation: "Куратор создает Git PR, содержащий четыре элемента: точную разницу конфигурации (патч, готовый к git-diff, а не прозу), 3–5 событий, которые привели к предложению, результаты канареечной проверки before/after и примечание об эскалации, если это предложение уже появлялось в предыдущих отчетах без каких-либо действий. Человек просматривает и сливается или закрывается. Куратор никогда не изменяет правила напрямую. Неудача в разомкнутом цикле проекта «Аристот» (те же два предложения, предложенные с разницей в десять недель, но так и не объединенные) мотивировала этот проект: на основе PR легче действовать, чем на основе отчета."
  doc_reference:
    file: guide/core/context-engineering.md
    section: 11. Замыкание цикла – курирование на основе PR
    anchor: "#11-loop-closure-pr-based-curation"
- id: 16-023
  difficulty: senior
  profiles:
  - senior
  - power
  question: Когда в процессе канареечной проверки ACE-v2 A/B запускается LLM-как судья?
  options:
    a: При каждом зондировании для обеспечения тщательности
    b: Только на зондах, где косинусное подобие падает ниже 0,85.
    c: На зондах, где разница превышает 100 токенов
    d: Никогда (достаточно только косинусного подобия)
  correct: b
  explanation: Канарский процесс выполняет косинусное подобие в качестве первого прохода для всех выходных данных зонда. LLM-как судья работает только в тех случаях, когда сходство падает ниже 0,85, поскольку в этих случаях расхождение достаточно велико, чтобы гарантировать качественную оценку. Это удерживает канареечные затраты практически нулевыми для большинства PR, сохраняя при этом дорогостоящее решение LLM для крайних случаев, которые действительно оправдывают это. Использование LLM в качестве судьи для каждого зонда сделало бы канареечный процесс непомерно дорогим.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 11. Замыкание цикла – курирование на основе PR
    anchor: "#ab-canary-probes"
- id: 16-024
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что должно произойти с предложением Куратора, которое появляется в трех последовательных отчетах без каких-либо действий?
  options:
    a: Применяется автоматически, чтобы избежать накопления
    b: Он удален из хранилища сигналов.
    c: Он сбрасывает свой счетчик и начинает заново
    d: Он переходит в состояние «ожидает решения человека» с пометкой блокировки или закрывается как «не подлежит исправлению» по документально подтвержденной причине.
  correct: d
  explanation: Предложение, которое появляется три раза без каких-либо действий, должно либо перейти к статусу «ожидает решения человека» с пометкой блокировки в следующем запросе запроса, либо закрыться как «не будет исправлено» по документально подтвержденной причине. Бесшумное повторение внушений — это тот же вариант отказа, что и разомкнутый цикл, только более тонкий. Счетчик эскалации — это механизм, который не позволяет системе бесконечно игнорировать собственные рекомендации, не принуждая человека принять решение.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 11. Замыкание цикла – курирование на основе PR
    anchor: "#suggestion-suppression"
- id: 16-025
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Каковы пороги бездействия по умолчанию для кандидатов на удаление в ACE-v2?
  options:
    a: 1 месяц на навыки, 3 месяца на правила
    b: 6 месяцев на навыки и правила
    c: 3 месяца на навыки, 6 месяцев на правила
    d: 1 месяц на правила, 6 месяцев на навыки
  correct: c
  explanation: "Руководство определяет 3 месяца для навыков и 6 месяцев для правил в качестве пороговых значений по умолчанию. Навыки меняются чаще по мере развития инструментов, поэтому уместным является более короткий период. Правила представляют собой более стабильные соглашения, поэтому порог длиннее. Это значения по умолчанию, а не абсолюты: команды в быстро меняющихся областях могут использовать более короткие окна, в то время как команды со стабильными и долгосрочными правилами могут их расширять. Сигналом к ​​спячке является отсутствие в журнале трений, а не только календарного времени."
  doc_reference:
    file: guide/core/context-engineering.md
    section: 12. Выброс – дисциплинированный деинжиниринг
    anchor: "#ejection-heuristics"
- id: 16-026
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие коммерческие инструменты наблюдения реализуют механизм исключения неактивных правил и навыков?
  options:
    a: Лангфьюс и ЛэнгСмит
    b: Мозговой трест
    c: Геликон
    d: Нет, ни один коммерческий инструмент LLMOps не реализует выброс.
  correct: d
  explanation: Никто. Braintrust, Langfuse, Helicone и LangSmith отслеживают, что происходит в подсказках и завершениях; ни один из них не отслеживает, что содержит ваша конфигурация, и не предлагает удалять ее части, которые причиняют вред. Для удаления требуется знание вашей схемы конфигурации, а не только истории запросов. Это уникальный разрыв, который заполняет данная дисциплина по сравнению с коммерческими инструментами, и именно поэтому в руководстве она описывается как одна из оправданных новинок подхода.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 12. Выброс – дисциплинированный деинжиниринг
    anchor: "#ejection-vs-archive"
- id: 16-027
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие направления исследований упоминаются в руководстве в отношении модели конституционного аудита?
  options:
    a: RLHF и контролируемая точная настройка
    b: Конституционный ИИ (Anthropic 2022) и RLAIF
    c: Цепочка мыслей и последовательность
    d: Генерация с расширенным поиском и проверка фактов
  correct: b
  explanation: "В руководстве конституционный аудит прослеживается до конституционного ИИ (Anthropic, 2022 г.) и RLAIF: использование документа высокого уровня для ограничения процесса генерации более низкого уровня. Транспонирование в контекстную инженерию работает на уровне конфигурации, а не на уровне вывода: «constitution.md» ограничивает внутреннюю согласованность системы правил, а не содержимое ответа модели. Этот механизм проще, чем конституционный ИИ на выходном уровне, поскольку входные данные короче и полностью детерминированы."
  doc_reference:
    file: guide/core/context-engineering.md
    section: 13. Аудит конституционности и самосогласованности
    anchor: "#constitutional-audit"
- id: 16-028
  difficulty: power
  profiles:
  - senior
  - power
  question: Какой реальный инцидент послужил причиной использования шаблона проверки самосогласованности в ACE-v2?
  options:
    a: Сбои сборки CI, вызванные устаревшими ссылками на правила
    b: Обновление модели, которое незаметно изменило поведение вызова инструмента.
    c: Документация утверждает 100% версию навыков, когда фактическое состояние составляло 17%.
    d: Аудит безопасности, выявляющий устаревшие учетные данные в файлах конфигурации.
  correct: c
  explanation: При производственной установке ACE в файле `ace-improvement-loop.md` говорилось, что «по состоянию на 04 марта 2026 г. создание версий завершено на 100 %». Шесть недель спустя измеренное состояние составило 20 из 114 навыков, которые были версионированы, что составляет 17%. Разрыв сохранялся, потому что никто не проверял заявления, которые система делала о себе. Проверка самосогласованности выполняется еженедельно и сверяет утверждения документации с измеренным состоянием, отмечая расхождения выше 10 % в следующем отчете куратора.
  doc_reference:
    file: guide/core/context-engineering.md
    section: 13. Аудит конституционности и самосогласованности
    anchor: "#self-consistency-check"
- id: 16-029
  difficulty: senior
  profiles:
  - senior
  - power
  question: При согласовании профилей нескольких разработчиков, при каком пороге правило становится «кандидатом на подъем» для общей конфигурации проекта?
  options:
    a: Правило присутствует более чем в 50 % профилей разработчиков.
    b: Правило присутствует более чем в 80% профилей разработчиков.
    c: Правило присутствует во всех профилях разработчиков.
    d: Правило присутствует как минимум в 3 профилях разработчиков.
  correct: a
  explanation: "Правило, появляющееся более чем в 50% отдельных профилей разработчиков, является кандидатом на подъем: оно принадлежит общему CLAUDE.md уровня проекта, а не дублируется в разных профилях. Показатель 80 % относится к эвристике перекрытия профилей исключения (предложения по консолидации), а не к порогу согласования. Проверка согласования отличает поведенческие правила (поднятие кандидатов выше порогового значения) от правил предпочтений (тон, многословие), которые никогда не повышаются независимо от частоты."
  doc_reference:
    file: guide/core/context-engineering.md
    section: 14. Согласование профилей нескольких разработчиков
    anchor: "#detection"
- id: 16-030
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Согласно руководству, какова частота ошибок pass@1 для задач многофайлового агента без спецификации?
  options:
    a: 5.2%
    b: 19.4%
    c: 32.1%
    d: 41.5%
  correct: b
  explanation: "Задачи с несколькими файлами завершаются неудачно с вероятностью 19,4 % прохода @ 1 без спецификации. Это количественный пример роли инженера по спецификациям: по мере того, как организации переводят агентов на работу по реализации нескольких файлов, отсутствие структурированной спецификации становится основной причиной сбоев в качестве выходных данных. Показатель 32,1% — это процент прохождения Claude Code теста c-CRAB (запросы на включение с наборами тестов), другой показатель."
  doc_reference:
    file: guide/roles/ai-roles.md
    section: 17. Инженер-специалист
    anchor: "#17-spec-engineer"
- id: 16-031
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Каковы четыре этапа разработки GitHub Spec Kit?
  options:
    a: Определить, спроектировать, внедрить, проверить
    b: Исследования, Спецификации, Код, Обзор
    c: Конституция, Указать, План, Задачи
    d: Требования, архитектура, реализация, тестирование
  correct: c
  explanation: "GitHub Spec Kit формализует разработку на основе спецификаций в виде четырехэтапного конвейера: Конституция (инварианты и ограничения, связывающие спецификацию), Спецификация (написание самой структурированной спецификации), План (план реализации агента, полученный из спецификации) и Задачи (атомарные задачи реализации). Файл спецификации в `.specify/` является управляющим артефактом во всем. Factory.ai Missions расширяет это за счет контрактов на поведенческую проверку, записываемых до начала реализации."
  doc_reference:
    file: guide/roles/ai-roles.md
    section: 17. Инженер-специалист
    anchor: "#17-spec-engineer"
- id: 16-032
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  - pm
  question: По данным Strata Identity Research, какой процент организаций не имеет официальной стратегии идентификации агентов к 2026 году?
  options:
    a: 33%
    b: 55%
    c: 61%
    d: 77%
  correct: d
  explanation: Исследование Strata Identity Research 2026 сообщает, что 77% организаций не имеют официальной стратегии идентификации агентов. Только 23% имеют формальную стратегию, 44% по-прежнему используют статические ключи API для аутентификации агентов, а 18% полагаются на наследование доверия IAM без ограничения области действия каждого агента. Это структурный разрыв, который мотивирует роль агента-архитектора личности. Угроза Lethal Trifecta (частные данные + ненадежный контент + внешние коммуникации) хорошо понятна, но в большинстве организаций защита еще не выстроена.
  doc_reference:
    file: guide/roles/ai-roles.md
    section: 18. Архитектор идентичности агента
    anchor: "#18-agent-identity-architect"
- id: 16-033
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой механизм аутентификации использует идентификатор агента Microsoft Entra для определения разрешений для отдельных сеансов агента?
  options:
    a: Статические ключи API, привязанные к типу агента
    b: OAuth Потоки от имени (OBO) привязаны к конкретным контекстам сеанса
    c: Токены JWT с утверждениями на основе ролей
    d: Утверждения SAML с ограниченным по времени доступом
  correct: b
  explanation: Идентификатор агента Microsoft Entra предоставляет выделенные типы субъектов-служб с потоками OAuth «от имени» (OBO), привязанными к конкретным контекстам сеанса. Поток OBO означает, что агент действует от имени конкретного контекста задачи, а не с широкими разрешениями общих учетных данных команды или статического ключа API. Субагенты, порожденные оркестраторами, по умолчанию не могут наследовать родительские разрешения; они получают минимальные возможности для выполнения своей задачи. Это модель идентификации каждого агента, которую не внедрили 77% организаций.
  doc_reference:
    file: guide/roles/ai-roles.md
    section: 18. Архитектор идентичности агента
    anchor: "#18-agent-identity-architect"
- id: 16-034
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: На каком проценте производственного трафика инженеры по оценке ИИ обычно проводят канареечные сравнения A/B, прежде чем предлагать изменения модели?
  options:
    a: 5-10%
    b: 10-25%
    c: 1-2%
    d: 0.1-0.5%
  correct: c
  explanation: Канарские трубопроводы обеспечивают 1-2% производственного трафика. Это стандартная цифра, указанная в руководстве как для должности AI Eval Engineer, так и для функции непрерывной оценки AWS Bedrock AgentCore. Увеличение трафика увеличивает радиус регрессии; работа на меньшем уровне снижает статистическую мощность. Диапазон 1–2 % уравновешивает статистическую значимость и воздействие и соответствует тому, как Bedrock AgentCore реализует оценку трафика для обнаружения скрытого ухудшения качества.
  doc_reference:
    file: guide/roles/ai-roles.md
    section: 19. Инженер по оценке искусственного интеллекта
    anchor: "#19-ai-eval-engineer"
- id: 16-035
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой диапазон оценок предвзятости стиля указан в документе «Суждение судей» (arXiv 2604.23178) для передовых систем судейства LLM?
  options:
    a: 0.76-0.92
    b: 0.10-0.25
    c: 0.45-0.65
    d: 0.30-0.50
  correct: a
  explanation: 'В «Judgeing the Judges» (arXiv 2604.23178) сообщается, что баллы смещения стиля составляют 0,76–0,92 для передовых моделей по сравнению с смещением позиции ниже 0,04. (Эта цифра взята из этой статьи, а не из отдельной статьи «JudgeBiasBench», arXiv 2603.08091.) Предвзятость стиля является доминирующей моделью: судьи LLM одобряют стилистически безупречные, но неправильные результаты значительно чаще, чем следовало бы. Практическим следствием является то, что истинно отрицательные показатели выявления недействительных результатов обычно составляют менее 25%. Инженеры по оценке AI используют эти данные для разработки конвейеров оценки, которые сочетают LLM в качестве судьи для качественных измерений с проверками на основе кода для всего, что можно оценить механически.'
  doc_reference:
    file: guide/roles/ai-roles.md
    section: 19. Инженер по оценке искусственного интеллекта
    anchor: "#19-ai-eval-engineer"
- id: 16-036
  difficulty: senior
  profiles:
  - power
  - senior
  question: Как ведет себя диалог AskUserQuestion по умолчанию, начиная с версии 2.1.200, когда пользователь не отвечает?
  options:
    a: Он ждет бесконечно; автоматическое продолжение после тайм-аута простоя теперь включено через /config
    b: Через 30 секунд он автоматически продолжит работу с первым из перечисленных вариантов, поведение такое же, как и раньше.
    c: Он полностью отменяет текущий ход и возвращает управление подсказке пользователя.
    d: Он передается фоновому агенту, который отвечает от имени пользователя, используя историю сеансов.
  correct: a
  explanation: "В примечании к выпуску ясно указано: диалоговые окна AskUserQuestion больше не продолжаются автоматически по умолчанию, и вы можете снова выбрать тайм-аут простоя через /config, если хотите сохранить старое поведение. Вариант b описывает значение по умолчанию, существовавшее до версии 2.1.200, которое было удалено в этом выпуске. Варианты c и d описывают поведение, которого нет в примечаниях к выпуску."
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.200
- id: 16-037
  difficulty: power
  profiles:
  - power
  question: Что меняет установка CLAUDE_CODE_RETRY_WATCHDOG для длительного автоматического сеанса?
  options:
    a: Он отключает все автоматические повторные попытки, требуя от пользователя вручную возобновлять каждый неудачный запрос.
    b: Это влияет только на повторные попытки вызова инструмента MCP, а не на базовое соединение API.
    c: Он ограничивает CLAUDE_CODE_MAX_RETRIES значением 15, чтобы предотвратить неконтролируемый цикл повторов в нестабильной сети.
    d: Он увеличивает количество повторов по умолчанию для временных ошибок, не связанных с пропускной способностью, до 300 и снимает ограничение в 15 повторов, которое в противном случае налагается CLAUDE_CODE_MAX_RETRIES.
  correct: d
  explanation: 'CLAUDE_CODE_RETRY_WATCHDOG увеличивает количество повторов по умолчанию для временных ошибок, не связанных с пропускной способностью, до 300 и удаляет ограничение в 15, которое в противном случае налагает CLAUDE_CODE_MAX_RETRIES. Вариант c описывает противоположное: уже существующее ограничение снимает сторожевая переменная. В той же версии v2.1.199 также возникали временные ошибки 429, не связанные с достижением лимита использования, автоматические повторные попытки с отсрочкой для подписчиков - связанное, но отдельное изменение от самой переменной сторожевого таймера.'
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.199
- id: 16-038
  difficulty: intermediate
  profiles:
  - power
  - senior
  question: Контрольный таймер простоя потоковой передачи, включенный по умолчанию, начиная с версии 2.1.196, что делает, если поток ответов не создает событий в течение примерно 5 минут?
  options:
    a: Он прерывает остановившийся поток и автоматически повторяет запрос.
    b: Он молча продолжает ждать, поскольку у Claude Code нет встроенного таймаута потока.
    c: Он завершает весь процесс Claude Code, требуя перезагрузки вручную.
    d: Он переключает сеанс на резервную модель до конца разговора.
  correct: a
  explanation: Сторожевой таймер прерывает поток, который не вызывал никаких событий в течение примерно 5 минут, и повторяет запрос, применяя его к нескольким поставщикам. Его можно отключить с помощью CLAUDE_ENABLE_STREAM_WATCHDOG=0. Он не убивает весь процесс и не меняет модели молча. До этого выпуска остановленный поток без встроенного тайм-аута был ближе к поведению, описанному в варианте б.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.196
- id: 16-039
  difficulty: senior
  profiles:
  - power
  - senior
  question: До версии 2.1.198 как субагенты и операции сжатия контекста справлялись с расширенным мышлением и что изменилось?
  options:
    a: Они всегда бежали с расширенным мышлением, полностью отключенным; теперь они могут включить его вручную для каждого субагента через Frontmatter
    b: Они уже унаследовали конфигурацию сеанса; v2.1.198 изменил только бюджет мышления по умолчанию в токенах.
    c: Они использовали фиксированное значение по умолчанию независимо от настроек сеанса; теперь они наследуют собственную конфигурацию расширенного мышления сеанса
    d: Раньше они наследовали конфигурацию сеанса, но в версии 2.1.198 для экономии средств они переключились на фиксированную конфигурацию по умолчанию.
  correct: c
  explanation: В примечаниях к выпуску версии 2.1.198 говорится, что субагенты и сжатие контекста теперь наследуют конфигурацию расширенного мышления сеанса, улучшая качество вывода делегированных задач, подразумевая, что ранее они использовали фиксированное значение по умолчанию, а не следовали тому, что настроил родительский сеанс. Вариант d меняет направление изменения на противоположное, а вариант b утверждает, что ничего не изменилось, что противоречит улучшению, отмеченному в релизе.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 16-040
  difficulty: senior
  profiles:
  - power
  - senior
  question: Что означает термин «призрачные токены» в контекстном руководстве по проектированию?
  options:
    a: Токены учитываются API дважды, когда включены кэширование запросов и потоковая передача.
    b: Контент, который выдерживает /compact или этап обобщения, но больше не выполняет полезную работу, потребляет бюджет, не будучи несущим нагрузку.
    c: Дополнительные жетоны, которые модель тратит на логические рассуждения, прежде чем дать окончательный ответ.
    d: Токены выставляют счет за запрос, который не удался и был повторен в автоматическом режиме сторожевым таймером потоковой передачи.
  correct: b
  explanation: Токены-призраки — это контент, который пережил суммирование с потерями или проход /compact, но перестал выполнять полезную работу, мертвый груз, который требует затрат бюджета, но не является несущим нагрузку. В руководстве это сформулировано как более узкий вопрос более поздней стадии, чем «Минимально жизнеспособный контекст», который нацелен на шум еще до того, как начнется уплотнение. Другие варианты описывают несвязанные явления, двойное выставление счетов, накладные расходы и повторную попытку выставления счетов, не подпадающие под этот термин в руководстве.
  doc_reference:
    file: guide/ecosystem/context-engineering-tools.md
    section: Качество контекста после сжатия («призрачные токены»)

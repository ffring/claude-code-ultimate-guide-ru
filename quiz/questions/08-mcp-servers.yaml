    anchor: "#community-mcp-servers-ecosystem"
- id: 08-021
  difficulty: senior
  profiles:
  - senior
  - power
  question: В чем ключевое различие между официальными серверами `git-mcp` и `github-mcp`?
  options:
    a: Git MCP — для Linux; GitHub MCP — для macOS и Windows.
    b: Git MCP использует OAuth; GitHub MCP использует токены API
    c: Git MCP — официальный Anthropic (12 локальных инструментов git, без аутентификации); GitHub MCP — официальный GitHub (удаленная платформа, для удаленного режима требуется GitHub Copilot)
    d: Git MCP работает в CI/CD; GitHub MCP работает только в интерактивном режиме
  correct: c
  explanation: |-
    `git-mcp` это **чиновник Anthropic Git-сервер**: он предоставляет 12 локальных инструментов git (журнал, статус, различия, фиксации и т. д.) без необходимости аутентификации. Он полностью работает в локальном репозитории. `github-mcp` это **чиновник GitHub сервер**: он подключается к пульту GitHub платформе и требует аутентификации. Для удаленного режима (рассылка, создание PR, проблемы) требуется GitHub Copilot подписка. Выбирать `git-mcp` для локальных операций git и `github-mcp` для GitHub интеграция платформы.
    ---
  doc_reference:
    file: guide/diagrams/05-mcp-ecosystem.md
    section: Официальные серверы
    anchor: "#official-servers"
- id: 08-022
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какие подкоманды CLI позволяют аутентифицировать или деаутентифицировать названный сервер MCP непосредственно с терминала, минуя интерактивное меню /mcp?
  options:
    a: claude mcp auth <name>, which always opens a browser and has no headless option
    b: claude mcp connect <name> --headless, added in the same release as the /mcp menu
    c: claude mcp login <name> and claude mcp logout <name>, with a --no-browser flag that redirects the OAuth flow through stdin for SSH sessions
    d: claude mcp auth-refresh <name>, which silently renews tokens without user interaction
  correct: c
  explanation: вход claude mcp <name> и выход claude mcp <name> аутентифицируют и деаутентифицируют конкретный сервер MCP прямо из CLI. Оба выпущены в версии 2.1.186. Флаг --no-browser перенаправляет поток OAuth через стандартный ввод вместо открытия вкладки браузера, что важно для сеансов SSH или безголовых контейнеров, где браузер недоступен. Остальные три параметра называют команды, которых нет в Claude Code.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.186
- id: 08-023
  difficulty: senior
  profiles:
  - senior
  - power
  question: Чем управляет переменная среды CLAUDE_CODE_MCP_TOOL_IDLE_TIMEOUT?
  options:
    a: Он устанавливает, как долго Claude Code ожидает перед повторной попыткой неудачного подключения к серверу MCP при запуске.
    b: Он контролирует, как долго удаленный вызов инструмента MCP может зависать без ответа, прежде чем он будет прерван с ошибкой, переопределяя 5-минутное значение по умолчанию.
    c: Он устанавливает интервал между отправкой уведомлений roots/list_changed на серверы MCP.
    d: Он контролирует, как долго схемы инструментов остаются в кэше, прежде чем Claude Code повторно получит их с сервера.
  correct: b
  explanation: До версии 2.1.187 удаленный вызов инструмента MCP, который никогда не отвечал, мог привести к зависанию сеанса на неопределенный срок. В этом выпуске такие вызовы прерывались с ошибкой после установленного по умолчанию 5-минутного периода простоя, и CLAUDE_CODE_MCP_TOOL_IDLE_TIMEOUT позволяет переопределить это значение по умолчанию. Это не имеет ничего общего с повторными попытками подключения при запуске, интервалами уведомлений о корнях или кэшированием схемы инструмента, которые являются отдельными механизмами.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.187
- id: 08-024
  difficulty: power
  profiles:
  - senior
  - power
  question: Что происходит с версией 2.1.203? Claude Code's MCP roots/list возможность вести себя, когда рабочие каталоги сеанса изменяются в середине сеанса?
  options:
    a: Он вычисляется один раз при запуске сеанса и никогда не обновляется, даже если каталоги добавляются позже с помощью --add-dir.
    b: Он всегда возвращает только один каталог, из которого был запущен Claude Code, игнорируя любые дополнительные рабочие каталоги.
    c: Требуется, чтобы сервер MCP опрашивал roots/list по таймеру, поскольку Claude Code не отправляет уведомления об изменениях.
    d: Он отражает текущие дополнительные рабочие каталоги сеанса, и Claude Code отправляет notifications/roots/list_changed всякий раз, когда они изменяются, поэтому серверы могут динамически синхронизироваться.
  correct: d
  explanation: В версии 2.1.203 ответ roots/list отражает текущие дополнительные рабочие каталоги сеанса, включая добавленные позже с помощью --add-dir или другого механизма в середине сеанса, а Claude Code теперь отправляет событие notifications/roots/list_changed всякий раз, когда этот набор изменяется. Это позволяет серверу MCP оставаться в соответствии с тем, что сеанс считает областью действия, без опроса. Другие варианты описывают статическую модель или модель на основе опроса, которую заменяет фактическая конструкция push-уведомлений.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.203
- id: 08-025
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Документированный принцип проектирования MCP предостерегает от использования одного инструмента при каждой отдельной операции API. Что вместо этого должен инкапсулировать хорошо спроектированный инструмент MCP?
  options:
    a: Один инструмент на каждую конечную точку API, поэтому агент имеет максимальную гибкость для самостоятельного составления любой последовательности вызовов.
    b: Как можно больше инструментов на один сервер, чтобы в модели всегда был специализированный инструмент для любой ситуации.
    c: Инструменты, которые инкапсулируют полное намерение пользователя, например размещение заказа, включая активную скидку, вместо того, чтобы раскрывать отдельные операции API, которые агент должен связать в цепочку.
    d: Инструменты, которые возвращают необработанные, необработанные ответы API, оставляя всю интерпретацию модели клиента.
  correct: c
  explanation: Принципы использования руководства требуют разработки инструментов MCP с учетом полных намерений пользователя, а не отдельных вызовов API. Инструмент, охватывающий одну операцию API, заставляет агента самостоятельно связывать несколько вызовов, и каждый вызов в этой цепочке является независимой точкой отказа. Инструмент, охватывающий полный рабочий процесс, например размещение заказа с уже примененной скидкой, удерживает модель на одном четко определенном пути вместо того, чтобы составлять несколько хрупких шагов. Варианты a, b и d описывают фрагментированный, чрезмерно специализированный или недостаточно обработанный дизайн, против которого выступает принцип.
  doc_reference:
    file: guide/ecosystem/mcp-servers-ecosystem.md
    section: Принципы использования (помимо контрольного списка оценки)
- id: 08-026
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Где хранится конфигурация MCP пользовательского уровня?
  options:
    a: ~/.mcp/config.json
    b: ~/.claude.json
    c: /etc/claude/mcp.json
    d: ~/.config/claude/mcp.json
  correct: b
  explanation: |-
    Серверы MCP настраиваются в `~/.claude.json` в поле `"mcpServers"`.

    Расположение конфигурации:
    - `~/.claude.json` (поле `"mcpServers"`) - Область действия User/local
    - `.mcp.json` в корне проекта - Объем проекта (доступен через VCS)

    В конфигурации указывается, какие серверы запускать и их настройки.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 8.3 Конфигурация
    anchor: "#mcp-configuration-location"
- id: 08-027
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой синтаксис Claude Code использует для подстановки переменных среды в конфигурации MCP?
  options:
    a: ${projectPath}
    b: ${workspaceFolder}
    c: ${VAR_NAME}
    d: ${PROJECT_DIR}
  correct: c
  explanation: |-
    Claude Code использует стандартный синтаксис `${VAR}` в стиле оболочки для расширения переменных среды.

    Подстановка переменных в конфиге MCP:
    - `${VAR}` - Значение переменной среды
    - `${VAR:-default}` - переменная среды с резервным вариантом

    Примечание. `${workspaceFolder}` и `${env:VAR_NAME}` — это соглашения VS Code, а не Claude Code.

    Example:
    ```json
    "окр.": {
      "DATABASE_URL": "${DATABASE_URL}"
    }
    ```
  doc_reference:
    file: guide/ultimate-guide.md
    section: 8.3 Конфигурация
    anchor: "#variable-substitution"

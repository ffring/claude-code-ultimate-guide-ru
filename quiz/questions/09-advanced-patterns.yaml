- id: 09-022
  difficulty: power
  profiles:
  - power
  question: Каковы 5 уровней «механического штабелирования»?
  options:
    a: Режим планирования, расширенное мышление, вращение двигателя, разделение ролей, перестановка
    b: Режим планирования, последовательное мышление, контекст7, Серена, драматург
    c: CLAUDE.md, Режим планирования, Расширенное мышление, Серверы MCP, Перехватчики
    d: Режим планирования, расширенное мышление, пересмотр двигателя, мультиагентность, перехватчики
  correct: a
  explanation: |-
    Механическое наложение слоев: 5 методов для максимальной мощности Claude Code:

    1. **Plan Mode** - Безопасное исследование без изменений
    2. **Расширенное мышление** – Глубокие внутренние рассуждения.
    3. **Rev the Engine** - Прогрессивные подсказки прогрева
    4. **Split-Role** — отдельный architect/implementer/reviewer
    5. **Permutation** — систематическое тестирование вариаций.

    Каждый уровень усиливает эффективность предыдущего.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Механик штабелирования
    anchor: "#mechanic-stacking"
- id: 09-023
  difficulty: power
  profiles:
  - power
  question: Что такое «фреймворк перестановок» в Claude Code?
  options:
    a: A/B тестирование вариантов пользовательского интерфейса
    b: "Систематическое тестирование вариаций на основе CLAUDE.md: определите параметры, сгенерируйте варианты, внедрите, оцените"
    c: Генерация случайного кода для тестов
    d: Набор автоматизированных регрессионных тестов
  correct: b
  explanation: "Permutation Framework использует CLAUDE.md для проведения систематического вариационного тестирования. Рабочий процесс: определить параметры вариантов (например, выбор алгоритма, структуру данных, стратегию кэширования), сгенерировать все комбинации, реализовать каждый вариант, оценить с помощью метрик. Это гарантирует, что вы методично исследуете пространство решений, а не выбираете первый подход."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Что такое структура перестановок?
    anchor: "#what-is-a-permutation-framework"
- id: 09-024
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какая ментальная модель описывает разработчика как организатора экземпляров Claude?
  options:
    a: Менеджер трубопровода
    b: Агент-супервайзер
    c: You Are the Main Thread — аналогия планировщика ЦП, где разработчик отправляет задачи агентам.
    d: Маршрутизатор задач
  correct: c
  explanation: "«You Are the Main Thread» использует аналогию с планировщиком ЦП: разработчик — это основной поток, распределяющий работу по экземплярам Claude (рабочим потокам). Вы управляете приоритетами, переключениями контекста и синхронизацией. Ключевая идея: вы не пишете код — вы управляете агентами, которые пишут код. Это переключает навыки с кодирования на оркестровку."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Ты — главная тема
    anchor: "#you-are-the-main-thread"
- id: 09-025
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что рекомендует руководство, если элементы списка задач постоянно расходятся с фактически выполненной работой?
  options:
    a: Удалить список задач и начать заново
    b: Добавьте более подробную информацию к каждой задаче
    c: "Используйте шаблоны расхождений в качестве диагностики: слишком широкие = разрушение, слишком узкие = шаг назад, неправильные приоритеты = согласование с целями."
    d: Не обращайте внимания на расхождение и продолжайте
  correct: c
  explanation: |-
    Расхождение в списке задач является диагностическим признаком, а не ошибкой. Шаблоны выявляют проблемы:

    - **Слишком широкие задачи** → разбить на более мелкие части
    - **Слишком узкие задачи** → отступите назад и подумайте шире
    - **Неправильные приоритеты** → привести задачи в соответствие с фактическими целями
    - **Постоянный дрейф** → ваша ментальная модель проблемы неверна

    Используйте дивергенцию как сигнал, а не шум.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Списки задач как инструмент диагностики
    anchor: "#task-lists-as-diagnostic-tool"
- id: 09-026
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каково «правило появления» для утверждения установленных шаблонов при проверке кода?
  options:
    a: ">5 случаев = установлено, 2-5 = возникающее, <2 = не установлено"
    b: 10+ случаев = установлено, 3-10 = возникающее, <3 = не установлено
    c: На основе количества файлов, а не количества вхождений
    d: ">20 случаев = установлено, 5-20 = возникающее, <5 = не установлено"
  correct: b
  explanation: |-
    Меры защиты от галлюцинаций при проверке кода определяют правило возникновения:

    - **10+ случаев** = установленный шаблон (безопасно для ссылки)
    - **3-10 случаев** = формирующаяся модель (упоминать осторожно)
    - **<3 вхождений** = НЕ установленный шаблон (не утверждайте, что это так)

    Это не позволяет Claude галлюцинировать «устоявшиеся условности» на основе нескольких примеров.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Разделение ролей субагентов
    anchor: "#split-role-sub-agents"
- id: 09-027
  difficulty: power
  profiles:
  - power
  question: Какие три специализированных агента используются при многоагентной проверке кода?
  options:
    a: Обозреватель безопасности, аналитик производительности, обозреватель UX
    b: Линтер, проверка типов, средство запуска тестов
    c: Агент согласованности, агент SOLID, защитный аудитор кода
    d: Младший рецензент, старший рецензент, архитектор-рецензент
  correct: c
  explanation: |-
    Мультиагентный PR-анализ использует 3 специализированных агента:

    1. **Consistency Agent** — проверяет соглашения об именах, шаблоны импорта, соблюдение стиля кода.
    2. **SOLID Agent** — анализирует архитектурные принципы, внедрение зависимостей, единая ответственность.
    3. **Защитный аудит кода** — проверяет обработку ошибок, проверку входных данных, крайние случаи.

    У каждого агента есть средства защиты от галлюцинаций (правило возникновения, утверждения на уровне файла).
  doc_reference:
    file: guide/ultimate-guide.md
    section: Разделение ролей субагентов
    anchor: "#split-role-sub-agents"
- id: 09-028
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое «долг понимания» согласно «Проблеме 80%» Адди Османи?
  options:
    a: Задолженность по документации - недостающие документы
    b: Код, который вы отправили, но не до конца понимаете – в отличие от технического долга
    c: Проверка долга – непроверенные PR
    d: Задолженность по проектированию – пропущен этап проектирования
  correct: b
  explanation: |-
    **Задолженность за понимание** (из статьи Османи «Проблема 80%»): код, который вы отправили, но не полностью понимаете, в отличие от технического долга (код, который вы понимаете, но знаете, неоптимален).

    Османи обобщает исследования, показывающие, что, когда ИИ генерирует более 80% кода, разработчики рискуют накопить долг понимания, принимая предложения без глубокого понимания.

    **Руководство связывает это с «ловушкой кодирования Vibe»**: принятие кода, основанного на интуитивном понимании, а не на проверенном понимании.

    **Исправление**: Всегда будьте готовы объяснить, ПОЧЕМУ решение работает, а не только ЧТО оно делает.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: Адди Османи (команда Google Chrome)
    anchor: "#addy-osmani-google-chrome-team"
- id: 09-029
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое «4-шаговый цикл» для CLAUDE.md в качестве составной памяти?
  options:
    a: Написание, тестирование, развертывание, мониторинг
    b: Планируйте, выполняйте, анализируйте, фиксируйте
    c: Ошибка, Правило, Чтение, Никогда не повторяется
    d: Спросите, внедрите, проверьте, отправьте
  correct: c
  explanation: |-
    Руководство интерпретирует концепцию CLAUDE.md Бориса Черного как «объединение памяти» в четырехэтапный цикл:

    1. **Error** - Claude допускает ошибку
    2. **Rule** — вы добавляете правило в CLAUDE.md, запрещающее его.
    3. **Read** — Claude читает CLAUDE.md при каждом запуске сеанса.
    4. **Никогда не повторяется** — Ошибка больше никогда не повторяется.

    Борис Черный утверждает: «Я отношусь к Claude.md как к накапливающейся памяти: каждая ошибка становится прочным правилом для команды». Четырехшаговая схема — это интерпретация этого принципа в руководстве, а не явная цитата Бориса.
  doc_reference:
    file: guide/ultimate-guide.md
    section: "Реальный случай: Борис Черный (Интервал)"
    anchor: "#real-world-case-boris-cherny-interval"
- id: 09-030
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое «потолок в 150 инструкций» в контекстной инженерии?
  options:
    a: Вы не можете превышать 150 000 токенов в одном файле CLAUDE.md.
    b: Модель перестает отвечать после 150 последовательных инструкций.
    c: Когда количество инструкций превышает примерно 150, внимание становится ненадежным, а приверженность резко падает.
    d: Claude Code устанавливает жесткий лимит в 150 правил и отказывается загружать больше
  correct: c
  explanation: |-
    Потолок в 150 инструкций относится к приблизительной точке, в которой внимание трансформатора становится ненадежным для поддержания одновременного выполнения всех инструкций. Данные исследований и сообщества (HumanLayer: 15-25% соблюдения больших наборов инструкций) показывают, что как только количество постоянно включенных инструкций превышает примерно 150, Claude начинает пропускать правила или применять их непоследовательно. Исправление — это определение пути (правила загружаются только тогда, когда соответствующие файлы находятся в области видимости), чтобы количество эффективных инструкций было значительно ниже потолка.
    ---
  doc_reference:
    file: guide/core/context-engineering.md
    section: Контекстный бюджет
    anchor: "#2-the-context-budget"
- id: 09-031
  difficulty: power
  profiles:
  - power
  question: Что означает конвейер ACE в контекстной инженерии?
  options:
    a: "Сборка → Проверка → Выполнение: создайте контекст, проверьте канареечными тестами, затем запустите Claude."
    b: "Аудит → Сжатие → Оценка: оценка качества контекста, устранение раздутия, затем измерение приверженности"
    c: "Агент → Контекст → Выход: создать агентов, внедрить контекст, затем завершить работу по завершении."
    d: "Анализ → Настройка → Внедрение: анализ базы кода, настройка правил, затем встраивание в CLAUDE.md."
  correct: a
  explanation: |-
    ACE = **Assemble → Проверить → Выполнить**. Assemble создает контекст из профиля команды и модулей проекта, создавая CLAUDE.md, специфичный для разработчика и задачи. Проверка запускает канареечную проверку: 3–5 тестовых запросов, которые проверяют ключевые действия перед фактической задачей. Если канареечные проверки завершаются неудачно, устраните проблему с контекстом, прежде чем продолжить. Execute запускает Claude с проверенным контекстом фактической задачи. Конвейер структурирован для команд, использующих Claude Code в автоматизированных или полуавтоматических рабочих процессах, где качество контекста должно проверяться перед каждым запуском.
    ---
  doc_reference:
    file: guide/core/context-engineering.md
    section: Трубопровод ACE
    anchor: "#the-ace-pipeline"
- id: 09-032
  difficulty: power
  profiles:
  - power
  question: Что такое конвейер Plan-Validate-Execute и чем он отличается от режима `/plan`?
  options:
    a: Рабочий процесс из трех команд, в котором каждая команда одновременно запускается в отдельном окне терминала.
    b: Рабочий процесс из трех команд (/plan-start, /plan-validate, /plan-execute), в котором планирование, независимая проверка и параллельное выполнение намеренно разделены.
    c: Три фазы команды /plan переключаются нажатием Tab между ними.
    d: Стратегия ветвления git с плановыми, промежуточными и производственными ветвями.
  correct: b
  explanation: |-
    Конвейер Plan-Validate-Execute выполняется тремя явными командами: `/plan-start` (5-этапное планирование с динамической командой исследовательских агентов + ADR), `/plan-validate` (независимая двухуровневая проверка специалистами-агентами, без предвзятости подтверждения), `/plan-execute` (агенты параллельного рабочего дерева до объединенного PR). Ключевое отличие от стандартного режима `/plan`: исследования проводятся специализированными агентами параллельно (а не одним агентом последовательно), проверка не зависит от планирования, и каждое важное решение генерирует ADR, который автоматически принимает будущие решения. Запускайте `/clear` между командами, чтобы сбросить контекст.
    ---
  doc_reference:
    file: guide/workflows/plan-pipeline.md
    section: ТЛ;ДР
    anchor: "#tldr"
- id: 09-033
  difficulty: power
  profiles:
  - power
  question: Что такое шаблон планирования с двумя экземплярами (Джон Уильямс) и как он масштабируется по сравнению с другими подходами с несколькими экземплярами?
  options:
    a: Два экземпляра Claude, работающие на разных машинах для резервирования.
    b: Экземпляр планировщика и экземпляр рецензента, которые используют один и тот же рабочий каталог.
    c: Горизонтальное масштабирование с использованием 5–15 параллельных агентов-реализаторов.
    d: 'Вертикальное разделение: один экземпляр — Planner (только для чтения, создает спецификации), а другой — Implementer (выполняет утвержденные спецификации).'
  correct: d
  explanation: |-
    Шаблон двойного экземпляра создает **вертикальное разделение**: Экземпляр 1 ("Claude Zero" или Planner) доступен только для чтения и создает подробные спецификации, хранящиеся в `.claude/plans/`. Экземпляр 2 (Реализатор) считывает утвержденные спецификации и выполняет их. Выкройка Джона Уильямса стоит ~$100-200/month против многоэкземплярного шаблона Бориса ($500-1K/month, горизонтальное масштабирование с 5-15 параллельными агентами). Шаблон с двумя экземплярами лучше всего подходит для трудоемкой и ориентированной на качество работы, где planning/implementation разделение уменьшает циклы доработок и исправлений.
    ---
  doc_reference:
    file: guide/workflows/dual-instance-planning.md
    section: Сравнение с другими шаблонами
    anchor: "#comparison-to-other-patterns"
- id: 09-034
  difficulty: senior
  profiles:
  - senior
  - power
  question: "Что делает `isolation: \"worktree\"` в заставке агента YAML (v2.1.50+)?"
  options:
    a: Запрещает агенту читать файлы за пределами текущего каталога.
    b: Автоматически создает агент в новом рабочем дереве git каждый раз, когда он вызывается (v2.1.50+).
    c: Запускает агент в контейнере Docker с сетевой изоляцией.
    d: Создает виртуальную песочницу, которая блокирует все операции записи файлов.
  correct: b
  explanation: |-
    Установка `isolation: "worktree"` во вступительной части агента автоматически создает агент в новом рабочем дереве git каждый раз, когда он вызывается. Это заменяет прежний шаблон ручной передачи `isolation: "worktree"` на каждый отдельный вызов инструмента Task. Рабочее дерево автоматически создается перед запуском агента и очищается после его завершения. Это рекомендуемый подход для агентов, которые выполняют крупномасштабный рефакторинг или генерируют изменения, которые не должны загрязнять основное рабочее дерево.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Декларативная изоляция в определениях агентов
    anchor: "#declarative-isolation-in-agent-definitions"
- id: 09-035
  difficulty: power
  profiles:
  - power
  question: Что происходит в конвейере ACE, если канареечные проверки завершаются неудачно на этапе «Проверка»?
  options:
    a: Если канареечные проверки завершаются неудачей, конвейер продолжает работу, но записывает предупреждения.
    b: Канарские проверки запускаются после выполнения для проверки результатов.
    c: Если канареечные проверки завершаются неудачно на этапе проверки, конвейер завершается, и перед повторной попыткой необходимо исправить проблему с контекстом.
    d: Неудачные канареечные проверки запускают цикл автоматического восстановления, который изменяет CLAUDE.md.
  correct: c
  explanation: |-
    Если канареечные проверки завершаются неудачно, конвейер ACE **немедленно завершает работу** и предлагает устранить проблему с контекстом перед повторной попыткой. Конструкция сценария очевидна: если `CANARY_EXIT -ne 0`, выведите «Проверка Canary не удалась. Исправьте проблемы с контекстом перед выполнением». и выйдите с кодом 1. Это намеренно. Запуск Claude с нарушенным контекстом приводит к сбоям в нисходящем направлении, которые сложнее отладить. Канареечный набор должен состоять из 3–5 тестовых запросов, которые проверяют ключевые требования к поведению вашего CLAUDE.md перед каждым автоматическим запуском.
    ---
  doc_reference:
    file: guide/core/context-engineering.md
    section: Трубопровод ACE
    anchor: "#the-ace-pipeline"
- id: 09-036
  difficulty: senior
  profiles:
  - senior
  - power
  question: Почему в архитектуре проверки кода с участием нескольких поставщиков, описанной в руководстве, инструмент на основе RAG, такой как Greptile, улавливает то, что упускает собственный PR-обзор Claude Code Action?
  options:
    a: Greptile заранее индексирует весь репозиторий и может искать инвариант в каждом файле, в то время как обзор Claude Code Action ограничивается различиями одного PR.
    b: Greptile использует точно настроенную модель, которая превосходит Claude при обнаружении логических ошибок в пределах того же PR.
    c: Блоки Greptile объединяются напрямую, тогда как Claude Code Action публикует только консультативные комментарии.
    d: Claude Code Action не может читать несколько файлов во время проверки, поэтому проверяет синтаксис только в измененных строках.
  correct: a
  explanation: "Greptile заранее индексирует весь репозиторий, поэтому может ответить на вопросы, например, соответствует ли новый запрос правилу области видимости, применяемому к десяткам несвязанных файлов. Claude Code Action глубоко рассуждает о различиях с полным контекстом кодовой базы, но просматривает по одному PR за раз и не выполняет поиск по всему репозиторию. Вариант c меняет фактическое разделение ролей: Claude Code Action — это инструмент, которому разрешено блокировать слияние через шлюз CI, а не через Greptile. Вариант d неверен, потому что Claude Code Action делает вывод о намерении по всему контексту кодовой базы для каждого PR, но он просто не предназначен для поиска за пределами этого PR."
  doc_reference:
    file: guide/workflows/multi-provider-code-review.md
    section: Почему три провайдера, а не один
    anchor: "#why-three-providers-not-one"
- id: 09-037
  difficulty: senior
  profiles:
  - senior
  - power
  question: BMAD-METHOD и spec-kitty расширяют разработку, ориентированную на спецификации, но каждый добавляет свой недостающий элемент. Что такое spec-kitty, чего нет в BMAD-METHOD?
  options:
    a: Автоматическое восстановление кода из спецификации всякий раз, когда они рассинхронизируются.
    b: Управляемая облачная служба, которая выполняет полный цикл от спецификации до развертывания за единым интерфейсом.
    c: "Изолированное параллельное выполнение: каждый рабочий пакет выполняется в своем собственном рабочем дереве git, отслеживаемом на локальной канбан-доске с журналом аудита каждого решения по слиянию."
    d: Цепочка из более чем 19 агентов с конкретными ролями (аналитик, проектировщик, архитектор, разработчик, контроль качества), каждый из которых создает артефакт планирования с версией до того, как человек завершит работу.
  correct: c
  explanation: "Spec-kitty добавляет ту часть, которую не хватает и Spec Kit, и BMAD-METHOD: каждый рабочий пакет выполняется в своем собственном рабочем дереве git, с локальной панелью управления канбана, отслеживающей цикл проверки-принятия-слияния и контрольный журнал каждого решения по слиянию. Вариант d описывает сам BMAD-METHOD, который запускает более 19 ролевых агентов через цепочку планирования, но не обеспечивает изолированное параллельное выполнение само по себе. Вариант А относится к до сих пор нерешенной проблеме смещения спецификации, с которой ни один инструмент не справляется надежно. Вариант б описывает совершенно другую категорию — фабрики программного обеспечения для искусственного интеллекта полного цикла, такие как Maleus, Factory.ai и Blitzy."
  doc_reference:
    file: guide/workflows/spec-first.md
    section: С Spec-Kitty (изолированное параллельное выполнение)
    anchor: "#with-spec-kitty-isolated-parallel-execution"
- id: 09-038
  difficulty: senior
  profiles:
  - senior
  - power
  - pm
  question: В модели зрелости агента поддержки и CSM на каком уровне перестает быть обязательным этап проверки человеком в процессе, то есть человек, читающий черновик до того, как он дойдет до клиента?
  options:
    a: Это никогда не перестанет быть востребованным. На каждом уровне от L0 до L5 предполагается, что человек просматривает результат до того, как его увидит клиент.
    b: L2, как только агент получит доступ к базе данных только для чтения и его диагнозы станут достаточно надежными.
    c: L3, когда агент сможет отличать известные ошибки от новых благодаря интеграции системы отслеживания проблем.
    d: L5, как только у агента будет достаточно контекста, чтобы подготовить полный брифинг CSM перед звонком без присмотра.
  correct: a
  explanation: "В руководстве это прямо указано: этап проверки человеком не является необязательным и не должен автоматизироваться, даже если точность агента на практике выглядит хорошей, и каждый уровень в шаблоне предполагает, что человек читает выходные данные до того, как они дойдут до клиента. Каждый из вариантов b, c и d выбирает определенный уровень в качестве порогового значения, но вся суть шаблона в том, что проверка человеком — это постоянный механизм безопасности, который делает предоставление более глубокого доступа, например, чтение базы данных L2, в первую очередь приемлемым риском."
  doc_reference:
    file: guide/workflows/support-csm-agent.md
    section: Безопасность и ограждения
    anchor: "#security-guardrails"
- id: 09-039
  difficulty: senior
  profiles:
  - senior
  - power
  question: В руководстве описывается выполнение оценки LLM в качестве судьи асинхронно, а не синхронно по каждому запросу пользователя. Какова причина этой закономерности?
  options:
    a: Синхронный запуск судьи накажет каждого пользователя дополнительной задержкой, чтобы уловить частоту отказов, которая влияет только на меньшинство взаимодействий; вместо этого ответ подается немедленно, а затем оценивается по зарегистрированным данным.
    b: Требуется асинхронное судейство, поскольку модель оценки всегда меньше и медленнее, чем производственная модель, поэтому она не успевает за трафиком в реальном времени.
    c: Синхронное судейство технически невозможно, поскольку LLM-как судья работает только с пакетами не менее 50 запросов одновременно.
    d: Асинхронное судейство позволяет избежать затрат на регистрацию входных и выходных данных, поскольку необходимо сохранять только помеченные ответы.
  correct: a
  explanation: "В руководстве напрямую изложена производственная схема: немедленно обслуживайте ответ агента, регистрируйте входные и выходные данные, асинхронно запускайте модель оценки на основе зарегистрированных данных, затем используйте вердикты для обновления набора данных и отмечайте регрессии. Вариант b неверен с точки зрения фактов: модель оценки обычно больше, чем производственная модель, а не меньше, например, использование Opus для оценки выходных данных Sonnet. Варианты c и d создают ограничения, о которых никогда не говорится в руководстве."
  doc_reference:
    file: guide/roles/agent-evaluation.md
    section: "LLM-как судья: работать асинхронно"
    anchor: "#llm-as-judge-run-asynchronously"
- id: 09-040
  difficulty: power
  profiles:
  - power
  question: Как включить команды агентов в Claude Code v2.1.32+?
  options:
    a: Используйте команду /agent-teams.
    b: Установите CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 или добавьте к settings.json
    c: Установите плагин агентских команд из skills.sh.
    d: Используйте флаг --teams CLI
  correct: b
  explanation: |-
    Командам агентов требуется флаг экспериментальной функции. Два метода:

    1. **Переменная среды**: `export CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`
    2. **Файл настроек**: добавьте `{"env": {"CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS": "1"}}` в ~/.claude/settings.json.

    Минимум Opus не требуется. Выберите доступную модель для каждого товарища по команде; эта функция остается экспериментальной.
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Настройка и конфигурация
    anchor: "#3-setup-configuration"
- id: 09-041
  difficulty: power
  profiles:
  - power
  question: Когда следует использовать команды агентов вместо рабочих процессов с несколькими экземплярами?
  options:
    a: Всегда - команды агентов превосходят
    b: Когда задачи требуют координации в общей базе кода (анализ с интенсивным чтением)
    c: Когда задачи полностью независимы (отдельные проекты)
    d: Когда бюджет ограничен (команды агентов обходятся дешевле)
  correct: b
  explanation: |-
    **Agent Teams** = Автоматическая координация в общей базе кода (на основе git).
    Подходит для: задач, требующих большого объема чтения (проверка кода, отслеживание ошибок, анализ).

    **Multi-Instance** = Ручная оркестровка, независимые задачи
    Лучше всего подходит для: отдельных проектов, без общего состояния, без необходимости координации.

    Ключ: используйте Teams, когда важна координация, и Multi-Instance, когда распараллеливание без координации.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.20 Команды агентов
    anchor: "#920-agent-teams-multi-agent-coordination"
- id: 09-042
  difficulty: power
  profiles:
  - power
  question: В чем основное ограничение агентских команд?
  options:
    a: Невозможно создать более двух агентов.
    b: Задачи с большим объемом чтения работают хорошо, задачи с большим объемом записи рискуют привести к конфликтам слияния.
    c: Работает только на macOS
    d: Требуется дорогостоящее оборудование
  correct: b
  explanation: |-
    **Критическое ограничение**: компромисс между интенсивным чтением и интенсивной записью

    ✅ Хорошо: проверка кода (агенты читают, анализируют, сообщают)
    ✅ Хорошо: отслеживание ошибок (агенты читают журналы, отслеживают выполнение)
    ⚠️ Рискованно: рефакторинг общих типов (конфликты слияния).
    ❌ Плохо: один и тот же файл был изменен несколькими агентами.

    Смягчение: назначьте непересекающиеся наборы файлов, используйте подход «сначала интерфейс».
    Стоимость токена также значительна (множитель 3x+).
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Ограничения и ошибки
    anchor: "#6-limitations-gotchas"
- id: 09-043
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какое правило модели применимо к экспериментальным командам агентов?
  options:
    a: Каждый товарищ по команде должен использовать Opus.
    b: Каждый товарищ по команде должен использовать ту же модель, что и ведущий.
    c: Haiku нельзя выбрать в качестве товарища по команде.
    d: Товарищи по команде могут использовать разные модели, доступные в учетной записи.
  correct: d
  explanation: Для команд агента требуется флаг экспериментальной функции, а не минимальная версия Opus. Укажите модель каждого товарища по команде в запросе или определении агента; в противном случае параметр модели субагента или ведущая модель задает значение по умолчанию. Организационные ограничения и принудительное переопределение среды по-прежнему применяются. У каждого товарища по команде есть собственное контекстное окно, зависящее от модели.
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Когда большие команды оправданы
    anchor: "#when-large-teams-are-justified"
- id: 09-044
  difficulty: power
  profiles:
  - power
  question: Какова роль «руководителя команды» в архитектуре команд агентов?
  options:
    a: Выполняйте все задания, пока товарищи по команде наблюдают.
    b: Разбивайте задачи, вызывайте товарищей по команде, обобщайте результаты
    c: Контролируйте расходы и предотвращайте чрезмерное использование токенов
    d: Разрешение конфликтов слияния вручную
  correct: b
  explanation: |-
    **Руководитель группы** (основное заседание) обязанности:

    1. **Разбить задачи** на подзадачи
    2. **Создать сеансы товарищей по команде** (каждый с контекстом 1M токенов)
    3. **Обобщить результаты** всех агентов после завершения

    **Соратники по команде** самостоятельно работают над поставленными задачами и отчитываются перед руководителем группы.
    Навигация: используйте Shift+Up/Down для переключения между агентами.
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Глубокое погружение в архитектуру
    anchor: "#2-architecture-deep-dive"
- id: 09-045
  difficulty: power
  profiles:
  - power
  question: Какие производственные показатели были проверены для команд агентов?
  options:
    a: "Fountain: проверка на 50% быстрее, CRED: скорость выполнения в 2 раза."
    b: "GitHub: проверено 10 PR, Vercel: время безотказной работы 99 %"
    c: "Anthropic: 100% генерация кода без ошибок"
    d: "Мета: пятикратное увеличение производительности разработчиков"
  correct: a
  explanation: |-
    **Подтвержденные производственные показатели** (Отчет о тенденциях в области агентного кодирования на 2026 год):

    - **Fountain** (управление персоналом): на 50 % быстрее проверка, на 40 % адаптация, в 2 раза больше конверсий.
    - **CRED** (15 миллионов пользователей, финансовые услуги): 2-кратное увеличение скорости выполнения на протяжении всего жизненного цикла разработки.
    - **Anthropic Research**: автономное завершение компилятора C (без вмешательства человека)

    Эти группы агентов по проверке работают в производстве над сложными задачами, требующими большого количества операций чтения.
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Варианты производственного использования
    anchor: "#4-production-use-cases"
- id: 09-046
  difficulty: power
  profiles:
  - power
  question: Каков типичный множитель стоимости токена для команд агентов (3 агента)?
  options:
    a: То же, что и для одного агента (без накладных расходов)
    b: 1,5x (минимальные накладные расходы)
    c: 3x+ (каждый агент выполняет отдельный вывод модели)
    d: 10x (экспоненциальная стоимость)
  correct: c
  explanation: |-
    **Множитель стоимости токена: 3x+** для 3 агентов

    Why:
    - Каждый агент выполняет **отдельный вывод модели**
    - 3 агента = 3 входных жетона, 3 выходных жетона
    - Загрузка контекста на каждого агента (1 млн токенов × 3)
    - Накладные расходы на координацию (синтез руководителей группы)

    Затраты оправданы, если экономия времени > увеличение затрат (проблемы производства, критический анализ).
    В проектах с ограниченным бюджетом следует использовать одного агента.
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Компромиссы по стоимости
    anchor: "#cost-trade-offs"
- id: 09-047
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какая настройка модели допустима для ограниченного переименования с проверенным списком ссылок?
  options:
    a: Haiku 4.5 с максимальным усилием
    b: Haiku 4.5 с большим усилием
    c: Haiku 4.5 без параметра усилий, с последующими тестами и обзором различий
    d: Для каждого переименования требуется Fable
  correct: c
  explanation: Haiku 4.5, псевдоним haiku у облачных провайдеров, не имеет параметра усилий; Haiku 5.5 поддерживает уровни усилий. Более легкая модель является кандидатом на ограниченные изменения, когда ссылки и приемочные проверки ясны. Проверьте разницу и тесты; переименования по-прежнему могут влиять на общедоступные API, динамические ссылки или сгенерированные файлы. Для масштабирования стандартные скорости ввода составляют $0.10/MTok для Haiku 5.5 (до 100 000 входных токенов) по сравнению с $4/MTok для Opus 5.5.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Таблица решений
    anchor: "#decision-table"
- id: 09-048
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: "Что делает `model: haiku` в заставке агента YAML?"
  options:
    a: Делает стиль общения агента более лаконичным
    b: Заставляет агента использовать Haiku для создания всех своих субагентов.
    c: Настраивает агент для работы по модели Haiku вместо модели сеанса по умолчанию.
    d: Включает режим экономии затрат, который сокращает количество вызовов инструментов
  correct: c
  explanation: |-
    `model: haiku` в заголовке агента устанавливает модель **, используемую для этого конкретного агента**,
    переопределяя настройки сеанса по умолчанию.

    Вот как вы реализуете шаблон planner/implementer:
    ```yaml
    # planner.md
    модель: опус # Глубокое обоснование стратегии

    # implementer.md
    модель: haiku # Экономичное механическое исполнение.
    ```

    Каждый агент работает независимо со своей настроенной моделью.
    Модель сеанса (по умолчанию Sonnet) не затрагивается.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.5 Модель каждого агента
    anchor: "#model-per-agent-patterns"
- id: 09-049
  difficulty: senior
  profiles:
  - senior
  - power
  question: Чем на самом деле управляет параметр `effort` в моделях, которые его поддерживают, например Opus 5.5?
  options:
    a: Только бюджет токена мышления (сколько жетонов для расширенных рассуждений)
    b: "Общий вычислительный бюджет: мышление, вызовы инструментов, многословность текста и глубина анализа."
    c: Максимальное количество вызовов инструмента на один ответ
    d: Качественный вентиль, который фильтрует выходные данные с низкой достоверностью
  correct: b
  explanation: |-
    `effort` контролирует **общий вычислительный бюджет**, а не только мышление.

    В `effort: low`:
    - Меньше вызовов инструментов (по возможности объединяет операции)
    - Нет пояснительной преамбулы перед действиями
    - Краткие ответы

    В `effort: high`:
    - Больше вызовов инструментов с подробными объяснениями.
    - Описывает план перед его выполнением.
    - Комплексный анализ и резюме

    Это означает, что `effort` влияет на поведение, выходящее за рамки мышления. В Opus 5.5, Sonnet 5.5, Haiku 5.5 и моделях Fable мышление невозможно отключить (Alt+T не имеет эффекта), поэтому `effort` — это шкала, показывающая, сколько работы выполняет модель.
    Это комплексный регулятор эффективности, а не переключатель мышления.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.5 Уровни усилий
    anchor: "#effort-levels"
- id: 09-050
  difficulty: senior
  profiles:
  - senior
  - power
  question: "Каково заметное влияние `effort: low` на использование инструмента?"
  options:
    a: Claude отказывается использовать какие-либо инструменты и отвечает только по памяти.
    b: Claude объединяет операции инструмента для минимизации вызовов и пропуска пояснительной преамбулы.
    c: Claude ограничивается максимум тремя вызовами инструментов на ответ.
    d: Claude использует только инструменты чтения, а не инструменты записи и редактирования.
  correct: b
  explanation: |-
    В `effort: low` Claude оптимизирует эффективность:

    **Использование инструмента**: объединяет операции, которые обычно представляют собой отдельные вызовы.
    Вместо «Чтение → Анализ → Чтение → Анализ» он может выполнить одно целевое чтение.

    **Без преамбулы**: пропускает введение типа «Сейчас я прочитаю файл, чтобы понять...».
    Действия происходят непосредственно, без повествования.

    **Result**: более быстрое и дешевое выполнение задач, не требующих прозрачности.
    Лучше всего подходит для субагентов в автоматизированных конвейерах, задачах классификации и поиска.

    Пример задачи, подходящей для `low`: `"Rename getUserById to findUserById across src/"`
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.5 Уровни усилий
    anchor: "#effort-levels"
- id: 09-051
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какую модель в шаблоне агента planner/implementer должна использовать каждая роль?
  options:
    a: "Планировщик: Sonnet, Реализатор: Haiku"
    b: "Планировщик: Opus, Реализатор: Sonnet"
    c: "Планировщик: Opus, Реализатор: Haiku"
    d: "Оба: Sonnet (последовательность важнее стоимости)"
  correct: c
  explanation: |-
    **Planner: Opus** — Стратегия требует глубоких рассуждений.
    Ошибки планирования накапливаются на всех этапах реализации.
    Неправильное архитектурное решение, связанное с затратами на планирование = минуты на исправление.
    Та же ошибка обнаружена после реализации = дней.

    **Реализатор: Haiku** — Механическое исполнение.
    Подход уже определен планировщиком.
    Нет дизайнерских решений = нет необходимости в глубоких рассуждениях.
    По стандартным тарифам входные данные Haiku 5.5 стоят $0.10/MTok (до 100 000 входных токенов) по сравнению с $4/MTok для Opus 5.5.

    **Когда Haiku недостаточно**: Если реализация требует принятия решений,
    разработчик должен остановиться и сообщить, а не принять решение — или вместо этого вы используете Sonnet.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.5 Модель каждого агента
    anchor: "#model-per-agent-patterns"
- id: 09-052
  difficulty: power
  profiles:
  - power
  question: Чем управляет MAX_ITERATIONS=8 в рабочих процессах команды агентов и что происходит при достижении лимита?
  options:
    a: Максимальное количество файлов, которые может прочитать агент (агент прекращает чтение и продолжает работу с доступным контекстом)
    b: Максимальное количество повторных попыток для любой неудачной задачи (агент останавливается и сообщает руководителю группы, а не продолжает повторять попытки)
    c: Максимальное количество агентов-соратников (лидер команды перестает появляться и работает последовательно)
    d: Максимальный бюджет токенов на агента (агент переключается в режим с минимальными усилиями для экономии токенов)
  correct: b
  explanation: Loop Guardrails предотвращает застревание агентов в непродуктивных циклах повторных попыток. MAX_ITERATIONS устанавливает жесткое ограничение на количество повторных попыток для любой отдельной неудачной задачи. Когда лимит достигнут, агент останавливается и сообщает об этом руководителю группы, а не повторяет попытку. Перед каждой повторной попыткой запускается запрос на размышление («Что конкретно не удалось? Какое изменение могло бы это исправить?»), Вынуждая агента изменить подход, а не повторять одно и то же ошибочное действие. Без ограничений на итерацию агенты могут использовать весь свой бюджет токенов, пытаясь выполнить заблокированную задачу, в то время как остальная часть рабочей очереди останавливается.
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Петлевые ограждения
    anchor: "#loop-guardrails"
- id: 09-053
  difficulty: power
  profiles:
  - power
  question: Каково рекомендуемое соотношение в шаблоне «Выделенный рецензент» и почему рецензент должен быть доступен только для чтения?
  options:
    a: 1 рецензент на 10 разработчиков (рецензент является узким местом при более низких показателях; доступ только для чтения предотвращает перегрузку контекста)
    b: 1 рецензент на 3-4 сборщика (меньшее количество сборщиков делает рецензента узким местом, большее количество вызывает резервное копирование в очереди; только чтение предотвращает конфликты слияния)
    c: 1 рецензент на каждого разработчика (паритет максимизирует охват рецензий; доступ только для чтения не является обязательным)
    d: 2 рецензента на каждого сборщика (двойная проверка выявляет больше ошибок; для API требуется только чтение)
  correct: b
  explanation: "Партнер по команде выделенного рецензента добавляет агента только для чтения, который проверяет каждое событие TaskCompleted. Соотношение: 1 рецензент на 3-4 застройщика. Ниже этого диапазона рецензент становится узким местом. Выше него очередь на проверку застревает, и результаты приходят слишком поздно, чтобы их можно было принять правильно. Доступ только для чтения имеет важное значение: рецензент с доступом на запись сам начнет исправлять проблемы, создавая конфликты слияния и сводя на нет цель параллельной изоляции. Задача рецензента — вырабатывать структурированные выводы (блокирующие и неблокирующие), а не вносить исправления."
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: Член команды преданного рецензента
    anchor: "#dedicated-reviewer-teammate"
- id: 09-054
  difficulty: power
  profiles:
  - power
  question: Какова структура WHY/WHAT в шаблоне итеративного поиска для субагентов и каково максимальное количество циклов поиска?
  options:
    a: ПОЧЕМУ = описание задачи, ЧТО = формат вывода (максимум 5 циклов)
    b: ПОЧЕМУ = решаемая проблема, ЧТО = конкретная задача (максимум 3 цикла)
    c: ПОЧЕМУ = причина создания агента, ЧТО = файлы для чтения (максимум 2 цикла)
    d: ПОЧЕМУ = бизнес-обоснование, ЧТО = архитектурное решение (максимум 1 цикл)
  correct: b
  explanation: "Итеративный поиск дает субагентам ограниченный контекстный бюджет. ПОЧЕМУ = проблема решается или ограничение удовлетворяется (дает контекст решения агента). ЧТО = конкретная задача, которую нужно выполнить. Агент, который знает только ЧТО, не имеет бизнес-ограничений, предотвращающих неправильный выбор. ПОЧЕМУ управляет реализацией без дополнительных циклов коррекции. Максимум 3 цикла: цикл 1 использует начальный контекст, цикл 2 — конкретный целевой запрос, цикл 3 — окончательный целевой запрос, где агент должен выдать выходные данные независимо от оставшейся неопределенности."
  doc_reference:
    file: guide/workflows/agent-teams.md
    section: 9. Итеративный поиск субагентов
    anchor: "#9-iterative-retrieval-for-sub-agents"
- id: 09-055
  difficulty: power
  profiles:
  - power
  question: Как Claude Code структурирует свою иерархию префиксов кэша и какие слои почти всегда являются попаданиями в кэш?
  options:
    a: сообщения > система > инструменты (слой сообщений всегда удачный, слой инструментов всегда промахивается)
    b: система > инструменты > сообщения (надежно работает только системное приглашение)
    c: инструменты > система > сообщения (инструменты и системные слои почти всегда являются совпадениями, уровень сообщений варьируется)
    d: инструменты > сообщения > система (все три слоя срабатывают одинаково часто)
  correct: c
  explanation: "Каждый вызов API структурирует содержимое в фиксированном порядке: инструменты, затем система, затем сообщения. Сопоставление кэша всегда начинается с начала этого префикса. Инструменты (список инструментов) и система (CLAUDE.md) стабильны на протяжении большинства ходов. Это означает, что первые два уровня почти всегда являются попаданиями в кэш, и только новые очереди сообщений требуют новых вычислений. Размещение наиболее стабильного контента в первую очередь максимизирует долю каждого запроса, обслуживаемого из кеша, при 0,1x базовой стоимости."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Оптимизация затрат
    anchor: "#how-claude-code-handles-caching-automatically"
- id: 09-056
  difficulty: power
  profiles:
  - power
  question: Что такое 20-блочный просмотр при кэшировании запросов, какую проблему он вызывает в длительных сеансах и как его исправить?
  options:
    a: Claude читает только последние 20 сообщений пользователя (старый контекст теряется безвозвратно; исправление — /save)
    b: Для каждой точки останова сопоставление кэша проверяет примерно 20 позиций блоков назад (длинный сеанс может вытолкнуть более ранний кэшированный префикс за пределы этого окна; исправление — более ранняя явная точка останова кэша)
    c: Кэш становится недействительным после 20 вызовов инструментов (агенты должны приостанавливать каждые 20 вызовов; исправление заключается в сокращении использования инструментов)
    d: После 20 ходов контекст сеанса обрезается (исправление — начать новый сеанс)
  correct: b
  explanation: Для каждой точки останова сопоставление проверяет до 20 позиций блоков на наличие префикса, который фактически был кэширован предыдущим запросом. Это не ограничение в 20 ходов разговора, и старый контент не удаляется только потому, что сеанс длинный. Если дополнения перемещают предыдущую запись за пределы окна поиска, более ранняя явная точка останова может сохранить доступ к ней. Сжатие перезаписывает историю и может потребовать новой записи в кэш, поэтому /compact не гарантирует более высокую скорость попадания.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Оптимизация затрат
    anchor: "#how-claude-code-handles-caching-automatically"
- id: 09-057
  difficulty: power
  profiles:
  - power
  question: Какой артефакт создает каждый этап в рабочем процессе RPI (Исследование > Планирование > Реализация) и что происходит на первом этапе?
  options:
    a: "Исследование создает NOTES.md, Планирование создает SPEC.md, Реализация создает код: Ворота 1 — это проверка кода."
    b: "Исследование дает RESEARCH.md, План дает PLAN.md, Реализация создает код: Ворота 1 — это решение GO/NO-GO, принимаемое человеком до начала любого планирования."
    c: "Исследование выдает подсказку, Планирование создает список задач, Реализация создает разницу: Ворота 1 — это автоматизированный проход теста."
    d: "Все фазы имеют общий PROGRESS.md: ворота автоматически активируются Claude."
  correct: b
  explanation: "Структуры ИРЦ характеризуются развитием трех взаимосвязанных фаз. Фаза 1 (Исследование): составляет RESEARCH.md, охватывающий осуществимость, риски, точки принятия решения и оценку усилий. Ворота 1: люди отмечают GO или NO-GO. Этап 2 (План): создается PLAN.md с архитектурными решениями и последовательными этапами реализации. Ворота 2: человек одобряет код до того, как он будет написан. Этап 3 (Реализация): создает рабочий код с пошаговыми тестовыми вентилями. Ворота 1 являются наиболее важными: NO-GO экономит затраты на полную реализацию, от которой пришлось бы отказаться."
  doc_reference:
    file: guide/workflows/rpi.md
    section: Как работают ворота
    anchor: "#how-the-gates-work"
- id: 09-058
  difficulty: power
  profiles:
  - power
  question: Каков минимальный порог токена быстрого кэширования для Opus 4.6 и к чему он применяется?
  options:
    a: "Opus 4.6: 1024 токена (применяются к каждому файлу CLAUDE.md отдельно)"
    b: "Opus 4.6: 4096 токенов (применяются к кэшируемому префиксу приглашения в целом, поэтому короткий CLAUDE.md все еще можно кэшировать как часть более крупного префикса)"
    c: "Opus 4.6: 2048 токенов (Opus и Sonnet имеют одинаковый минимум)"
    d: "Opus 4.6: 8192 токена (большинство подсказок слишком коротки для кэширования)"
  correct: b
  explanation: Минимальные пороговые значения для оперативного кэширования различаются в зависимости от модели. Opus 5.5, Sonnet 5.5, Fable 5.1 и Haiku 5.5 требуют 512 токенов. Opus 4.7 требует 2048. Для Opus 4.6, Opus 4.5 и Haiku 4.5 требуется 4096. Для Opus 4.8, Sonnet 5 и Sonnet 4.6 требуется 1024. Минимум применяется к префиксу кэшируемого приглашения, а не к CLAUDE.md или каждому блоку в отдельности, поэтому короткий CLAUDE.md может быть частью достаточно большого кэшированного префикса наряду с инструментами и другими инструкциями. Прежде чем применять порог, проверьте точную модель и платформу.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Оптимизация затрат
    anchor: "#how-claude-code-handles-caching-automatically"

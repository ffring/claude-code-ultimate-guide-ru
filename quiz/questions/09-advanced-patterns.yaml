  question: Сколько методологий разработки описано в справочнике по методологиям?
  options:
    a: 5 методологий
    b: 10 методологий
    c: 15 методологий
    d: 20 методологий
  correct: c
  explanation: "15 методологий, организованных в 6-уровневую пирамиду: уровень 1 (стратегический – BMAD), уровень 2 (спецификация – SDD, на основе документов, на основе требований, DDD), уровень 3 (поведение – BDD, ATDD, CDD), уровень 4 (функции – FDD, контекстная инженерия), уровень 5 (реализация – TDD, Eval-Driven, Мультиагент), уровень 6 (оптимизация)."

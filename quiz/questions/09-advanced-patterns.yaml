  question: Что такое «контекстная инженерия» как методология?
  options:
    a: Контекст инженерной команды
    b: "Отношение к контексту как к первоклассному элементу дизайна: постепенное раскрытие, управление памятью, динамическое обновление."
    c: Создание контекстных меню
    d: Управление переменными среды
  correct: b
  explanation: "Контекстная инженерия рассматривает контекст как элемент дизайна. Ключевые понятия: прогрессивное раскрытие (позволяет агенту обнаруживать информацию постепенно), управление памятью (разговор или постоянная память), динамическое обновление (перезапись списка TODO перед ответом). Высокий Claude подходит (⭐⭐⭐) для длительных сессий."

questions:
- id: 09-001
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каковы три компонента паттерна «Троица»?
  options:
    a: Git, VSCode, терминал
    b: Режим планирования, расширенное мышление, последовательное мышление
    c: Серена, Context7, драматург
    d: Агент, Навык, Команда
  correct: b
  explanation: |-
    Троица — это самый мощный паттерн Claude Code, сочетающий в себе:

    1. **Plan Mode** - Безопасное исследование без изменений
    2. **Extended Thinking** — Глубокий анализ (всегда включен для Opus 5.5, Sonnet 5.5, Haiku 5.5 и моделей Fable)
    3. **Последовательное мышление (MCP)** – Структурированное многошаговое рассуждение.

    В совокупности они обеспечивают максимальное понимание перед принятием мер.
    Используйте для принятия архитектурных решений, сложной отладки и модернизации устаревших версий.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.1 Троица
    anchor: "#91-the-trinity"
- id: 09-002
  difficulty: power
  profiles:
  - power
  question: Как переключить мышление на модель, которая это позволяет?
  options:
    a: Используйте ключевое слово ультрадумать
    b: Alt+T или Option+T на macOS
    c: Используйте флаг --think CLI
    d: Используйте команду /thinking.
  correct: b
  explanation: Alt+T (Option+T на macOS) переключает мышление там, где оно поддерживается. Opus 5.5 и Fable всегда используют мышление, поэтому переключатель не влияет на эти модели. Вместо этого выберите меньшее усилие для ограниченной работы. Ключевое слово ultrathink добавляет инструкцию рассуждения без изменения усилия API; это не переключатель мышления.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Управление режимом мышления
    anchor: "#controlling-thinking-mode"
- id: 09-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой флаг CLI запускает Claude Code без интерактивных подсказок для CI/CD?
  options:
    a: -p (флаг приглашения для неинтерактивного выполнения)
    b: --headless
    c: --batch
    d: --automated
  correct: a
  explanation: |-
    Флаг `-p` обеспечивает подсказку непосредственно в командной строке, запуская Claude Code без интерактивных подсказок:

    ```баш
    # Базовое безголовое исполнение
    claude -p "Run the tests and report results"

    # С ограничением расходов
    claude -p --max-budget-usd 5.00 "Build the project"

    # С конкретной моделью
    claude -p --model sonnet "Analyze code quality"
    ```

    Примечание. Флаг `--headless` отсутствует. Флаг `-p` по своей сути делает выполнение неинтерактивным, принимая приглашение в качестве аргумента CLI. Необходим для интеграции CI/CD, автоматизированных конвейеров и сценариев рабочих процессов.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.3 Интеграция CI/CD
    anchor: "#headless-mode"
- id: 09-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как передать контент в Claude Code с помощью подсказки?
  options:
    a: claude | cat file.txt -p 'analyze'
    b: cat file.txt | claude -p 'analyze this code'
    c: claude < file.txt --prompt 'analyze'
    d: file.txt > Клод -p 'анализировать'
  correct: b
  explanation: |-
    Используйте стандартный конвейер Unix с флагом `-p`:

    ```баш
    cat file.txt | claude -p 'analyze this code'
    git diff | claude -p 'explain these changes'
    npm test 2>&1 | claude -p 'summarize test failures'
    ```

    Это обеспечивает мощную интеграцию оболочки для автоматического анализа кода.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.3 Интеграция CI/CD
    anchor: "#unix-piping-workflows"
- id: 09-005
  difficulty: power
  profiles:
  - power
  question: Что такое шаблон «Rev the Engine»?
  options:
    a: Параллельное выполнение тестов
    b: Несколько раундов циклов «написание-критика-улучшение»
    c: Несколько раундов планирования и глубокого обдумывания перед выполнением
    d: Использование моделей более высоких вычислений
  correct: c
  explanation: |-
    Паттерн «Включите двигатель» предполагает несколько циклов **планирования и глубокого обдумывания** перед выполнением, подобно прогреву двигателя перед поездкой.

    **Стандартный рабочий процесс**: думать → планировать → выполнять
    **Усовершенствовать двигатель**: думать → планировать → думать усерднее → уточнять план → думать усерднее → завершать → выполнять

    **Когда использовать**:
    - Критические архитектурные решения (необратимые, высокоэффективные)
    - Сложные миграции, затрагивающие более 10 файлов.
    - Незнакомые области, где первые инстинкты часто ошибаются.

    **Почему это работает**: Каждый раунд заставляет Claude пересматривать предположения. Раунд 2 обычно выявляет 30–40% проблем, которые были пропущены в раунде 1.

    **Note**: В руководстве также описывается вариант шаблона с использованием циклов запись-критика-улучшение (строка 9761), но основное определение фокусируется на планировании итераций.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.3 Заведите двигатель
    line: 2337-2375
- id: 09-006
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой флаг выходного формата структурируется JSON из Claude для сценариев?
  options:
    a: --формат JSON
    b: --output-format json
    c: --json
    d: --structured
  correct: b
  explanation: |-
    Используйте `--output-format` для управления форматом ответа:

    | Формат | Вариант использования |
    |--------|----------|
    | `text` | Удобочитаемый вывод (по умолчанию) |
    | `json` | Структурированные данные, поддающиеся машинному анализу |
    | `stream-json` | Потоковая передача в реальном времени для больших выходных данных |

    Example:
    ```баш
    git log --oneline -10 | claude -p 'Categorize commits' --output-format json
    ```
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.3 Управление форматом вывода
    line: 9894-9902
- id: 09-007
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что такое «Vibe Coding» согласно руководству?
  options:
    a: Кодирование во время прослушивания музыки
    b: Быстрое создание прототипов в ходе естественного диалога перед переходом к реализации
    c: Использование ИИ для генерации случайного кода
    d: Программирование в непринужденной обстановке
  correct: b
  explanation: |-
    Vibe Coding — это быстрое создание прототипов посредством естественного диалога.

    Когда использовать код Вайбера:
    - Раннее исследование: проверка эффективности подхода.
    - Подтверждение концепции: быстрая проверка перед полной реализацией.
    - Обучение: понимание новой библиотеки или шаблона.

    Rules:
    - Нет производственного кода - только разведка
    - Выбрасывайте свободно
    - Сосредоточьтесь на обучении
    - Четко сигнализируйте: «Это вайбер-код, не для производства»
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.8 Vibe-кодирование и скелетные проекты
    anchor: "#vibe-coding"
- id: 09-008
  difficulty: power
  profiles:
  - power
  question: Что такое шаблон проверки ворот перед созданием PR?
  options:
    a: Просто проведите тесты
    b: Сборка -> Lint -> Тест -> Проверка типа -> ЗАТЕМ создаем PR
    c: Сначала создайте PR, а затем исправляйте проблемы
    d: Только проверка вручную
  correct: b
  explanation: |-
    Шаблон Verify Gate гарантирует прохождение всех проверок перед созданием PR:

    ```
    Сборка -> Lint -> Тест -> Проверка типа -> ЗАТЕМ создаем PR
    ```

    Если ЛЮБОЙ шаг не удался:
    - Немедленно остановись.
    - Сообщите, что не удалось и почему
    - Предложить исправления
    - НЕ приступайте к созданию пиара

    Это предотвращает напрасные циклы CI и время проверки.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.3 Интеграция CI/CD
    anchor: "#verify-gate-pattern"
- id: 09-009
  difficulty: senior
  profiles:
  - senior
  - power
  question: В чем заключается ключевая идея «Todo как зеркала инструкций»?
  options:
    a: Todos предназначены только для отслеживания
    b: То, что вы пишете как задачу, становится инструкцией Claude.
    c: Todos должны быть расплывчатыми для обеспечения гибкости
    d: Всегда используйте пункты списка
  correct: b
  explanation: |-
    Принцип зеркала: то, что вы пишете как задачу, становится инструкцией Claude.

    Плохо (неясное задание -> неясное исполнение):
    «Исправь ошибку»

    Хорошо (конкретная задача -> точное выполнение):
    «Исправить нулевой указатель в getUserById, когда пользователь не найден — возвращайте ноль вместо выдачи»

    Хорошо продуманные задачи обеспечивают точное выполнение Claude.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.6 Todo как зеркала инструкций
    anchor: "#the-mirror-principle"
- id: 09-010
  difficulty: power
  profiles:
  - power
  question: Согласно «мышлению непрерывного совершенствования», что вам следует спрашивать после каждого ручного вмешательства?
  options:
    a: Была ли это моя вина?
    b: Как я могу улучшить процесс, чтобы избежать этой ошибки в следующий раз?
    c: Кто несет за это ответственность?
    d: Должен ли я использовать другой ИИ?
  correct: b
  explanation: |-
    После каждого ручного вмешательства спрашивайте:
    «Как я могу улучшить процесс, чтобы в следующий раз избежать этой ошибки или ручного исправления?»

    Конвейер улучшений:
    1. Может ли правило линтинга это уловить? -> Добавить правило проверки
    2. Можно ли зайти в conventions/docs? -> Добавить в CLAUDE.md или АДР
    3. Ни то, ни другое? -> Принять как крайний случай

    Мета-навык: вместо исправления кода исправьте систему, которая его производит.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.10 Мышление о постоянном совершенствовании
    anchor: "#the-key-question"
- id: 09-011
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что такое скелетный проект?
  options:
    a: Проект без кода
    b: Минимальный рабочий шаблон, устанавливающий шаблоны перед полной реализацией.
    c: Устаревший проект
    d: Документ с описанием проекта
  correct: b
  explanation: |-
    Скелетный проект — это минимальный рабочий шаблон, устанавливающий шаблоны.

    Принципы скелета:
    1. **Должен запуститься**: `pnpm dev` работает с 1 дня
    2. **Одна полная вертикальная**: Полный стек для одной функции
    3. **Шаблоны, а не особенности.**: показывает КАК, а не ЧТО.
    4. **Минимальные зависимости**: Только то, что необходимо

    Прогресс: скелет (день 1) -> MVP (неделя 1) -> полный (месяц 1)
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.8 Vibe-кодирование и скелетные проекты
    anchor: "#skeleton-projects"
- id: 09-012
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое режим OpusPlan?
  options:
    a: Использование только Opus для всего
    b: Opus для планирования, Sonnet для исполнения.
    c: Специальный режим отладки
    d: Планирование без ИИ
  correct: b
  explanation: |-
    Режим OpusPlan сочетает в себе сильные стороны модели:
    - **Planning**: Opus для мышления высокого уровня
    - **Execution**: Sonnet для реализации

    Это обеспечивает стратегическое мышление + экономически эффективное исполнение.

    ```баш
    /model опусплан
    Shift+Tab x 2 # Войти в режим планирования (Opus)
    # Проектирование архитектуры...
    Shift+Tab # Выход из режима плана (Sonnet)
    # Реализуйте план...
    ```
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.13 Стратегии оптимизации затрат
    anchor: "#model-selection-matrix"
- id: 09-013
  difficulty: power
  profiles:
  - power
  question: Когда НЕ следует использовать --dangerously-skip-permissions?
  options:
    a: В конвейерах CI/CD
    b: В производственных системах или конфиденциальных кодовых базах
    c: Для автоматического тестирования
    d: В контейнерах Docker
  correct: b
  explanation: |-
    Никогда не используйте `--dangerously-skip-permissions` в производственных системах или конфиденциальных базах кода.

    Безопасное использование:
    - Трубопроводы CI/CD с изолированной средой
    - Автоматизированное тестирование с ограниченным объемом
    - Контейнеры разработки

    Небезопасное использование:
    - Производственные системы
    - Кодовые базы с секретами
    - Среды с конфиденциальными данными

    Флаг обходит все запросы разрешений, создавая угрозу безопасности.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.11 Распространенные ошибки и лучшие практики
    anchor: "#security-pitfalls"
- id: 09-014
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой формат подсказок рекомендует руководство для эффективных запросов?
  options:
    a: Простой естественный язык
    b: ЧТО, ГДЕ, КАК, ПРОВЕРИТЬ
    c: Тема, текст, нижний колонтитул
    d: Название, описание, критерии приемки
  correct: b
  explanation: |-
    Рекомендуемый формат приглашения:

    - **WHAT**: Доставка бетона
    - **WHERE**: Файл paths/locations
    - **HOW**: Constraints/approach
    - **VERIFY**: критерии успеха.

    Example:
    ```
    ЧТО: Добавить проверку ввода в форму входа.
    ГДЕ: src/components/LoginForm.tsx, src/schemas/auth.ts
    КАК: использовать проверку схемы Zod, отображать ошибки в режиме реального времени
    ПРОВЕРКА: пустой адрес электронной почты показывает ошибку, неверный формат показывает ошибку
    ```
  doc_reference:
    file: guide/ultimate-guide.md
    section: Пропуск плана
    anchor: "#1-skipping-the-plan"
- id: 09-015
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Каков рекомендуемый уровень обучения Claude Code?
  options:
    a: Узнай все сразу
    b: Начните с расширенных функций
    c: "Неделя 1: Основные команды -> Неделя 2: CLAUDE.md -> Неделя 3: Агенты -> Месяц 2+: Серверы MCP"
    d: Немедленно перейдите на серверы MCP.
  correct: c
  explanation: |-
    Руководство рекомендует прогрессивное обучение:

    1. **Неделя 1**: Базовые команды, управление контекстом
    2. **Неделя 2**: CLAUDE.md, разрешения
    3. **Неделя 3**: Агенты и команды.
    4. **Month 2+**: серверы MCP, расширенные шаблоны

    Начните с простых задач с низким уровнем риска и постепенно усложняйте.
    Это позволяет избежать перегруженности и закладывает прочную основу.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.11 Распространенные ошибки и лучшие практики
    anchor: "#learning-adoption-pitfalls"
- id: 09-016
  difficulty: power
  profiles:
  - power
  question: Какой рабочий процесс git позволяет работать над несколькими функциями одновременно в изолированных контекстах?
  options:
    a: Гит-тайник
    b: Рабочие деревья Git
    c: Только ветки Git
    d: Подмодули Git
  correct: b
  explanation: |-
    Рабочие деревья Git создают несколько рабочих каталогов из одного репозитория.

    Benefits:
    - Работайте над несколькими функциями одновременно
    - Каждое рабочее дерево имеет независимый контекст Claude Code.
    - Нет необходимости в операциях stash/switch
    - Параллельное тестирование при разработке.

    ```баш
    git worktree add ../myproject-hotfix hotfix
    git worktree add ../myproject-feature-a feature-a
    ```
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.12 Лучшие практики и рабочие процессы Git
    anchor: "#git-worktrees-for-parallel-development"
- id: 09-017
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Что такое SDD (разработка на основе спецификаций) и ее основное требование?
  options:
    a: Разработка на основе скорости – самый быстрый подход
    b: Разработка на основе спецификаций — одна хорошо структурированная итерация равна 8 неструктурированным.
    c: Разработка на основе стандартов – соответствует отраслевым стандартам.
    d: Последовательная управляемая разработка — линейный рабочий процесс
  correct: b
  explanation: "SDD (разработка на основе спецификаций) означает спецификации ДО кода. Ключевое утверждение: одна хорошо структурированная итерация равна 8 неструктурированным. CLAUDE.md — это ваш файл спецификации. Лучше всего подходит для API и контрактов. Высокая посадка Claude (⭐⭐⭐)."
  doc_reference:
    file: guide/core/methodologies.md
    section: "Уровень 2: Спецификация и архитектура"
    anchor: "#tier-2-specification-architecture"
- id: 09-018
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой формат BDD (Разработка на основе поведения) использует для тестовых сценариев?
  options:
    a: Arrange-Act-Assert
    b: Учитывая-Когда-То (Огурец)
    c: Setup-Execute-Verify
    d: Input-Process-Output
  correct: b
  explanation: "BDD использует формат «Дано-Когда-То» (Gherkin). BDD выходит за рамки тестирования — это процесс сотрудничества: (1) Открытие с помощью devs/business, (2) Формулировка с примерами, (3) Автоматизация с помощью Cucumber. Пример: данный товар на складе 0 → Когда клиент пытается совершить покупку → Система отказывается."
  doc_reference:
    file: guide/core/methodologies.md
    section: "Уровень 3: Поведение и принятие"
    anchor: "#tier-3-behavior-acceptance"
- id: 09-019
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Каковы три шага цикла TDD?
  options:
    a: Plan-Develop-Test
    b: Red-Green-Refactor
    c: Write-Run-Fix
    d: Design-Code-Review
  correct: b
  explanation: "Классический цикл TDD: (1) Красный — запись неудачного теста, (2) Зеленый — минимальный код для прохождения, (3) Рефакторинг — очистка, пока тесты остаются зелеными. Для Claude: укажите явно: «Напишите FAILING тестов, которые еще не существуют». TDD — это основной рабочий процесс (⭐⭐⭐)."
  doc_reference:
    file: guide/core/methodologies.md
    section: "Уровень 5: Реализация"
    anchor: "#tier-5-implementation"

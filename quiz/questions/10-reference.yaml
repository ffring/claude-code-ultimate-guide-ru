- id: 10-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое сочетание клавиш переходит в режим планирования при использовании OpusPlan?
  options:
    a: Ctrl+П
    b: Shift+Tab (при включенном OpusPlan)
    c: Альт+П
    d: Команда /plan
  correct: b
  explanation: |-
    При включенном OpusPlan (`/model opusplan`) используйте режим планирования от `Shift+Tab` до enter/exit:

    - `Shift+Tab × 2` → Войти в режим планирования (Opus для планирования)
    - `Shift+Tab` (один раз) → Выход в режим действия (Sonnet для выполнения)

    **Alternative**: используйте команду `/plan` для явного входа в режим планирования без OpusPlan.

    **Note**: сочетания клавиш Shift+Tab работают только при включенном OpusPlan. Без OpusPlan вместо этого используйте команду `/plan`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.3 Режим ОпусПлан
    line: 2295-2309
- id: 10-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое сочетание клавиш позволяет вернуться к предыдущей контрольной точке (отменить изменения Claude)?
  options:
    a: Ctrl+Z
    b: Esc (двойное нажатие)
    c: Ctrl+R
    d: Альт+З
  correct: b
  explanation: |-
    Двойное нажатие `Esc` (Esc×2) возвращает к предыдущей контрольной точке.

    Это эквивалентно команде `/rewind`.
    Он отменяет недавние изменения Claude в текущем сеансе без создания коммитов git.

    Используйте, когда Claude допустил ошибку и вы хотите попробовать другой подход.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.2 Сочетания клавиш
    anchor: "#session-control"
- id: 10-003
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что делает `/compact`?
  options:
    a: Сжимает файлы на диске
    b: Обобщает и сжимает контекст разговора
    c: Сворачивает окно терминала
    d: Уменьшает длину ответа Claude.
  correct: b
  explanation: |-
    `/compact` обобщает и сжимает контекст разговора.

    Используйте `/compact`, когда:
    - Использование контекста достигает 70-90%
    - Реакция становится медленной
    - Claude начинает забывать предыдущий контекст

    Это освобождает контекстное пространство, сохраняя при этом важную информацию.
    Проверьте использование контекста с помощью `/context`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.1 Таблица команд
    anchor: "#built-in-commands"
- id: 10-004
  difficulty: senior
  profiles:
  - senior
  - power
  question: С каким процентом контекста следует запускать /compact согласно рекомендациям?
  options:
    a: 50%
    b: 75-90%
    c: 95%+
    d: Только когда возникают ошибки
  correct: b
  explanation: |-
    Рекомендации по управлению контекстом:

    | Уровень контекста | Действие |
    |--------------|--------|
    | 0-50% | Работайте свободно |
    | 50-75% | Будьте избирательны |
    | **75-90%** | **Используйте `/compact`** |
    | 90%+ | Используйте `/clear` |

    Проактивное сжатие на уровне 75 % предотвращает ухудшение контекста и поддерживает производительность. Красная зона (75-90%) — это время, когда вам следует запустить /compact или /clear для восстановления контекста.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.4 Устранение неполадок
    anchor: "#context-recovery"
- id: 10-006
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков правильный шаблон разрешений, позволяющий разрешить ВСЕ команды git?
  options:
    a: Баш (гит)
    b: Баш (git *)
    c: git:*
    d: Баш(*git*)
  correct: b
  explanation: |-
    Шаблон `Bash(git *)` позволяет использовать любую команду git.

    Примеры шаблонов разрешений:
    - `Bash(git *)` - Любая команда git
    — `Bash(npm test)` — Именно «npm test»
    - `Edit` - Все правки файлов
    - `mcp__serena__*` - Все инструменты Serena

    Подстановочные знаки (*) обеспечивают гибкое сопоставление разрешений.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.3 Справочник по настройке
    anchor: "#permission-patterns"
- id: 10-007
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Где следует разместить CLAUDE.md, специфичный для проекта (фиксированный в git)?
  options:
    a: ~/.claude/CLAUDE.md
    b: /project/CLAUDE.local.md
    c: /project/CLAUDE.md
    d: ~/.config/claude/project.md
  correct: c
  explanation: |-
    Местоположение CLAUDE.md:

    | Местоположение | Область применения | Совершенный |
    |----------|-------|-----------|
    | `~/.claude/CLAUDE.md` | Все проекты | N/A (глобальный) |
    | `/project/CLAUDE.md` | Этот проект | **Да** |
    | `/project/.claude/CLAUDE.md` | Этот проект (альтернативное местоположение) | **Да** |
    | `/project/CLAUDE.local.md` | Персональный | Нет (gitignored) |

    Корень `CLAUDE.md` зафиксирован и передан команде.
    `.claude/CLAUDE.md` является личным и должен находиться в `.gitignore`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.3 Справочник по настройке
    anchor: "#claudemd-locations"
- id: 10-008
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что делает флаг --debug='mcp'?
  options:
    a: Отключает серверы MCP.
    b: Отлаживает соединения с сервером MCP с подробным выводом.
    c: Тестирует конфигурации MCP
    d: Включает автоматическое обнаружение MCP.
  correct: b
  explanation: |-
    Флаг `--debug='mcp'` включает режим отладки для подключений к серверу MCP.

    Методы отладки MCP:
    ```баш
    claude --debug='mcp'  # Debug all MCP connections
    /mcp # Просмотр статуса MCP внутри Claude Code
    ```

    Используйте, когда серверы MCP не подключаются или инструменты не появляются.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.4 Устранение неполадок
    anchor: "#mcp-debugging-techniques"
- id: 10-009
  difficulty: power
  profiles:
  - power
  question: Если проверка имени сервера MCP завершается неудачно с ошибкой шаблона, какие символы РАЗРЕШЕНЫ?
  options:
    a: Только буквы
    b: Буквы, цифры, символы подчеркивания, дефисы (максимум 64 символа)
    c: Любые символы, кроме пробелов
    d: Буквенно-цифровые и точки
  correct: b
  explanation: |-
    Имена серверов MCP должны совпадать: `^[a-zA-Z0-9_-]{1,64}`.

    Allowed:
    - Буквы (а-я, А-Я)
    - Числа (0-9)
    - Подчеркивания (_)
    - Дефисы (-)
    - Максимум 64 символа

    Не допускается:
    - Пространства
    - Специальные символы (@, # и т. д.)
    - Более 64 символов
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.4 Устранение неполадок
    anchor: "#error-1-tool-name-validation-failed"
- id: 10-010
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какая команда показывает стоимость сеанса, лимиты использования плана и статистику активности?
  options:
    a: /info
    b: /usage
    c: /session
    d: /status
  correct: b
  explanation: |-
    Команда `/usage` показывает стоимость сеанса, лимиты использования плана и статистику активности. `/cost` и `/stats` — его псевдонимы, а `/stats` открывается на вкладке «Статистика».

    `/status` отличается: он открывает интерфейс настроек на вкладке «Состояние», где показаны версия, модель, учетная запись и подключение. Чтобы увидеть, насколько полно контекстное окно, используйте `/context`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.1 Таблица команд
    anchor: "#built-in-commands"
- id: 10-011
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой флаг ограничивает максимальные расходы API в безголовом режиме?
  options:
    a: --cost-limit
    b: --max-budget-usd
    c: --spending-cap
    d: --budget
  correct: b
  explanation: |-
    Флаг `--max-budget-usd` устанавливает максимальный расход API (только с `--print`):

    ```баш
    claude -p "analyze" --max-budget-usd 5.00
    ```

    Это предотвращает неконтролируемые затраты в автоматизированных конвейерах.
    Операция останавливается, если бюджет превышен.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.3 Справочник по настройке
    anchor: "#cli-flags-reference"
- id: 10-012
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как запустить команду оболочки непосредственно из командной строки Claude Code?
  options:
    a: "оболочка: команда"
    b: "!команда"
    c: $команда
    d: запустить команду
  correct: b
  explanation: |-
    Префикс `!command` напрямую запускает команду оболочки.

    Быстрые действия:
    - `!command` - Запустить команду оболочки
    - `@filename` - Справочный файл
    - `Ctrl+C` - Отмена операции
    - `Ctrl+R` - Повторить последнюю попытку

    Пример: `!git status` запускает git status без его интерпретации Claude.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.1 Таблица команд
    anchor: "#quick-actions"
- id: 10-013
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как правильно возобновить конкретный сеанс по идентификатору?
  options:
    a: claude --session abc123
    b: claude -r abc123
    c: claude --load abc123
    d: claude -s abc123
  correct: b
  explanation: |-
    Используйте `-r` или `--resume`, чтобы возобновить определенный сеанс:

    ```баш
    claude -r abc123           # Resume session abc123
    claude --resume abc123     # Same as above
    claude -c # Возобновить последнюю сессию (коротко)
    claude --continue # Возобновить последний сеанс (длинный)
    ```

    Объедините с `-p` для создания сценариев: `claude -r abc123 -p "check status"`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.3 Справочник по настройке
    anchor: "#cli-flags-reference"
- id: 10-014
  difficulty: power
  profiles:
  - power
  question: Какой шаблон .gitignore рекомендуется использовать для файлов Claude Code?
  options:
    a: Игнорировать все содержимое .claude/
    b: Игнорируйте settings.local.json и CLAUDE.local.md, оставьте agents/commands/hooks.
    c: Не игнорируйте ничего
    d: Игнорировать только агентов/
  correct: b
  explanation: |-
    Рекомендуемый .gitignore:

    ```gitignore
    #Claude Code — Личное (игнорировать)
    .claude/settings.local.json
    CLAUDE.local.md
    .claude/.serena/

    #Claude Code — Команда (keep/commit)
    # .claude/CLAUDE.md (память проекта)
    # .claude/agents/
    # .claude/commands/
    # .claude/hooks/
    # .claude/settings.json
    ```

    Благодаря этому рабочие процессы команды становятся общими, а личные настройки остаются конфиденциальными.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 9.11 Распространенные ошибки и лучшие практики
    anchor: "#recommended-gitignore"
- id: 10-015
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какова утренняя настройка ежедневного рабочего процесса согласно руководству?
  options:
    a: Просто начните кодировать
    b: Git pull, /context, загрузить память проекта, просмотреть вчерашний прогресс
    c: Сначала запустите все тесты
    d: Очистить весь контекст
  correct: b
  explanation: |-
    Утренний процесс настройки:

    1. Git извлекает последние изменения
    2. Просмотрите контекст с помощью `/context`.
    3. Загрузите память проекта (`/sc:load`, если используете Serena)
    4. Обзор вчерашнего прогресса

    Это гарантирует, что вы начнете со свежего кода и полной осведомленности о контексте.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.6 Ежедневный рабочий процесс и контрольные списки
    anchor: "#daily-workflow-pattern"
- id: 10-016
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой флаг позволяет инструментам Claude получать доступ к каталогам за пределами текущего рабочего каталога?
  options:
    a: --include-dir
    b: --add-dir
    c: --context-dir
    d: --load-dir
  correct: b
  explanation: |-
    Используйте `--add-dir`, чтобы разрешить инструменту доступ к дополнительным каталогам:

    ```баш
    claude --add-dir ../shared ../utils
    claude --add-dir packages/api
    ```

    По умолчанию Claude может получать доступ только к файлам в текущем рабочем каталоге.
    Используйте --add-dir, чтобы расширить разрешения на другие каталоги (например, общие библиотеки в монорепозитории).
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.3 Справочник по настройке
    anchor: "#cli-flags-reference"
- id: 10-017
  difficulty: power
  profiles:
  - power
  question: Если последовательное мышление MCP кажется медленным или не отвечает, чего следует ожидать?
  options:
    a: Он сломан и требует перезагрузки
    b: Ответы длительностью 10–30 секунд являются нормальными из-за значительных вычислительных ресурсов.
    c: Переключиться на другой MCP
    d: Уменьшите сложность запроса
  correct: b
  explanation: |-
    Последовательное мышление требует значительных вычислительных ресурсов — ожидайте ответов в течение 10–30 секунд.

    Это не ошибка, просто наберитесь терпения.

    Советы для последовательного:
    - Лучше всего работает с конкретными, четко определенными проблемами.
    - Хорошо: «Устраните причину сбоя аутентификации пользователя на мобильном устройстве».
    - Плохо: «Сделайте приложение лучше»

    Более длительное время ответа отражает более глубокий анализ.
  doc_reference:
    file: guide/ultimate-guide.md
    section: MCP Методы отладки
    anchor: "#mcp-debugging-techniques"
- id: 10-018
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой ярлык открывает внешний редактор для ввода длинного текста?
  options:
    a: Ctrl+Е
    b: Ctrl+Г
    c: Ctrl+О
    d: Ctrl+Л
  correct: b
  explanation: |-
    `Ctrl+G` открывает внешний редактор для составления длинного текста.

    Полезные сочетания клавиш для ввода:
    - `Ctrl+A`: переход к началу строки.
    - `Ctrl+E`: переход в конец строки.
    - `Ctrl+W`: удалить предыдущее слово.
    - `Ctrl+G`: Открыть внешний редактор.
    - `Tab`: автозаполнение путей к файлам.

    Внешний редактор позволяет комфортно редактировать сложные подсказки.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.2 Сочетания клавиш
    anchor: "#input-navigation"
- id: 10-019
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что делает флаг --from-pr в Claude Code v2.1.27?
  options:
    a: Создает новый запрос на извлечение
    b: Возобновляет сеансы, связанные с номером PR или URL-адресом GitHub.
    c: Извлекает все PR-комментарии в контекст
    d: Закрывает запрос на извлечение
  correct: b
  explanation: "Флаг `--from-pr` (v2.1.27) позволяет возобновлять сеансы Claude Code, связанные с определенным PR GitHub. Использование: `claude --from-pr 123` или `claude --from-pr https://github.com/org/repo/pull/123`. Это загружает контекст PR (различия, комментарии, проверки) непосредственно в сеанс."
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.27 (2026-01-29)
    anchor: "#v2127-2026-01-29"
- id: 10-020
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какое критическое изменение было внесено в Claude Code v2.1.19 для аргументов hook/command?
  options:
    a: Аргументы удалены полностью
    b: Миграция с $ARGUMENTS.0 (точечный синтаксис) на $ARGUMENTS[0] (синтаксис квадратных скобок)
    c: Новая переменная $PARAMS заменила $ARGUMENTS.
    d: Аргументы теперь требуют формата JSON.
  correct: b
  explanation: В Claude Code v2.1.19 синтаксис доступа к аргументам изменен с точечной записи (`$ARGUMENTS.0`) на запись скобок (`$ARGUMENTS[0]`). Это критическое изменение затрагивает все пользовательские команды и перехватчики, ссылающиеся на аргументы. Обновите свои скрипты, чтобы использовать новый синтаксис скобок.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Переменная интерполяция
    anchor: "#variable-interpolation"
- id: 10-021
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Согласно разделу руководства «Мифы против реальности», какова правда о «скрытых функциях Claude Code»?
  options:
    a: Существуют секретные флаги для опытных пользователей
    b: Для скрытых функций требуется корпоративный план
    c: Никаких скрытых функций — Anthropic использует постепенное развертывание, а не секретные флаги.
    d: Бета-флаги хранятся в .claude/config.
  correct: c
  explanation: Раздел «Мифы против реальности» развенчивает миф о «скрытых возможностях». Anthropic использует постепенное развертывание (функции постепенно включаются для пользователей), а не секретные флаги или скрытые конфигурации. Все функции описаны в примечаниях к выпуску. Секретного режима опытного пользователя не существует.
  doc_reference:
    file: guide/ultimate-guide.md
    section: "Приложение D: Мифы против реальности"
    anchor: "#appendix-d-myths-vs-reality"
- id: 10-022
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какие уровни усилий предлагает Claude Code для Opus 5.5, Sonnet 5.5 и Haiku 5.5?
  options:
    a: Три уровня (низкий, средний, высокий), потому что в v2.1.72 макс убрали
    b: Пять уровней (низкий, средний, высокий, высокий, максимальный)
    c: Три уровня (быстрый, нормальный, глубокий)
    d: Два уровня (быстрый и тщательный), переключаемые с помощью Alt+T.
  correct: b
  explanation: |-
    Opus 5.5, Sonnet 5.5, Haiku 5.5 и модели Fable поддерживают `low`, `medium`, `high`, `xhigh` и `max`. Opus 4.6 и Sonnet 4.6 останавливаются на `max` без `xhigh`, а уровень, который не поддерживает активная модель, возвращается к самому высокому поддерживаемому уровню, находящемуся на нем или ниже. Модели, не перечисленные в документации по конфигурации модели, не поддерживают усилия.

    По умолчанию используется `medium` на Opus 5.5, Sonnet 5.5 и Haiku 5.5 и `high` на большинстве других моделей, поддерживающих усилие. Установите уровень с помощью `/effort`, средства выбора `/model`, `--effort` или переменной среды `CLAUDE_CODE_EFFORT_LEVEL`. `max` применяется только к текущему сеансу, если вы не установили его через эту переменную среды. Ультракод — это отдельный переключатель, а не уровень усилий.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.72 (2026-03-09)
    anchor: "#v2172-2026-03-09"
- id: 10-023
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое быстрый режим в Opus 5.5 и каков стандартный компромисс между ценой токена?
  options:
    a: Он пропускает проверки разрешений
    b: Более быстрое обслуживание той же модели по удвоенной стандартной цене токена.
    c: Он переключает сессию на Haiku.
    d: Он запускает все вызовы инструментов параллельно.
  correct: b
  explanation: Быстрый режим обслуживает Opus 5.5 по цене 8/40 долларов США за миллион токенов input/output по сравнению с 4/20 долларами США на стандартной скорости. Anthropic рекламирует увеличение производительности до 2,5 раз, но не гарантирует сквозное ускорение. Используйте /fast в Claude Code; использование подписки взимается за использование кредитов. Sonnet и Haiku не поддерживают быстрый режим.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Модель ценообразования (проверено 24 сентября 2026 г.)
    anchor: "#pricing-model-verified-september-24-2026"
- id: 10-024
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что включает восстановленный параметр `model` в инструменте «Агент» (v2.1.72)?
  options:
    a: Это позволяет указать другую модель для каждого вызова инструмента агента, позволяя различным субагентам использовать разные модели.
    b: Он устанавливает модель для всего сеанса при передаче первого вызова инструмента агента.
    c: Он переопределяет модель, используемую фоновыми заданиями cron.
    d: Он был окончательно удален в версии 2.1.72 и заменен на modelOverrides.
  correct: a
  explanation: |-
    Параметр `model` в инструменте «Агент» (восстановлен в версии 2.1.72) позволяет **переопределять модель каждого вызова**. Вы можете указать, какую модель будет использовать каждый субагент при его создании, с помощью инструмента «Агент». Например, оркестратор в Opus 5.5 может создать субагент проверки кода в Sonnet для экономической эффективности или субагент аудита безопасности в Opus для тщательности. Этот параметр был временно удален в предыдущей версии и теперь снова работает с тем же поведением, что и раньше.
    ---
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.72 (2026-03-09)
    anchor: "#v2172-2026-03-09"
- id: 10-025
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какую полезную информацию теперь предоставляет обновленная команда `/context` (v2.1.74)?
  options:
    a: Список всех активных подключений к серверу MCP с указанием времени пинга.
    b: "Практические предложения: контекстно-зависимые инструменты, предупреждения о раздувании памяти и советы по оптимизации."
    c: Полная стенограмма сеанса сжата до краткого изложения
    d: Разбивка использования токенов по типам файлов
  correct: b
  explanation: |-
    Версия 2.1.74 `/context` добавлено обновление команды **практические предложения** наряду с существующим отображением использования контекста. Он выявляет контекстно-нагруженные инструменты, потребляющие непропорционально большое количество токенов, отмечает раздувание памяти, выдает предупреждения о емкости и предоставляет конкретные советы по оптимизации для уменьшения использования контекста. Это делает `/context` не просто пассивный счетчик, а активный советник для управления состоянием контекста во время длительных сеансов.
    ---
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.74 (2026-03-12)
    anchor: "#v2174-2026-03-12"
- id: 10-026
  difficulty: junior
  profiles:
  - junior
  - pm
  question: Что на самом деле делает быстрый режим Claude Code с используемой моделью?
  options:
    a: Он переключает сеанс на Haiku 4.5 для остальной части разговора, чтобы уменьшить задержку.
    b: Он полностью отключает расширенное мышление, чтобы сократить время отклика, независимо от модели.
    c: Он использует ту же модель, в настоящее время Opus, со скоростью примерно в 2,5 раза выше и примерно в 2 раза дороже токена; он не переключается на меньшую модель
    d: Он маршрутизирует запросы через региональную конечную точку API с низкой задержкой по той же цене, что и в стандартном режиме.
  correct: c
  explanation: В быстром режиме текущая модель Opus работает с более высокой скоростью вывода, примерно в 2,5 раза быстрее, примерно в 2 раза дороже стандартной цены токена. Это та же модель, а не более ранняя версия Haiku, и она не затрагивает настройки расширенного мышления или маршрут через другую конечную точку.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Модель ценообразования
- id: 10-027
  difficulty: intermediate
  profiles:
  - power
  question: Что делает установка CLAUDE_CODE_DISABLE_MOUSE_CLICKS в пользовательском интерфейсе терминала?
  options:
    a: Отключает обработку щелчков мышью, перетаскивания и наведения в полноэкранном режиме, при этом колесико продолжает работать.
    b: Отключает только прокрутку с помощью колесика, заставляя всюду использовать только клавиатуру.
    c: Отключает всю подсистему мыши, включая полноэкранный просмотр за пределами экрана.
    d: Скрывает курсор мыши без изменения поведения щелчка.
  correct: a
  explanation: Переменная env отключает щелчок мышью, перетаскивание и наведение курсора, в частности, в полноэкранном режиме, сохраняя при этом функцию прокрутки колеса. Он не влияет на поведение прокрутки, не выходит за пределы полноэкранного режима и не влияет на видимость курсора.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.195
- id: 10-028
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое сочетание клавиш переключает в режим планирования?
  options:
    a: Ctrl+П
    b: Shift+Tab
    c: Альт+П
    d: Ctrl+Shift+П
  correct: b
  explanation: |-
    `Shift+Tab` циклически переключает режим разрешений: «Вручную», затем «Принять изменения», затем «План».

    Навигация в режиме плана:
    - `Shift+Tab` из руководства: переключиться на принятие изменений.
    - `Shift+Tab` дважды из ручного режима: перейдите в режим планирования.
    - `Shift+Tab` снова: выйти из режима плана, не утверждая план.

    «Режима выполнения» нет: при утверждении плана вы попадаете в режим, указанный в названии параметра утверждения.

    Режим планирования позволяет безопасно просматривать данные только для чтения перед внесением изменений.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.2 Сочетания клавиш
    anchor: "#session-control"
- id: 10-029
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какая комбинация клавиш прерывает выполняемую операцию, очищает ввод подсказки, когда ничего не выполняется, и завершает работу при втором нажатии?
  options:
    a: Esc
    b: Ctrl+С
    c: Ctrl+Z
    d: Альт+С
  correct: b
  explanation: |-
    `Ctrl+C` прерывает текущую операцию. Если ничего не работает, первое нажатие очищает ввод подсказки, а второе нажатие завершает Claude Code.

    Связанные ярлыки:
    - `Esc`: прервать Claude в середине хода или закрыть диалог.
    - `Esc` + `Esc`: очистить черновик ввода или открыть меню перемотки, когда ввод пуст.
    - `Ctrl+R`: история команд обратного поиска.
    - `Ctrl+G`: открыть приглашение во внешнем редакторе.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.2 Сочетания клавиш
    anchor: "#session-control"

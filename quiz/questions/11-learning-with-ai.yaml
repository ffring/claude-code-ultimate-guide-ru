category: Обучение с помощью ИИ
category_id: 11
source_file: guide/roles/learning-with-ai.md
questions:
- id: 11-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Каковы три шаблона разработчика при использовании ИИ согласно руководству «Обучение с ИИ»?
  options:
    a: Новичок, Средний, Эксперт
    b: Зависимый, Избегающий, Расширенный
    c: Пассивный, Активный, Проактивный
    d: Потребитель, Производитель, Создатель
  correct: b
  explanation: "Три шаблона: Зависимый (копипаст без понимания, не может отлаживать код ИИ), Избегающий (отказывается от ИИ в принципе, медленнее аналогов) и Дополненный (критически использует ИИ, все понимает). Цель состоит в том, чтобы стать дополненным — использовать ИИ в качестве рычага, сохраняя при этом глубокое понимание."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Три модели
    anchor: "#the-three-patterns"
- id: 11-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что означает UVAL в протоколе обучения ИИ?
  options:
    a: Используйте, проверяйте, применяйте, изучайте
    b: Понимать, проверять, применять, учиться
    c: Понимать, проверять, анализировать, учиться
    d: Используйте, проверяйте, анализируйте, регистрируйте
  correct: b
  explanation: "UVAL означает: «Сначала пойми» (правило 15 минут), «Проверь» (убедитесь, что вы действительно научились), «Примените» (превратите знания в навыки посредством модификации), «Изучите» (сохраните информацию для долгосрочного сохранения). Этот протокол гарантирует, что вы учитесь, а не просто копируете."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Протокол УВАЛ
    anchor: "#the-uval-protocol"
- id: 11-003
  difficulty: junior
  profiles:
  - junior
  - senior
  question: Если в ходе быстрой самопроверки вы набрали 0–2 ответа «да», о чем это говорит?
  options:
    a: Вы разработчик дополненной реальности
    b: Вы на верном пути, и у вас есть возможности для оптимизации.
    c: Вы подвержены риску зависимости – мышление аутсорсинга
    d: Вы избегаете ИИ
  correct: c
  explanation: "Оценка «да» от 0 до 2 указывает на риск зависимости — вы передаете свое мышление ИИ. Тест из 5 вопросов: можете ли вы объяснить код, сгенерированный ИИ, выполняли ли вы отладку без ИИ, знаете ли вы, ПОЧЕМУ решения работают, можете ли вы написать код самостоятельно, знаете ли вы ограничения ИИ. Низкие баллы означают, что вам следует прочитать раздел «Преодоление зависимости»."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Быстрая самопроверка
    anchor: "#quick-self-check-start-here"
- id: 11-004
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Что такое «Правило 15 минут» в шаге «Сначала понять» протокола UVAL?
  options:
    a: Ограничьте использование ИИ до 15 минут в день.
    b: "Четырехэтапный протокол: сформулируйте проблему, подходы к мозговому штурму, выявите пробелы, ЗАТЕМ спросите ИИ"
    c: Подождите 15 минут после получения ответа ИИ, прежде чем использовать его.
    d: Потратьте 15 минут на объяснение кода искусственного интеллекта коллеге.
  correct: b
  explanation: "Правило 15 минут представляет собой особый протокол: (1) Сформулируйте проблему в ОДНОМ предложении (2 минуты), (2) Мозговой штурм 3 возможных подходов (5 минут), (3) Определите пробелы в знаниях (3 минуты), (4) ЗАТЕМ задайте ИИ гораздо лучший вопрос (5 ​​минут). Это заставляет вас думать, прежде чем спрашивать, что приводит к более качественным вопросам и более быстрому обучению."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: "У: Сначала пойми"
    anchor: "#u-understand-first-the-15-minute-rule"
- id: 11-005
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Что такое метод «Объясните это обратно» на этапе проверки протокола UVAL?
  options:
    a: Попросите ИИ объяснить свой собственный код
    b: Написать документацию для кода
    c: Если вы не можете объяснить код коллеге, значит, вы его не выучили.
    d: Запишите свои объяснения и просмотрите их позже.
  correct: c
  explanation: "Правило простое: если ты не можешь объяснить код коллеге, ты его не понимаешь. Это этап проверки: вы должны быть в состоянии сформулировать, ПОЧЕМУ решение работает, а не просто ЧТО оно работает. Руководство рекомендует использовать косую черту /explain-back, которая просит ВАС объяснить код, сгенерированный ИИ."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: "В: Проверьте"
    anchor: "#v-verify-explain-it-back"
- id: 11-006
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Каков коэффициент использования ИИ в 30-дневном плане развития на первой неделе?
  options:
    a: 0-20% использования ИИ
    b: 40-50% использования ИИ
    c: 60-70% использования ИИ
    d: 70-80% использования ИИ
  correct: a
  explanation: "Первая неделя посвящена основам с использованием ИИ на 0–20 %: дни 1–2 — сборка БЕЗ ИИ (0 %), дни 4–5 — рефакторинг только с проверкой ИИ (20 %), день 6 — отладка без ИИ (0 %). Цель состоит в том, чтобы создать (или восстановить) основные навыки без сильной зависимости от ИИ. Критерии успеха: можете объяснить каждую написанную вами строчку."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: 30-дневный план прогресса
    anchor: "#30-day-progression-plan"
- id: 11-007
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какой коэффициент использования ИИ рекомендуется в 30-дневном плане на 4-й неделе (расширенный этап)?
  options:
    a: 30-40%
    b: 50-60%
    c: 70%
    d: 90-100%
  correct: c
  explanation: "На 4-й неделе (расширенный этап) рекомендуется использовать ИИ на 70 % с протоколом UVAL. Прогрессия следующая: 1-я неделя (0–20%), 2-я неделя (30–40%), 3-я неделя (50–60%), 4-я неделя (70%). Критерии успеха на четвёртой неделе: ты быстрый И всё понимаешь. Ограничение в 70% гарантирует сохранение навыков."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: 30-дневный план прогресса
    anchor: "#week-4-augmented"
- id: 11-008
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Согласно руководству, какова метафора развития ИИ?
  options:
    a: ИИ — ваш второй пилот
    b: ИИ — ваш GPS
    c: ИИ — ваш помощник
    d: ИИ — твой учитель
  correct: b
  explanation: "ИИ сравнивают с GPS: он отлично подходит для быстрого перемещения, опасен, если вы теряете способность ориентироваться без него, действительно полезен, когда вы понимаете карту И используете GPS. Разработчик, который только копирует и вставляет результаты ИИ, подобен водителю, который не умеет читать карту — хорошо, пока не выйдет из строя GPS или кто-нибудь не спросит дорогу."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Проблема за 60 секунд
    anchor: "#the-problem-in-60-seconds"
- id: 11-009
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Что является «красным флагом» зависимости от ИИ согласно контрольному списку?
  options:
    a: Использование ИИ для сложных алгоритмов
    b: Невозможно начать программировать без ИИ
    c: Использование ИИ для проверки кода
    d: Просить ИИ объяснить концепции
  correct: b
  explanation: "«Невозможно начать без ИИ» — это красный флаг, указывающий на то, что вы передали декомпозицию проблемы на аутсорсинг. Другие красные флажки: не понимают код ИИ, не могут отлаживать ошибки ИИ, беспокойство без ИИ, отказы на собеседованиях, всегда спрашивают «как», а не «почему», каждое решение выглядит одинаково. Немедленное действие: кодируйте 30 минут ежедневно без ИИ."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Контрольный список красных флажков
    anchor: "#red-flags-checklist"
- id: 11-010
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Каков основной принцип шага «Применить» в протоколе UVAL?
  options:
    a: Примените код непосредственно в рабочей среде
    b: Превратите знания в навыки посредством МОДИФИКАЦИИ, а не копирования.
    c: Применяйте проверки кода ко всему коду, созданному ИИ.
    d: Примените модульные тесты для проверки правильности
  correct: b
  explanation: Шаг «Применить» требует внесения изменений, а не копирования и вставки. Вы должны изменить хотя бы один элемент (имя переменной, структуру, обработку крайних случаев). Почему? Модификация требует понимания. Копирование пассивно; модификация требует от вас взаимодействия с кодом и понимания того, как он работает.
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: "А: Применить"
    anchor: "#a-apply-transform-dont-copy"
- id: 11-011
  difficulty: senior
  profiles:
  - junior
  - senior
  - power
  question: Какая конфигурация CLAUDE.md включает «Режим обучения» с Claude Code?
  options:
    a: "## Режим обучения — задавайте мне вопросы перед созданием кода"
    b: "## Строгий режим — никогда не генерировать код напрямую"
    c: "## Режим обучения: всегда объясняйте перед показом"
    d: "## Режим викторины: протестируйте перед внедрением"
  correct: a
  explanation: "Режим обучения в CLAUDE.md предлагает Claude задавать вопросы перед созданием: «Какие подходы я рассматривал?», «На чем конкретно я застрял?», «Как я ожидаю, что решение будет выглядеть?». Это реализует этап понимания протокола UVAL непосредственно в вашем рабочем процессе."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Claude Code для обучения
    anchor: "#claude-code-for-learning-not-just-producing"
- id: 11-012
  difficulty: senior
  profiles:
  - junior
  - senior
  - power
  question: Какое событие-привязку рекомендуется использовать для записи ежедневного обучения?
  options:
    a: PreToolUse — перед каждой командой
    b: PostToolUse — после каждого редактирования
    c: Стоп - когда сеанс заканчивается
    d: Уведомление - по оповещениям
  correct: c
  explanation: "Хук learning-capture.sh использует событие Stop (окончание сеанса) для запроса: «Какую ОДНУ вещь вы узнали сегодня?» Это автоматически записывается в ~/claude-learnings.md. Он легкий (задает один вопрос), поэтому вы действительно будете его использовать, в отличие от многословных учебных журналов."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Хуки, которые формируют привычки
    anchor: "#hooks-that-build-habits"
- id: 11-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Каков основной риск модели «Зависимость» согласно руководству?
  options:
    a: Медленнее, чем сверстники
    b: безработный
    c: Оставленный позади
    d: Переутомленный
  correct: b
  explanation: "Риск зависимого паттерна становится нетрудоспособным. Признаки: копипаст без понимания, не могу отладить код ИИ, беспокойство без ИИ. На собеседованиях: не может разобраться с основами доски, мучается вопросом: «Почему такой подход?», просит изучить основы. Вы отправляете код, который не можете объяснить — когда он ломается, вы застреваете."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: "Модель 1: Зависимый"
    anchor: "#pattern-1-dependent"
- id: 11-014
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какой вопрос еженедельной самопроверки выявляет зависимость?
  options:
    a: Сколько строк кода я написал?
    b: Я быстрее, чем в прошлом месяце? Я умнее?
    c: Сколько я использовал ИИ на этой неделе?
    d: Уложился ли я во все сроки?
  correct: b
  explanation: "Ключевой вопрос: «Я быстрее, чем в прошлом месяце? Я умнее?» Если вы быстрее, но НЕ умнее, вы создаете зависимость. Другие еженедельные вопросы: Что я узнал такого, чего не знал раньше? Мог бы я сделать это без ИИ? Все ли я понял, что отправил?"
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Еженедельный самоаудит
    anchor: "#weekly-self-audit"
- id: 11-015
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какой подход рекомендуется использовать для избегающих разработчиков (шаблон 2)?
  options:
    a: Продолжайте избегать искусственного интеллекта, чтобы сохранить чистоту.
    b: "Начните с использования ИИ с минимальными ставками: создайте шаблон, объясните незнакомый код, напишите документацию и создайте тестовые примеры."
    c: Немедленно переключитесь на 100% использование ИИ.
    d: Подождите, пока инструменты ИИ станут более зрелыми
  correct: b
  explanation: "Для разработчиков избегающих (схема 2) руководство «Введение с низкими ставками» на первой неделе руководства рекомендует облегчить выполнение задач ИИ с низким уровнем риска: создание шаблона, просьба к ИИ объяснить незнакомый код, написание документации и создание тестовых примеров. Это способствует знакомству, не уступая при этом контроля над решением основных проблем. (Начиная с того, что ИИ проверяет ВАШ собственный код, это средство руководства от зависимого шаблона, а не от избегающего.) Чистое избегание означает быть медленнее, но не умнее."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Использование инструментов искусственного интеллекта
    anchor: "#embracing-ai-tools"
- id: 11-016
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие три режима сбоя определены в книге Адди Османи «Проблема 80%» агентного кодирования?
  options:
    a: Потеря контекста, переполнение токена, галлюцинации
    b: Чрезмерное проектирование, распространение предположений, подхалимское соглашение
    c: Медленные ответы, неправильный язык, пропущенные тесты
    d: Утечки памяти, состояния гонки, взаимоблокировки
  correct: b
  explanation: |-
    В книге «Проблема 80%» Адди Османи выделяются три режима отказа:

    1. **Overengineering** — ИИ добавляет ненужную сложность (уровни абстракции, преждевременная оптимизация)
    2. **Распространение предположения** — одно неверное предположение каскадно распространяется по базе кода.
    3. **Подхалимское соглашение** — ИИ соглашается с плохими идеями, а не сопротивляется им.

    80% относятся к тому, что ИИ сделает 80% пути, а последние 20% требуют глубокого человеческого понимания.
  doc_reference:
    file: guide/ecosystem/ai-ecosystem.md
    section: Адди Османи (команда Google Chrome)
    anchor: "#addy-osmani-google-chrome-team"
- id: 11-017
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Каковы 3 симптома «перегрузки контекста» кодирования Vibe?
  options:
    a: Утечки памяти, медленный запуск, ограничения скорости API
    b: Дампы контекста «большого взрыва», подсказки более 5 тысяч строк, снижение производительности
    c: Потерянные файлы, неработающий импорт, отсутствующие тесты
    d: Чрезмерные коммиты, конфликты слияний, увеличение количества ветвей
  correct: b
  explanation: |-
    Симптомы перегрузки контекста при кодировании vibe:

    1. **Большой дамп контекста** — вставка целых баз кода в подсказки
    2. **5K+ строковые подсказки** - Превышение эффективного использования контекстного окна
    3. **Снижение производительности** — качество Claude падает по мере роста контекста.

    Исправление: постепенное раскрытие (постепенная передача контекста), использование CLAUDE.md для постоянного контекста и запуск новых сеансов между этапами.
  doc_reference:
    file: guide/ultimate-guide.md
    section: "Антишаблон: перегрузка контекста"
    anchor: "#anti-pattern-context-overload"
- id: 11-018
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков был ключевой вывод РКИ для опытных разработчиков METR (2025, arXiv:2507.09089)?
  options:
    a: Инструменты искусственного интеллекта позволили опытным разработчикам работать с большими базами кода на 40 % быстрее.
    b: Разработчики правильно подсчитали, что при использовании инструментов искусственного интеллекта они работали на 19 % медленнее.
    c: Инструменты искусственного интеллекта не оказали заметного влияния на скорость разработки больших баз кода.
    d: Инструменты искусственного интеллекта замедлили работу опытных разработчиков на больших базах кода на 19 %, несмотря на то, что разработчики считали себя на 20 % быстрее.
  correct: d
  explanation: |-
    METR RCT изучил 16 опытных разработчиков по 246 проблемам в больших базах кода (более 1 млн строк). Противоречивый вывод: инструменты искусственного интеллекта сделали этих опытных разработчиков **на 19% медленнее**, однако разработчики **считали себя на 20% быстрее** (разрыв в восприятии 39 баллов). Это считается самым убедительным доказательством риска атрофии навыков у опытных разработчиков, работающих над большими, знакомыми базами кода. Исследование подчеркивает разницу между производительностью при выполнении изолированных задач (где помогает ИИ) и при навигации по сложным существующим системам (где знакомство имеет большее значение).
    ---
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Исследование производительности
    anchor: "#productivity-research"
- id: 11-019
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков был ключевой вывод Borg et al. РКИ «Эхо ИИ» (2025 г., arXiv:2507.00788)?
  options:
    a: Пользователи ИИ работали на 30,7% медленнее из-за отладки кода, сгенерированного ИИ.
    b: Пользователи ИИ работали на 30,7 % быстрее (в среднем), без существенной разницы в удобстве сопровождения кода для последующих разработчиков.
    c: Пользователи ИИ создали на 30,7% больше ошибок, чем разработчики, не использующие ИИ.
    d: Код искусственного интеллекта было на 30,7% сложнее поддерживать по сравнению с кодом, написанным человеком.
  correct: b
  explanation: |-
    Исследование «Эхо ИИ» (151 участник, 95% профессиональные разработчики) показало, что пользователи ИИ работали на **30,7% быстрее** (медиана), а обычные пользователи работали быстрее на ~55,9%. Что особенно важно, на втором этапе проверялась ремонтопригодность: последующие разработчики, разрабатывающие код, сгенерированный искусственным интеллектом, не показали **никакой существенной разницы** во времени разработки или качестве кода по сравнению с кодом, созданным человеком. Это первое РКИ, явно ориентированное на удобство сопровождения кода ИИ. Соавтором исследования выступил Дэйв Фарли («Непрерывная доставка»). Это препринт arXiv, еще не опубликованный в рецензируемых материалах.
    ---
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Исследование производительности
    anchor: "#productivity-research"
- id: 11-020
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое функция информационной панели показателей вклада (публичная бета-версия, январь 2026 г.)?
  options:
    a: Персональная панель статистики доступна на всех планах Claude и показывает ежедневное использование токенов.
    b: Интеграция GitHub Actions, которая записывает каждую команду Claude Code в электронную таблицу.
    c: Панель мониторинга Team/Enterprise, отслеживающая объединенные PR и выделенные строки with/without Claude Code атрибуция, показывает +67% PR merged/engineer/day на Anthropic
    d: Таблица лидеров, ранжирующая разработчиков по использованию Claude Code внутри организации.
  correct: c
  explanation: |-
    Метрики вклада — это функция планов **Team и Enterprise** (публичная бета-версия, январь 2026 г.), которая отслеживает объединенные запросы на участие и атрибуцию строк кода, зафиксированных with/without Claude Code. Доступ предоставляется только администраторам и владельцам рабочей области. Настройка: установите приложение Claude GitHub → включите GitHub Analytics в настройках администратора → подтвердите подлинность своей организации GitHub. Внутренние обновленные данные Anthropic показывают, что **+67% объединенных PR на одного инженера в день** и 70-90% кода теперь написаны с помощью Claude Code, хотя это индикаторы направления, а не строгие контрольные показатели (базовый период не разглашается).
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Показатели вклада (январь 2026 г.)
    anchor: "#contribution-metrics-january-2026"
- id: 11-021
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: В исследовании PLDI 2025 года, проведенном ETH Zurich и Калифорнийским университетом в Беркли, были проанализированы ошибки компиляции в коде, сгенерированном LLM. Что он обнаружил и какой практический урок извлекает из этого руководство?
  options:
    a: 94% ошибок компиляции были ошибками типа, поэтому строго типизированные языки и строгие архитектурные шаблоны служат защитой для кода, генерируемого агентом.
    b: 94% ошибок компиляции были синтаксическими ошибками, поэтому линтинг должен выполняться перед каждым коммитом агента.
    c: Код, сгенерированный LLM, успешно компилируется в 94% случаев на всех протестированных языках без существенного разрыва между типизированными и нетипизированными языками.
    d: Исследование не выявило корреляции между языковой типизацией и качеством кода агента, что противоречит полевым наблюдениям в руководстве.
  correct: a
  explanation: "Исследование показало, что 94% ошибок компиляции в коде, сгенерированном LLM, были ошибками типа. Практический вывод руководства заключается в том, что строго типизированные языки и строгие архитектурные шаблоны, такие как гексагональная архитектура или предметно-ориентированное проектирование, действуют как страховочная сеть, поскольку компилятор автоматически отклоняет большой класс ошибок агента. В полевых заметках команды, цитируемых в руководстве, это прямо отмечено: чем больше структуры налагает кодовая база, тем более последовательно в ней работают агенты, что исключает утверждение о противоречии варианта d."
  doc_reference:
    file: guide/roles/adoption-approaches.md
    section: Что мы знаем (эмпирические данные)
- id: 11-022
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Согласно схеме, по которой девять независимых докладчиков собрались на одной встрече, что происходит с качеством контекста, когда сессия приближается к бюджету контекстного окна?
  options:
    a: Качество снижается по прямой от 0% до 100% бюджета, без определенного порога.
    b: На качество не влияет использование бюджета до тех пор, пока окно не заполнится полностью, после чего сеанс просто прекращается.
    c: Качество улучшается по мере накопления большего количества контекста, вплоть до жесткого ограничения на уровне 100%.
    d: Качество резко падает примерно на 70 % использованного бюджета, а не снижается постепенно, поэтому перед достижением этой отметки следует очистить или сжать контекст.
  correct: d
  explanation: "Сближение происходит резко, а не постепенно: качество контекста резко падает примерно на 70% использованного бюджета, а не снижается прямолинейно. Практический смысл состоит в том, чтобы очистить или уплотнить перед достижением этой отметки, поскольку ожидание видимой путаницы означает, что порог обычно уже перейден. Варианты a, b и c описывают более плавное или позднее наступающее ухудшение, чем то, о чем на самом деле сообщили выступавшие."
  doc_reference:
    file: guide/ecosystem/practitioner-insights.md
    section: Контекстная инженерия
- id: 11-023
  difficulty: senior
  profiles:
  - senior
  - power
  - pm
  question: В чем заключается ловушка скорости в командах, дополненных искусственным интеллектом, и почему DORA «Высокая» частота развертывания не является достаточным доказательством работоспособности?
  options:
    a: Команды развертываются слишком медленно, потому что ИИ увеличивает накладные расходы
    b: Высокая частота внедрения может сосуществовать с выгоранием, атрофией навыков и поверхностными отзывами. DORA измеряет темп, а не устойчивость или качество
    c: Метрики DORA действительны только для команд из 10 и более инженеров.
    d: Частота развертывания вызывает конфликты слияния, когда ИИ создает слишком много ветвей.
  correct: b
  explanation: "Ловушка скорости: команда с высоким рейтингом по частоте развертывания DORA может одновременно испытывать выгорание (инженеры штампуют результаты ИИ), атрофию навыков (инженеры теряют способность самостоятельно рассуждать о коде) и поверхностные проверки (давление скорости препятствует глубокой проверке). DORA измеряет скорость доставки, а не то, понимает ли команда, что она отправляет. Вот почему существуют метрики уровня 2 (CFR по происхождению кода, время проверки): для выявления ухудшения качества, которое скрывается за быстрыми цифрами."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Метрики управления на уровне команды
    anchor: "#team-level-steering-metrics"
- id: 11-024
  difficulty: intermediate

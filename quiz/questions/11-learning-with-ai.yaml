  - pm
  question: Что такое «ритуал 3 показателей, 5 минут в понедельник» для технических руководителей и от чего он защищает?
  options:
    a: Ежедневный формат стендапа, заменяющий ретроспективы спринтов.
    b: Еженедельная проверка частоты развертывания, времени выполнения и покрытия тестов на предмет соответствия требованиям.
    c: Еженедельный обзор трех показателей рулевого управления менее чем за пять минут, чтобы вовремя уловить дрейф, прежде чем шаблоны ловушек скорости укрепятся в командных привычках.
    d: Инструмент, который автоматически генерирует еженедельные отчеты из истории git.
  correct: c
  explanation: "Ритуал понедельника — это легкая еженедельная привычка для технических руководителей: потратьте пять минут на просмотр трех управляющих показателей (обычно частота развертываний, CFR по происхождению кода и проверка разницы во времени). Целью является раннее обнаружение дрейфа. Ловушки скорости, атрофия навыков и обходные пути для проверки развиваются постепенно. Еженедельные проверки улавливают сигнал до того, как он станет культурной моделью, которую трудно изменить. Пять минут намеренно короткие: ритуал должен быть практически нулевым, чтобы он действительно состоялся."
  doc_reference:
    file: guide/roles/learning-with-ai.md
    section: Метрики управления на уровне команды
    anchor: "#team-level-steering-metrics"

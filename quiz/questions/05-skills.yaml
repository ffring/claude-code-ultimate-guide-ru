category: Навыки
category_id: 5
source_file: guide/ultimate-guide.md
questions:
- id: 05-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Какова связь между навыками и агентами?
  options:
    a: Навыки заменяют агентов
    b: Навыки — это пакеты знаний, которые агенты могут унаследовать.
    c: Агенты — это тип навыка
    d: Они полностью независимы
  correct: b
  explanation: Навыки — это пакеты знаний, которые агенты могут наследовать. В то время как агенты представляют собой специализированные роли (ориентированные на задачи), навыки представляют собой повторно используемые модули знаний (ориентированные на предметную область). Несколько агентов могут унаследовать один и тот же навык, избегая дублирования. Например, и проверяющий код, и агент-аудитор безопасности могут унаследовать навык охранника.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.1 Понимание навыков
    anchor: "#51-understanding-skills"
- id: 05-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как хранилище должно отражать сферу владения навыком?
  options:
    a: Сохраните все навыки в ~/.claude/skills/, чтобы все проекты получили их.
    b: Используйте .claude/skills/{skill-name}/ для навыка, принадлежащего проекту, и ~/.claude/skills/{skill-name}/ для личного навыка.
    c: Используйте .claude/agents/ для командных навыков и .claude/commands/ для личных навыков.
    d: Местоположение не влияет на владение или обнаружение
  correct: b
  explanation: Сохраните проект или навык команды под именем `.claude/skills/{skill-name}/`, чтобы в репозитории можно было хранить информацию о владельце, пути проверки и предположениях. Сохраните личный навык под `~/.claude/skills/{skill-name}/`. Оба местоположения действительны, но они декларируют разные границы владения. Для каждого каталога требуется файл `SKILL.md`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.2 Создание навыков
    anchor: "#52-creating-skills"
- id: 05-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой НЕОБХОДИМЫЙ файл находится в папке навыков?
  options:
    a: README.md
    b: skill.yaml
    c: SKILL.md
    d: index.md
  correct: c
  explanation: "SKILL.md — обязательный основной файл в каждой папке навыков. Дополнительные файлы включают: reference.md (подробная документация), контрольные списки/ (списки проверки), примеры/ (шаблоны кода с примерами good/bad) и сценарии/ (вспомогательные сценарии). SKILL.md содержит описание и основные инструкции для навыка."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.2 Создание навыков
    anchor: "#skill-folder-structure"
- id: 05-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: В чем ключевое различие между навыками, агентами и командами (CC 2.1.3+)?
  options:
    a: Они все делают одно и то же
    b: Навыки = модули знаний (вызываемые пользователем или автоматически), Агенты = специализированные роли (делегированные), Команды = вызываемые пользователем навыки с отключением-вызовом модели true
    c: Команды — единственный повторно используемый компонент
    d: Агенты не могут использовать навыки или команды.
  correct: b
  explanation: |-
    Начиная с CC 2.1.3, различие следующее: Навыки — это модули знаний, которые могут быть либо вызываемыми пользователем (ранее «команды»), либо автоматически вызываемыми моделью. Агенты — это специализированные роли, которым Claude делегирует задачи (например, проверяющему безопасность). «Команды» теперь представляют собой просто вызываемые пользователем навыки (навыки с `disable-model-invocation: true` в начале), хранящиеся в `.claude/skills/`, как и все другие навыки.

    На практике: навыки с `disable-model-invocation: true` ведут себя как старые команды (запускаемые `/name`). Навыки без этого флага загружаются автоматически при совпадении контекста. Агенты наследуют навыки и обладают собственной постоянной памятью. Их можно комбинировать: агенты наследуют навыки, вызываемые моделью, а пользователи вызывают навыки, вызываемые пользователем, через `/name`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Навыки против агентов
    anchor: "#skills-vs-agents"
- id: 05-005
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что контролирует поле «контекст» в заставке SKILL.md?
  options:
    a: Размер контекстного окна
    b: Работает ли навык в изолированном (разветвление) или общем (наследование) контексте.
    c: Контекст файла для загрузки
    d: Контекст подключения к базе данных
  correct: b
  explanation: "Поле `context` управляет контекстом выполнения: «вилка» означает изолированный контекст (навык работает независимо), «наследовать» означает общий контекст (навык разделяет контекст с вызывающим агентом). Используйте fork для навыков, которым требуется чистое состояние, наследуйте для навыков, которым нужен доступ к истории разговоров и загруженным файлам."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.2 Создание навыков
    anchor: "#skillmd-frontmatter"
- id: 05-006
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Когда общий навык является полезным источником истины?
  options:
    a: Публикация навыка автоматически назначает сопровождающего.
    b: Навык, принадлежащий проекту, может устранить дублирование, если его пользователи имеют общего владельца, путь проверки и предположения.
    c: Каждый агент автоматически получает все установленные обновления навыков.
    d: Дублирование всегда хуже, чем общий общий навык.
  correct: b
  explanation: Навык, принадлежащий проекту, может устранить дублирование, если репозиторий определяет, кто его обслуживает, как проверяются изменения и какие предположения разделяют его потребители. Публикация или установка навыка не создает этот контракт. Локальная вилка или специализированная копия могут быть безопаснее, чем универсальный артефакт, полный ветвей для несовместимых контекстов.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.1 Понимание навыков
    anchor: "#why-skills"
- id: 05-007
  difficulty: senior
  profiles:
  - senior
  - power
  question: Чем ХОРОШИЙ навык отличается от ПЛОХОГО?
  options:
    a: Хорошие навыки длиннее, плохие — короче.
    b: Хорошие навыки можно использовать повторно, они ориентированы на предметную область и включают справочный материал; плохие навыки специфичны для одного агента и слишком широки
    c: Хорошие навыки используют опусы, плохие навыки используют хайку.
    d: У хороших навыков больше файлов
  correct: b
  explanation: "Хорошие навыки: возможность многократного использования несколькими агентами, ориентированность на предметную область (не слишком широкая), содержат справочные материалы и контрольные списки, а также включают этапы проверки. Плохие навыки: специфичны только для одного агента, слишком широкая сфера применения, только инструкции без справочных материалов и отсутствие контрольных списков проверки."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.1 Понимание навыков
    anchor: "#what-makes-a-good-skill"
- id: 05-008
  difficulty: power
  profiles:
  - power
  question: Какова основная методология навыка TDD (разработка через тестирование)?
  options:
    a: Пишите тесты после кода
    b: КРАСНЫЙ (неудачный тест) -> ЗЕЛЕНЫЙ (минимальный код для прохождения) -> РЕФАКТОР (улучшить, пока зеленый)
    c: Сначала напишите все тесты, затем весь код
    d: Пропустить тесты на скорость
  correct: b
  explanation: "Навык TDD следующий: 1) КРАСНЫЙ — напишите неудачный тест на желаемое поведение ПЕРЕД кодом, 2) ЗЕЛЕНЫЙ — напишите МИНИМАЛЬНЫЙ код, чтобы тест прошел, 3) РЕФАКТОР — улучшите реализацию, сохраняя тесты зелеными, затем повторите. Этот цикл гарантирует, что тесты действительно проверят поведение, требуя сначала сбоя, а затем постепенного улучшения."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.4 Примеры навыков
    anchor: "#example-2-tdd-skill"
- id: 05-009
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что должен включать в себя навык охранника для покрытия OWASP?
  options:
    a: Просто список уязвимостей
    b: Контрольные списки для каждой категории OWASP Top 10 с конкретными элементами проверки
    c: Ссылки на внешние инструменты безопасности
    d: Примеры паролей
  correct: b
  explanation: "Навык Security Guardian должен включать подробные контрольные списки для каждой категории OWASP Top 10: A01 Нарушение контроля доступа (проверка авторизации, IDOR, повышение привилегий), A02 Криптографические сбои (жестко запрограммированные секреты, TLS, хеширование паролей), A03 Внедрение (SQL, NoSQL, XSS) и т. д. Каждая категория должна иметь определенные элементы проверки с флажками."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.4 Примеры навыков
    anchor: "#example-1-security-guardian-skill"
- id: 05-010
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что такое поле «агент» в заставке SKILL.md?
  options:
    a: Какой агент создал навык
    b: "Какой тип субагента (Explore, Plan, общего назначения или пользовательский субагент .claude/agents/) использовать, когда установлен context: fork"
    c: Агент, который должен использовать этот навык
    d: Имя агента
  correct: b
  explanation: "Поле `agent` выбирает, какой тип субагента управляет навыком, если установлено `context: fork`. Принимаемые значения — встроенные агенты (Explore, Plan, общего назначения) или любой пользовательский субагент из `.claude/agents/`; если он опущен, по умолчанию используется значение общего назначения. Он не имеет никакого эффекта, если не сочетается с `context: fork`, и не имеет ничего общего с классификацией «специалист» или «общая»."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.2 Создание навыков
    anchor: "#skillmd-frontmatter"
- id: 05-011
  difficulty: power
  profiles:
  - power
  question: Что означает поле `allowed-tools` в графе навыков?
  options:
    a: Инструменты для документов по навыкам
    b: Инструменты или шаблоны команд, предварительно одобренные для хода, который активирует навык.
    c: Инструменты, которые могут активировать навык
    d: Постоянная песочница, которая блокирует все инструменты, не указанные в списке.
  correct: b
  explanation: "Поле `allowed-tools` предварительно утверждает соответствующие инструменты или команды с ограниченной областью действия для хода, который активирует навык. Например, `allowed-tools: Read Grep Bash(npm run *)` сужает то, что запускается без другого запроса разрешения. Это не эксклюзивный список разрешенных или «песочница»: другие инструменты по-прежнему управляются разрешениями сеанса. Используйте `disallowed-tools` для пошагового удаления и правила запрета проекта для постоянных ограничений."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.2 Создание навыков
    anchor: "#skillmd-frontmatter"
- id: 05-012
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие дополнительные папки может содержать каталог навыков?
  options:
    a: Разрешено только SKILL.md.
    b: reference.md, контрольные списки/, примеры/ и скрипты/
    c: src/, dist/ и node_modules/
    d: тесты/, документы/ и конфигурации/
  correct: b
  explanation: "Каталог навыков может содержать: SKILL.md (обязательный), reference.md (подробная документация), контрольные списки/ (списки проверки, такие как security.md, performance.md), примеры/ (шаблоны кода, такие как good-example.ts, bad-example.ts) и скрипты/ (вспомогательные сценарии, такие как audit.sh). Эта богатая структура поддерживает всесторонние знания предметной области."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.2 Создание навыков
    anchor: "#skill-folder-structure"
- id: 05-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что является примером ХОРОШЕГО хеширования паролей в навыке Security Guardian?
  options:
    a: md5 (пароль)
    b: sha1(пароль)
    c: аргон2 или bcrypt
    d: Кодировка Base64
  correct: c
  explanation: "Навык Security Guardian показывает argon2 или bcrypt как безопасное хеширование паролей. ПЛОХИЕ примеры явно перечислены: md5(пароль) и sha1(пароль) — они криптографически взломаны для хранения паролей. Хороший шаблон: `const hashedPassword = await hash(password)` с использованием библиотеки argon2. Всегда проверяйте пароль с помощью `await verify(hashedPassword, inputPassword)`."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.4 Примеры навыков
    anchor: "#54-skill-examples"
- id: 05-014
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какова закономерность AAA при тестировании TDD?
  options:
    a: Спросить, ответить, утвердить
    b: Организовать, действовать, утверждать
    c: Анализируйте, применяйте, одобряйте
    d: Принять, настроить, признать
  correct: b
  explanation: "AAA означает Arrange, Act, Assert: 1) Arrange — настройка тестовых данных и предварительных условий, 2) Act — выполнение тестируемого кода, 3) Assert — проверка соответствия результата ожиданиям. Пример: Упорядочить массив элементов. Действовать, вызвав CalculTotal(items). Утвердить, что общая сумма равна ожидаемому значению. Такая структура делает тесты читабельными и удобными в сопровождении."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.4 Примеры навыков
    anchor: "#test-structure-aaa-pattern"
- id: 05-015
  difficulty: power
  profiles:
  - power
  question: Какой репозиторий навыков сообщества специализируется на кибербезопасности и тестировании на проникновение?
  options:
    a: awesome-claude-skills
    b: claude-security-pack
    c: zebbern/claude-code-guide с 29 навыками кибербезопасности.
    d: owasp-claude-skills
  correct: c
  explanation: "Репозиторий zebbern/claude-code-guide содержит 29 навыков, ориентированных на кибербезопасность, включая тестирование на проникновение (SQL-инъекция, XSS, IDOR), инструменты безопасности (Metasploit, Burp Suite, SQLMap), безопасность инфраструктуры (AWS, Cloud, Network) и методологии (этический взлом, контрольные списки пентестов). Важно: их следует тщательно протестировать и использовать только при наличии надлежащего разрешения."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.5 Репозитории навыков сообщества
    anchor: "#cybersecurity-skills-repository"
- id: 05-016
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что должны включать в себя навыки, чтобы быть наиболее полезными?
  options:
    a: Только теория и концепции
    b: Контрольные списки, примеры кода good/bad и этапы методологии.
    c: Ссылки на внешние сайты
    d: Маркетинговые описания
  correct: b
  explanation: "Полезные навыки включают в себя: этапы методологии (понятный процесс, которому необходимо следовать), контрольные списки (элементы проверки с флажками), примеры кода good/bad (показывающие правильные шаблоны и антишаблоны) и справочные материалы. Эта комбинация обеспечивает как теоретические знания, так и практические рекомендации, которые агенты могут применять непосредственно при выполнении задач."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.3 Шаблон навыков
    anchor: "#53-skill-template"
- id: 05-017
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как вы ссылаетесь на навык в работе агента?
  options:
    a: "импорт: имя навыка"
    b: "навыки: [название навыка]"
    c: "использование: имя-навыка"
    d: "требуется: имя навыка"
  correct: b
  explanation: "Справочные навыки в теме агента с использованием массива `skills`: `skills: [security-guardian, tdd]`. Это заставляет агента унаследовать все знания из этих навыков. Вы можете указать несколько навыков, и агент объединит их опыт. Имя навыка совпадает с именем папки в `.claude/skills/`."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.4 Лучшие практики
    anchor: "#skill-composition"
- id: 05-018
  difficulty: power
  profiles:
  - power
  question: Какой отказ от ответственности применяется к навыкам сообщества в области кибербезопасности?
  options:
    a: Они официально сертифицированы
    b: Тщательно тестируйте, обеспечивайте авторизацию, проверяйте соответствие политикам, используйте только легально
    c: Они работают на всех системах
    d: Отказ от ответственности не требуется
  correct: b
  explanation: Перед использованием в производстве проверьте навыки сообщества в области кибербезопасности, просмотрите их инструкции, вспомогательные файлы, сценарии, зависимости и разрешения на инструменты, а также подтвердите, что работа разрешена в письменной форме. Рейтинг каталога или популярность репозитория не заменяют проверку конкретной версии, которую вы используете.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.5 Репозитории навыков сообщества
    anchor: "#important-disclaimer"
- id: 05-019
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие четыре области владения следует различать перед распространением навыка?
  options:
    a: Локальный, удаленный, управляемый и неуправляемый
    b: Бесплатные, платные, с открытым исходным кодом и проприетарные
    c: Личное, проектное или командное, инструментальное или поставщика, а также рыночное или глобальное.
    d: Подсказка, агент, ловушка и MCP
  correct: c
  explanation: Прежде чем выбирать канал распространения, выберите между персональным, проектным или командным, инструментом или поставщиком, рынком или глобальным масштабом. Каждая область применения имеет разные требования к совместимости и обслуживанию. Публичное распространение поддерживает обнаружение, но не создает совместного владения.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Право собственности и повторное использование
    anchor: "#ownership-and-reuse-governance"
- id: 05-020
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое схема «точечного роста» в управлении жизненным циклом навыков?
  options:
    a: Когда навык становится слишком большим и его нужно разделить
    b: Когда модель проходит репрезентативную оценку без соответствующих навыков, что делает ее кандидатом на пенсию, который все еще нуждается в проверке рисков и зависимостей.
    c: Когда навык срабатывает слишком часто и его нужно регулировать
    d: Когда навык принимается более широким сообществом
  correct: b
  explanation: Точечный рост происходит, когда модель проходит репрезентативные оценки без навыка повышения возможностей. Этот результат делает этот навык кандидатом на пенсию; это не доказывает безопасное удаление. Проверьте зависимости активного рабочего процесса, данные об использовании, частоту выполнения задач и серьезность сбоев, затем отключите навык и сравните сеансы, прежде чем выводить его из эксплуатации.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.X Жизненный цикл навыков и прекращение их использования
    anchor: "#5x-skill-lifecycle-retirement"
- id: 05-021
  difficulty: power
  profiles:
  - power
  question: Что делает настройка триггера (оптимизатор описания) в Skill Evals?
  options:
    a: Он регулирует время загрузки навыков в контекст.
    b: Он сжимает описания навыков, чтобы уменьшить использование токенов.
    c: Он автоматически запускает все тесты навыков по расписанию.
    d: Он анализирует и улучшает поле описания навыка, чтобы уменьшить количество ложноположительных и ложноотрицательных результатов при активации навыка.
  correct: d
  explanation: Trigger Tuning анализирует `description` навыка и предлагает изменения, направленные на уменьшение количества ложноположительных и ложноотрицательных результатов при активации. Он оценивает маршрутизацию, а не качество вывода. Навык может сработать в нужный момент и все равно дать неверный результат, поэтому тестируйте активацию и утверждения задач отдельно.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.Y Оценка навыков
    anchor: "#5y-skill-evals"
- id: 05-022
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Если вы наберете /skill-a /skill-b и выполните XYZ в одном приглашении, что произойдет с версией 2.1.199?
  options:
    a: Загружается только первый упомянутый навык, остальные обрабатываются как обычный текст.
    b: Загружены все ведущие навыки, максимум до 5.
    c: Все ведущие навыки загружаются без ограничений по количеству.
    d: Объединение вызовов навыков в одно приглашение не поддерживается и вызывает ошибку.
  correct: b
  explanation: Начиная с версии 2.1.199, вызовы сложенных косых навыков загружают все ведущие навыки, упомянутые в начале подсказки, максимум до 5, вместо загрузки только первого. До этого изменения распознавался только первый навык. Вариант c неверен, поскольку существует ограничение, а вариант d неверен, поскольку стекирование явно поддерживается.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.199
- id: 05-023
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: В чем помогает навык /dataviz, добавленный в качестве встроенного навыка в версии 2.1.198?
  options:
    a: Навыки написания сценариев миграции SQL.
    b: Навыки создания каркасов модульных тестов.
    c: Навыки руководства по проектированию диаграмм и информационных панелей с работоспособным валидатором цветовой палитры.
    d: Навыки проверки соблюдения требований доступности на веб-страницах.
  correct: c
  explanation: Навык /dataviz предоставляет рекомендации по проектированию диаграмм и информационных панелей, включая работоспособный валидатор цветовой палитры. Это не связано с SQL, тестированием или доступностью, которые являются правдоподобными темами для связанных навыков, но не тем, что охватывает /dataviz.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 05-024
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что проверяет инструмент NVIDIA SkillSpector с открытым исходным кодом перед установкой навыка Claude Code?
  options:
    a: Статический анализ файла навыков или репозитория, проверенный на соответствие 64 шаблонам в 16 категориях перед установкой.
    b: Мониторинг сетевых вызовов навыка во время его выполнения
    c: Оперативное сканирование уязвимостей всей вашей конфигурации Claude Code и установленных серверов MCP.
    d: Автоматическое средство исправления, которое исправляет уязвимые навыки на месте.
  correct: a
  explanation: SkillSpector выполняет статический анализ, проверку регулярных выражений и AST в файле навыка или репозитории, проверяя его на наличие 64 известных вредоносных или рискованных шаблонов в 16 категориях, таких как быстрое внедрение, эксфильтрация данных и отравление инструмента MCP, прежде чем навык коснется вашей машины. Он не отслеживает сетевые вызовы во время выполнения, не сканирует вашу действующую конфигурацию и ничего не исправляет автоматически, а только оценивает и сообщает.
  doc_reference:
    file: guide/ecosystem/third-party-tools.md
    section: СкиллСпектор
- id: 05-025
  difficulty: senior
  profiles:
  - senior
  - power
  question: Где должна проходить граница между навыком и средствами автоматизации?
  options:
    a: Сохраняйте каждый повторяющийся рабочий процесс в SKILL.md, поскольку пронумерованные шаги гарантируют порядок выполнения.
    b: Сохраните интерпретацию в навыке, но переместите требуемый порядок, повторные попытки, правила остановки и проверки артефактов в перехватчик, сценарий, задание CI или обвязку рабочего процесса.
    c: Перенесите все суждения в детерминированный сценарий, чтобы модель не могла адаптироваться.
    d: Используйте агент, если рабочий процесс содержит более одного шага.
  correct: b
  explanation: Используйте этот навык, когда модель должна интерпретировать контекст, разрешить двусмысленность или адаптировать процедуру. Поместите требуемый порядок, предварительные условия, повторные попытки, жесткие остановки и проверки артефактов в перехватчик, сценарий, задание CI или динамический рабочий процесс. Нумерованный список направляет модель; это не гарантирует, что элементы управления сработали.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.1 Навыки и агенты
    anchor: "#decision-tree-which-to-use"
- id: 05-026
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие доказательства предоставляет `/skill-doctor` и каковы его текущие ограничения?
  options:
    a: Он сканирует все навыки, включая комплексные и корпоративные навыки, в локальных сеансах и сеансах удаленного управления.
    b: Это доказывает, что любой неиспользуемый навык можно безопасно удалить.
    c: Он сообщает видимую стоимость контекста навыков и никогда не вызываемые навыки в терминале с ограничениями по объему и доступности.
    d: Он автоматически архивирует неиспользуемые навыки за пределами путей обнаружения.
  correct: c
  explanation: "`/skill-doctor` сообщает стоимость контекста для видимых навыков и отмечает навыки, которые никогда не использовались. Для него требуется Claude Code v2.1.252 или более поздней версии, исключаются встроенные и корпоративные навыки, зависит от получения флага функции и он недоступен через удаленное управление. Рассматривайте неиспользуемый флаг как сигнал проверки и объединяйте его с репрезентативными сеансами, зависимостями и рисками."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.X Жизненный цикл навыков и прекращение их использования
    anchor: "#5x-skill-lifecycle-retirement"
- id: 05-027
  difficulty: power
  profiles:
  - power
  question: Что могут поддерживать оценки навыков, а что они не доказывают?
  options:
    a: Проходная оценка доказывает, что навык верен для каждой модели, репозитория и будущего запроса.
    b: Результаты тестов и A/B поддерживают масштабное сравнение; Trigger Tuning измеряет маршрутизацию; независимые валидаторы и квалифицированный человеческий анализ усиливают доказательства
    c: Судья LLM является независимым доказательством, поскольку он не может разделить слепые зоны тестируемой модели.
    d: Точность активации подтверждает качество вывода, поэтому утверждения задач не являются обязательными.
  correct: b
  explanation: В режиме тестирования фиксируются показатели прохождения, затраченное время и использование токенов в отдельных случаях. A/B Тестирование сравнивает две версии навыков, не сообщая судье, какая из них какая. Настройка триггера нацелена на ложноположительные и ложноотрицательные результаты при активации. Эти артефакты поддерживают сравнение по области действия; они не доказывают универсальную правильность и не устраняют отклонения модели. Запишите модель, версию клиента, подсказки, утверждения, количество запусков, сбои и стоимость, а затем добавьте детерминированные проверки или квалифицированную проверку человеком, если этого требует риск.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 5.Y Оценка навыков
    anchor: "#5y-skill-evals"

  - pm
  question: Какой каталог в папке .claude/ считается наиболее чувствительным к безопасности?
  options:
    a: .claude/hooks/ (сценарии запускаются с полными правами пользователя при каждом событии агента)
    b: .claude/agents/ (определения агентов могут переопределять системные подсказки)
    c: .claude/commands/ (пользовательские команды могут выполнять произвольный код)
    d: .claude/settings.json (содержит все ключи и токены API)
  correct: a
  explanation: "Каталог .claude/hooks/ наиболее чувствителен к безопасности, поскольку сценарии перехвата выполняются автоматически при событиях агента (SessionStart, PostToolUse и т. д.) с полными привилегиями пользователя, запускающего Claude Code. В отличие от агентов или команд, требующих явного вызова, перехватчики срабатывают автоматически. Шаблоны «красных флажков» в перехватах включают: curl/wget (сетевые вызовы), base64 (обфускация полезной нагрузки), /dev/tcp (обратные оболочки) и eval/exec (динамическое выполнение кода)."
  doc_reference:
    file: guide/security/security-hardening.md
    section: 5-минутный контрольный список .claude/ аудита
    anchor: "#5-minute-claude-audit-checklist"
- id: 13-028
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какая комбинация шаблонов в сценарии .claude/hooks/ указывает на вероятную вредоносную перехватку?
  options:
    a: команды echo, printf и tee для ведения журнала
    b: команды git, npm и docker для интеграции CI/CD
    c: "curl/wget + base64 + /dev/tcp + eval: сетевые вызовы, кодирование, обратная оболочка и динамическое выполнение."
    d: дата, имя хоста и whoami для ведения журнала аудита
  correct: c
  explanation: "Вредоносные перехватчики обычно сочетают в себе: curl/wget (эксфильтрация данных), base64 (обфускация полезной нагрузки, используемая ClawHavoc через glot.io), /dev/tcp или /dev/udp (обратные оболочки bash, нет законного варианта использования перехватчика) и eval/exec (динамическое выполнение кода). Дополнительные красные флажки: доступ к ключам .env/credentials/ssh, ссылки на сайты вставки (glot.io, Pastebin.com) и nc/ncat/netcat (обратные оболочки Netcat, удалить немедленно)."
  doc_reference:
    file: guide/security/security-hardening.md
    section: 5-минутный контрольный список .claude/ аудита
    anchor: "#5-minute-claude-audit-checklist"

  question: Как кампания ClawHavoc доставляет вредоносное ПО AMOS?
  options:
    a: Через скомпрометированные пакеты npm с помощью постустановочных сценариев.
    b: Путем прямого использования CVE в протоколе MCP.
    c: Через фишинговые электронные письма с вредоносными вложениями.
    d: "Поддельные предварительные условия в SKILL.md, фрагменты оболочки в кодировке Base64 из glot.io и защищенные паролем ZIP-файлы (пароль: «openclaw»)"
  correct: d
  explanation: "ClawHavoc использует многоэтапную доставку: (1) SKILL.md содержит поддельные предварительные условия, которые обманным путем заставляют агента выполнять команды, (2) фрагменты оболочки в кодировке Base64, полученные из службы вставки glot.io, (3) защищенные паролем ZIP-файлы с паролем «openclaw» и (4) дропперы второго этапа с необработанных IP-адресов (91.92.242.30 и т. д.). Эта цепочка использует доверие агента к инструкциям SKILL.md."

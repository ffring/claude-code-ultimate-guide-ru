  - pm
  question: Какой инструмент CLI сканирует конфигурации сервера MCP на наличие известных уязвимостей?
  options:
    a: "mcp-fortress: панель управления защитой во время выполнения"
    b: "Snyk Agent Scan, ранее mcp-scan (uvx snyk-agent-scan): поддерживается Snyk с 90-100% отзывом известных вредоносных навыков."
    c: "Skills-ref validate: средство проверки соответствия спецификациям навыков."
    d: "Гарак: сканер уязвимостей LLM от NVIDIA"
  correct: b
  explanation: "Snyk Agent Scan (ранее mcp-scan от Invariant, запускаемый через `uvx snyk-agent-scan@latest`) является основным инструментом CLI для сканирования конфигураций MCP. При поддержке Snyk он обнаруживает известные уязвимые серверы MCP, сканирует SKILL.md на предмет быстрого внедрения и вредоносного кода, а также поддерживает конфигурации Claude Desktop, Cursor и Windsurf. Он достигает 90-100% отзыва при 0% ложных срабатываний в топ-100 skills.sh. Ограничения: он не может обнаруживать полезные нагрузки только во время выполнения и отправляет описания инструментов и содержимое навыков в анализ Snyk API. Не запускайте пакет npm с именем mcp-scan: он принадлежит несвязанному издателю."
  doc_reference:
    file: guide/security/security-hardening.md
    section: 1.2 Риски цепочки поставок навыков агентов
    anchor: "#12-agent-skills-supply-chain-risks"

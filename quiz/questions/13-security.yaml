  correct: b
  explanation: "CVE-2025-49596 — это критическая уязвимость (CVSS 9.4) в инспекторе MCP. Он предоставляет неаутентифицированный прокси-сервер на 0.0.0.0, позволяя использовать RCE с любой вредоносной веб-страницы. На Shodan было обнаружено около 560 открытых экземпляров. Исправлено в MCP Inspector >= 0.14.1. Смягчение: немедленно обновить и ограничить привязку к локальному хосту."

questions:
- id: 13-001
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Что такое атака «MCP Rug Pull»?
  options:
    a: Сервер MCP неожиданно выходит из строя
    b: Доброкачественный MCP, который становится вредоносным после завоевания доверия (повторное одобрение не требуется)
    c: MCP, который использует слишком много токенов
    d: Атака на сам протокол MCP
  correct: b
  explanation: "MCP Rug Pull использует модель однократного одобрения: злоумышленник публикует безобидный MCP → пользователь одобряет один раз → MCP работает нормально (формирует доверие) → злоумышленник распространяет вредоносное обновление → MCP похищает учетные данные БЕЗ повторного одобрения. Смягчение: закрепление версии + проверка хеша."
  doc_reference:
    file: guide/security/security-hardening.md
    section: "Атака: MCP Rug Pull"
    anchor: "#attack-mcp-rug-pull"
- id: 13-002
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что использует CVE-2025-53109/53110 (EscapeRoute)?
  options:
    a: Оперативное внедрение в системную подсказку Claude
    b: Выход из песочницы файловой системы MCP через обход префикса + символические ссылки
    c: Повреждение памяти в инструменте Bash
    d: Утечка ключа API в сетевых запросах
  correct: b
  explanation: "CVE-2025-53109/53110 (EscapeRoute) позволяет выйти из песочницы в файловой системе MCP через обход префикса в сочетании с символическими ссылками. Серьезность: Высокая. Смягчение: избегайте файловой системы MCP с неограниченным доступом или примените официальный патч. Источник: исследование безопасности Cymulate."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Резюме CVE (2025–2026 гг.)
    anchor: "#cve-summary-2025-2026"
- id: 13-003
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какое известное ограничение Permissions.deny в .claude/settings.json?
  options:
    a: Работает только на macOS
    b: Системные напоминания могут раскрывать содержимое файла до проверки разрешений инструмента.
    c: Он не может блокировать команды Bash
    d: Требуются права администратора
  correct: b
  explanation: 'Permissions.deny имеет архитектурные ограничения: фоновое индексирование может раскрыть содержимое файла через внутренний механизм «системного напоминания» ДО того, как будут применены проверки разрешений инструмента. Это описано в GitHub #4160. Глубокая защита: храните секреты вне каталогов проекта.'
  doc_reference:
    file: guide/security/security-hardening.md
    section: Известные пробелы в безопасности
    anchor: "#known-security-gaps"
- id: 13-004
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какова рекомендуемая стратегия глубокоэшелонированной защиты для защиты секретов?
  options:
    a: Используйте только Permissions.deny
    b: Храните секреты вне проекта + внешнее хранилище + перехватчики PreToolUse + никогда не фиксируйте
    c: Зашифруйте все файлы в проекте
    d: Используйте VPN при запуске Claude Code
  correct: b
  explanation: "Углубленная защита: (1) Храните секреты вне каталогов проекта (~/.secrets/ или хранилище), (2) Используйте внешнее управление секретами (AWS Secrets Manager, 1Password), (3) Добавляйте перехватчики PreToolUse в качестве вторичной блокировки, (4) Никогда не фиксируйте секреты, (5) Просматривайте команды bash вручную."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Стратегия глубокоэшелонированной защиты
    anchor: "#defense-in-depth-strategy"
- id: 13-005
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой метод уклонения от быстрой инъекции использует U+200B, U+200C, U+200D?
  options:
    a: Кодировка Base64
    b: Переопределение RTL
    c: Символы нулевой ширины (невидимые для человека)
    d: Гомоглифы
  correct: c
  explanation: "Символы нулевой ширины (U+200B, U+200C, U+200D) делают инструкции невидимыми для людей, но при этом они продолжают интерпретироваться. Обнаружение: шаблон регулярного выражения Юникода [\\x{200B}-\\x{200D}\\x{FEFF}\\x{202A}-\\x{202E}]. Добавлен в prompt-injection-detector.sh в версии 3.6.0."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Техники уклонения
    anchor: "#evasion-techniques"
- id: 13-006
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой инструмент обнаружения секретов имеет самую высокую полноту (88%), но меньшую точность (46%)?
  options:
    a: ТрюфельСвинья
    b: GitGuardian
    c: Гитликс
    d: detect-secrets
  correct: c
  explanation: "Gitleaks: запоминаемость 88%, точность 46%, быстрота (~2 коммита min/100K) — лучше всего подходит для перехватчиков перед фиксацией. TruffleHog: полнота 52%, точность 85%, медленный — лучше всего подходит для проверки CI. GitGuardian: полнота 80%, точность 95% — корпоративный мониторинг. обнаружение секретов: полнота 60%, точность 98% — базовый подход."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Сравнение инструментов
    anchor: "#tool-comparison"
- id: 13-007
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой стек перехватчиков рекомендуется использовать для обеспечения безопасности в settings.json?
  options:
    a: Только хуки PostToolUse для логирования
    b: PreToolUse (блокировщик опасностей, детектор инъекций) + PostToolUse (сканер вывода) + SessionStart (целостность MCP)
    c: Никаких хуков — полагайтесь только на Permissions.deny
    d: Только хуки UserPromptSubmit
  correct: b
  explanation: "Рекомендуемый стек перехватчиков безопасности: PreToolUse → dangerous-actions-blocker.sh (Bash), prompt-injection-detector.sh + unicode-injection-scanner.sh (Edit/Write). PostToolUse → output-secrets-scanner.sh (Bash). Начало сеанса → mcp-config-integrity.sh. Несколько уровней для глубокоэшелонированной защиты."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Настройка стека хуков
    anchor: "#23-hook-stack-setup"
- id: 13-008
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какие серверы MCP помечены как «Безопасные» в проверенном сообществом безопасном списке?
  options:
    a: файловая система (неограниченная), база данных (учетные данные продукта)
    b: "@modelcontextprotocol/server-*, контекст7, последовательное мышление, память"
    c: браузер (полный доступ), пользовательские MCP
    d: Все MCP безопасны по умолчанию
  correct: b
  explanation: "Безопасный список MCP: @modelcontextprotocol/server-* (справочные серверы MCP), context7 (документы только для чтения), последовательное мышление (без внешнего доступа, локально), память (локальный файловый). Риск: неограниченная файловая система (CVE-2025-53109), повреждение базы данных (эксфильтрация). Небезопасно: полный доступ через браузер."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Безопасный список MCP (проверен сообществом)
    anchor: "#mcp-safe-list-community-vetted"
- id: 13-009
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Каково первое действие, когда тайна раскрыта?
  options:
    a: Задокументируйте инцидент для вскрытия
    b: Немедленно отозвать учетные данные
    c: Сканировать весь репо
    d: Уведомить команду
  correct: b
  explanation: "Первые 15 минут (остановить кровотечение): (1) Немедленно отозвать — ключ удаления доступа AWS, токен отзыва GitHub, ключ Stripe Roll. (2) Подтвердите масштаб воздействия. Затем: аудит истории git, сканирование зависимостей, проверка логов CI/CD. Первые 24 часа: чередуйте ВСЕ соответствующие учетные данные, уведомляйте о соблюдении требований, документируйте сроки."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Секрет раскрыт
    anchor: "#31-secret-exposed"
- id: 13-010
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Каковы три уровня безопасности в руководстве?
  options:
    a: Низкий, Средний, Высокий
    b: Базовый (5 минут), Стандартный (30 минут), Усиленный (2 часа)
    c: Разработка, Постановка, Производство
    d: Бесплатная, Профессиональная, Корпоративная
  correct: b
  explanation: "Уровни безопасности: Базовый (5 минут) = сканер вывода + блокировщик опасностей — для одиночного dev/experiments.. Стандартный (30 минут) = + хуки для внедрения + проверка MCP — для кода teams/sensitive. Усиленный (2 часа) = + проверка целостности + ZDR - для enterprise/production."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Уровни безопасности
    anchor: "#security-posture-levels"
- id: 13-011
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой подход к изоляции песочницы сочетает изоляцию microVM с сетевыми политиками для обеспечения автономии агентов?
  options:
    a: E2B (размещенные облачные песочницы)
    b: Спрайты Fly.io (периферийные вычисления)
    c: Docker Песочницы (с настраиваемыми шаблонами и сетевыми политиками)
    d: Песочница Cloudflare SDK
  correct: c
  explanation: "Песочницы Docker обеспечивают изоляцию на уровне микроVM с помощью настраиваемых сетевых политик. Ключевые функции: пользовательские шаблоны Dockerfile для воспроизводимых сред, сетевые политики для управления egress/ingress, монтирование томов для постоянного хранилища и ограничения CPU/memory. Этот подход подходит командам, которым нужен полный контроль над конфигурацией песочницы, сохраняя при этом строгую изоляцию."
  doc_reference:
    file: guide/security/sandbox-isolation.md
    section: 3. Песочницы Docker
    anchor: "#3-docker-sandboxes"
- id: 13-012
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Что такое ошибка автоматического создания проблемы GitHub (#13797) и чем она опасна?
  options:
    a: Проблемы автоматически удаляются
    b: Claude Code случайно создает общедоступные выпуски GitHub, содержащие сведения о частном проекте.
    c: Проблемы создаются, но остаются частными
    d: Влияет только на платные корпоративные аккаунты
  correct: b
  explanation: "Ошибка автоматического создания задачи GitHub (#13797) приводит к тому, что Claude Code случайно создает общедоступные задачи GitHub, содержащие сведения о частном проекте. Задокументировано более 17 случайных раскрытий информации, затронувших версию 2.0.65+. Опасность: внутренний код, архитектурные решения и частный контекст становятся публичными. Способ устранения: отключите инструмент gh CLI или ограничьте разрешения GitHub."
  doc_reference:
    file: guide/core/known-issues.md
    section: 1. Автоматическое создание проблемы GitHub в неправильном репозитории (декабрь 2025 г. – настоящее время)
    anchor: "#1-github-issue-auto-creation-in-wrong-repository-dec-2025-present"
- id: 13-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что такое «Отравление инструмента через SKILL.md» (техника атаки T001)?
  options:
    a: Файл SKILL.md слишком велик и замедляет работу агента.
    b: Уязвимость в парсере SKILL.md, приводящая к сбою агента
    c: Скрытые инструкции в SKILL.md, которые заставляют агента выполнять вредоносные команды (curl|bash, base64 eval, ZIP-архивы с паролями).
    d: SKILL.md, который ссылается на устаревшие конечные точки API.
  correct: c
  explanation: "Отравление инструмента через SKILL.md (T001) включает в себя скрытые инструкции, которые обманом заставляют агента выполнять вредоносные команды. Общие шаблоны включают `curl | bash` с сайтов вставки, таких как glot.io, команды eval, декодированные в base64, и защищенные паролем ZIP-файлы (пароль: «openclaw»). Используется кампаниями ClawHavoc и ToxicSkills. Смягчение: сканируйте SKILL.md на наличие команд оболочки; никогда не выполняйте предварительные условия автоматически."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Модели атак
    anchor: "#attack-patterns"
- id: 13-014
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Что такое «отравление памяти» в контексте безопасности агента ИИ (метод T002)?
  options:
    a: Атака, которая повреждает оперативную память агента, вызывая сбои.
    b: Внедрение постоянных вредоносных инструкций в файлы памяти агента (CLAUDE.md, SOUL.md, MEMORY.md)
    c: Атака типа «отказ в обслуживании», заполняющая контекстное окно агента.
    d: Атака, которая стирает историю разговоров агента.
  correct: b
  explanation: "Отравление памяти (T002) внедряет постоянные инструкции бэкдора в файлы конфигурации, такие как SOUL.md, MEMORY.md, CLAUDE.md или AGENTS.md. Эти инструкции сохраняются в течение сеансов, создавая когнитивных червей, которые реплицируются в файлах памяти агента. Идентифицирован в кампании ToxicSkills. Смягчение: рассматривать файлы памяти как конфигурационные; требовать проверки кода на наличие изменений; мониторить различия."
  doc_reference:
    file: guide/core/memory-systems.md
    section: 7.1 Отравление памяти посредством быстрой инъекции
    anchor: "#71-memory-poisoning-via-prompt-injection"
- id: 13-015
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как работает атака «Растерянный депутат» через MCP (техника T004)?
  options:
    a: Сервер MCP полностью притворяется другим сервером.
    b: Пользователь случайно подключается к неправильному серверу MCP.
    c: Сам протокол MCP имеет уязвимость переполнения буфера.
    d: Злоумышленник манипулирует данными или выходными данными сеанса MCP, а клиент доверяет отравленному ответу.
  correct: d
  explanation: "Атака «Запутанный заместитель» через MCP (T004) происходит, когда злоумышленник манипулирует идентификаторами или выходными данными сеанса MCP, заставляя клиента доверять отравленным ответам. Примеры включают повторное использование идентификатора сеанса в oatpp-mcp (CVE-2025-6515) и объединение Git MCP + файловой системы MCP через отравленный README. Смягчение: идентификаторы криптографических сеансов, проверка ввода, минимальные привилегии для инструментов MCP."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Модели атак
    anchor: "#attack-patterns"
- id: 13-016
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Что такое атака с перепривязкой DNS на локальные серверы MCP (техника T005)?
  options:
    a: Вредоносный веб-сайт повторно привязывает свой домен к 127.0.0.1 для доступа к серверам MCP, работающим локально.
    b: Атака, изменяющая DNS-записи домена сервера MCP.
    c: Метод перехвата трафика MCP между клиентом и удаленным сервером.
    d: Атака, которая отравляет DNS-кеш хоста сервера MCP.
  correct: a
  explanation: "Перепривязка DNS на локальном MCP (T005) позволяет вредоносному веб-сайту повторно привязать свой домен к 127.0.0.1, получив доступ к серверам MCP, работающим локально, без аутентификации. Затронуто: MCP Python SDK HTTP/SSE (CVE-2025-66416), шлюз MCP (CVE-2025-64443), Playwright MCP (CVE-2025-9611). Смягчение: используйте транспорт stdio; включить защиту от перепривязки DNS; аутентифицировать локальные серверы."
  doc_reference:
    file: guide/security/security-hardening.md
    section: Техники атаки
    anchor: "#attack-techniques"
- id: 13-017
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Что делает эксфильтрацию с помощью хука (метод Т007) особенно опасной?
  options:
    a: Хуки могут изменить системное приглашение агента.
    b: Хуки работают в изолированной среде с ограниченным доступом.
    c: Перехватчики в .claude/hooks/ запускаются при событиях агента с полными правами пользователя, обеспечивая скрытую кражу данных.
    d: Хуки могут устанавливать только администраторы
  correct: c
  explanation: "Эксфильтрация на основе перехватчиков (T007) опасна, поскольку сценарии в .claude/hooks/ выполняются по событиям агента (SessionStart, PostToolUse и т. д.) с полными привилегиями пользователя, запускающего Claude Code. Вредоносный перехват может автоматически отправлять POST переменные среды, пути к файлам или содержимое кода на внешние серверы. Смягчение: просмотрите все хуки; запретить автоматический запуск перехватчиков из ненадежных репозиториев; поддерживать список разрешенных перехватчиков."
  doc_reference:
    file: guide/security/security-hardening.md
    section: "Пример: Эксфильтрация через Крюк"
    anchor: "#example-exfiltration-via-hook"
- id: 13-018
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Что такое кампания ClawHavoc?
  options:
    a: Легитимная среда тестирования безопасности для серверов MCP.
    b: Вредоносная кампания, включающая 341 вредоносный навык, использующий Atomic Stealer (AMOS) для кражи криптокошельков и данных браузера.
    c: Программа раскрытия уязвимостей, управляемая Anthropic.
    d: Коллекция инструментов безопасности с открытым исходным кодом для усиления защиты агентов.
  correct: b
  explanation: ClawHavoc (обнаружена Koi Security в феврале 2026 г.) — это кампания, включающая 341 вредоносный навык на ClawHub/OpenClaw.. 335 развертывают вредоносное ПО Atomic Stealer (AMOS), нацеленное на криптокошельки (более 60, включая Exodus, Binance, Electrum), данные браузера (Chrome, Safari, Firefox), ключи SSH и сеансы Telegram. Категории включают криптоинструменты (111), утилиты YouTube (57), finance/social (76), боты Polymarket (34) и другие.
  doc_reference:
    file: guide/security/security-hardening.md
    section: Кампании
    anchor: "#campaigns"
- id: 13-019
  difficulty: junior
  profiles:
  - junior

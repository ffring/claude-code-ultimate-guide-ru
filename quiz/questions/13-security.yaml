    b: "12,7%: примерно каждый восьмой имел умеренные недостатки"
    c: "36,82%: более трети из 3984 навыков имели недостатки, при этом 534 критических и 76 вредоносных полезных нагрузок"
    d: "78,5%: подавляющее большинство были скомпрометированы"
  correct: c
  explanation: "В отчете Snyk ToxicSkills (февраль 2026 г.) было просканировано 3984 навыка в ClawHub и skills.sh. Результаты: 1467 ошибок (36,82%), 534 критических риска (13,4%), 76 подтвержденных вредоносных полезных нагрузок, 10,9% с жестко закодированными секретами, 17,7% получения удаленного контента, 2,9% с удаленным быстрым выполнением. На момент сканирования 8 вредоносных навыков все еще были активны."

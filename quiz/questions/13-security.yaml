  question: Что такое структура SAFE-MCP?
  options:
    a: Ан Anthropic- ведение списка утвержденных MCP серверы
    b: Песочница времени выполнения для изоляции серверных процессов MCP.
    c: Программа сертификации для разработчиков серверов MCP.
    d: Структура безопасности с более чем 80 методами, сопоставленными с ATT&CK для сред MCP, предоставляющая черные списки на основе политик.
  correct: d
  explanation: SAFE-MCP (safemcp.org) — это комплексная система безопасности, которая сопоставляет более 80 методов атак со структурой MITRE ATT&CK, специально адаптированной для сред MCP. Он предоставляет основанные на политике черные списки и защитные рекомендации. В сочетании с такими инструментами, как mcp-scan, Docker MCP Gateway и Snyk AI-BOM, он является частью стратегии глубокоэшелонированной защиты инфраструктуры агентов ИИ.

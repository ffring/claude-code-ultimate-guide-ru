  question: Что раскрывает CVE-2025-66032 в Claude Code?
  options:
    a: Утечка памяти при интеграции языковой модели Claude Code.
    b: Обход аутентификации в Claude Code's API обработка ключей
    c: 8 обходов выполнения команд через недостатки черного списка (man --html, модификатор sed e, неоднозначность git arg, расширение переменных bash)
    d: Отказ в обслуживании из-за чрезмерного просмотра файлов
  correct: c
  explanation: "CVE-2025-66032 (обнаруженный Flatt Security) раскрывает 8 различных способов обойти черный список команд Claude Code и выполнить произвольные команды. Методы включают в себя: man --html (открывает браузер с произвольным URL-адресом), модификатор sed e (выполняет команды), неоднозначность аргументов git и расширение переменных bash. Исправлено в Claude Code >= 1.0.93. Это демонстрирует, почему эшелонированная защита имеет значение, выходящее за рамки простых черных списков."
  doc_reference:

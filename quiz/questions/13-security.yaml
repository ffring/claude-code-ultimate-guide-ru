- id: 13-031
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие четыре предварительно настроенных уровня защиты описаны в руководстве по управлению предприятием?
  options:
    a: "Бронза, серебро, золото, платина: масштабируется только в зависимости от размера команды."
    b: "Стартовый, Стандартный, Строгий, Регламентированный: масштабирование в зависимости от требований соответствия и производственных рисков."
    c: "Базовый, Расширенный, Корпоративный, Государственный: масштабирование по уровням плана."
    d: "Разработка, промежуточный этап, производство, соответствие требованиям: зеркалирование сред развертывания"
  correct: b
  explanation: |-
    Четыре уровня: **Starter** (небольшая команда <5, внутренние проекты, 10-минутная установка), **Standard** (команда 5-20, код, связанный с производством, добавляет элементы управления MCP и шлюзы рабочего процесса), **Strict** (производственные системы с реальными данными о клиентах, полный рабочий процесс утверждения + журнал аудита) и **Regulated** (среды HIPAA/SOC2/PCI/finance, все предыдущие уровни + журнал аудита соответствия). Каждый уровень предоставляет готовые к копированию дополнения `settings.json` и CLAUDE.md. Уровни масштабируются в зависимости от требований соответствия и воздействия на производство, а не только по численности персонала.
    ---
  doc_reference:
    file: guide/security/enterprise-governance.md
    section: Ярусы ограждений
    anchor: "#4-guardrail-tiers"
- id: 13-032
  difficulty: power
  profiles:
  - power
  question: Что обеспечивает рабочий процесс управления MCP в руководстве по управлению предприятием?
  options:
    a: Конвейер CI/CD, который автоматически утверждает серверы MCP с помощью зеленого сканирования безопасности.
    b: Процесс отправки разработчиками серверов MCP своих инструментов на торговую площадку Anthropic.
    c: Система изоляции на основе Docker для запуска ненадежных серверов MCP.
    d: Конвейер утверждения (запрос → проверка → утверждение → развертывание) с реестром YAML, отслеживающим серверы approved/pending/denied.
  correct: d
  explanation: |-
    Рабочий процесс управления MCP предоставляет конвейер **approval** для управления сервером MCP на уровне организации: запрос → проверка → утверждение → развертывание. Он включает формат реестра YAML для отслеживания утвержденных, ожидающих и запрещенных серверов с классификацией рисков (LOW/MEDIUM/HIGH), классификацией области данных (PUBLIC/INTERNAL/CONFIDENTIAL/RESTRICTED) и датами истечения срока действия. Перехватчик принудительного управления (`governance-enforcement-hook.sh`) проверяет активную конфигурацию MCP на соответствие утвержденному реестру в начале сеанса, выдавая предупреждение без блокировки (в первую очередь управление, а не в первую очередь трение). Это для команд, которым необходима возможность аудита на предмет соответствия SOC2/ISO27001.
    ---
  doc_reference:
    file: guide/security/enterprise-governance.md
    section: MCP Рабочий процесс управления
    anchor: "#3-mcp-governance-workflow"
- id: 13-033
  difficulty: senior
  profiles:
  - senior
  - power
  question: Чем отличается встроенная песочница macOS и Linux в Claude Code?
  options:
    a: macOS использует контейнеры Docker; Linux использует встроенную «песочницу» процессов.
    b: macOS использует пузырчатую пленку; Linux использует ремень безопасности (sandbox-exec)
    c: macOS использует ремень безопасности (sandbox-exec, встроенный); Linux использует пузырчатую пленку + socat (необходимо установить отдельно)
    d: Обе платформы используют одну и ту же песочницу на базе Docker с дополнительным собственным режимом.
  correct: c
  explanation: |-
    В **macOS**встроенная песочница использует **Seatbelt** (встроенная система `sandbox-exec`), установка не требуется, работает «из коробки» с версии 2.1.0+. На **Linux/WSL2**используется **bubblewrap** + **socat**, который необходимо установить вручную (`sudo apt-get install bubblewrap socat` на Ubuntu/Debian). Встроенная песочница пока недоступна на WSL1 или Windows (планируется). Параметр `dangerouslyDisableSandbox` позволяет несовместимым инструментам (таким как `docker` или `watchman`) выходить из песочницы для каждой команды с одобрения пользователя.
    ---
  doc_reference:
    file: guide/security/sandbox-native.md
    section: ТЛ;ДР
    anchor: "#tldr"
- id: 13-034
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое параметр `dangerouslyDisableSandbox` и когда он применяется?
  options:
    a: Флаг settings.json, который навсегда отключает всю песочницу для проекта.
    b: Аварийный люк для каждой команды, который позволяет Claude повторить неудачную команду за пределами песочницы с одобрения пользователя.
    c: Флаг CLI, эквивалентный --dangerously-skip-permissions
    d: Параметр управляемой политики, который могут настраивать только администраторы.
  correct: b
  explanation: |-
    `dangerouslyDisableSandbox` — это аварийный люк **для каждой команды** для инструментов, несовместимых с песочницей (например, `docker`, `watchman`). Если команда завершается сбоем из-за ограничений песочницы, Claude анализирует ошибку и повторяет попытку с этим набором параметров. Пользователь получает обычный запрос разрешения, и в случае одобрения команда запускается за пределами изолированной программной среды. Чтобы полностью отключить этот аварийный люк для максимальной безопасности, установите `"sandbox.allowUnsandboxedCommands": false` в `settings.json`. Это заставляет все команды запускаться в изолированной программной среде или быть явно перечислены в `excludedCommands`.
    ---
  doc_reference:
    file: guide/security/sandbox-native.md
    section: Спасательный люк
    anchor: "#6-escape-hatch"
- id: 13-035
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что делает параметр sandbox.credentials, если он включен в Claude Code, представленном в версии 2.1.187?
  options:
    a: Он шифрует все переменные среды до того, как они попадут в песочницу.
    b: Перед запуском любой изолированной команды требуется запрос пароля.
    c: Он ограничивает изолированные команды одним разрешенным регионом AWS.
    d: Он блокирует изолированные команды от чтения файлов учетных данных, таких как .aws/credentials и .ssh/, а также секретных переменных среды.
  correct: d
  explanation: "Sandbox.credentials, добавленный в версии 2.1.187, блокирует чтение файлов учетных данных командами песочницы, таких как .aws/credentials и .ssh/, а также секретные переменные среды. Это закрывает пробел, из-за которого процесс в песочнице мог бы в противном случае прочитать и извлечь хранящиеся секреты, даже если доступ к файловой системе и сети был ограничен. Другие параметры описывают возможности, которых нет у этого параметра: он не шифрует переменные, не добавляет интерактивный шлюз пароля и не ограничивает регионы AWS."
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.187
- id: 13-036
  difficulty: power
  profiles:
  - power
  question: Поскольку autoMode.classifyAllShell был представлен в версии 2.1.193, где теперь пользователь может узнать, почему автоматический режим отклонил команду оболочки?
  options:
    a: В отдельный файл журнала записывается только при установленном CLAUDE_CODE_DEBUG.
    b: Никуда; причины отказа намеренно скрыты от пользователя в целях безопасности
    c: Только на специальной панели безопасности, доступной с сайта claude.ai.
    d: В расшифровке всплывающее уведомление об отказе и просмотр недавних отказов /permissions.
  correct: d
  explanation: "В версии 2.1.193 добавлен autoMode.classifyAllShell, который маршрутизирует каждую команду Bash и PowerShell через классификатор рисков автоматического режима, а не только команды, соответствующие шаблонам выполнения произвольного кода. В том же выпуске причины отказа были указаны в трех местах: стенограмме, всплывающем сообщении об отказе и списке недавних отказов /permissions, что упрощает диагностику заблокированной команды без необходимости копаться в журналах. Для этого не существует отдельной информационной панели или скрытого журнала только для отладки, и полное сокрытие причины сведет на нет суть изменения."
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.193
- id: 13-037
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой пробел в безопасности закрыл v2.1.196 в отношении списка Claude McP и Claude McP?
  options:
    a: Эти команды перестали требовать аутентификацию, публично раскрывая имена серверов MCP.
    b: Они больше не создают серверы .mcp.json, одобренные преданным .claude/settings.json; неутвержденные серверы теперь отображаются как ожидающие утверждения.
    c: Они начали автоматически удалять неиспользуемые конфигурации сервера MCP.
    d: Они начали кэшировать ответы сервера MCP без аннулирования, что приводило к устаревшим данным.
  correct: b
  explanation: До версии 2.1.196 репозиторий мог поставлять зафиксированный .claude/settings.json, который самоутверждал сервер .mcp.json. Запуск claude mcp list или claude mcp get автоматически создаст этот сервер, даже если он никогда не проверялся разработчиком и даже если он был вредоносным. Исправление заставляет эти команды отображать неутвержденные серверы как «Ожидающие одобрения» вместо их запуска, закрывая путь, по которому вредоносный зафиксированный файл настроек мог предоставить автоматическое одобрение сервера до того, как кто-либо на него посмотрит.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.196
- id: 13-038
  difficulty: power
  profiles:
  - power
  question: Почему в руководстве песочница на основе WebAssembly с помощью таких инструментов, как Wassette, описывается как значимая альтернатива изоляции на уровне процесса для инструментов MCP?
  options:
    a: Он компилирует серверы MCP в компоненты .wasm с предоставленными возможностями во время выполнения, поэтому инструмент получает только явно объявленные пути к файловой системе, сетевые хосты и переменные окружения, а не полагается на собственный код инструмента для самоограничения.
    b: Благодаря этому вызовы инструментов MCP выполняются быстрее, чем собственные двоичные файлы, полностью пропуская систему разрешений.
    c: Он автоматически исправляет известные CVE на серверах MCP во время выполнения, не требуя обновлений.
    d: Это заменяет необходимость проверки исходного кода сервера MCP перед установкой.
  correct: a
  explanation: "Песочница на основе WASM устраняет конкретную угрозу: скомпрометированный или небрежный сервер MCP с непредсказуемой файловой системой или сетевым доступом. Wassette компилирует сервер MCP в компонент Wasm и обеспечивает объявленное YAML предоставление возможностей на уровне выполнения, поэтому граница запрета по умолчанию не зависит от правильного поведения собственного кода инструмента. В руководстве эта изоляция на уровне браузера называется значимой гарантией, но не сертифицированной границей корпоративной безопасности, и отмечается, что сам Wassette еще не готов к производству. Он не ускоряет вызовы за счет пропуска разрешений, автоматического исправления CVE и не устраняет необходимость проверки кода."
  doc_reference:
    file: guide/security/sandbox-isolation.md
    section: 7б. Песочница инструмента MCP на основе WebAssembly (экспериментальная)
    anchor: "#7b-webassembly-based-mcp-tool-sandboxing-experimental"
- id: 13-039
  difficulty: senior
  profiles:
  - senior
  - power
  question: CVE-2026-50548 и CVE-2026-50549, оба оцененные как критические в таблице CVE руководства, сохраняются там для удобства использования различных инструментов. Что они описывают?
  options:
    a: Выход из песочницы Claude Code, запускаемый командами sed и echo по конвейеру
    b: Выход из песочницы терминала агента Cursor, сочетающий в себе обход ограничения рабочего каталога с выходом при записи файла в случае сбоя канонизации пути, позволяя агенту запускать команды и записывать файлы за пределами границы рабочей области.
    c: Атака цепочки поставок GitHub Actions на торговые площадки плагинов Claude Code
    d: Уязвимость быстрого внедрения в инструменте WebFetch, позволяющая использовать SSRF
  correct: b
  explanation: CVE-2026-50548 и CVE-2026-50549 влияют на курсор, а не на Claude Code. Они сочетают в себе обход ограничения рабочего каталога с escape-записью файла, которая срабатывает в случае сбоя канонизации пути, позволяя агенту выполнять команды и записывать файлы за пределами предполагаемого рабочего пространства. Руководство хранит их в своей таблице, поскольку один и тот же класс ошибок выхода из песочницы может повлиять на любой агент кодирования, который обеспечивает соблюдение границ рабочего пространства посредством проверки пути, а не только на Claude Code. Вариант a описывает другую, специфичную для Claude Code проблему, отслеживаемую в другом месте таблицы, а варианты c и d описывают типы атак, не задокументированные под этими номерами CVE.
  doc_reference:
    file: guide/security/security-hardening.md
    section: Резюме CVE (2025–2026 гг.)
    anchor: "#cve-summary-2025-2026"

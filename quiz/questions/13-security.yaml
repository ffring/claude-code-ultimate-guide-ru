  question: Что SafeDep vet MCP обеспечивает для безопасности агентов?
  options:
    a: Мониторинг использования памяти сервера MCP во время выполнения
    b: Автоматическое исправление уязвимых серверов MCP.
    c: Защита от перепривязки DNS для локальных серверов MCP
    d: Анализ состава программного обеспечения, который проверяет пакеты перед установкой и обнаруживает небрежность
  correct: d
  explanation: SafeDep vet MCP — это инструмент анализа состава программного обеспечения, интегрированный в сервер MCP. Он проверяет предложения пакетов перед установкой pip/npm, обнаруживает небрежность (названия пакетов, вымышленные ИИ, которые регистрируют злоумышленники) и идентифицирует уязвимые и вредоносные пакеты. Он ориентирован на пакеты и дополняет mcp-scan (который фокусируется на конфигурациях MCP и сканировании SKILL.md).

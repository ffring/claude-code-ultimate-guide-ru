category: Конфиденциальность и наблюдаемость
category_id: 14
source_file: guide/security/data-privacy.md
questions:
- id: 14-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Каков срок хранения данных по умолчанию для разговоров Claude Code?
  options:
    a: 30 дней
    b: 1 год
    c: 5 лет
    d: Навсегда
  correct: c
  explanation: Срок хранения по умолчанию составляет 5 лет, а данные используются для обучения модели. При отказе от обучения в claude.ai/settings/data-privacy-controls срок хранения сокращается до 30 дней (только мониторинг безопасности). Enterprise API (ZDR) имеет срок хранения 0 дней.
  doc_reference:
    file: guide/security/data-privacy.md
    section: TL;DR – сводка по хранению
    anchor: "#tldr-retention-summary"
- id: 14-002
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какие данные отправляются в Anthropic при использовании Claude Code?
  options:
    a: Только ваши подсказки
    b: Подсказки, файлы, которые читает Claude, результаты MCP, выходные данные Bash, сообщения об ошибках
    c: Только фрагменты кода, которые вы копируете и вставляете
    d: Только хешированные метаданные
  correct: b
  explanation: "Отправляется все, что видит Claude: ваши запросы, файлы, которые читает Claude (включая .env, если он не исключен!), результаты сервера MCP (запросы SQL, ответы API), выходные данные команд Bash и сообщения об ошибках со трассировкой стека. Используйте Permissions.deny, чтобы заблокировать конфиденциальные файлы."
  doc_reference:
    file: guide/security/data-privacy.md
    section: Что оставляет ваша машина
    anchor: "#what-leaves-your-machine"
- id: 14-003
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой риск при подключении базы данных через MCP?
  options:
    a: База данных может замедляться
    b: Результаты запроса (включая PII) отправляются на Anthropic и сохраняются в соответствии с политикой хранения.
    c: Claude может удалять таблицы
    d: MCP использует слишком много токенов
  correct: b
  explanation: 'Когда MCP выполняет запрос к базе данных, ВСЕ результаты отправляются в Anthropic: «ВЫБРАТЬ * ИЗ заказов» → 100 строк с именами клиентов, адресами электронной почты, адресами → сохраняются в соответствии с вашим уровнем хранения. НИКОГДА не подключайте производственные базы данных. Используйте dev/staging с анонимизированными данными.'
  doc_reference:
    file: guide/security/data-privacy.md
    section: "Риск 2: доступ к базе данных MCP"
    anchor: "#risk-2-mcp-database-access"
- id: 14-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как сократить срок хранения данных Claude Code с 5 лет до 30 дней?
  options:
    a: Удалить папку ~/.claude
    b: Отключите «Разрешить обучение модели» в claude.ai/settings/data-privacy-controls.
    c: Используйте режим инкогнито
    d: Добавить флаг --no-retention
  correct: b
  explanation: Посетите claude.ai/settings/data-privacy-controls и отключите «Разрешить обучение модели». Это немедленно сокращает срок хранения с 5 лет до 30 дней (только контроль безопасности). Enterprise API (ZDR) обеспечивает хранение в течение 0 дней для соответствия требованиям HIPAA/GDPR.
  doc_reference:
    file: guide/security/data-privacy.md
    section: Контрольный список для быстрого аудита
    anchor: "#quick-audit-checklist"
- id: 14-005
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какова политика хранения данных Enterprise API (ZDR)?
  options:
    a: хранение 30 дней
    b: хранение 1 год
    c: 0 дней (только обработка в режиме реального времени, данные не сохраняются)
    d: 5 лет как по умолчанию
  correct: c
  explanation: Enterprise API (нулевое хранение данных) имеет срок хранения 0 дней — данные обрабатываются в режиме реального времени, а не сохраняются. Требуется для соблюдения требований HIPAA, GDPR, PCI-DSS и государственных контрактов. Требуется корпоративный контракт с Anthropic.
  doc_reference:
    file: guide/security/data-privacy.md
    section: TL;DR – сводка по хранению
    anchor: "#tldr-retention-summary"
- id: 14-006
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой инструмент поиска сеансов рекомендуется использовать в руководстве?
  options:
    a: claude-conversation-extractor
    b: session-search.sh (bash-скрипт с нулевой зависимостью)
    c: запустил CLI (npm)
    d: Встроенная команда /search.
  correct: b
  explanation: "session-search.sh — рекомендуемый инструмент: отсутствие зависимостей (только bash), быстрый (список ~10 мс, поиск ~400 мс), отображает готовые к использованию команды «claude --resume». Установите с псевдонимом «cs» для быстрого доступа. Альтернативные инструменты Python существуют, но они медленнее."
  doc_reference:
    file: guide/ops/observability.md
    section: "Рекомендуется: session-search.sh"
    anchor: "#recommended-session-searchsh"
- id: 14-007
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какое событие перехвата используется для регистрации сеанса?
  options:
    a: PreToolUse
    b: PostToolUse
    c: Начало сеанса
    d: Уведомление
  correct: b
  explanation: Для ведения журнала сеанса используется перехватчик PostToolUse — он запускается после завершения работы каждого инструмента, фиксируя имя инструмента, путь к файлу, проект и оценки токенов. Настройте в settings.json скрипт session-logger.sh. Журналы хранятся в виде файлов JSONL в ~/.claude/logs/..
  doc_reference:
    file: guide/ops/observability.md
    section: Зарегистрируйтесь в настройках
    anchor: "#2-register-in-settings"
- id: 14-008
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой метод оценки токенов используется регистратором сеансов?
  options:
    a: API предоставил точные подсчеты
    b: ~4 символа на токен (эвристика, немного завышена)
    c: 1 слово = 1 токен
    d: Только на основе размера файла
  correct: b
  explanation: Регистратор оценивает токены, используя эвристику ~4 символа на каждый токен. Это приблизительное значение и имеет тенденцию к незначительному завышению. Регистратор руководства работает на основе названий инструментов, путей к файлам и длины текста, а не данных об использовании API, поэтому его оценки имеют отклонение примерно на 15–25 % от фактического выставления счетов. Для измеренных значений используйте /usage, строку состояния или экспорт OpenTelemetry.
  doc_reference:
    file: guide/ops/observability.md
    section: Метод оценки токена
    anchor: "#token-estimation-method"
- id: 14-009
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Что НЕ МОЖЕТ обеспечить самостоятельный регистратор сеансов на основе перехватчиков?
  options:
    a: Отслеживание количества использования инструментов
    b: Определить шаблоны доступа к файлам
    c: Укажите точное количество токенов и фактическую стоимость API.
    d: Запись временных меток операций
  correct: c
  explanation: "Регистратор на основе перехватчиков НЕ МОЖЕТ предоставить точное количество токенов или фактическую стоимость API сам по себе, поскольку регистратор руководства оценивает токены на основе длины текста вместо считывания данных об использовании API. Claude Code сообщает об измеренном использовании по другим каналам: /usage показывает стоимость сеанса и использование токена, строка состояния может отображать использование контекстного окна, а OpenTelemetry экспортирует потоки для каждого токена пользователя и показатели стоимости. Регистратор МОЖЕТ отслеживать количество использований инструментов, шаблоны доступа к файлам, относительные сравнения и время выполнения операций."
  doc_reference:
    file: guide/ops/observability.md
    section: Чего этот мониторинг НЕ МОЖЕТ сделать
    anchor: "#what-this-monitoring-cannot-do"
- id: 14-010
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Где локально хранятся журналы сеансов Claude Code?
  options:
    a: ~/.config/claude/
    b: ~/.claude/projects/<project>/
    c: /var/log/claude/
    d: Только в облаке
  correct: b
  explanation: Сеансы хранятся локально в ~/.claude/projects/<project>/ в виде файлов JSONL. Это позволяет возобновить сеанс с помощью «claude --resume <id>» или «claude -c» для самого последнего сеанса. Пользовательские журналы из session-logger.sh хранятся в ~/.claude/logs/ (настраиваются через CLAUDE_LOG_DIR).
  doc_reference:
    file: guide/ops/observability.md
    section: Собственные команды
    anchor: "#native-commands"
- id: 14-011
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Когда следует использовать «Соавтор» или «Соавтор» в коммитах git?
  options:
    a: Всегда используйте параметр «Соавтор» при любом участии ИИ.
    b: Соавторство, когда ИИ генерирует важный код. Содействие, когда ИИ только советует или проверяет.
    c: Никогда не приписывайте AI в коммитах
    d: Используйте оба при каждом коммите
  correct: b
  explanation: |-
    Отслеживаемость ИИ в коммитах git соответствует различным стандартам, основанным на **ownership и подотчетности**:

    | Аспект | Соавтор | При содействии |
    |--------|---------------|-------------|
    | **Импликация** | ИИ как соавтор | Автор-человек, которому помогает ИИ |
    | **Кредит** | Общее авторство | Основной автор-человек |
    | **Ответственность** | Неоднозначный | Человек подотчетен |

    **Когда использовать:**
    - **Co-Authored-By**: Claude по умолчанию. Когда ИИ генерирует значительный код (реализация, рефакторинг). Модель совместного авторства.
    - **При содействии**: стандарт LLVM (январь 2026 г.). Когда ты основной автор и искусственный интеллект помог. Четкая ответственность и подотчетность человека.

    Это различие важно для участия в OSS, контекста соответствия и понимания кода authorship/accountability..
  doc_reference:
    file: guide/ops/ai-traceability.md
    section: 3.2 Трейлер с поддержкой (стандарт LLVM)
    anchor: "#32-assisted-by-trailer-llvm-standard"
- id: 14-012
  difficulty: power
  profiles:
  - senior
  - power
  question: Что позволяют атрибуты OpenTelemetry workflow.run_id и workflow.name, добавленные в версии 2.1.202, оперативной группе?
  options:
    a: Автоматическое объединение данных телеметрии из двух отдельных рабочих процессов в одну трассировку.
    b: Автоматически завершать рабочий процесс, превышающий бюджет токенов
    c: Восстановите активность конкретного запуска многоагентного рабочего процесса на основе данных телеметрии, поскольку каждый диапазон, создаваемый агентами, созданными рабочим процессом, теперь содержит идентификатор и имя запуска.
    d: Переименуйте запущенный рабочий процесс прямо с панели управления сборщика OTel.
  correct: c
  explanation: В версии 2.1.202 добавлены workflow.run_id и workflow.name в качестве атрибутов OpenTelemetry для телеметрии, отправляемой агентами, созданными рабочим процессом. Каждый диапазон, созданный во время выполнения данного рабочего процесса, теперь имеет общий идентификатор и имя, поэтому оператор может фильтровать или группировать телеметрию в своей серверной части наблюдения и точно реконструировать то, что сделал этот один запуск рабочего процесса. Он не добавляет соблюдения бюджета, возможности переименования или автоматического объединения трассировок.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.202
- id: 14-013
  difficulty: senior
  profiles:
  - senior
  - power
  - pm
  question: Событие OTel v2.1.193 claude_code.assistant_response регистрирует текст ответа модели. Каковы последствия для конфиденциальности для развертывания, которое уже экспортировало содержимое подсказок перед обновлением?
  options:
    a: Ничего не меняется; событие является добровольным и отключено по умолчанию при каждом развертывании.
    b: Развертывание также начнет получать содержимое ответов при обновлении, если только оно не установит OTEL_LOG_ASSISTANT_RESPONSES=0, чтобы вести журнал только подсказок.
    c: Развертывание должно перейти на новую схему OTel, прежде чем будут приняты какие-либо данные телеметрии.
    d: Содержимое ответа хешируется автоматически и не может быть прочитано в виде открытого текста.
  correct: b
  explanation: "При развертывании, уже регистрирующем содержимое приглашения через OpenTelemetry, не нужно выбирать что-либо новое, чтобы также начать получать текст ответа помощника после обновления до версии 2.1.193, новое событие для этого сценария включается по умолчанию. Команда, которая хочет продолжать экспортировать только подсказки без текста ответа, должна установить OTEL_LOG_ASSISTANT_RESPONSES=0. Стоит сообщить команде, заботящейся о соблюдении нормативных требований: обычное обновление может незаметно расширить список регистрируемых данных."
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.193
- id: 14-014
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Что из этого является одним из рычагов снижения затрат на агентский ИИ, определенных в рамках концепции единичной экономики руководства?
  options:
    a: Маршрутизация подсказок по сложности к более дешевой модели, когда задача не требует рассуждений верхнего уровня.
    b: Согласование фиксированной ежемесячной лицензии на каждое рабочее место вместо оплаты за токен
    c: Отключение кэширования подсказок, чтобы каждый раз обновлять контекст.
    d: Выполнение каждой задачи с помощью наиболее эффективной модели, чтобы избежать затрат на повторные попытки.
  correct: a
  explanation: "В руководстве названы четыре инженерных рычага, которые снижают стоимость каждой задачи: маршрутизация по сложности, изоляция тяжелой работы в субагентах, ограничение итераций явными критериями выхода и повторное использование кэшированного контекста. Маршрутизация по сложности означает отправку задач поиска, переименования и форматирования на более дешевую модель и резервирование дорогой модели для действительно неоднозначной работы. В одном производственном аккаунте, упомянутом в руководстве, затраты таким образом сократились примерно вдвое. Фиксированная цена за рабочее место явно является моделью SaaS, с которой в руководстве сравниваются агентские затраты, а не рычагом внутри нее, и отключение кэширования приведет к увеличению затрат, поскольку цены на чтение кэша намного ниже свежих входных данных."
  doc_reference:
    file: guide/ops/ai-unit-economics.md
    section: 3. Реальные рычаги снижения затрат
    anchor: "#3-the-real-cost-reduction-levers"
- id: 14-015
  difficulty: intermediate
  profiles:
  - senior
  - power
  - pm
  question: Что значит поставить API шлюз, такой как LiteLLM или Portkey, перед Anthropic's API добавить, по сравнению с предоставлением каждому разработчику прямого Anthropic API ключ?
  options:
    a: Более быстрый вывод модели, поскольку шлюз постоянно кэширует каждый ответ.
    b: Виртуальные ключи с бюджетами для каждой команды и списками разрешенных моделей, а также централизованное ведение журнала использования, все это применяется до того, как запрос достигнет Anthropic.
    c: Автоматическая проверка кода каждого запроса на включение, созданного ИИ.
    d: Замена Permissions.deny, поскольку шлюз также может блокировать чтение локальных файлов.
  correct: b
  explanation: Без шлюза любой разработчик, обладающий реальным ключом Anthropic, может вызвать любую модель, и разбивка затрат для каждой команды не происходит до тех пор, пока не будет получен счет. Шлюз, такой как LiteLLM или Portkey, выдает виртуальные ключи, ограниченные командой, обеспечивает соблюдение ежемесячного ограничения бюджета, которое возвращает ошибку при превышении, ограничивает модели, которые может вызывать ключ, и регистрирует каждый запрос с метаданными команды и токена для информационных панелей. Он не проверяет качество кода и не имеет представления о том, что происходит на компьютере разработчика, поэтому Permissions.deny и локальная изолированная программная среда по-прежнему необходимы отдельно.
  doc_reference:
    file: guide/ops/api-gateway.md
    section: 1. Зачем нужен уровень шлюза
    anchor: "#1-why-a-gateway-layer"
- id: 14-016
  difficulty: senior
  profiles:
  - senior
  - power
  question: В шаблоне журнала аудита PR, описанном на странице отслеживания руководства, что делает перехватчик сеанса PreToolUse и как эти данные достигают запроса на включение?
  options:
    a: Он блокирует любые вызовы инструментов, которые не были предварительно одобрены менеджером, а отклоненные вызовы отправляются по электронной почте в службу безопасности.
    b: Он записывает структурированный журнал вызовов инструментов в формате JSONL в файл ежедневной активности, который рабочий процесс GitHub Actions собирает и загружает в качестве артефакта при открытии или обновлении PR.
    c: Он перезаписывает сообщение фиксации, чтобы включить полную расшифровку сеанса.
    d: Он автоматически загружает всю историю разговоров на общедоступную панель мониторинга соответствия.
  correct: b
  explanation: Перехватчик сеансового журнала срабатывает в PreToolUse и добавляет одну строку JSON для каждого вызова инструмента, включая имя инструмента, метку времени, идентификатор сеанса и путь к хранилищу, к ежедневному файлу под .claude/logs/.. Рабочий процесс GitHub Actions, запускаемый при событиях запроса на включение, затем собирает этот журнал вместе со списком измененных файлов и метаданными сеанса и загружает его как артефакт сборки. Это дает регулируемой или заботящейся о соблюдении требований команде структурированный ответ на то, что Claude делал во время изменения, не полагаясь ни на чьи воспоминания о сеансе. Он не блокирует вызовы инструментов, не отправляет никому электронные письма и не публикует ничего на общедоступной информационной панели.
  doc_reference:
    file: guide/ops/ai-traceability.md
    section: PR-аудит
    anchor: "#pr-audit-trail"
- id: 14-017
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что делает CLAUDE_CODE_SUBPROCESS_ENV_SCRUB и зачем он нужен?
  options:
    a: Он очищает вывод терминала после каждой команды
    b: Это предотвращает утечку конфиденциальных переменных среды в контексты подпроцессов (например, серверы MCP, перехватчики).
    c: Он отключает все расширения переменных среды в командах bash.
    d: Он шифрует переменные среды перед их передачей в Claude.
  correct: b
  explanation: CLAUDE_CODE_SUBPROCESS_ENV_SCRUB — это элемент управления безопасностью, который предотвращает утечку конфиденциальных переменных среды (ключи API, токены, секреты) в контексты подпроцессов. Без него переменные среды, присутствующие в родительской оболочке, наследуются серверными процессами, перехватчиками и порожденными подпроцессами MCP. Задайте для него список имен переменных, разделенных запятыми, или используйте шаблон glob. Критически важно для команд, где Claude работает в средах с производственными учетными данными.
  doc_reference:
    file: guide/core/settings-reference.md
    section: Контроль поведения
    anchor: "#behavior-control"
- id: 14-018
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что контролирует sandbox.failIfUnavailable в настройках Claude Code?
  options:
    a: Вылетает ли Claude Code при недоступности сети
    b: Отказывается ли Claude Code запускаться, если его слой изоляции песочницы не может быть активирован
    c: Будут ли серверы MCP корректно выходить из строя по истечении времени ожидания в их песочнице
    d: Пропускаются ли перехваты, когда песочница занята
  correct: b
  explanation: "sandbox.failIfUnavailable (логическое значение, по умолчанию: false) контролирует, будет ли Claude Code выполняться с жестким сбоем, когда изоляцию песочницы невозможно активировать. Установите значение true в средах production/CI, чтобы обеспечить выполнение каждого сеанса внутри изолированной программной среды без автоматического перехода в режим без изолированной программной среды. Установите значение false в средах разработки, где песочница может быть недоступна (например, некоторые ядра Linux или Docker-in-Docker). Часть конфигурации глубокоэшелонированной защиты."
  doc_reference:
    file: guide/core/settings-reference.md
    section: sandbox.failIfUnavailable
    anchor: "#sandboxfailifunavailable"
- id: 14-019
  difficulty: power
  profiles:
  - power
  question: Что такое заголовок X-Claude-Code-Session-Id и как его следует обрабатывать в nginx?
  options:
    a: Заголовок, который Claude Code вводит для аутентификации запросов API, следует удалить перед пересылкой.
    b: Заголовок корреляции сеанса, отправляемый при каждом запросе Claude Code API, полезный для отслеживания; nginx должен передать его вышестоящим службам
    c: Заголовок ограничения скорости, который nginx использует для регулирования трафика Claude Code.
    d: Заголовок, идентифицирующий версию модели Claude, установленный серверами Anthropic.
  correct: b
  explanation: "X-Claude-Code-Session-Id — это заголовок корреляции сеанса, который Claude Code прикрепляет к каждому исходящему запросу API. Он обеспечивает распределенную трассировку: вы можете сопоставлять вызовы инструментов сеанса, запросы API и журналы между микросервисами. В nginx передайте его восходящему потоку: `proxy_pass_header X-Claude-Code-Session-Id;`. В стеках наблюдаемости используйте его в качестве корня трассировки для группировки всех действий из одного сеанса Claude."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Отслеживание сеансов на уровне прокси с помощью X-Claude-Code-Session-Id (v2.1.86+)
    anchor: "#proxy-level-session-tracking-with-x-claude-code-session-id-v2186"

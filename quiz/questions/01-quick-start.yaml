category: Быстрый старт
category_id: 1
source_file: guide/ultimate-guide.md
questions:
- id: 01-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Какой метод установки Anthropic рекомендует для Claude Code на macOS, Linux и WSL?
  options:
    a: brew install claude-code
    b: npm install -g @anthropic-ai/claude-code
    c: pip install claude-code
    d: curl -fsSL https://claude.ai/install.sh | bash
  correct: d
  explanation: "Anthropic рекомендует **собственный установщик**: `curl -fsSL https://claude.ai/install.sh | bash` (PowerShell: `irm https://claude.ai/install.ps1 | iex`). Он автоматически обновляется в фоновом режиме. Homebrew (`brew install --cask claude-code`, обратите внимание на бочку), WinGet, Linux пакеты и npm (`npm install -g @anthropic-ai/claude-code`, Node.js 22+) остаются доступными, но не обновляются автоматически. Пип-пакета нет."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.1 Установка
    anchor: "#11-installation"
- id: 01-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: После того как Claude предложит изменение кода, какие варианты у вас есть при просмотре различий?
  options:
    a: Только принять (y) или отклонить (n)
    b: Принять (y), отклонить (n) или изменить (e)
    c: Принять (y), пропустить (s) или отложить (d)
    d: Принять (c), отклонить (r) или просмотреть (v)
  correct: b
  explanation: "Когда Claude предлагает изменение, у вас есть три варианта: нажмите «y», чтобы принять изменение, «n», чтобы отклонить и запросить альтернативы, или «e», чтобы отредактировать изменение вручную. Это дает вам полный контроль над тем, что применяется к вашей кодовой базе. Всегда проверяйте различия, прежде чем принять их — это ваша подстраховка."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.2 Первый рабочий процесс
    anchor: "#12-first-workflow"
- id: 01-003
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Какая команда показывает все доступные команды Claude Code?
  options:
    a: /commands
    b: /list
    c: /help
    d: /menu
  correct: c
  explanation: Команда `/help` отображает все доступные команды Claude Code. Это команда, к которой можно обратиться, если вы заблудились или хотите узнать о доступных функциях. Это одна из 7 основных команд, которые охватывают 90% ежедневного использования.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.3 Основные команды
    anchor: "#13-essential-commands"
- id: 01-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что делает префикс `!` в Claude Code?
  options:
    a: Отмечает команду как срочную
    b: Запускает команду оболочки напрямую, не спрашивая Claude.
    c: Экранирует специальные символы
    d: Удаляет предыдущую команду
  correct: b
  explanation: Префикс `!` немедленно выполняет команды оболочки, не запрашивая об этом Claude. Например, `!git status` запускает команду напрямую. Используйте это для быстрой проверки статуса, просмотра команд и уже известных команд. Это быстрее, чем спрашивать Claude, если вы точно знаете, какая команда вам нужна.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.3 Основные команды
    anchor: "#shell-commands-with"
- id: 01-005
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что делает символ `@` при использовании в командной строке?
  options:
    a: Упоминает другого пользователя
    b: Ссылается на конкретный файл для целевых операций.
    c: Отмечает сообщение как важное
    d: Активирует агента
  correct: b
  explanation: Символ `@` ссылается на определенные файлы в подсказках для целевых операций. Например, `Review @src/auth/login.tsx for security issues` сигнализирует Claude о необходимости чтения этого файла. Это обеспечивает точность (нацеливание на точные файлы), скорость (пропуск обнаружения файлов) и ясность (делает ваши намерения явными). Claude читает файл по требованию с помощью инструментов.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.3 Основные команды
    anchor: "#file-references-with"
- id: 01-006
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков рекомендуемый подход при переходе с GitHub Copilot на Claude Code?
  options:
    a: Немедленно полностью прекратите использование Copilot.
    b: "Используйте гибридный подход: Copilot для автозаполнения, Claude Code для сложных задач."
    c: Используйте Claude Code только для простых задач.
    d: Экспортируйте все настройки Copilot в Claude Code.
  correct: b
  explanation: "Руководство рекомендует гибридный подход: используйте Copilot для быстрого автозаполнения и шаблонного кода, а Claude Code — для реализации функций, отладки, проверки кода и понимания незнакомых кодовых баз. При этом используются сильные стороны обоих инструментов: Copilot превосходно справляется со встроенными предложениями, а Claude Code обрабатывает операции с несколькими файлами и сложные рассуждения."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.6 Переход с других инструментов ИИ-кодирования
    anchor: "#migration-guide-github-copilot-claude-code"
- id: 01-007
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что разрешено делать Claude в режиме плана?
  options:
    a: Редактируйте файлы, запускайте команды и делайте коммиты
    b: Только читать и анализировать – никакие изменения не допускаются.
    c: Запускать команды, но не редактировать файлы
    d: Создавайте новые файлы, но не редактируйте существующие.
  correct: b
  explanation: Режим планирования — это режим Claude Code «смотри, но не трогай». Он позволяет читать файлы, искать в базе кода, анализировать архитектуру и предлагать подходы. Он предотвращает редактирование файлов, выполнение команд изменения состояния, создание новых файлов и выполнение коммитов. Идеально подходит для безопасного исследования перед внесением изменений.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.4 Режимы разрешений
    anchor: "#plan-mode"
- id: 01-008
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой флаг позволяет вам продолжить последний разговор Claude Code?
  options:
    a: --last
    b: --продолжить или -c
    c: --resume-last
    d: --restore
  correct: b
  explanation: Используйте `claude --continue` или `claude -c`, чтобы автоматически возобновить последний разговор. Это сохраняет полный контекст и историю разговоров во время сеансов терминала. Для возобновления определенного сеанса по идентификатору используйте `claude --resume <id>` или `claude -r <id>`. Это особенно полезно для многодневных функций или при прерывании.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.3 Основные команды
    anchor: "#session-continuation-and-resume"
- id: 01-009
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что вам следует ВСЕГДА делать, прежде чем принять изменение кода с Claude?
  options:
    a: Запустите набор тестов
    b: Создайте резервную копию файла
    c: Внимательно читайте разницу
    d: Спросите уровень доверия Claude
  correct: c
  explanation: 'Всегда читайте разницу, прежде чем принимать изменения — это ваша подстраховка. В руководстве это подчеркивается как крайне важное: «Всегда проверяйте различия, прежде чем принимать изменения». Хотя проведение тестов является хорошей практикой, просмотр различий является немедленным обязательным шагом перед принятием проекта. Нужно понимать, какие изменения предлагаются.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.2 Первый рабочий процесс
    anchor: "#step-3-review-the-diff"
- id: 01-010
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое сочетание клавиш прерывает операцию, выполняемую Claude, и завершает работу Claude Code при двойном нажатии, когда ничего не выполняется?
  options:
    a: Ctrl+Z
    b: Ctrl+С
    c: Esc
    d: Ctrl+Q
  correct: b
  explanation: Ctrl+C прерывает выполняемую операцию, что полезно для остановки длительного анализа или когда Claude использует нежелательный подход. Если ничего не работает, первое нажатие очищает ввод подсказки, а второе нажатие завершает Claude Code. Esc также прерывает Claude в середине хода, но не завершает работу, а Ctrl+R выполняет поиск в истории команд. Знание этих сочетаний клавиш помогает сохранять контроль во время рабочего процесса.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.3 Основные команды
    anchor: "#quick-actions-shortcuts"
- id: 01-011
  difficulty: senior
  profiles:
  - senior
  - power
  question: Когда следует использовать режим автоматического принятия в Claude Code?
  options:
    a: Для всех операций для экономии времени
    b: Только для четко определенных обратимых операций, которым вы доверяете.
    c: При работе над производственным кодом
    d: Для сложных задач рефакторинга
  correct: b
  explanation: "Режим автоматического принятия следует использовать только для четко определенных обратимых операций. Руководство предупреждает: «Используйте автоматическое принятие только для четко определенных, обратимых операций». Это опасно для сложных или рискованных изменений. Режим по умолчанию (запрос разрешения) наиболее безопасен, особенно для учебной и производственной работы."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.4 Режимы разрешений
    anchor: "#auto-accept-mode-acceptedits"
- id: 01-012
  difficulty: power
  profiles:
  - power
  question: Каково рекомендуемое эмпирическое правило выбора между Claude Code и инструментами автозаполнения в зависимости от размера кода?
  options:
    a: "<10 строк: автозаполнение, >10 строк: Claude Code"
    b: "<5 строк: автозаполнение, 5–50 строк в одном файле: либо > 50 строк, либо в нескольких файлах: Claude Code"
    c: Всегда используйте Claude Code независимо от размера.
    d: "<20 строк: автозаполнение, >20 строк: Claude Code"
  correct: b
  explanation: "В руководстве даны четкие рекомендации: менее 5 строк кода — используйте Copilot/autocomplete; 5-50 строк в одном файле — работает любой инструмент; более 50 строк или многофайловые изменения - используйте Claude Code. Это поможет вам выбрать правильный инструмент в зависимости от уровня сложности задачи."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.6 Переход с других инструментов ИИ-кодирования
    anchor: "#common-migration-issues"
- id: 01-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какие форматы изображений поддерживает Claude Code для визуального анализа?
  options:
    a: Только PNG
    b: PNG, JPG, JPEG, WebP, GIF (статический)
    c: Все форматы изображений, включая RAW.
    d: Только SVG и PNG
  correct: b
  explanation: Claude Code поддерживает форматы PNG, JPG, JPEG, WebP и статический GIF. Вы можете вставлять изображения прямо в терминал (Cmd+V/Ctrl+V), перетаскивать их или ссылаться на них по пути. Это полезно для реализации пользовательского интерфейса из макетов, устранения визуальных проблем, анализа диаграмм и аудита доступности. Обратите внимание, что изображения потребляют значительное количество токенов контекста (эквивалент 1000–2000 слов).
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.3 Основные команды
    anchor: "#working-with-images-and-screenshots"
- id: 01-014
  difficulty: senior
  profiles:
  - senior
  - power
  question: При возобновлении сеанса Claude Code какой контекст сохраняется?
  options:
    a: Только история разговоров
    b: Полная история разговоров, файлы read/edited, настройки CLAUDE.md
    c: Только последние 10 сообщений
    d: Только файлы, которые были изменены
  correct: b
  explanation: |-
    Когда вы возобновляете сеанс (через `claude -c` или `claude -r <id>`), Claude сохраняет:
    - ✅ Полная история разговоров
    - ✅ Файлы ранее read/edited
    - ✅ CLAUDE.md и настройки проекта
    - ✅ Незафиксированный код меняет осведомленность
    - ✅ Состояние сервера MCP (если используется Серена)

    **Не сохранилось**:
    - ❌ Разрешения на уровне сеанса (необходимо повторное одобрение)
    - ❌ Стандартное состояние сервера MCP (исключение Серены)
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.2 Продолжение и возобновление сеанса
    line: 753-761
- id: 01-015
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Какую команду следует использовать для проверки установки Claude Code?
  options:
    a: claude check
    b: claude --verify
    c: claude --version
    d: claude test
  correct: c
  explanation: Используйте `claude --version`, чтобы проверить установку и отобразить текущую версию. Это также полезно перед сообщением об ошибках. После установки вы также можете использовать `claude doctor` для проверки работоспособности автоматического обновления и `claude update` для проверки наличия доступных обновлений.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.1 Установка
    anchor: "#verify-installation"
- id: 01-016
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Каков оптимальный диапазон разрешения изображения для визуального анализа Claude Code?
  options:
    a: 50–200 пикселей (минимально возможное)
    b: 200–1568 пикселей (оптимальное значение для баланса quality/token)
    c: 2000–4000 пикселей (максимальная детализация)
    d: 8000 пикселей+ (самое высокое разрешение)
  correct: b
  explanation: Оптимальный диапазон — 200-1568 пикселей. Ниже 200 пикселей не хватает детализации, 200–1000 пикселей — оптимальное место для каркасов, 1 000–1 568 пикселей обеспечивает оптимальный баланс quality/token, изображения выше 1 568 пикселей автоматически уменьшаются (трата времени на загрузку), а изображения размером более 8 000 пикселей отклоняются API.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Оптимизация изображения для Claude Vision
    anchor: "#image-optimization-for-claude-vision"
- id: 01-017
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как рассчитываются токены изображений в Claude Code?
  options:
    a: file_size_bytes / 1000
    b: (ширина × высота) / 750
    c: пикселей / 1000
    d: Исправлено 500 токенов за изображение.
  correct: b
  explanation: "Формула расчета токена: (ширина × высота) / 750 ≈ израсходованных токенов. Примеры: 200×200 = ~54 жетона, 500×500 = ~334 жетона, 1000×1000 = ~1334 жетона. Это помогает оценить влияние контекста перед вставкой изображений. Используйте /context после вставки, чтобы отслеживать фактическое использование контекста."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Оптимизация изображения для Claude Vision
    anchor: "#image-optimization-for-claude-vision"
- id: 01-018
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой формат изображения рекомендуется для каркасов и диаграмм в Claude Code?
  options:
    a: JPEG (лучшее сжатие)
    b: PNG (резкие линии и текст)
    c: GIF (универсальная поддержка)
    d: БМП (без потерь)
  correct: b
  explanation: PNG рекомендуется для каркасов, диаграмм и текста, поскольку он сохраняет четкие линии. WebP хорош для общих скриншотов со сжатием. JPEG предназначен только для фотографий. Артефакты сжатия вредят обнаружению линий. Следует избегать GIF (только статика, низкое качество). Всегда обрезайте изображение до нужной области и изменяйте размер до 1000–1200 пикселей, если оно больше.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Оптимизация изображения для Claude Vision
    anchor: "#image-optimization-for-claude-vision"
- id: 01-019
  difficulty: junior
  profiles:
  - junior
  - pm
  question: Как называется режим разрешений по умолчанию в Claude Code начиная с версии 2.1.200 и что это означает для тех, кто использует его впервые?
  options:
    a: Режим планирования, то есть Claude может только описывать план и никогда не трогать файлы.
    b: Режим обхода, что означает, что все проверки разрешений отключены с самого начала.
    c: Ручной режим, то есть Claude запрашивает одобрение перед выполнением каждого действия, пока вы не предоставите более широкие разрешения.
    d: Автоматический режим, означающий, что Claude выполняет каждое действие без запроса.
  correct: c
  explanation: 'Начиная с версии 2.1.200, режим, ранее помеченный как «default», теперь называется «Manual» в CLI, --help, VS Code и JetBrains (--permission-mode manual и «defaultMode: «manual» принимаются наряду со старым значением). Для начинающего пользователя это означает, что Claude останавливается и перед каждым редактированием файла или командой запрашивает самую безопасную отправную точку. Автоматический режим и разрешения на обход пропускают эти запросы, а режим планирования — это отдельное состояние планирования, доступное только для чтения, а не состояние по умолчанию.'
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.200
- id: 01-020
  difficulty: junior
  profiles:
  - junior
  - pm
  question: Что происходит по умолчанию в Claude Code версии 2.1.198, когда Claude делегирует задачу субагенту?
  options:
    a: Основная сессия зависает до тех пор, пока субагент не завершит свою работу.
    b: Субагент работает молча, и никому не сообщается, когда он завершится.
    c: Claude продолжает работать над другими задачами, пока работает субагент, и вы получите уведомление, когда он завершится.
    d: Вам необходимо вручную проверять прогресс каждые несколько минут, поскольку уведомлений нет.
  correct: c
  explanation: Начиная с версии 2.1.198, субагенты по умолчанию работают в фоновом режиме, поэтому Claude продолжает работать над другими частями вашей задачи, пока работает субагент, и вы получаете уведомление о его завершении, а не ждете бездействия. Это заменило предыдущее поведение, когда вызов субагента блокировал родительский сеанс до его возвращения. Ручной опрос не требуется, уведомление происходит автоматически.

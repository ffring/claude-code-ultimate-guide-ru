  question: Как Claude Code обеспечивает управление моделью на уровне организации в соответствии с выпусками v2.1.196 и v2.1.187?
  options:
    a: Только через отдельный CLI только для администратора, который обычные разработчики никогда не видят.
    b: Администраторы устанавливают модели организации или роли по умолчанию, показанные в /model, а ограничения, настроенные организацией, применяются к средствам выбора моделей, --model, /model и переменной среды ANTHROPIC_MODEL.
    c: Через файл «.claude/model-policy.json», который должен зафиксировать каждый репозиторий.
    d: Ограничения модели применяются только к прямым вызовам API, а не к расширениям CLI или IDE.
  correct: b
  explanation: "В версии 2.1.196 добавлены модели организации по умолчанию, установленные администраторами в консоли организации и отображаемые как «Организация по умолчанию» или «Роль по умолчанию» в /model, если участник не выбрал ни одну. В версии 2.1.187 добавлено принудительное применение ограничений модели, настроенных организацией, для каждой поверхности выбора: средство выбора модели, --model, /model и переменная среды ANTHROPIC_MODEL. В руководстве нет отдельного файла CLI, предназначенного только для администратора, и файла «.claude/model-policy.json»."

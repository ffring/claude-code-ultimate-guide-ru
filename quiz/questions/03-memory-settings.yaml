  question: Согласно разделу руководства по управлению предприятием, какие три механизма объединяет большинство организаций, чтобы гарантировать, что разработчики действительно используют конфигурацию, одобренную организацией?
  options:
    a: Общий settings.json, зафиксированный в репозитории команды, общий CLAUDE.md для правил поведения и Anthropic Team/Enterprise элементы управления консоли администратора.
    b: Одна переменная среды, экспортируемая на каждом компьютере разработчика при входе в систему.
    c: Ночной скрипт, который перезаписывает локальный settings.json каждого разработчика с центрального сервера.
    d: Расширение браузера, которое перехватывает и перезаписывает запросы Claude Code API.
  correct: a
  explanation: "В разделе 2.3 названы три механизма: общий settings.json, зафиксированный в корне репозитория, автоматически подбираемый любым, кто клонирует репозиторий, с изменением, видимым в истории git; общий CLAUDE.md для правил поведения и классификации данных; и консоль администратора Anthropic Team/Enterprise для политик использования всей организации и управления ключами API. В руководстве четко указано, что settings.json на уровне репозитория обеспечивает наиболее детальный контроль и работает на всех планах, а консоль администратора является дополнительным уровнем для корпоративных клиентов, а не заменой. Ни один из других вариантов не отображается в руководстве."

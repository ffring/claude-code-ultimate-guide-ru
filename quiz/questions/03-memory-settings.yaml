    d: 50 строк, 5 КБ, 20 файлов
  correct: b
  explanation: "Автоматическая память MEMORY.md имеет три жестких ограничения: (1) ограничение в 200 строк: строки после 200 в MEMORY.md обрезаются и никогда не загружаются в контекст; (2) Максимум 25 КБ на файл памяти: файлы большего размера разделяются или усекаются; (3) Ограничение каталога на 200 файлов: каталог памяти ограничен 200 отдельными файлами памяти. Эти ограничения существуют для того, чтобы система памяти не потребляла слишком много контекстных окон. Управляйте активно: архивируйте старые воспоминания, объединяйте дубликаты, сохраняйте краткий указатель."
  doc_reference:

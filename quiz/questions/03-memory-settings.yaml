- id: 03-034
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков правильный подход, когда индекс MEMORY.md приближается к 200 строкам?
  options:
    a: Удалите самые старые записи, чтобы не превышать лимит.
    b: Архивируйте устаревшие записи для разделения файлов, объединения дубликатов и сохранения индекса в виде коротких строк указателей длиной менее 150 символов каждая.
    c: Создайте второй файл MEMORY.md как MEMORY2.md, чтобы расширить емкость.
    d: Увеличьте лимит, добавив настройку в settings.json.
  correct: b
  explanation: "Когда MEMORY.md приближается к 200 строкам: заархивируйте устаревшие воспоминания (переместите устаревший контент в архивный файл, но удалите указатель индекса), объедините дубликаты (две записи по одной и той же теме → одна обновленная запись) и убедитесь, что каждая строка индекса коротка (менее ~ 150 символов): индекс представляет собой просто указатели, а не содержимое. MEMORY.md — индексный файл; фактическое содержимое находится в отдельных файлах памяти. Никогда не создавайте второй MEMORY.md, поддержка MEMORY2.md отсутствует."

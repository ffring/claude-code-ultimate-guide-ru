category: Память и настройки
category_id: 3
source_file: guide/ultimate-guide.md
questions:
- id: 03-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Как Claude Code обрабатывает соответствующие файлы инструкций пользователя (~/.claude/CLAUDE.md), проекта (CLAUDE.md) и личного (CLAUDE.local.md) в одном сеансе?
  options:
    a: Загружается только самый конкретный файл, остальные игнорируются.
    b: Соответствующие файлы объединены, поэтому следует избегать противоречивых инструкций вместо того, чтобы полагаться на порядок замены.
    c: Проект локального переопределения, который переопределяет глобальный, точно так же, как приоритет settings.json.
    d: Global всегда имеет приоритет над проектными и личными файлами.
  correct: b
  explanation: Инструкции объединяются, а не следуют приоритету настроек. ~/.claude/CLAUDE.md применяется ко всем вашим проектам, CLAUDE.md или .claude/CLAUDE.md содержит общие инструкции проекта, которые вы фиксируете, а CLAUDE.local.md содержит персональные инструкции проекта, которые остаются игнорируемыми git. Поскольку все применимые файлы достигают Claude вместе, противоречие между ними является ошибкой в ​​ваших инструкциях, а не чем-то, что разрешается за вас правилом приоритета.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.4 Правила приоритета
    anchor: "#claudemd-precedence"
- id: 03-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Где следует хранить соглашения группы, чтобы ими можно было поделиться с помощью контроля версий?
  options:
    a: ~/.claude/CLAUDE.md
    b: /project/CLAUDE.local.md
    c: /project/CLAUDE.md
    d: /project/.claude/settings.local.json
  correct: c
  explanation: Соглашения группы должны храниться в `/project/CLAUDE.md` (корень проекта; `/project/.claude/CLAUDE.md` — эквивалентное место). Этот файл передан в git и доступен команде. Персональные инструкции проекта находятся в `/project/CLAUDE.local.md` (gitignored), а персональные глобальные настройки — в `~/.claude/CLAUDE.md`. Такое разделение обеспечивает соблюдение командных стандартов, позволяя при этом персональную настройку.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.1 Файлы памяти (CLAUDE.md)
    anchor: "#level-2-project-projectclaudemd"
- id: 03-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какова цель settings.local.json?
  options:
    a: Сохранение конфигураций группового перехватчика
    b: Определите настройки для всего проекта
    c: Переопределение личных разрешений (gitignored)
    d: Настройте серверы MCP для команды
  correct: c
  explanation: settings.local.json хранит переопределения личных разрешений и игнорируется git. Он позволяет вам настроить, какие инструменты автоматически разрешаются, запрещаются или требуют запроса вашего личного рабочего процесса, не затрагивая настройки команды. Например, вы можете разрешить все команды git, в то время как команде требуется подтверждение для определенных операций.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.3 Настройки и разрешения
    anchor: "#settingslocaljson-personal-permissions"
- id: 03-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какая папка содержит пользовательские агенты, команды, ловушки и навыки?
  options:
    a: ~/.клод/
    b: /project/CLAUDE.md
    c: /project/.claude/
    d: /project/config/
  correct: c
  explanation: "Папка `.claude/` вашего проекта содержит: агенты/ (настраиваемые определения агентов), команды/ (пользовательские команды с косой чертой), перехватчики/ (сценарии, управляемые событиями), навыки/ (модули знаний), правила/ (автозагруженные соглашения) и файлы настроек. Это каталог конфигурации Claude Code вашего проекта для всех расширений."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.2 Структура папки .claude/
    anchor: "#full-structure"
- id: 03-005
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каково поведение разрешений для инструментов, перечисленных в категории «запретить»?
  options:
    a: Каждый раз запрашивать подтверждение
    b: Автоматическое одобрение без запроса
    c: Заблокировать полностью
    d: Войти, но разрешить
  correct: c
  explanation: "Инструменты из категории «запретить» полностью блокируются — Claude вообще не может их использовать. Три режима разрешения: «разрешить» (автоматическое одобрение без запроса), «запретить» (полностью заблокировать) и «спросить» (запросить подтверждение). Например, запрет «Bash(rm -rf *)» предотвращает случайные разрушительные операции."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.3 Настройки и разрешения
    anchor: "#permission-behavior"
- id: 03-006
  difficulty: power
  profiles:
  - power
  question: Что такое «шаблон единого источника истины» для систем искусственного интеллекта с несколькими инструментами?
  options:
    a: Используйте только один инструмент искусственного интеллекта для каждого проекта.
    b: Сохраняйте соглашения в docs/conventions/ и ссылайтесь на них из всех конфигураций инструментов ИИ.
    c: Скопируйте одни и те же правила в конфигурацию каждого инструмента ИИ.
    d: Пусть каждый инструмент ИИ определяет свои собственные правила
  correct: b
  explanation: Шаблон «Единый источник истины» хранит соглашения в `/docs/conventions/` (coding-standards.md, architecture.md, testing.md и т. д.) и ссылается на них из CLAUDE.md, CodeRabbit и других инструментов. Это предотвращает конфликты, когда один инструмент утверждает код, а другой помечает его. Все инструменты обеспечивают соблюдение одних и тех же стандартов из одного источника.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.1 Файлы памяти (CLAUDE.md)
    anchor: "#single-source-of-truth-pattern"
- id: 03-007
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что должно быть включено в файл CLAUDE.md уровня проекта?
  options:
    a: Только личные предпочтения
    b: Технический стек, соглашения о коде, шаблоны архитектуры и общие команды
    c: API ключи и секреты
    d: История Git
  correct: b
  explanation: "Проект CLAUDE.md должен включать в себя: технологический стек (фреймворки, версии), соглашения о коде (именование, шаблоны), архитектуру (структура папок, уровни) и общие команды (dev, test, lint). Это дает контекст проекта Claude. Никогда не включайте ключи или секреты API. Делайте это лаконично с примерами и обновляйте, когда правила меняются."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.1 Файлы памяти (CLAUDE.md)
    anchor: "#level-2-project-projectclaudemd"
- id: 03-008
  difficulty: senior
  profiles:
  - senior
  - power
  question: Чему соответствует шаблон разрешений «Bash(git *)»?
  options:
    a: Только точная команда «git»
    b: Любая команда git
    c: Команды Git, начинающиеся со звездочки
    d: Команды Git с шаблонами glob
  correct: b
  explanation: "Шаблон «Bash(git *)» соответствует любой команде git. В шаблонах разрешений используются подстановочные знаки: «Bash(git *)» соответствует любой команде git, «Bash(pnpm *)» соответствует любой команде pnpm, «mcp__serena__*» соответствует всем инструментам Serena MCP. Обе формы эквивалентны в официальной документации: суффикс :*, как в «Bash(git status:*)», — это просто альтернативный способ записи завершающего подстановочного знака, а не устаревшая форма."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.3 Настройки и разрешения
    anchor: "#permission-patterns"
- id: 03-009
  difficulty: power
  profiles:
  - power
  question: Что такое «динамическая память» (переключение профилей)?
  options:
    a: Способность Claude запоминать между сеансами
    b: Временная модификация CLAUDE.md под конкретные задачи с последующим восстановлением
    c: Автоматическое сжатие памяти
    d: Синхронизация памяти между устройствами
  correct: b
  explanation: "Динамическая память означает временное изменение CLAUDE.md для конкретных задач с последующим его восстановлением. Методы включают в себя: git stash (сохранить оригинал, изменить, восстановить), библиотеку профилей (хранить профили типа security-audit.md, debugging.md в ~/.claude/profiles/) или параллельные экземпляры (разные CLAUDE.md в разных рабочих деревьях). Переключение профилей скриптом: `claude-profile security-audit`."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.3 Настройки и разрешения
    anchor: "#dynamic-memory-profile-switching"
- id: 03-010
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что происходит с файлами в каталоге .claude/rules/?
  options:
    a: Их необходимо импортировать вручную.
    b: Они автоматически загружаются и объединяются
    c: Они переопределяют CLAUDE.md
    d: Они игнорируются, если на них не ссылаются.
  correct: b
  explanation: Файлы в `.claude/rules/` автоматически загружаются и объединяются. Вы можете создать несколько файлов, таких как code-conventions.md, git-workflow.md и architecture.md — все они загружаются автоматически без ручного импорта. Это позволяет модульную организацию соглашений проекта, которым будет следовать Claude.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.4 Правила приоритета
    anchor: "#rules-auto-loading"
- id: 03-011
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что из этого следует игнорировать?
  options:
    a: /project/CLAUDE.md
    b: .claude/agents/
    c: .claude/settings.local.json и CLAUDE.local.md
    d: .claude/hooks/
  correct: c
  explanation: "Файлы, которые следует игнорировать: CLAUDE.local.md (локальные персональные инструкции) и .claude/settings.local.json (личные разрешения). Примечание. /project/CLAUDE.md (в корне проекта) — это память проекта, и ее следует фиксировать, а НЕ игнорировать git. Другие файлы для фиксации включают: .claude/agents/, команды/, хуки/, навыки/, правила/ и settings.json. Такое разделение позволяет осуществлять персональную настройку при совместном использовании групповых конфигураций."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.2 Структура папки .claude/
    anchor: "#what-goes-where"
- id: 03-012
  difficulty: power
  profiles:
  - power
  question: Чем конфигурация «allowedTools» отличается от категорий разрешений?
  options:
    a: Ничего, они одинаковые
    b: Обеспечивает детальный контроль с помощью шаблонов для конкретных инструментов в .claude/settings.json.
    c: Работает только для инструментов MCP.
    d: Требуются права администратора
  correct: b
  explanation: "Конфигурация разрешенных инструментов в .claude/settings.json или .claude/settings.local.json обеспечивает детальный контроль с использованием определенных шаблонов. Например: «Read(*)» разрешает все операции чтения, «Bash(git status *)» разрешает команды состояния git, «Bash(pnpm *)» разрешает команды pnpm. Вы можете установить прогрессивные уровни разрешений от начального (очень строгого) до продвинутого. Никогда не используйте --dangerously-skip-permissions."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Конфигурация разрешенных инструментов / autoApproveTools
    anchor: "#allowedtools-autoapprovetools-configuration"
- id: 03-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Каков глобальный путь конфигурации на macOS/Linux?
  options:
    a: /etc/claude/
    b: ~/.клод/
    c: /usr/local/claude/
    d: ~/.config/claude/
  correct: b
  explanation: В macOS/Linux глобальный путь конфигурации — ~/.claude/.. В Windows — %USERPROFILE%\.claude\ или C:\Users\YourName\.claude\.. Этот каталог содержит ваш глобальный CLAUDE.md, настройки и может включать подкаталог Profiles/ для динамического переключения памяти.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 1.1 Установка
    anchor: "#platform-specific-paths"
- id: 03-014
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каковы три уровня прогрессивных разрешений в AllowTools?
  options:
    a: Администратор, Пользователь, Гость
    b: Начинающий (очень строгий), средний, продвинутый
    c: Читать, писать, выполнять
    d: Низкий, Средний, Высокий
  correct: b
  explanation: "Три прогрессивных уровня разрешений: начинающий (очень строгий — только чтение, Grep, Glob), средний (добавляет команды Bash git/pnpm) и расширенный (добавляет редактирование, запись, WebFetch, агент). Начните с ограничений и расширяйте их по мере обретения уверенности. Это предотвращает несчастные случаи во время обучения."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Конфигурация разрешенных инструментов / autoApproveTools
    anchor: "#allowedtools-autoapprovetools-configuration"
- id: 03-015
  difficulty: power
  profiles:
  - power
  question: Почему НИКОГДА не следует использовать --dangerously-skip-permissions?
  options:
    a: Это устарело
    b: Это может привести к деструктивным операциям, таким как rm -rf, принудительное нажатие на главную или DROP TABLE.
    c: Это стоит дороже
    d: Это медленнее
  correct: b
  explanation: "Никогда не используйте --dangerously-skip-permissions, поскольку это может привести к разрушительным операциям. Страшные истории включают в себя: `rm -rf node_modules`, за которым следует `rm -rf .` (ошибка пути), `git push --force` для непреднамеренного main, `DROP TABLE users` при плохо сгенерированной миграции и удаление файлов .env с учетными данными. Вместо этого всегда отдавайте предпочтение детальным разрешенным инструментам."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Конфигурация разрешенных инструментов / autoApproveTools
    anchor: "#allowedtools-autoapprovetools-configuration"
- id: 03-016
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что должен содержать глобальный CLAUDE.md?
  options:
    a: Соглашения о коде, специфичные для проекта
    b: Личные предпочтения, применимые ко всем проектам (стиль общения, предпочтительные инструменты, правила безопасности)
    c: Контактная информация члена команды
    d: История коммитов Git
  correct: b
  explanation: "Глобальный CLAUDE.md (~/.claude/CLAUDE.md) должен содержать личные предпочтения, применимые ко всем вашим проектам: стиль общения (будьте краток, используйте примеры кода), предпочтительные инструменты (TypeScript вместо JavaScript, pnpm вместо npm) и правила безопасности (всегда запускайте тесты, никогда не принуждайте к отправке). Настройки, специфичные для проекта, находятся в проекте CLAUDE.md."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.1 Файлы памяти (CLAUDE.md)
    anchor: "#level-1-global-claudeclaudemd"
- id: 03-017
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что хранится в settings.json (не settings.local.json)?
  options:
    a: Личные разрешения
    b: Конфигурации перехватчиков, зафиксированные в репозитории
    c: Ключи API
    d: Данные отслеживания затрат
  correct: b
  explanation: settings.json хранит конфигурации хуков и предназначен для совместного использования в репозитории. Он определяет перехватчики для событий PreToolUse, PostToolUse, UserPromptSubmit — определяя сопоставители и сценарии перехватчиков. Переопределения личных разрешений находятся в settings.local.json (gitignored). Такое разделение позволяет автоматизировать команду, уважая при этом личные предпочтения.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.3 Настройки и разрешения
    anchor: "#settingsjson-team-configuration"
- id: 03-018
  difficulty: senior
  profiles:
  - senior
  - power
  question: Сколько доменов проверки рекомендуется в руководстве для комплексных проверок качества?
  options:
    a: 3 домена (lint, test, build)
    b: "8 доменов: интерфейс, серверная часть, типы, стиль, производительность, доступность, безопасность, UX"
    c: "5 доменов: синтаксис, логика, производительность, безопасность, стиль."
    d: 12 доменов, охватывающих все возможные проверки
  correct: b
  explanation: |-
    **Восемь доменов проверки в руководстве** (ЧТО проверять):

    1. Фронтенд (UI отображается корректно)
    2. Бэкенд (API отвечает правильно)
    3. Типы (проверка TypeScript/type проходит)
    4. Стиль (проходы линтинга)
    5. Производительность (без регрессов)
    6. Доступность (соответствие WCAG)
    7. Безопасность (отсутствие уязвимостей)
    8. UX (пользовательские потоки работают сквозно)

    **Отдельное понятие - 4 метода проверки Бориса Черного** (КАК проверить):
    1. Инструменты CLI (bash-скрипты)
    2. Бэкенд (автоматические тесты)
    3. Фронтенд (проверка браузера)
    4. Мобильная версия (тестирование на симуляторе)

    **Ключевое отличие**: домены **8 руководства** определяют комплексные параметры качества, подлежащие проверке. Методы Бориса **4** описывают технические подходы к выполнению проверки. CLAUDE.md должен определить, какие домены применяются к каждому типу изменений.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Циклы проверки
    anchor: "#verification-loops"
- id: 03-019
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Что такое «шаблон свежего контекста» и когда его следует использовать?
  options:
    a: Очистка кеша браузера перед тестированием
    b: Запуск нового сеанса с чистым контекстом после этапа реализации, чтобы избежать накопленного шума.
    c: Сброс git в чистое состояние
    d: Удаление папки .claude, чтобы начать все сначала
  correct: b
  explanation: Шаблон свежего контекста означает запуск нового сеанса Claude Code между этапами исследования и реализации. Во время исследования контекст накапливает шум (тупики, отклоненные подходы, отладочные результаты). Новый сеанс дает Claude чистый контекст, ориентированный исключительно на реализацию и улучшающий качество вывода.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Свежий шаблон контекста (цикл Ральфа)
    anchor: "#fresh-context-pattern-ralph-loop"
- id: 03-020
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что позволяет настройка `modelOverrides`, представленная в версии 2.1.73?
  options:
    a: Переключает Claude на другую модель в середине разговора.
    b: Сопоставляет записи средства выбора модели с идентификаторами моделей пользовательских поставщиков (например, ARN Bedrock)
    c: Устанавливает модель по умолчанию для всех новых сеансов
    d: Переопределяет модель, используемую только субагентами.
  correct: b
  explanation: |-
    `modelOverrides` позволяет сопоставлять записи средства выбора модели с идентификаторами моделей пользовательских поставщиков, например, указывая запись «Opus» на определенный профиль вывода Bedrock ARN. Это полезно для сторонних поставщиков (Bedrock, Vertex, Foundry), у которых идентификаторы моделей отличаются от сторонних имен API. Он идет в `~/.claude/settings.json` и не переключает модели во время разговора; он перенаправляет, какой идентификатор модели поставщика используется при выборе данной модели из средства выбора.
    ---
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.73 (2026-03-11)
    anchor: "#v2173-2026-03-11"
- id: 03-021
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что настраивает настройка `autoMemoryDirectory` (v2.1.74)?
  options:
    a: Каталог, в котором осуществляется поиск файлов CLAUDE.md.
    b: Папка Claude сканирует контекстные файлы при запуске.
    c: Пользовательский каталог хранения для файлов автозапоминания.
    d: Путь, по которому архивируются стенограммы сеансов
  correct: c
  explanation: |-
    `autoMemoryDirectory` указывает, где Claude Code хранит файлы памяти, которые он сохраняет автоматически с помощью функции автоматической памяти (v2.1.59+). По умолчанию автопамять записывает в `~/.claude/projects/*/memory/MEMORY.md`. Этот параметр позволяет командам перенаправлять это хранилище (полезно для общих дисков или когда вы хотите, чтобы вся память находилась в определенном подкаталоге проекта). Он установлен в `settings.json`, а не в CLAUDE.md.
    ---
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.74 (2026-03-12)
    anchor: "#v2174-2026-03-12"
- id: 03-022
  difficulty: senior
  profiles:
  - senior
  - power
  question: Чему соответствует правило `"Read(./.env)"` в `permissions.deny` по сравнению с простым правилом `"Read"`?
  options:
    a: Оба блокируют каждый вызов Read, поскольку спецификатор в круглых скобках игнорируется.
    b: Простое правило только предупреждает, а версия спецификатора блокирует
    c: Простое правило соответствует каждому вызову чтения, тогда как версия спецификатора соответствует только чтению файла `.env`.
    d: Версия спецификатора соответствует любому файлу, в пути которого есть `.env`.
  correct: c
  explanation: |-
    Правила разрешений используют формат `Tool` или `Tool(specifier)`. Голый `Read` соответствует каждому чтению, тогда как `Read(./.env)` соответствует только чтению файла `.env`. Инструменты `Bash(npm run *)` и `WebFetch(domain:example.com)` следуют одной и той же схеме. Claude Code сначала оценивает правила `deny`, затем `ask`, затем `allow`, и решение принимается по первому совпадению, поэтому правило запрета не может быть переопределено более широким правилом разрешения.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Шаблоны разрешений
    anchor: "#permission-patterns"
- id: 03-023
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что происходит с HTML-комментариями (`<!-- ... -->`) в CLAUDE.md начиная с версии 2.1.72?
  options:
    a: HTML-комментарии полностью удаляются из файла CLAUDE.md на диске.
    b: HTML-комментарии скрыты от Claude при автоматическом вставке CLAUDE.md, но видны с помощью инструмента чтения.
    c: HTML-комментарии рассматриваются как YAML метаданные Claude Code
    d: Комментарии HTML вызывают ошибку синтаксического анализа и препятствуют загрузке CLAUDE.md.
  correct: b
  explanation: |-
    Начиная с версии 2.1.72, HTML-комментарии в CLAUDE.md **скрываются из Claude**, когда файл автоматически вставляется в контекст. Они не используют токены контекста и не влияют на поведение Claude. Однако они остаются видимыми при явном чтении с помощью инструмента «Чтение». Это позволяет вам встраивать в CLAUDE.md заметки разработчика, историю изменений или внутреннюю документацию, которая появляется только тогда, когда человек читает файл напрямую.
    ---
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.72 (2026-03-09)
    anchor: "#v2172-2026-03-09"
- id: 03-024
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Чем управляют настройки `spinnerVerbs` и `spinnerTipsOverride` в `settings.json`?
  options:
    a: Настройте вращающиеся слова действий и подсказки, отображаемые на счетчике терминала, пока работает Claude.
    b: Настройте, как Claude описывает свои рассуждения в ответах.
    c: Установите глаголы, которые Claude использует в сообщениях о фиксации.
    d: Определите стиль индикатора выполнения для долго выполняющихся команд bash.
  correct: a
  explanation: |-
    `spinnerVerbs` заменяет или дополняет повторяющиеся слова действия, отображаемые в терминале во время работы Claude (например, «Анализ…», «Принятие кофеина…»). Установите `"mode": "replace"`, чтобы полностью заменить значения по умолчанию, или `"mode": "add"`, чтобы расширить их. `spinnerTipsOverride` настраивает кончики, показанные рядом со спиннером; используйте `"excludeDefault": true`, чтобы полностью удалить встроенные подсказки. Эти настройки не имеют никакого функционального эффекта. Это чисто UX-персонализация для разработчиков, которым нужен более персонализированный и увлекательный опыт работы с терминалом.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Настройки персонализации терминала
    anchor: "#terminal-personalization-settings"
- id: 03-025
  difficulty: power
  profiles:
  - power
  question: Что такое «проблема фрагментации N×M×P» в конфигурации командного ИИ?
  options:
    a: Формула для расчета затрат API для нескольких моделей
    b: Количество агентов, необходимых для параллельного выполнения (N задач × M моделей × P приоритетов)
    c: Индекс фрагментации, показывающий, насколько устарел CLAUDE.md.
    d: Формула отклонения конфигурации, показывающая, как комбинации разработчиков × инструментов × ОС приводят к фрагментации файлов инструкций ИИ.
  correct: d
  explanation: |-
    N×M×P описывает, как размножаются файлы инструкций ИИ: N разработчиков × M инструментов (Claude Code, Курсор, Виндсерфинг) × P операционных систем (macOS, Linux). Для команды из 5 разработчиков, использующей 3 инструмента для 2 типов ОС, это 30 потенциальных конфигураций. На практике это вызывает настоящий дрейф: добавляет один разработчик TypeScript правила, другой никогда их не получит; macOS-конкретные пути ломаются Linux. Решение **Сборка модуля на основе профиля** (раздел 3.5), который извлекает повторно используемые модули и автоматически собирает окончательный файл инструкций для каждого профиля разработчика, достигая измеренного сокращения контекста токена на 59%.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: 3.5 Масштабная конфигурация команды
    anchor: "#35-team-configuration-at-scale"
- id: 03-026

  question: Что такое Managed-Settings.d/ и какие проблемы управления он решает?
  options:
    a: Каталог для хранения резервных копий settings.json.
    b: Уровень управления предприятием, на котором администраторы удаляют фрагменты конфигурации, которые объединяются с настройками проекта, переопределяя настройки уровня команды.
    c: Каталог для истории настроек с контролем версий.
    d: Промежуточная область для изменений настроек, которые требуют утверждения перед применением.
  correct: b
  explanation: "Managed-settings.d/ — это механизм управления предприятием: администраторы помещают в этот каталог фрагменты конфигурации JSON, а Claude Code объединяет их с settings.json уровня проекта (и переопределяет). Это решает проблему соблюдения политик безопасности всей организации (запрещенные инструменты, необходимые перехватчики, заблокированные пути) без изменения репозитория каждой команды. Команды IT/Security контролируют управляемый уровень; разработчики контролируют уровень своего проекта; управляемый всегда побеждает в конфликтах."
  doc_reference:
    file: guide/ultimate-guide.md

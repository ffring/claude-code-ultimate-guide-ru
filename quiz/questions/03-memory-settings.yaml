  question: Каковы три области действия системы памяти агента Claude Code?
  options:
    a: Локальный, удаленный, облачный
    b: Пользователь (глобальный), Проект (уровень репозитория), Локальный (gitignored для каждой машины)
    c: Сеанс, постоянный, архивированный
    d: Только чтение, однократная запись, только добавление
  correct: b
  explanation: "Память агента имеет 3 области действия: (1) Пользователь: глобальная память в ~/.claude/, применяется ко всем проектам, личным предпочтениям и межпроектным знаниям. (2) Проект: память уровня репозитория в .claude/, переданная в git и доступная для команды. (3) Локальный: gitignored память для каждой машины в .claude/memory/ (локальный), для состояния, специфичного для машины, которое не должно использоваться совместно. Понимание масштаба предотвращает случайное добавление личных заметок или потерю контекста на уровне команды."

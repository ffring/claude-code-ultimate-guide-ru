  question: По состоянию на Claude Code v2.1.200, что изменилось в настройке Permissions.defaultMode в settings.json?
  options:
    a: '«Ручной» полностью заменяет «по умолчанию», и старое значение теперь выдает ошибку проверки.'
    b: '«Вручную» принимается в качестве псевдонима для «по умолчанию» в разрешении.defaultMode, выбирая тот же консервативный режим утверждения за действие.'
    c: '«Ручной» — это совершенно новый режим, поведение которого отличается от старого режима «по умолчанию».'
    d: Permissions.defaultMode был полностью удален в пользу нового ключа разрешений верхнего уровня.
  correct: b
  explanation: "В версии 2.1.200 «defaultMode»: «manual» стал принятым псевдонимом наряду с существующим значением «default», что соответствует переименованному в CLI режиму разрешений «Manual». Оба значения выбирают одно и то же поведение, старое значение по-прежнему работает, ничего не вызывает ошибок, и ни один ключ не был удален или заменен."

category: Внутреннее устройство архитектуры
category_id: 12
source_file: guide/core/architecture.md
questions:
- id: 12-001
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какова базовая архитектура Claude Code?
  options:
    a: Оркестратор DAG с планированием задач
    b: Простой цикл while(tool_call) без классификатора
    c: Конвейер RAG с вложениями
    d: Мультиагентная система с маршрутизатором намерений
  correct: b
  explanation: Claude Code выполняет удивительно простой цикл `while(tool_call)`. НЕТ классификатора намерений, маршрутизатора задач, конвейера RAG/embedding, оркестратора DAG или разделения planner/executor. Модель сама решает, когда вызывать инструменты, какие инструменты вызывать и когда это будет сделано. Это шаблон «агентского цикла».
  doc_reference:
    file: guide/core/architecture.md
    section: Главный цикл
    anchor: "#1-the-master-loop"
- id: 12-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое утверждение о встроенных инструментах Claude Code верно?
  options:
    a: В нем ровно 5 инструментов и больше ничего
    b: Имеет фиксированный набор ровно из 8 инструментов, который никогда не меняется.
    c: Он имеет основной набор (Bash, Read, Edit, Write, Grep, Glob и Agent для субагентов), а также дополнительные инструменты, такие как WebFetch, WebSearch и отслеживание задач, все они перечислены в справочнике по инструментам.
    d: В нем нет встроенных инструментов, только инструменты MCP.
  correct: c
  explanation: В справочнике по инструментам перечислено множество встроенных инструментов, а не фиксированное количество из 8. Основными из них являются Bash (универсальный адаптер), Read, Edit, Write, Grep, Glob и Agent (создает субагент с собственным контекстным окном), а также другие, такие как WebFetch, WebSearch, Skill и инструменты отслеживания задач. TodoWrite был заменен TaskCreate/TaskGet/TaskList/TaskUpdate, и эти инструменты включены по умолчанию только для некоторых старых моделей (Opus 4.7, Sonnet 4.6, Haiku 4.5 и более ранних версий).
  doc_reference:
    file: guide/architecture.md
    section: Инструментальный арсенал
    anchor: "#2-the-tool-arsenal"
- id: 12-003
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой инструмент Claude называют «швейцарским ножом» и «универсальным адаптером»?
  options:
    a: Читать
    b: Греп
    c: Баш
    d: Задача
  correct: c
  explanation: Bash — это швейцарский армейский нож Claude. Он может запускать любой инструмент CLI (git, npm, Docker, Curl...), выполнять сценарии, связывать команды с каналами и получать доступ к состоянию системы. Модель была обучена на огромных объемах данных оболочки, что делает ее очень эффективной в качестве универсального адаптера.
  doc_reference:
    file: guide/core/architecture.md
    section: Универсальный адаптер Bash
    anchor: "#the-bash-universal-adapter"
- id: 12-004
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какие из них используют одно и то же контекстное окно в Claude Code?
  options:
    a: Только история разговоров
    b: Системное приглашение, файлы CLAUDE.md, история разговоров и результаты инструмента.
    c: Только ваши подсказки и ответы Claude
    d: Только файлы CLAUDE.md и результаты инструментов.
  correct: b
  explanation: Claude Code работает в одном контекстном окне, совместно используемом системным приглашением, файлами CLAUDE.md, историей разговоров и результатами инструмента, а также местом, зарезервированным для ответа. На прямых API, Opus 5.5, Sonnet 5.5, Haiku 5.5 и Fable 5.1 есть собственное окно на 1 миллион токенов, а у устаревшего Haiku 4.5 — 200 тысяч. Окно большего размера поднимает потолок, но не устраняет необходимости управлять тем, что его заполняет.
  doc_reference:
    file: guide/architecture.md
    section: Контекстная разбивка бюджета
    anchor: "#context-budget-breakdown"
- id: 12-005
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каковы заявленные пороговые значения автоматического сжатия для Claude Code?
  options:
    a: 50-60%
    b: 75-92% (противоречивые данные)
    c: 95-99%
    d: Автосжатия не существует
  correct: b
  explanation: "Пороговые значения автоматического уплотнения различаются в зависимости от источника: анализ PromptLayer сообщает о 92%, наблюдения сообщества сообщают о 75–80%. При срабатывании обобщаются старые ходы разговора, результаты инструментов сжимаются, а недавний контекст сохраняется. Используйте /compact, чтобы вручную запустить суммирование."
  doc_reference:
    file: guide/core/architecture.md
    section: Auto-Compaction
    anchor: "#auto-compaction"
- id: 12-006
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Какова максимальная глубина вложенности по умолчанию для субагентов, созданных с помощью инструмента «Агент»?
  options:
    a: Неограниченная глубина
    b: До трех слоев ниже основного разговора
    c: Глубина = 1 (субагент не может создавать субагенты)
    d: До двух слоев ниже основного разговора
  correct: b
  explanation: По умолчанию субагент может создавать собственных субагентов, расположенных на три уровня ниже основного разговора. При достижении предела глубины Claude Code удерживает инструмент «Агент», поэтому субагент самостоятельно выполняет делегированную работу и возвращает одну сводку. Установите CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH, чтобы изменить предел; значение 1 отключает вложение. Ограничение глубины по-прежнему имеет значение, поскольку вложенные субагенты увеличивают стоимость и затрудняют отладку многоуровневых цепочек.
  doc_reference:
    file: guide/core/architecture.md
    section: Почему Глубина = 1?
    anchor: "#why-depth-1"
- id: 12-007
  difficulty: senior
  profiles:
  - senior
  - power
  question: С какого контекста начинается субагент, созданный инструментом «Агент»?
  options:
    a: Полная история разговоров и все файлы, которые Claude уже прочитал.
    b: Новое, изолированное контекстное окно, заполненное сообщением делегирования, которое Claude записывает для него.
    c: Последние 10 сообщений разговора
    d: Сжатая копия родительского сеанса
  correct: b
  explanation: Субагенты имеют ИЗОЛИРОВАННЫЙ контекст. Каждый из них начинается с нового контекстного окна и не видит историю ваших разговоров, уже использованные вами навыки или уже прочитанные файлы Claude; он работает на основе сообщения делегирования, которое составляет Claude (разветвление является исключением, поскольку оно наследует диалог). Субагент возвращает сводку, которая сохраняет основной контекст чистым. «Изучение» и «Планирование» также запускаются без файлов CLAUDE.md, в то время как их загружают другие встроенные и настраиваемые субагенты.
  doc_reference:
    file: guide/architecture.md
    section: Модель изоляции
    anchor: "#isolation-model"
- id: 12-008
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Каковы 4 уровня разрешений в модели безопасности Claude Code?
  options:
    a: Пользователь, Администратор, Система, Корень
    b: Интерактивные подсказки, правила Allow/Deny, хуки, песочница
    c: Чтение, запись, выполнение, удаление
    d: Локальный, Проектный, Глобальный, Корпоративный
  correct: b
  explanation: "Claude Code имеет 4 уровня безопасности: (1) Интерактивные подсказки (разрешить once/always/deny), (2) Правила Allow/Deny в settings.json, (3) Хуки (скрипты выполнения Pre/Post), (4) Режим песочницы (файловая система + сетевая изоляция). Каждый слой добавляет защиту."
  doc_reference:
    file: guide/core/architecture.md
    section: Модель разрешений и безопасности
    anchor: "#5-permission-security-model"
- id: 12-009
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой алгоритм использует инструмент редактирования, если точное совпадение не удается?
  options:
    a: Немедленно возвращает ошибку
    b: Нечеткое совпадение (нормализация пробелов, нормализация конца строки, расширение контекста)
    c: Сопоставление шаблонов регулярных выражений
    d: Поиск семантического сходства
  correct: b
  explanation: "Если точное совпадение не удалось, Edit пытается выполнить нечеткое сопоставление: (1) нормализация пробелов (конечные пробелы, отступы), (2) нормализация окончания строки (CRLF или LF), (3) расширение контекста (окружающие строки). Только если нечеткое совпадение также не удалось, оно возвращает ошибку."
  doc_reference:
    file: guide/core/architecture.md
    section: Нечеткие детали совпадения
    anchor: "#fuzzy-matching-details"
- id: 12-010
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Какой протокол использует MCP (Model Context Protocol) для связи?
  options:
    a: ОТДЫХ API вместо HTTPS
    b: ГрафQL
    c: JSON-RPC 2.0 через stdio или HTTP
    d: gRPC с буферами протоколов
  correct: c
  explanation: MCP использует JSON-RPC 2.0 поверх stdio или транспорта HTTP. Инструменты MCP соответствуют соглашению об именах `mcp__<server>__<tool>`. Серверы запускаются при первом использовании и остаются работоспособными во время сеанса. Они имеют ту же систему разрешений, что и собственные инструменты.
  doc_reference:
    file: guide/core/architecture.md
    section: MCP Интеграция
    anchor: "#6-mcp-integration"
- id: 12-011
  difficulty: senior
  profiles:
  - power
  question: Какова философия дизайна Claude Code, сформулированная Anthropic?
  options:
    a: Больше строительных лесов, меньше моделей — создавайте сложную оркестровку
    b: Меньше строительных лесов, больше модели – доверьтесь рассуждениям Claude
    c: Максимальный контроль – четкие правила для каждого случая
    d: Гибридный подход – RAG + классификатор + модель
  correct: b
  explanation: "Философия Claude Code — «Меньше строительных лесов, больше моделей» — доверяйте рассуждениям Claude вместо того, чтобы создавать сложные системы оркестровки. Это означает: принимает решение одна модель (без classifier/router), Grep+Glob (без RAG), простой цикл while (без DAG), диалог как состояние (без конечных автоматов)."
  doc_reference:
    file: guide/core/architecture.md
    section: "10. Философия: меньше строительных лесов, больше модели"
    anchor: "#10-philosophy-less-scaffolding-more-model"
- id: 12-012
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие типы специализированных субагентов доступны в Claude Code?
  options:
    a: Читатель, Писатель, Искатель, Исполнитель
    b: Исследовать, Планировать, общего назначения (основные встроенные типы)
    c: Младший, Старший, Эксперт, Архитектор
    d: Быстрый, сбалансированный, тщательный, полный
  correct: b
  explanation: |-
    Основными встроенными субагентами Claude Code, создаваемыми с помощью инструмента «Агент», являются:

    1. **Explore**: исследование кодовой базы с помощью инструментов, доступных только для чтения. Он использует модель основного диалога (за исключением случаев, когда основной диалог запускает Fable) и поддерживает уровни тщательности (тщательный quick/medium/very).

    2. **Plan**: проводите исследования в режиме планирования, чтобы результаты исследования не входили в основной разговор. Инструменты только для чтения; он наследует модель основного диалога.

    3. **общего назначения**: сложные многоэтапные задачи с использованием всех инструментов, доступных субагентам.

    Claude Code также включает вспомогательные агенты, такие как claude, statusline-setup и claude-code-guide, которые вызываются автоматически.

    **Важно**: Bash — это ИНСТРУМЕНТ (утилита выполнения команд), а не тип субагента. Субагенты могут ИСПОЛЬЗОВАТЬ инструмент Bash, но типа субагента «Bash» не существует.

    Источник: Официальная документация code.claude.com/docs/en/sub-agents (проверено 27 октября 2026 г.).
  doc_reference:
    file: guide/core/architecture.md
    section: Типы субагентов
    anchor: "#sub-agent-types"
- id: 12-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой инструмент заменил TodoWrite для управления задачами в Claude Code v2.1.16+?
  options:
    a: Менеджер проекта API
    b: Канбан-инструмент
    c: Задачи API (TaskCreate, TaskGet, TaskList, TaskUpdate)
    d: Инструмент «Повестка дня»
  correct: c
  explanation: "Tasks API (v2.1.16+) заменил TodoWrite четырьмя инструментами: TaskCreate (создание задач с описаниями), TaskGet (получение полной информации о задаче), TaskList (список всех задач со статусом), TaskUpdate (обновление статуса, зависимостей, метаданных). Ключевое улучшение: зависимости задач через поля blockedBy/blocks. Согласно справочнику по инструментам, эти инструменты доступны по умолчанию только в Opus 4.7, Sonnet 4.6, Haiku 4.5 и более ранних моделях; на более новых моделях Claude отслеживает многоэтапную работу без письменного контрольного списка, если вы не дадите свое согласие."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Задачи API (v2.1.16+)
    anchor: "#tasks-api-v2116"
- id: 12-014
  difficulty: power
  profiles:
  - power
  question: Каковы накладные расходы API на получение полных сведений о 50 задачах с помощью Tasks API?
  options:
    a: 10-кратные издержки (10 вызовов API)
    b: 25-кратные издержки (25 вызовов API)
    c: 51x накладных расходов (требуется 1 TaskList + 50 вызовов TaskGet)
    d: 100-кратные издержки (100 вызовов API)
  correct: c
  explanation: "Ограничение Tasks API: TaskList возвращает только сводные поля (идентификатор, тема, статус, владелец, заблокированный). Чтобы получить полную информацию (описание, метаданные), нужны отдельные вызовы TaskGet. Для 50 задач: 1 TaskList + 50 TaskGet = 51 вызов API. Этот шаблон N+1 является известным ограничением по сравнению с TodoWrite, который возвращал все за один вызов."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Задачи API (v2.1.16+)
    anchor: "#tasks-api-v2116"
- id: 12-015
  difficulty: power
  profiles:
  - power
  question: Что такое TeammateTool и каков его статус?
  options:
    a: Готовая к использованию мультиагентная платформа
    b: Экспериментальная мультиагентная координация (spawnTeam, DiscoverTeams, requestJoin, ApprovJoin) — нестабильно, нет официальной поддержки.
    c: Официальный инструмент Anthropic для командной работы
    d: Устаревшая функция заменена Tasks API.
  correct: b
  explanation: "TeammateTool — экспериментальный инструмент многоагентной координации с 4 операциями: spawnTeam, DiscoverTeams, RequestJoin, ApprovalJoin. Статус: нестабильный, официально не поддерживается Anthropic. Это позволяет экземплярам Claude формировать команды и координировать свои действия, но API может быть изменен без предварительного уведомления. Не рекомендуется для производственного использования."
  doc_reference:
    file: guide/ultimate-guide.md
    section: TeammateTool (экспериментальный)
    anchor: "#teammatetool-experimental"
- id: 12-016
  difficulty: senior
  profiles:
  - senior
  - power
  question: Эмпирическое исследование десятков платформ агентов с открытым исходным кодом и сотен агентских приложений, упомянутое в руководстве по использованию агентов, выявило несоответствие в том, куда направляются усилия по тестированию. Что это за несоответствие?
  options:
    a: Усилия по тестированию равномерно распределяются между детерминированными компонентами и логическим ядром LLM, но внедрение специальных инструментов оценки LLM превышает 50 %.
    b: Более 70% усилий по тестированию нацелено на ядро ​​рассуждений LLM, а менее 5% — на детерминированные компоненты, такие как вызовы инструментов.
    c: Внедрение специальных инструментов оценки LLM, таких как DeepEval, превышает 60%, но тестирование детерминированных компонентов полностью игнорируется.
    d: Более 70 % усилий по тестированию нацелено на детерминированные компоненты, такие как инструменты и логика рабочего процесса, а менее 5 % — на ядро ​​рассуждений LLM (тело плана).
  correct: d
  explanation: Исследование показало, что более 70% усилий по тестированию нацелено на детерминированные компоненты, такие как инструменты, API и логику рабочего процесса, в то время как менее 5% нацелены на тело плана, ядро ​​рассуждений LLM, в котором действительно живут неочевидные сбои, такие как правдоподобные, но неверные результаты. Внедрение специальных инструментов оценки LLM было ниже 1%, а не выше 50 или 60%, как в вариантах a и c. Вариант б инвертирует реальные результаты. Руководство рекомендует перебалансировать как минимум 20–30 % усилий по тестированию тела плана.
  doc_reference:
    file: guide/core/agent-harness.md
    section: 7. Тестирование антипаттерна распределения
    anchor: "#7-test-distribution-anti-pattern"
- id: 12-017
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Claude Code v2.1.191 снизил загрузку ЦП во время потоковой передачи примерно на 37%. Какие внутренние изменения привели к этому?
  options:
    a: Текстовые обновления были объединены с интервалом 100 мс вместо того, чтобы отображаться для каждого токена.
    b: Потоковая передача была перенесена из средства рендеринга терминала в механизм сравнения на основе WebSocket.
    c: Схемы вызовов инструментов кэшировались между ходами, чтобы избежать повторного анализа каждого токена.
    d: Контекстное окно обрезалось постоянно во время потоковой передачи, а не только во время сжатия.
  correct: a
  explanation: 'В примечаниях к выпуску говорится, что загрузка ЦП во время потоковой передачи снизилась примерно на 37% за счет объединения текстовых обновлений с интервалом 100 мс вместо обновления отображения для каждого токена. Это отдельная цифра от процента сокращения токенов, приписываемого динамической отправке инструментов в другом месте руководства. Эти два числа измеряют разные вещи: циклы ЦП во время рендеринга и использование токенов при загрузке схемы инструмента, и по совпадению оказались в одном и том же диапазоне. Варианты b, c и d описывают правдоподобные, но неустановленные механизмы, не упомянутые в примечаниях к выпуску.'
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.191
- id: 12-018
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое «гниение контекста» и что делает его структурным, а не случайным?
  options:
    a: Постепенное ухудшение качества, вызванное слишком большим количеством комментариев к коду в контекстном окне.
    b: "Стоимость внимания n²: по мере роста контекста каждый новый токен обрабатывает все предыдущие токены, вызывая экспоненциальное замедление и ухудшение качества независимо от качества контента."
    c: Гниль, вызванная оставлением неиспользуемых переменных и мертвого кода в контексте.
    d: Ограничение скорости API, которое приводит к ухудшению ответов при большом контексте
  correct: b
  explanation: "Контекстное разрушение является структурным, а не случайным: внимание преобразователя равно O(n²), где каждый новый токен обрабатывает все предыдущие токены. По мере роста контекста эффективное внимание к токену ослабевает, ранний контекст теряет вес, а недавние токены непропорционально доминируют. Это происходит даже с качественным контекстным контентом. Решения: /compact (удаление), цепочка контекстов (новый сеанс с тщательно подобранной сводкой) или JIT-извлечение (никогда не загружаться; извлечение по требованию). Вы не сможете исправить структурную гниль, очистив подсказки."
  doc_reference:
    file: guide/core/architecture.md
    section: Контекстная гниль
- id: 12-019
  difficulty: power
  profiles:
  - power
  question: В чем ключевое различие между получением данных JIT (точно в срок) и RAG в контексте субагентов Claude Code?
  options:
    a: JIT-поиск использует векторные базы данных, а RAG использует поиск по ключевым словам.
    b: JIT-извлечение никогда не загружает контекст предварительно, субагенты извлекают только то, что им нужно в нужный момент; RAG предварительно индексирует и встраивает документы для семантического поиска.
    c: JIT быстрее, но менее точен; RAG медленнее, но точнее
    d: JIT предназначен только для извлечения кода; RAG занимается поиском документации
  correct: b
  explanation: "JIT-извлечение в субагентах означает отсутствие предварительной загрузки контекста: агент определяет, что ему нужно (шаблон WHY/WHAT), извлекает только это, обрабатывает и затем отбрасывает. Благодаря этому контекстные окна для каждого агента остаются небольшими. RAG предварительно индексирует и встраивает корпус данных заранее, обеспечивая поиск семантического сходства во время запроса. Для субагентов Claude Code: JIT предпочтителен для целевых задач извлечения (без настройки внедрения, без устаревшего индекса); RAG подходит для баз знаний, к которым неоднократно обращаются во время многих сеансов."
  doc_reference:
    file: guide/core/architecture.md
    section: JIT против извлечения RAG
- id: 12-020
  difficulty: power
  profiles:
  - power
  question: Для чего используется MMD (максимальное среднее несоответствие) при обнаружении отклонения контекста?
  options:
    a: Измерение максимального количества токенов, которые могут переместиться до сбоя сеанса.
    b: Статистический тест, сравнивающий распределение недавних вложений токенов с базовым распределением для обнаружения семантического отклонения в текущих разговорах.
    c: Отслеживание максимального расстояния памяти между двумя связанными файлами CLAUDE.md
    d: Алгоритм сжатия, который минимизирует среднее отклонение в контекстных сводках.
  correct: b
  explanation: "MMD (максимальное среднее несоответствие) — это статистический тест на основе ядра, который сравнивает два распределения, не принимая параметрическую форму. При обнаружении смещения контекста: вы встраиваете tokens/messages из базового окна и недавнего окна, затем вычисляете MMD между двумя распределениями. Высокий показатель MMD указывает на то, что разговор семантически отклонился от исходной темы, что является сигналом для /compact или начала нового сеанса. Порог: MMD > 0,3 обычно требует вмешательства. Более надежное, чем косинусное расстояние, для мультимодального дрейфа."
  doc_reference:
    file: guide/core/architecture.md
    section: Обнаружение отклонения контекста
- id: 12-021
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Что такое «проблема высоты Златовласки» для правил проекта CLAUDE.md?
  options:
    a: 'Поиск подходящего размера файла для CLAUDE.md: не слишком большого (потеря контекста) и не слишком маленького (недостаточные рекомендации)'
    b: "Проблема написания правил на правильном уровне абстракции: слишком высокий уровень (ignored/mis-applied) или слишком низкий уровень (хрупкий, переопределенный)."
    c: Выбор правильной глубины каталога для вложенных файлов CLAUDE.md в монорепозитории
    d: 'Балансировка строгости правил: слишком строгая приводит к тому, что Claude отклоняет допустимые задачи, слишком слабая не дает никаких указаний.'
  correct: b
  explanation: 'Проблема высоты Златовласки: правила, написанные слишком высоко («пишите хороший код»), слишком абстрактны, чтобы их можно было применять последовательно. Правила, написанные слишком кратко («всегда добавляйте пустую строку после объявления функции»), являются хрупкими. Они конфликтуют с контекстом или устаревают. Лучшее место — средняя высота: достаточно конкретная, чтобы можно было действовать, и достаточно абстрактная, чтобы обобщать схожие ситуации. Пример правильной высоты: «предпочитайте функциональный стиль для преобразования данных; используйте классы только тогда, когда вам нужно управление жизненным циклом с отслеживанием состояния».'
  doc_reference:
    file: guide/core/architecture.md
    section: Высота Златовласки

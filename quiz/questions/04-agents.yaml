category: Агенты
category_id: 4
source_file: guide/ultimate-guide.md
questions:
- id: 04-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: Что такое агенты в Claude Code?
  options:
    a: Внешние программы
    b: Специализированные персонажи ИИ для конкретных задач, которым Claude может делегировать
    c: Человеческие помощники
    d: Автоматизированные сценарии
  correct: b
  explanation: Агенты — это специализированные подпроцессы (персонажи ИИ), которым Claude может делегировать задачи. Они воплощают в себе опыт предметной области, например, эксперт по безопасности, знающий OWASP Top 10, или серверный архитектор, понимающий дизайн API. Думайте о них как об «экспертах-консультантах» — вместо того, чтобы объяснять все в своем сообщении, вы вызываете агента, который уже обладает таким опытом.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.1 Что такое агенты
    anchor: "#41-what-are-agents"
- id: 04-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Где следует хранить файлы пользовательских агентов?
  options:
    a: ~/.claude/agents/
    b: .claude/agents/
    c: /agents/
    d: .claude/commands/
  correct: b
  explanation: "Файлы пользовательских агентов должны храниться в `.claude/agents/` в каталоге вашего проекта. Это файлы уценки с фронтальной частью YAML. Например: `.claude/agents/backend-architect.md`, `.claude/agents/code-reviewer.md`. Их можно передать в систему контроля версий, чтобы поделиться ими со своей командой."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.2 Создание собственных агентов
    anchor: "#42-creating-custom-agents"
- id: 04-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие поля ОБЯЗАТЕЛЬНЫ в шаблоне YAML агента?
  options:
    a: название, модель, инструменты
    b: имя, описание
    c: название, описание, модель, инструменты
    d: имя, роль, навыки
  correct: b
  explanation: "В заголовке агента требуются только `name` и `description`. Необязательные поля включают в себя: модель (наследует родительский элемент по умолчанию; явный сонет, опус или хайку), инструменты (список, разделенный запятыми), навыки (для наследования) и запрещенные инструменты. Описание имеет решающее значение — оно определяет, когда Claude автоматически активирует агент, поэтому сделайте его ясным и конкретным."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.2 Создание собственных агентов
    anchor: "#frontmatter-fields"
- id: 04-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: В чем преимущество использования агентов перед прямыми подсказками?
  options:
    a: Агенты работают быстрее
    b: Агенты обладают профессиональным опытом, поэтому вам не нужно каждый раз все объяснять.
    c: Агенты стоят дешевле
    d: Агенты могут получить доступ к большему количеству файлов
  correct: b
  explanation: "Агенты воплощают в себе экспертные знания. Без агентов вы бы написали: «Проверьте этот код на предмет проблем безопасности, сосредоточив внимание на OWASP Top 10, проверив SQL-инъекцию, XSS, CSRF...» С агентами: «Используйте агента проверки безопасности для аудита этого кода». Агент уже обладает этим опытом, что делает ваши подсказки короче и более последовательными."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.1 Что такое агенты
    anchor: "#agent-vs-direct-prompt"
- id: 04-005
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какую модель следует использовать для агентов, выполняющих сложный архитектурный анализ?
  options:
    a: хайку – для скорости
    b: сонет - для баланса
    c: опус - для максимального рассуждения
    d: Любая модель работает одинаково хорошо
  correct: c
  explanation: "Используйте опус для сложных рассуждений и задач по архитектуре. Рекомендации по выбору модели: хайку (быстро, недорого) для быстрых задач и простых изменений; сонет (взвешенный, явный выбор) для большинства задач; опус (медленный, дорогой) для сложных рассуждений, архитектурных решений и критических проверок безопасности. Сопоставьте модель со сложностью задачи."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.2 Создание собственных агентов
    anchor: "#model-selection"
- id: 04-006
  difficulty: power
  profiles:
  - power
  question: Что такое «Инструмент SEO» в дизайне агентов?
  options:
    a: Сделать инструменты доступными для поиска в Интернете
    b: Оптимизация поля описания для улучшения ситуации, когда Claude автоматически активирует агента.
    c: SEO для документации
    d: Маркетинговая техника
  correct: b
  explanation: "Инструмент SEO оптимизирует поле описания агента для улучшения автоматической активации. Методы включают в себя: использование «ПРАКТИВНО» для поощрения автоматической активации, перечисление явных ключевых слов-триггеров, описание конкретных контекстов и добавление коротких псевдонимов. Хорошее описание: «Проверщик кода безопасности — используйте ПРОАКТИВНО при: проверке кода аутентификации, анализе конечных точек API... Триггеры: безопасность, аутентификация, уязвимость, OWASP»."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.6 Расширенные шаблоны агентов
    anchor: "#tool-seo-optimizing-agent-descriptions"
- id: 04-007
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: "Какова наилучшая практика проектирования агентов: специализация или обобщение?"
  options:
    a: Создайте одного универсального агента, который сделает все
    b: Создайте специализированных агентов для каждого домена (безопасность, тестирование, бэкэнд и т. д.).
    c: Смешайте специализированных и универсальных агентов
    d: Полностью избегайте агентов
  correct: b
  explanation: 'Всегда отдавайте предпочтение специализации обобщению. Хорошо: отдельные агенты для бэкенд-архитектора (API, база данных, производительность), проверяющего безопасность (OWASP, аутентификация, шифрование), инженера-тестировщика (стратегия тестирования, покрытие, TDD). Плохо: один полноценный эксперт, который «делает все (плохо)». Специализированные агенты обладают узкоспециализированным контекстом и знаниями в конкретной области.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.4 Лучшие практики
    anchor: "#specialization-over-generalization"
- id: 04-008
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как агенты могут наследовать знания от навыков?
  options:
    a: Копируя содержимое навыков в агента
    b: Использование поля «навыки» во вступительной части
    c: Навыки и агенты не могут быть объединены
    d: Импортируя файлы навыков
  correct: b
  explanation: "Агенты наследуют навыки, используя поле `skills` во вступительной части. Например: `skills: [security-guardian]`. Это формирует опыт без дублирования — вместо копирования знаний OWASP в каждого агента, связанного с безопасностью, все они наследуют навыки охранника. Это соответствует принципам DRY для организации знаний."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.4 Лучшие практики
    anchor: "#skill-composition"
- id: 04-009
  difficulty: power
  profiles:
  - power
  question: Что такое «метод семи параллельных задач»?
  options:
    a: Одновременный запуск 7 экземпляров Claude
    b: Параллельный запуск 7 специализированных субагентов для реализации полного функционала
    c: Техника отладки
    d: Контрольный список проверки кода
  correct: b
  explanation: "Метод 7-параллельных задач параллельно запускает 7 специализированных субагентов: 1) Компоненты, 2) Стили, 3) Тесты, 4) Типы, 5) Хуки, 6) Интеграция, 7) Конфигурация. Все выполняется параллельно, затем результаты консолидируются. Это значительно ускоряет реализацию функций за счет распараллеливания независимых рабочих потоков."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.6 Расширенные шаблоны агентов
    anchor: "#the-7-parallel-task-method"
- id: 04-010
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков рекомендуемый вес агента для часто используемых задач?
  options:
    a: Тяжелый (25 тыс.+ токенов) за тщательность
    b: Средний (10-15 тыс. токенов) для баланса
    c: Легкий вес (<3 000 токенов) для скорости
    d: Вес не имеет значения
  correct: c
  explanation: 'Используйте облегченные агенты (токены <3 000, время инициализации <1 с) для частых задач и рабочих процессов. Золотое правило: «Легкий агент используется в 100 раз > тяжелый агент используется в 10 раз». Весовые категории агента: Легкая (<3 000 токенов) для частых задач, Средняя (10–15 000) для analysis/reviews, Тяжелая (25 000+) для аудитов architecture/full. Сопоставьте вес с частотой выполнения задач.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.6 Расширенные шаблоны агентов
    anchor: "#agent-weight-classification"
- id: 04-011
  difficulty: power
  profiles:
  - power
  question: Какая комбинация моделей рекомендуется при многоагентной оркестрации?
  options:
    a: Opus везде за качество
    b: Haiku повсюду для экономии средств
    c: Оркестратор Sonnet + рабочие Haiku + валидатор Sonnet
    d: Используйте одну и ту же модель для всех агентов
  correct: c
  explanation: "Рекомендуемый шаблон: Sonnet в качестве оркестратора (координаты), рабочие Haiku (параллельное выполнение), валидатор Sonnet (окончательная проверка). Это в 2-2,5 раза дешевле, чем везде использовать Opus с эквивалентным качеством для 90% задач. Например, рефакторинг 100 файлов: Sonnet анализирует и планирует, Haiku выполняет параллельное редактирование, Sonnet проверяет - экономия 80-90% затрат."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.6 Шаблон многоагентной оркестрации
    line: 5280-5310
- id: 04-012
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что должен включать раздел формата вывода агента?
  options:
    a: Только примеры кода
    b: Структурированные результаты, такие как отчеты с разделами, уровнями серьезности и рекомендациями.
    c: Вывод необработанного текста
    d: только JSON
  correct: b
  explanation: "Формат вывода агента должен указывать структурированные результаты. Например, агент проверки кода выводит: сводку, критические проблемы (необходимо исправить) со ссылками на файл:строки, предупреждения (следует исправить), предложения (неплохо иметь) и положительные примечания. Четкий формат вывода обеспечивает согласованные и действенные результаты при всех вызовах."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.5 Примеры агентов
    anchor: "#example-1-code-reviewer-agent"
- id: 04-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какова цель поля «disallowedTools» в заголовке агента?
  options:
    a: Чтобы перечислить инструменты, которые агент должен использовать
    b: Чтобы заблокировать использование определенных инструментов агентом
    c: Чтобы отключить агент
    d: Чтобы перечислить устаревшие инструменты
  correct: b
  explanation: "Поле disallowedTools блокирует использование агентом определенных инструментов. Например, агент проверки кода может иметь `disallowedTools: [WebSearch]`, чтобы гарантировать, что он сосредоточится на реальном коде, а не на поиске в Интернете. Это обеспечивает границы безопасности и фокусирует агента на его основной цели."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.2 Создание собственных агентов
    anchor: "#agent-file-structure"
- id: 04-014
  difficulty: power
  profiles:
  - power
  question: Что такое шаблон «Субагенты с разделением ролей»?
  options:
    a: Разделение одного агента на несколько файлов
    b: Многоперспективный анализ с использованием параллельных агентов с разными экспертными ролями.
    c: Разделение проверки кода на этапы
    d: Назначение агентов разным членам команды
  correct: b
  explanation: 'Субагенты с разделенными ролями обеспечивают параллельный многоперспективный анализ. Процесс: 1) Активируйте режим планирования (для текущих моделей Claude мышление всегда включено), 2) Спросите: «Какие роли экспертов будут анализировать это?», 3) Выберите роли (например, эксперт по безопасности, старший разработчик, проверяющий код), 4) Запустите параллельный анализ с каждой точки зрения, 5) Объедините отчеты в рекомендации. Отлично подходит для всесторонних обзоров кода и UX.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.6 Расширенные шаблоны агентов
    anchor: "#split-role-sub-agents"
- id: 04-015
  difficulty: senior
  profiles:
  - senior
  - power
  question: Когда следует избегать параллельного выполнения агентов?
  options:
    a: Когда задачи доступны только для чтения
    b: Когда задачи деструктивны (операции записи) и зависят друг от друга
    c: При использовании модели хайку
    d: Когда задействовано более 3 агентов
  correct: b
  explanation: "Избегайте параллельного выполнения разрушительных операций (записи), которые зависят друг от друга. Матрица решений: Независимый + Неразрушающий = Параллельный (максимальная эффективность); Независимый + Разрушительный = Последовательный с первым режимом планирования; Зависимые операции = Последовательные (порядок имеет значение). Параллельная запись рисков конфликтов, если файлы имеют общий imports/exports."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.6 Расширенные шаблоны агентов
    anchor: "#parallelization-decision-matrix"
- id: 04-016
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что обычно включает в себя методология агента отладчика?
  options:
    a: Только исправление кода
    b: Воспроизвести, изолировать, проанализировать, выдвинуть гипотезу, протестировать, исправить, проверить
    c: Просто запускаю тесты
    d: Удаление проблемного кода
  correct: b
  explanation: "Систематический агент отладчика выполняет следующие действия: 1) Воспроизведение - подтверждение существования проблемы, 2) Изолирование - сужение до наименьшего воспроизводимого случая, 3) Анализ - чтение кода, проверка журналов, отслеживание выполнения, 4) Выдвижение гипотезы - формирование теории о причине, 5) Тестирование - проверка гипотезы с минимальными изменениями, 6) Исправление - реализация решения, 7) Проверка - подтверждение работы исправления без нарушения других функций. Никогда не гадайте – всегда проверяйте."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.5 Примеры агентов
    anchor: "#example-2-debugger-agent"
- id: 04-017
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков пример описания ПЛОХОГО агента?
  options:
    a: "«Используйте при разработке API, проверке схем баз данных или оптимизации производительности серверной части»"
    b: "«Бэкэнд»"
    c: "«Проверщик кода безопасности — используйте ПРОАКТИВНО при проверке кода авторизации»"
    d: "«Используйте при обнаружении ошибок, неудачных тестов или неожиданного поведения»"
  correct: b
  explanation: "«Внутренняя часть» — плохое описание: оно слишком расплывчато, чтобы помочь Claude понять, когда активировать агент. Хорошие описания конкретны: «Используйте при разработке API, проверке схем баз данных или оптимизации производительности серверной части» или «Проверщик кода безопасности — используйте ПРОАКТИВНО при проверке кода аутентификации». Четкие триггеры активации улучшают использование агентов."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 4.4 Лучшие практики
    anchor: "#explicit-activation-triggers"
- id: 04-018
  difficulty: power
  profiles:
  - power
  question: Какова разница в надежности вызова между CLAUDE.md (активный контекст) и Skills (ленивый вызов)?
  options:
    a: Навыки более надежны, чем CLAUDE.md
    b: Оба имеют 100% надежность.
    c: "CLAUDE.md: 100% надежность (всегда загружено) против навыков: ~56% автоматически вызывается."
    d: CLAUDE.md устарел в пользу навыков
  correct: c
  explanation: "CLAUDE.md использует активную загрузку контекста — всегда присутствует в контексте Claude, поэтому активация 100% надежна. Навыки используют отложенный вызов — автоматически обнаруживаются и вызываются только тогда, когда Claude осознает необходимость, достигая уровня автоматического вызова ~ 56%, согласно Гао (2026). Компромисс: CLAUDE.md требует жетоны контекста в каждом сеансе, Навыки сохраняют жетоны, но могут пропускать активации. Используйте CLAUDE.md для критического поведения, Навыки — для дополнительных возможностей."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Сравнение загрузки памяти
    anchor: "#memory-loading-comparison"
- id: 04-019
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Как ведут себя по умолчанию субагенты, созданные с помощью инструмента Task/Agent, начиная с версии 2.1.198?
  options:
    a: Они запускаются в фоновом режиме только в том случае, если вы явно передадите флаг --background.
    b: Они работают в фоновом режиме только при появлении из панели агентов Клода.
    c: Они по-прежнему блокируют основной сеанс до его завершения, без изменений по сравнению с предыдущими версиями.
    d: По умолчанию они работают в фоновом режиме, поэтому Claude продолжает работать и получает уведомление по завершении.
  correct: d
  explanation: Начиная с версии 2.1.198, субагенты по умолчанию работают в фоновом режиме, поэтому Claude продолжает другую работу во время ее выполнения и получает уведомление по ее завершении вместо синхронной блокировки. Вариант c описывает поведение, существовавшее до версии 2.1.198. Варианты а и б изобретают механизмы, которых не существует; это изменение широко применяется к подагентам инструмента задач, а не только к тем, которые запускаются из определенной панели.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 04-020
  difficulty: senior
  profiles:
  - senior
  - power
  question: Когда фоновый агент, запущенный из агентов Claude, завершает работу с кодом в изолированном рабочем дереве git, что он теперь делает, начиная с версии 2.1.198?
  options:
    a: Он останавливается и спрашивает пользователя, что делать с изменениями.
    b: Он отбрасывает изменения, поскольку рабочие деревья должны быть эфемерными.
    c: Он автоматически фиксирует, отправляет и открывает черновой запрос на включение
    d: Он объединяет изменения непосредственно в основную ветку без PR.
  correct: c
  explanation: Начиная с версии 2.1.198, фоновые агенты, которые завершают код, работают в рабочем дереве, автоматически фиксируя, отправляя и открывая черновой запрос на включение, вместо того, чтобы останавливаться, чтобы спросить пользователя, что делать дальше. При этом исключается этап передачи вручную, поэтому рецензентам следует ожидать, что черновики запросов на запрос появятся без предварительного запроса на подтверждение. Он не касается main напрямую и не отбрасывает работу.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 04-021
  difficulty: power
  profiles:
  - senior
  - power
  question: Параметр «Динамический размер рабочего процесса» в /config позволяет вам выбрать небольшое, среднее или большое количество агентов. Какова природа этой настройки?
  options:
    a: Он устанавливает строгое максимальное количество агентов, которое Claude не может превышать.
    b: Это применимо только к агентам, созданным с помощью пользовательских команд с косой чертой.
    c: Это настройка выставления счетов, которая ограничивает количество агентов, которые могут работать в месяц.
    d: Это рекомендательное руководство для Claude, а не принудительное жесткое ограничение количества агентов.
  correct: d
  explanation: Этот параметр представляет собой явно рекомендательное указание относительно того, насколько большим Claude обычно делает динамические рабочие процессы, а не принудительное ограничение. Claude еще может отклоняться от него в зависимости от задачи. Вариант a завышает его как жесткий предел, а варианты b и c создают области, которые не поддерживаются примечаниями к выпуску.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.202
- id: 04-022
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: На какой модели, начиная с версии 2.1.198, работает встроенный агент Explore, используемый для поиска по кодовой базе только для чтения?
  options:
    a: Он всегда работает на Haiku, независимо от модели сеанса, для повышения скорости.
    b: Он всегда работает на самой дорогой доступной модели для максимальной тщательности.
    c: По умолчанию он работает на Sonnet и может быть обновлен до Opus с помощью флага
    d: Он наследует модель основного сеанса, ограниченную Opus, вместо того, чтобы всегда использовать значение по умолчанию Haiku.
  correct: d
  explanation: Explore теперь наследует модель основного сеанса, ограниченную Opus, вместо того, чтобы всегда работать на Haiku, как это было раньше. Сеанс, запущенный на Sonnet или Opus, получает более функциональный агент Explore, а сеанс Haiku по-прежнему получает Haiku. Вариант a описывает значение по умолчанию до версии 2.1.198; варианты b и c создают поведение, которого нет в примечаниях к выпуску.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198

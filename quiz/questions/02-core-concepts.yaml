questions:
- id: 02-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  - pm
  question: С каким процентом контекста следует использовать /compact?
  options:
    a: 0-50%
    b: 50-70%
    c: 70-90%
    d: Только на 100%
  correct: c
  explanation: "Используйте /compact, когда контекст достигает 70-90% (красная зона). Контекстные зоны: Зелёные (0-50%) – работают свободно; Желтый (50-75%) – начните быть избирательным; Красный (75-90%) – используйте /compact; Критический (90%+) — необходимо /clear или существует риск ошибки. Использование /compact на уровне 70 % снижает использование примерно на 50 %, сохраняя при этом ключевой контекст."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#context-zones"
- id: 02-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое собственное контекстное окно имеют текущие модели Claude (Opus 5.5, Sonnet 5.5, Haiku 5.5, Fable 5.1) на прямом API?
  options:
    a: 100 000 жетонов
    b: 200 000 токенов
    c: 1 000 000 токенов
    d: 2 000 000 жетонов
  correct: c
  explanation: 'Текущие модели Claude имеют собственное контекстное окно с 1 М токеном на прямом API, тогда как устаревшая версия Haiku 4.5 имеет 200 КБ. Думайте об этом как об оперативной памяти: когда она заполняется, работа замедляется или выходит из строя, а увеличение окна не устраняет необходимости ею управлять. Этот контекст включает в себя все сообщения, прочитанные файлы, выходные данные команд и результаты работы инструментов. Эффективное управление контекстом описывается как «самая важная концепция Claude Code».'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#the-context-budget"
- id: 02-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: "Что означает строка статуса «Ctx(u): 45%»?"
  options:
    a: Осталось 45 % вашего бюджета.
    b: Вы использовали 45 % контекста.
    c: Загружено 45% файлов
    d: Claude уверен на 45 %
  correct: b
  explanation: "Показатель строки состояния «Ctx(u): 45%» показывает, что вы использовали 45% контекстного окна. Полный формат строки состояния: `Claude Code | Ctx(u): 45% | Cost: $0.23 | Session: 1h 23m`. Отслеживание этого поможет вам узнать, когда использовать /compact или /clear, прежде чем возникнут проблемы, связанные с контекстом."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#reading-the-statusline"
- id: 02-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: В чем разница между /compact и /clear?
  options:
    a: /compact быстрее, /clear тщательнее
    b: /compact обобщает контекст (сохраняет ключевую информацию), /clear начинается полностью заново (теряет весь контекст)
    c: /compact очищает файлы, /clear очищает разговоры.
    d: Они делают то же самое
  correct: b
  explanation: /compact суммирует разговор, сохраняя ключевой контекст и одновременно сокращая использование примерно на 50%. Используйте его, когда заканчивается контекст. /clear запускается совершенно заново, теряя весь контекст — используйте его при смене темы или сильно раздутом контексте. Выбирайте исходя из того, нужно ли вам поддерживать преемственность.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#context-recovery-strategies"
- id: 02-005
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какое действие потребляет САМОЕ большое количество токенов контекста?
  options:
    a: Чтение небольшого файла (~500 токенов)
    b: Выполнение простой команды (~ 1 тыс. токенов)
    c: Чтение большого файла или поиск по нескольким файлам (~5 тыс.+ токенов)
    d: Отправка короткого сообщения
  correct: c
  explanation: Чтение больших файлов (токены более 5 тыс.) и поиск по нескольким файлам (токены более 3 тыс.) потребляют большую часть контекста. Небольшой файл стоит ~500 токенов, запуск команд — ~1000 токенов. Длинные разговоры накапливаются со временем. Для оптимизации будьте конкретны в запросах, используйте ссылки на символы, такие как «прочитайте функцию CalculateTotal», а не на целые файлы.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#what-consumes-context"
- id: 02-006
  difficulty: power
  profiles:
  - power
  question: Что такое «правило последних 20%» в управлении контекстом?
  options:
    a: Всегда сохраняйте последние 20% разговора
    b: Зарезервируйте ~20 % контекста для операций с несколькими файлами, исправлений и генерации сводки в конце сеанса.
    c: Регулярно удаляйте 20% контекста
    d: Используйте только 20 % доступного контекста.
  correct: b
  explanation: "Правило последних 20% рекомендует зарезервировать примерно 20% вашего контекста для: операций с несколькими файлами в конце сеанса, исправлений в последнюю минуту и ​​создания документов summary/checkpoint. Этот буфер гарантирует, что вы сможете правильно завершить свою работу даже при заполнении контекста."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#context-inspection"
- id: 02-007
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое «контекстное отравление» (также называемое контекстным кровотечением)?
  options:
    a: Когда использование контекста достигает 100 %
    b: Когда информация из одной задачи загрязняет другую
    c: Когда Claude забывает твои инструкции
    d: Когда файлы повреждаются
  correct: b
  explanation: "Отравление контекста происходит, когда информация из одной задачи заражает другую. Примеры включают в себя: кровотечение стиля (стиль синей кнопки применяется к несвязанным формам), загрязнение инструкций (конфликтующие правила вызывают путаницу) и временную путаницу (Claude использует устаревшие имена файлов). Используйте четкие границы задач и уточняйте приоритеты, чтобы предотвратить это."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Контекстное отравление (кровотечение)
    line: 2015-2044
- id: 02-008
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что такое 7-шаговый цикл взаимодействия в Claude Code?
  options:
    a: Планируйте, кодируйте, тестируйте, развертывайте, отслеживайте, исправляйте, повторяйте
    b: Описывать, анализировать, предлагать, рассматривать, решать, проверять, принимать на себя обязательства
    c: Чтение, запись, редактирование, запуск, отладка, тестирование, отправка
    d: Спросить, подождать, принять, запустить, проверить, исправить, готово
  correct: b
  explanation: "Цикл взаимодействия: 1) ОПИСАТЬ — объясните, что вам нужно, 2) АНАЛИЗИРОВАТЬ — Claude исследует кодовую базу, 3) ПРЕДЛОЖИТЬ — Claude предлагает изменения (diff), 4) ОБЗОР — вы читаете и оцениваете, 5) РЕШИТЬ — Accept/Reject/Modify, 6) VERIFY — запустить тесты, проверить поведение, 7) COMMIT — сохранить изменения (необязательно). Ключевая идея: вы сохраняете контроль на протяжении всего процесса."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.1 Цикл взаимодействия
    anchor: "#21-the-interaction-loop"
- id: 02-009
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как выйти из режима планирования, чтобы начать вносить изменения?
  options:
    a: /edit
    b: Нажмите Shift+Tab (или ответьте на запрос «Готовы реализовать этот план?»)
    c: /start
    d: /exit-plan
  correct: b
  explanation: Нажмите Shift+Tab, чтобы перейти из режима планирования в режим редактирования или ответить на Claudeподсказка «Готовы реализовать этот план?» для перехода. В режиме планирования Claude можно только читать и анализировать – никакие изменения не допускаются. Нет /execute косая черта в команде Claude Code; выход осуществляется через цикл разрешения Shift+Tab или путем утверждения плана. Такой поэтапный подход гарантирует, что вы поймете план еще до его реализации.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.3 Режим планирования
    anchor: "#exiting-plan-mode"
- id: 02-010
  difficulty: power
  profiles:
  - power
  question: Что такое режим OpusPlan?
  options:
    a: Премиум-уровень подписки
    b: Использование Opus для планирования (превосходное обоснование) и Sonnet для реализации (экономичность).
    c: Режим отладки
    d: Способ планирования без Claude
  correct: b
  explanation: OpusPlan использует Opus для планирования (с превосходными возможностями рассуждения) и автоматически переключается на Sonnet для реализации (более экономичный). Включите с помощью `/model opusplan`. Это обеспечивает планирование качества Opus при сохранении токенов благодаря скорости выполнения Sonnet. Особенно ценно для подписчиков Pro с ограниченным количеством токенов Opus.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.3 Режим планирования
    anchor: "#opusplan-mode"
- id: 02-011
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каковы симптомы истощения контекста?
  options:
    a: Claude печатает медленнее
    b: Более короткие ответы, забывание инструкций CLAUDE.md, несоответствия с предыдущим разговором.
    c: Появляются сообщения об ошибках
    d: Стоимость резко возрастает
  correct: b
  explanation: "Симптомы истощения контекста включают в себя: более короткие ответы, чем обычно (предупреждение), забывание инструкций CLAUDE.md (серьезное), несоответствия с предыдущим разговором (критическое), ошибки в уже обсуждавшемся коде (критическое) и «Я не могу получить доступ к этому файлу» для уже прочитанных файлов (критическое). При появлении критических симптомов немедленно начните новый сеанс."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#context-depletion-symptoms"
- id: 02-012
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что может /rewind?
  options:
    a: Отменить git-коммиты
    b: Отменить изменения файла Claude в текущем сеансе.
    c: Вернуться в историю разговоров
    d: Восстановить удаленные файлы с диска
  correct: b
  explanation: "/rewind отменяет изменения файла, сделанные Claude. Он работает с несколькими файлами, но только с изменениями Claude (а не с ручными изменениями), только в пределах текущего сеанса и НЕ отменяет автоматически коммиты git. Для рискованных операций сначала создайте контрольную точку git: «Давайте зафиксируем то, что у нас есть, прежде чем пробовать этот экспериментальный подход»."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.4 Перемотка назад
    anchor: "#24-rewind"
- id: 02-013
  difficulty: senior
  profiles:
  - senior
  - power
  question: К чему Claude НЕ имеет доступа в отношении вашего проекта?
  options:
    a: Структура файла и содержимое кода
    b: Состояние и ветки Git
    c: Состояние времени выполнения, внешние службы и скрытые файлы
    d: Правила проекта в CLAUDE.md
  correct: c
  explanation: "Claude знает: структуру файла, содержимое кода, состояние git и правила проекта (CLAUDE.md). Claude НЕ знает: состояние выполнения (не видит запущенные процессы), внешние службы (не может напрямую обращаться к базам данных), ваше намерение (нужны четкие инструкции) и скрытые файлы (по умолчанию уважает .gitignore). Понимание этой ментальной модели поможет вам эффективно общаться."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.5 Ментальная модель
    anchor: "#what-claude-doesnt-know"
- id: 02-014
  difficulty: power
  profiles:
  - power
  question: Какова цель «Техники проверки здравомыслия»?
  options:
    a: Чтобы проверить правильность компиляции кода
    b: Чтобы убедиться, что Claude правильно загрузил конфигурацию CLAUDE.md.
    c: Чтобы проверить наличие утечек памяти
    d: Для проверки покрытия тестами
  correct: b
  explanation: 'Метод проверки работоспособности проверяет, что Claude загрузил вашу конфигурацию. Добавьте в CLAUDE.md идентифицируемую информацию (например, ваше имя, название проекта, технический стек), затем спросите Claude: «Как меня зовут? Над каким проектом я работаю?» Правильные ответы подтверждают, что конфигурация загружена. Для расширенной проверки добавьте несколько контрольных точек в длинные файлы CLAUDE.md.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#sanity-check-technique"
- id: 02-015
  difficulty: senior
  profiles:
  - senior
  - power
  question: Когда следует использовать подсказки, структурированные в формате XML?
  options:
    a: Для всех подсказок независимо от сложности
    b: Для многоэтапных функций, исследования ошибок с учетом контекста и проверок кода с конкретными критериями.
    c: Только для простых однострочных запросов
    d: Только при работе с API
  correct: b
  explanation: Используйте подсказки со структурой XML, когда запросы имеют более 3 различных аспектов (инструкция + контекст + ограничения), когда неоднозначность вызывает недопонимание, при создании многократно используемых шаблонов или для сложной иерархии. Не используйте их для простых однострочных запросов или быстрого исправления опечаток — накладные расходы перевешивают выгоду. Такие теги, как <instruction>, <context>, <constraints>, помогают Claude понять различные аспекты.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.6 Когда использовать подсказки, структурированные в формате XML
    line: 2927-2951
- id: 02-016
  difficulty: power
  profiles:
  - power
  question: Для чего используется «шаблон передачи сеанса»?
  options:
    a: Передача сессий между членами команды
    b: Документирование состояния, решений и следующих шагов для обеспечения непрерывности между сеансами.
    c: Резервное копирование вашего кода
    d: Экспорт истории разговоров
  correct: b
  explanation: "Шаблон передачи сеанса создает документ для устранения промежутков между сеансами. Он включает в себя: что было достигнуто, текущее состояние, принятые решения, следующие шаги и контекст для следующего сеанса. Создавайте передачи обслуживания в конце рабочего дня, перед ограничением контекста, при переключении областей внимания или во время перерывов. Магазин в `claudedocs/handoffs/handoff-YYYY-MM-DD.md`."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#session-handoff-pattern"
- id: 02-017
  difficulty: senior
  profiles:
  - senior
  - power
  question: Согласно стоимостной документации Anthropic, какова средняя стоимость одного разработчика за активный день в корпоративных развертываниях?
  options:
    a: Около 1 доллара
    b: Около 5 долларов
    c: Около 13 долларов США
    d: Около 60 долларов
  correct: c
  explanation: В корпоративных развертываниях средняя стоимость составляет около 13 долларов США на разработчика за активный день и 150–250 долларов США на разработчика в месяц, при этом затраты ниже 30 долларов США за активный день для 90% пользователей. Это средние значения для бюджета пилотного проекта, а не цена за сеанс, поэтому измерьте расходы своей команды с помощью /usage, прежде чем экстраполировать.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.2 Управление контекстом
    anchor: "#cost-awareness-optimization"
- id: 02-018
  difficulty: power
  profiles:
  - power
  question: Что такое режим автоматического планирования и как его включить?
  options:
    a: Автоматическое планирование, которое всегда включено по умолчанию
    b: Конфигурация, которая заставляет Claude представлять план и ждать утверждения перед выполнением любого инструмента.
    c: Режим, который автоматически генерирует планы проектов.
    d: Премиум-функция для корпоративных пользователей
  correct: b
  explanation: В режиме автоматического планирования Claude представляет план и ожидает явного одобрения пользователя, прежде чем запускать ЛЮБОЙ инструмент. Настройте через `~/.claude/auto-plan-mode.txt` и запустите с помощью `claude --append-system-prompt "$(cat ~/.claude/auto-plan-mode.txt)"`. В результате получается на 76 % меньше токенов и лучшие результаты, поскольку планы проверяются перед выполнением.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 2.3 Режим планирования
    anchor: "#auto-plan-mode"
- id: 02-019
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - pm
  question: Что изменилось в модели Claude Code по умолчанию в версии 2.1.197?
  options:
    a: Claude Haiku стал моделью по умолчанию, позволяющей сократить расходы по всем направлениям.
    b: Claude Opus стал моделью по умолчанию, ограниченной контекстным окном в 500 000 токенов.
    c: Claude Sonnet 5 стала моделью по умолчанию с собственным контекстным окном для токенов 1M.
    d: Модель по умолчанию осталась прежней, изменилась только ценовая категория.
  correct: c
  explanation: Версия 2.1.197 представила Claude Sonnet 5 в качестве новой модели по умолчанию в Claude Code с собственным контекстным окном на 1 М токен, а не с ограниченным или уменьшенным окном. Opus и Haiku по-прежнему можно выбирать через /model, но в этом выпуске ни один из них не стал стандартным.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.197
- id: 02-020
  difficulty: intermediate
  profiles:
  - senior
  - pm
  - power
  question: Какие рекламные цены сопровождали запуск Claude Sonnet 5 в Claude Code (v2.1.197)?
  options:
    a: 2 доллара США за миллион входных токенов и 10 долларов США за миллион выходных токенов до 31 августа.
    b: 3 доллара США за миллион входных токенов и 15 долларов США за миллион выходных токенов до 31 августа.
    c: Абсолютно бесплатно для любого пользователя в период запуска.
    d: 1 доллар США за миллион входных токенов и 5 долларов США за миллион выходных токенов до 31 августа.
  correct: a
  explanation: В примечаниях к выпуску версии 2.1.197 указано, что Sonnet 5 запущен по рекламной цене в размере 2 долларов США за миллион входных токенов и 10 долларов США за миллион выходных токенов, действителен до 31 августа. Он не был бесплатным, а другие ценовые пары не соответствуют примечаниям к выпуску. Относитесь к этому как к ограниченной по времени рекламной акции, а не как к постоянной цене.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.197
- id: 02-021
  difficulty: senior
  profiles:
  - senior
  - power
  question: Почему в руководстве фраза «просто использовать контекстное окно токена 1M» рассматривается как антишаблон, а не как преимущество?
  options:
    a: Потому что окна с токенами 1M пока недоступны большинству пользователей Claude Code.
    b: Потому что окно в 1 миллион токенов стоит одинаково за запрос независимо от того, насколько оно заполнено.
    c: Потому что окно, полное шума, устаревших поворотов и повторяющихся инструкций, работает хуже, чем маленькое, тщательно подобранное, и стоит дороже.
    d: Потому что API выдает серьезную ошибку, когда сеанс пересекает примерно 900 тысяч токенов.
  correct: c
  explanation: В руководстве это сформулировано как вопрос соотношения сигнал-шум, а не вопрос мощности. Окно на 128 тысяч токенов с хорошо поддерживаемым и тщательно подобранным контентом превосходит окно на 1 миллион токенов, загруженное устаревшими поворотами и избыточными выводами инструментов. Большое окно не устраняет разрушение контекста, а задерживает его, делая каждый запрос медленнее и дороже. На уровне 900 КБ нет жесткой ошибки токена, а стоимость зависит от того, что на самом деле отправлено, поэтому заполнение окна само по себе является чистым недостатком.
  doc_reference:
    file: guide/core/context-engineering.md
    section: "MECW: Максимально эффективное контекстное окно"
- id: 02-022
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Для чего лучше всего подходит методология BMAD (Big Model Agentic Development)?
  options:
    a: Небольшие команды из 2–3 человек, которым требуется быстрая итерация.
    b: Проекты высокой сложности со стабильными требованиями, в которых окупается глубокое планирование
    c: Любой проект с более чем 10 разработчиками
    d: Только новые проекты, никогда устаревшие кодовые базы.
  correct: b
  explanation: BMAD оптимизирован для проектов высокой сложности со стабильными требованиями, где первоначальные инвестиции в структурированное планирование (требования, архитектура, истории) приносят дивиденды. Ключевой критерий — сложность + стабильность, а не численность команды. BMAD использует специализированных агентов (аналитик, архитектор, SM, Dev) для систематического разбиения и выполнения работы. Он борется с быстро меняющимися требованиями, поскольку стоимость перепланирования высока.
  doc_reference:
    file: guide/core/methodologies.md
    section: "Уровень 1: Стратегическая оркестровка"
    anchor: "#tier-1-strategic-orchestration"
- id: 02-023
  difficulty: intermediate
  profiles:
  - senior
  - power
  question: Каков основной критерий выбора FDD (Feature-Driven Development) с Claude Code?
  options:
    a: Команды размером менее 5 разработчиков, которым нужен простой процесс
    b: Функциональные команды с потребностями в параллельной доставке, одновременно разрабатываются несколько функций.
    c: Проекты, требующие подробной документации UML и моделей проектирования.
    d: Корпоративные команды, насчитывающие более 50 разработчиков
  correct: b
  explanation: Основным критерием FDD являются фиче-команды с потребностями в параллельной доставке, когда в команде одновременно разрабатывается несколько функций. Итерация каждой функции FDD (Проектирование → Сборка) хорошо сочетается с рабочим процессом Claude Code, основанным на сеансах, где каждая функция получает специальный сеанс планирования и реализации. Ключевым сигналом является «параллельная поставка», а не размер команды. FDD менее подходит для проектов, в которых функции имеют глубокие взаимозависимости, требующие последовательной разработки.
  doc_reference:
    file: guide/core/methodologies.md
    section: "Уровень 4: Доставка функций"
    anchor: "#tier-4-feature-delivery"

category: Команды
category_id: 6
source_file: guide/ultimate-guide.md
questions:
- id: 06-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Где следует размещать специальные команды (вызываемые пользователем навыки), чтобы они были доступны в Claude Code?
  options:
    a: ~/.claude/skills/
    b: .claude/skills/
    c: /usr/local/claude/commands/
    d: .claude/config/commands/
  correct: b
  explanation: |-
    Начиная с CC 2.1.3, специальные команды слэша находятся в `.claude/skills/` как вызываемые пользователем навыки. Каждая команда представляет собой папку с файлом `SKILL.md`, включающим в себя `disable-model-invocation: true`.

    Это позволяет использовать команды, специфичные для проекта, которые можно фиксировать в вашей кодовой базе.
    Глобальный каталог `~/.claude/skills/` предназначен для личных команд, доступных во всех проектах.

    Навыки организованы в подкаталогах:
    - `.claude/skills/tech/deploy/` для рабочих процессов разработки.
    - `.claude/skills/product/scope/` для рабочих процессов продукта
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.2 Создание пользовательских команд
    anchor: "#62-creating-custom-commands"
- id: 06-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как вызвать вызываемый пользователем навык с именем `commit`, расположенный в `.claude/skills/tech/commit/`?
  options:
    a: /commit
    b: /tech-commit
    c: /tech:commit
    d: "!tech/commit"
  correct: c
  explanation: |-
    Навыки, вызываемые пользователем, используют формат `/folder:name` в зависимости от пути к каталогу `.claude/skills/`.

    Таким образом, `.claude/skills/tech/commit/SKILL.md` становится `/tech:commit`.
    Такое соглашение об именах позволяет организовывать навыки по доменам, сохраняя при этом интуитивно понятный вызов.

    Examples:
    - `.claude/skills/tech/pr/SKILL.md` -> `/tech:pr`
    - `.claude/skills/product/scope/SKILL.md` -> `/product:scope`

    Начиная с CC 2.1.3, эти навыки заменяют старые файлы `.claude/commands/`. Флаг `disable-model-invocation: true` во внешнем элементе SKILL.md гарантирует, что они срабатывают только при явном вызове пользователя.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.2 Создание пользовательских команд
    anchor: "#command-naming"
- id: 06-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какая переменная используется в командных файлах для доступа к аргументам, передаваемым команде?
  options:
    a: $ARGS
    b: $ВХОД
    c: $ARGUMENTS
    d: $ПАРАМС
  correct: c
  explanation: |-
    Переменная `$ARGUMENTS` содержит текст, передаваемый после вызова команды.

    **Параметры синтаксиса**:
    - `$ARGUMENTS` → Полная строка аргумента
    - `$ARGUMENTS[0]` → Первый аргумент
    - `$ARGUMENTS[1]` → Второй аргумент
    - **Сокращенное обозначение**: `$0`, `$1`, `$2` → эквивалентно `$ARGUMENTS[0]`, `$ARGUMENTS[1]`, `$ARGUMENTS[2]`

    **Пример**: `/tech:deploy production staging`
    - `$ARGUMENTS` = `"production staging"`
    - `$0` или `$ARGUMENTS[0]` = `"production"`
    - `$1` или `$ARGUMENTS[1]` = `"staging"`

    Команды должны документировать ожидаемые аргументы и корректно обрабатывать пропущенные значения.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.2 Создание пользовательских команд
    anchor: "#variable-interpolation"
- id: 06-004
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какая встроенная команда отображает все доступные команды, включая пользовательские?
  options:
    a: /commands
    b: /list
    c: /help
    d: /show
  correct: c
  explanation: |-
    Команда `/help` отображает все доступные команды, как встроенные, так и пользовательские.

    Встроенные команды включают в себя:
    - `/clear` - Четкий разговор
    - `/compact` - Обобщить контекст
    - `/status` - Открыть вкладку Статус (версия, модель, учетная запись, подключение)
    - `/plan` - войти в режим планирования
    - `/rewind` - Отменить изменения

    Здесь также перечислены пользовательские навыки из `.claude/skills/` (с `disable-model-invocation: true`). Начиная с CC 2.1.3, специальные команды косой черты находятся в `.claude/skills/`, а не в `.claude/commands/`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.1 Слэш-команды
    anchor: "#61-slash-commands"
- id: 06-005
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие разделы должен включать хорошо структурированный шаблон команды в соответствии с лучшими практиками?
  options:
    a: Цель, шаги, результат
    b: Цель, процесс, аргументы, формат вывода, примеры, обработка ошибок
    c: Имя, Описание, Код
    d: Заголовок, тело, нижний колонтитул
  correct: b
  explanation: |-
    Полный шаблон команды должен включать в себя:

    1. **Purpose** — Краткое описание того, что делает команда.
    2. **Process** - Должна следовать пошаговая инструкция Claude
    3. **Arguments** — Как обрабатывать $ARGUMENTS (если предусмотрен provided/not)
    4. **Output Format** — ожидаемая структура вывода.
    5. **Examples** — Конкретные примеры использования.
    6. **Error Handling** — Как обрабатывать крайние случаи и сбои

    Эта комплексная структура обеспечивает последовательное и надежное выполнение команд.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.3 Шаблон команды
    anchor: "#63-command-template"
- id: 06-006
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какая команда переходит в режим планирования для безопасного исследования только для чтения?
  options:
    a: /safe
    b: /readonly
    c: /plan
    d: /explore
  correct: c
  explanation: |-
    Команда `/plan` переходит в режим планирования, в котором Claude может анализировать и исследовать
    кодовую базу без внесения каких-либо изменений.

    Это идеально подходит для:
    - Понимание незнакомых кодовых баз.
    - Архитектурный анализ перед изменениями
    - Безопасное исследование рискованных операций

    Выйдите из режима плана, одобрив план, представленный Claude, или с помощью `Shift+Tab`.
    Нет `/execute` командовать Claude Code.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.1 Слэш-команды
    anchor: "#built-in-commands"
- id: 06-007
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков рекомендуемый формат сообщения фиксации в примере с командой фиксации?
  options:
    a: Простое описание
    b: "Обычные фиксации: тип (объем): описание"
    c: Дата - Автор - Сообщение
    d: "ДЖИРА-123: Сообщение"
  correct: b
  explanation: |-
    В руководстве рекомендуется формат обычных коммитов: `type(scope): description`.

    Распространенные типы:
    - `feat`: новая функция.
    - `fix`: исправлена ​​ошибка.
    - `refactor`: Реструктуризация кода.
    - `docs`: Документация
    - `test`: Тестовые изменения
    - `chore`: Техническое обслуживание

    Это обеспечивает согласованную и анализируемую историю коммитов, полезную для журналов изменений и выпусков.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.4 Примеры команд
    anchor: "#example-1-commit-command"
- id: 06-008
  difficulty: power
  profiles:
  - power
  question: Какой метод использует команда «Фреймировщик проблем» для поиска коренных причин?
  options:
    a: SWOT-анализ
    b: 5 анализ «почему»
    c: Парето-анализ
    d: Диаграмма «рыбий кости»
  correct: b
  explanation: |-
    Команда «Фреймировщик проблем» использует технику «Анализ 5 почему».

    Это включает в себя вопрос «Почему?» пять раз, чтобы выяснить причину:
    - Почему 1: Первый ответ
    - Почему 2: более глубокий ответ
    - Почему 3: Еще глубже
    - Почему 4: Получение root-прав
    - Почему 5: Основная причина

    Затем команда переформулирует проблему следующим образом: «Как мы можем [действие] для [пользователя] добиться [результата]?»
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.4 Примеры команд
    anchor: "#example-3-problem-framer-command"
- id: 06-009
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что делает команда `/rewind`?
  options:
    a: Восстанавливает предыдущий коммит git
    b: Отменяет недавние изменения Claude в текущем сеансе.
    c: Очищает всю историю разговоров
    d: Отменяет последнее выполнение команды
  correct: b
  explanation: |-
    Команда `/rewind` отменяет недавние изменения Claude в текущем сеансе.

    Ключевые моменты:
    - Работает только для незафиксированных изменений, сделанных Claude.
    - НЕ создает git-коммиты
    - Используйте, когда Claude допустил ошибку и вы хотите попробовать другой подход.

    Для зафиксированных изменений используйте вместо этого `git revert`.
    Сочетание клавиш `Esc×2` (двойное нажатие Escape) также запускает перемотку.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.1 Слэш-команды
    anchor: "#built-in-commands"
- id: 06-010
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что должна делать обработка ошибок команды PR, если пользователь НЕ находится в ветке функции?
  options:
    a: Автоматически создавать ветку функций
    b: Продолжать в любом случае с предупреждениями
    c: "ВНИМАНИЕ: сначала создайте ветку функций."
    d: Выйти бесшумно
  correct: c
  explanation: |-
    Согласно примеру команды PR, если пользователь не находится в функциональной ветке,
    команда должна ПРЕДУПРЕЖДАТЬ: «Сначала создайте ветку функции».

    Аналогично, если рабочий каталог загрязнен, он должен СПРОСИТЬ: «Сначала зафиксировать изменения?»

    Хороший дизайн команд включает в себя четкую обработку ошибок, которая:
    - Предупреждает пользователей о предварительных требованиях.
    - Предлагает корректирующие действия.
    - Предотвращает случайные ошибки
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.4 Примеры команд
    anchor: "#example-2-pr-command"
- id: 06-011
  difficulty: power
  profiles:
  - power
  question: Каков рекомендуемый порядок команд git в рабочем процессе создания PR?
  options:
    a: толкайте, различайте, создавайте пиар
    b: статус, ветка, журнал, разница, при необходимости нажмите, создайте PR
    c: добавить, зафиксировать, нажать, создать PR
    d: оформление заказа, статус, push, создание пиара
  correct: b
  explanation: |-
    Рекомендуемый порядок работы с PR:

    1. `git status` — проверьте чистоту рабочего каталога.
    2. `git branch` — Подтвердите ветку функций.
    3. `git log main..HEAD` — просмотреть все коммиты.
    4. `git diff main...HEAD` — увидеть все изменения по сравнению с основным
    5. `git push -u origin [branch]` — Нажмите, если еще не нажали.
    6. `gh pr create` — Создайте пиар

    Этот тщательный процесс гарантирует качество PR в правильном контексте.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.4 Примеры команд
    anchor: "#example-2-pr-command"
- id: 06-012
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как вы ссылаетесь на файл при разговоре с Claude Code?
  options:
    a: "#имя файла"
    b: "@имя файла"
    c: "!имя файла"
    d: $имя_файла
  correct: b
  explanation: |-
    Синтаксис `@filename` ссылается на файл в вашем разговоре с Claude.

    Быстрые действия:
    - `@file` - Ссылка на файл
    - `!command` - Запустить команду оболочки
    - `Ctrl+C` - Отмена операции
    - `Ctrl+R` - Повторить последнюю попытку

    Это позволяет вам легко помещать определенные файлы в контекст для анализа Claude.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.1 Таблица команд
    anchor: "#quick-actions"
- id: 06-013
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что делает команда `/loop` в Claude Code (v2.1.71+)?
  options:
    a: Повторяет последнюю команду один раз
    b: Вводит бесконечный цикл разговора без ограничения сеанса
    c: Запускает команду приглашения или косой черты через повторяющийся интервал (например, каждые 5 минут).
    d: Перебирает все файлы в текущем каталоге.
  correct: c
  explanation: |-
    `/loop [interval] [prompt]` запускает команду приглашения или косой черты по регулярному расписанию. Пример: `/loop 5m check the deploy` проверяет развертывание каждые 5 минут, пока вы его не остановите. Это полезно для задач мониторинга, периодических проверок статуса или периодической автоматизации, не выходя из Claude Code. Интервал может быть указан в минутах (`5m`), секундах (`30s`) или часах (`1h`).
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: 10.1 Таблица команд
    anchor: "#101-commands-table"
- id: 06-014
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что делает команда `/simplify` (v2.1.63+)?
  options:
    a: Переформатирует код в соответствии со стилем проекта (эквивалент Prettier).
    b: Проверяет недавно измененный код на предмет чрезмерного проектирования, дублирования и избыточных абстракций, а затем исправляет их.
    c: Удаляет все комментарии и мертвый код из текущего файла.
    d: Обобщает различия с момента последнего коммита простым языком.
  correct: b
  explanation: |-
    `/simplify` проверяет ваш **недавно измененный код** на наличие чрезмерного проектирования и избыточных абстракций, а затем исправляет обнаруженные проблемы. Он работает на уровне архитектуры и структуры (анализируя возможности повторного использования, проблемы качества и повышения эффективности), а не на уровне форматирования или проверки. Он дополняет такие инструменты, как ESLint или Prettier, а не заменяет их. Запустите его после завершения работы над функцией, прежде чем открывать запрос на включение: `/simplify` (все изменения) или `/simplify focus on error handling` (целевая область).
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Команда /simplify
    anchor: "#the-simplify-command"
- id: 06-015
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что делает команда `/batch` в Claude Code (v2.1.63+)?
  options:
    a: Запускает одну команду в пакетном (неинтерактивном) режиме.
    b: Группирует несколько ожидающих изменений в один коммит.
    c: Последовательно выполняет все задачи агента в очереди.
    d: Организует крупномасштабные изменения кодовой базы с помощью 5–30 параллельных агентов в изолированных рабочих деревьях, каждый из которых открывает свой собственный PR.
  correct: d
  explanation: |-
    `/batch` распределяет крупномасштабные изменения кодовой базы между 5–30 параллельными агентами в изолированных рабочих деревьях git. Каждый агент выполняет независимую часть работы и открывает собственный запрос на включение. Рабочий процесс таков: (1) исследовать и планировать изменения, (2) создавать агенты параллельного рабочего дерева, (3) каждый агент завершает свою часть и создает PR. Идеально подходит для таких миграций, как `/batch migrate from react to vue` или `/batch add type annotations to all JavaScript files`, — задач, которые можно разделить на независимые блоки.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Команда /batch
    anchor: "#the-batch-command"
- id: 06-016
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Что делают команды `/stats` и `/rename` (добавлены в шпаргалку v3.32.2)?
  options:
    a: /stats показывает диаграмму использования + полосу; /rename устанавливает собственное имя для текущего сеанса.
    b: /stats показывает стоимость токена; /rename переименовывает последний файл CLAUDE.md.
    c: /stats показывает статистику различий файлов; /rename переименовывает текущую ветку git.
    d: Обе команды являются псевдонимами /status с разными форматами вывода.
  correct: a
  explanation: |-
    `/stats` отображает диаграмму использования и серию, визуальную сводку вашей активности Claude Code с течением времени. `/rename [name]` присваивает текущему сеансу собственное имя, что упрощает поиск в истории `/resume`. Оба были задокументированы в обновлении шпаргалки вместе с `/loop` и `/copy` (из выпусков v2.1.59–v2.1.71). Это команды качества жизни для управления сеансами и отслеживания личного использования.
    ---
  doc_reference:
    file: guide/cheatsheet.md
    section: Основные команды
    anchor: "#essential-commands"
- id: 06-017
  difficulty: power
  profiles:
  - senior
  - power
  question: Начиная с версии 2.1.223, как /review связан с /code-review?
  options:
    a: /review — многоагентный вариант, а /code-review — быстрый однопроходной вариант.
    b: /review представляет собой отдельный быстрый однопроходный обзор только для чтения GitHub пиар, при этом /code-review запускает мультиагентную проверку
    c: /review — это псевдоним /code-review, он использует те же уровни усилий и флаги.
    d: /review работает только с локальными различиями, а /code-review работает только с PR GitHub.
  correct: c
  explanation: "Начиная с версии 2.1.223, /review является псевдонимом /code-review: он просматривает текущие различия или номер PR, ветку или путь, который вы проходите, и принимает те же уровни усилий (от низкого до максимального, плюс ультра) и флаги. До версии 2.1.223 /review представляла собой отдельную команду, которая выполняла однопроходную проверку запроса на извлечение GitHub только для чтения, что и описывает опция b. Вариант d предполагает разделение локальных и GitHub, которого между ними никогда не существовало."
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.202
- id: 06-018
  difficulty: intermediate
  profiles:
  - junior
  - senior
  - power
  question: Что случилось с командой интерактивного мастера /agents начиная с версии 2.1.198?
  options:
    a: Он был объединен с /config как новая вкладка.
    b: Он был переименован в /subagents, но работает так же.
    c: Он все еще существует, но теперь требует флага --legacy.
    d: Интерактивный мастер был удален; /agents теперь печатает только напоминание о том, чтобы попросить Claude управлять субагентами или редактировать .claude/agents/ напрямую.
  correct: d
  explanation: Мастер /agents был удален в версии 2.1.198. В версии 2.1.198 и более поздних версиях /agents печатает только напоминание о том, что нужно попросить Claude создать или управлять субагентами или напрямую редактировать .claude/agents/ или ~/.claude/agents/; в версии 2.1.197 и ранее открывался интерактивный интерфейс. Он не был объединен с /config, переименован или закрыт флагом.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 06-019
  difficulty: power
  profiles:
  - senior
  - power
  question: Начиная с версии 2.1.191, может ли /rewind восстанавливать разговор после запуска /clear?
  options:
    a: Нет, запуск /clear навсегда отменяет возможность перемотки чего-либо до этого.
    b: Да, /rewind может возобновить разговор, который был до запуска /clear.
    c: Только если сессия была сохранена с /save до /clear.
    d: Да, но только в течение того же календарного дня, что и /clear.
  correct: b
  explanation: Начиная с версии 2.1.191, /rewind может возобновить диалог до запуска /clear, поэтому очистка видимого контекста больше не означает потерю возможности вернуться назад. До этого изменения /clear фактически был бы точкой невозврата для целей перемотки назад. Варианты c и d предусматривают условия, шаг ручного сохранения и временное окно, которые не упоминаются в примечаниях к выпуску.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.191
- id: 06-020
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Как вызвать специальную команду с именем `commit.md`, расположенную в `.claude/commands/tech/`?
  options:
    a: /commit
    b: /tech-commit
    c: /tech:commit
    d: "!tech/commit"
  correct: c
  explanation: |-
    Пользовательские команды используют формат `/folder:filename` (без расширения .md).

    Таким образом, `.claude/commands/tech/commit.md` становится `/tech:commit`.
    Такое соглашение об именах позволяет организовывать команды по доменам, сохраняя при этом интуитивно понятный вызов.

    Examples:
    - `.claude/commands/tech/pr.md` -> `/tech:pr`
    - `.claude/commands/product/scope.md` -> `/product:scope`
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.2 Создание пользовательских команд
    anchor: "#command-naming"
- id: 06-021
  difficulty: senior
  profiles:
  - senior
  - power
  question: Вы запускаете `/loop 5m check the deploy`. Как Claude Code это выполняет и как это остановить?
  options:
    a: Запускает подсказку один раз, затем ожидает повторного запуска вручную. Остановитесь, закрыв терминал.
    b: Выполняет запрос каждые 5 минут, пока вы не нажмете Ctrl+C или не отправите новое сообщение.
    c: Создает фоновое задание cron, которое продолжается даже после выхода Claude Code.
    d: Запускает приглашение в отдельном сеансе субагента по 5-минутному расписанию.
  correct: b
  explanation: "`/loop [interval] [prompt]` запускает заданную строку или команду с косой чертой несколько раз с указанным интервалом. После каждого выполнения Claude ожидает интервал и выполняется снова. Интервал по умолчанию, если ничего не указано, составляет 10 минут. Остановить просто: нажмите Ctrl+C или отправьте любое новое сообщение. Цикл не сохраняется после сеанса. Общие случаи использования включают мониторинг развертываний, опрос отзывов по связям с общественностью и проверку фоновых задач."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Команда /loop
    anchor: "#the-loop-command"
- id: 06-022
  difficulty: senior
  profiles:
  - senior
  - power
  question: В чем ключевое различие между `/branch` и началом новой сессии `claude` в момент принятия решения?
  options:
    a: "Разницы нет: `/branch` — это всего лишь псевдоним для начала новой сессии."
    b: "`/branch` разветвляет текущий сеанс на независимую копию, которая сохраняет весь предыдущий контекст, в то время как новый сеанс начинается пустым."
    c: "`/branch` автоматически создает ветку git, тогда как новый сеанс не создает"
    d: "`/branch` доступен только в режиме планирования; новая сессия работает в любом режиме"
  correct: b
  explanation: "`/branch` создает новый независимый сеанс, который начинается с истории текущего сеанса. Обе ветви затем развиваются независимо. Эквивалентным подходом CLI является `claude --resume <session-id> --fork-session`. Новый сеанс `claude` начинается без истории разговоров, при этом теряется весь контекст, накопленный до момента принятия решения. Используйте `/branch`, если хотите попробовать два разных подхода к одной и той же проблеме, не теряя при этом ни одной отправной точки."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Разветвление сеанса
    anchor: "#session-forking"
- id: 06-023
  difficulty: power
  profiles:
  - power
  question: Что делает поле заголовка `argument-hint` в пользовательском файле команд или навыков?
  options:
    a: Предоставляет резервное значение для `$ARGUMENTS`, когда пользователь вызывает команду без аргументов.
    b: Отображает текст-заполнитель в пользовательском интерфейсе выбора команд с косой чертой, показывая ожидаемый формат аргумента.
    c: Проверяет аргументы по схеме перед запуском команды.
    d: Устанавливает уровень усилий по умолчанию при вызове команды с аргументами
  correct: b
  explanation: '`argument-hint` — это поле заголовка, которое определяет, какой текст-заполнитель отображается в средстве выбора команды с косой чертой, когда команда или навык принимает `$ARGUMENTS`. Когда пользователь вводит имя команды, средство выбора показывает подсказку в виде визуального руководства по ожидаемому формату аргумента. Пример: `argument-hint: "<env> [--skip-tests] [--dry-run]"`. Это поле не влияет на проверку аргументов или значения по умолчанию. Это просто возможность пользовательского интерфейса для обнаружения.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 6.3 Интерполяция переменных
    anchor: "#variable-interpolation"
- id: 06-024
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какое сочетание команд и целей среди примеров команд `/investigate`, `/qa` и `/canary` является правильным?
  options:
    a: "`/investigate` = мониторинг после развертывания; `/qa` = отладка основной причины; `/canary` = тестирование обеспечения качества"
    b: "`/investigate` = отладка основной причины перед любым исправлением; `/qa` = тестирование качества веб-приложения с учетом различий; `/canary` = мониторинг производства после развертывания"
    c: "`/investigate` = рабочий процесс проверки кода; `/qa` = развертывание канареечного развертывания; `/canary` = автоматическое создание тестов"
    d: "`/investigate` = сканирование уязвимостей безопасности; `/qa` = отчет о покрытии тестами; `/canary` = постепенное развертывание трафика"
  correct: b
  explanation: Все три являются пользовательскими шаблонами команд в `examples/commands/`. `/investigate` обеспечивает систематический анализ первопричин перед написанием какого-либо исправления. `/qa` выполняет многоуровневую проверку качества с учетом различий в веб-приложении, определяя затронутые маршруты из изменений текущей ветки. `/canary` отслеживает работающее приложение после развертывания и сравнивает его с базовым состоянием перед развертыванием. Эти команды показывают, как можно закодировать структурированные рабочие процессы, выходящие за рамки простых подсказок.
  doc_reference:
    file: examples/commands/
    section: Пользовательские шаблоны команд
    anchor: "#command-examples"
- id: 06-025
  difficulty: power
  profiles:
  - power
  question: Вам необходимо детерминированное выполнение CI/CD, на которое не влияют настройки локального разработчика. Какой флаг CLI обеспечивает это?
  options:
    a: "`--dangerously-skip-permissions`: обходит все проверки разрешений для автономного выполнения."
    b: "`--bare`: пропускает автоматическое обнаружение перехватчиков, навыков, плагинов, субагентов, серверов MCP, автоматической памяти и CLAUDE.md."
    c: "`--no-mcp`: отключает все серверы MCP для чистой среды выполнения."
    d: "Только `-p`: режим печати уже обеспечивает герметичную среду выполнения."
  correct: b
  explanation: '`--bare` — это минимальный режим для скриптовых вызовов `-p`, таких как `claude --bare -p "query"`. Он пропускает автоматическое обнаружение перехватчиков, навыков, пользовательских команд, субагентов, установленных плагинов, серверов MCP, автоматической памяти и CLAUDE.md, поэтому конфигурация локального разработчика не влияет на выполнение конвейера; Claude содержит инструменты Bash, чтения и редактирования файлов. Навыки в каталоге, который вы передаете с помощью `--add-dir`, все равно загружаются. Без `--bare` вызов `claude -p` в CI мог бы использовать перехватчики, плагины и навыки, установленные на машине, настраивающей бегун, что делает поведение конвейера недетерминированным.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: GitHub Actions Интеграция
    anchor: "#github-actions-integration"
- id: 06-026
  difficulty: power
  profiles:
  - power
  question: Каково назначение флага `--channels` CLI?
  options:
    a: Указывает, какие каналы связи (Slack, электронная почта, веб-перехватчик) получают выходные данные Claude.
    b: Устанавливает количество параллельных каналов выполнения инструмента для повышения производительности.
    c: Включает ретрансляцию разрешений, с помощью которой серверы каналов MCP могут пересылать запросы на утверждение инструмента во внешнюю систему.
    d: Настраивает Claude для подписки на определенные каналы событий из внешних служб.
  correct: c
  explanation: "`--channels` — это механизм ретрансляции разрешений. Серверы MCP, которые заявляют о возможности `permission`, могут использовать ее для пересылки запросов на одобрение инструмента из терминала, например, на ваш телефон, чтобы вы могли удаленно утверждать или отклонять вызовы инструментов, не находясь за клавиатурой. Это отличается от удаленного управления (которое отражает весь сеанс). Функция каналов конкретно предназначена для делегирования потока принятия решений о разрешениях внешней системе."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Интеграция
    anchor: "#integration"
- id: 06-027
  difficulty: senior
  profiles:
  - senior
  - power
  question: При беге `claude auth login`, что означает `--console` флаг делать?
  options:
    a: Выводит токен аутентификации на стандартный вывод вместо сохранения его в связке ключей.
    b: Аутентификация осуществляется через консоль Anthropic (биллинг API) вместо стандартного потока Claude.ai OAuth.
    c: Открывает представление отладки консоли браузера для устранения проблем с аутентификацией.
    d: Включает структурированный вывод JSON для команды входа в систему.
  correct: b
  explanation: Флаг `--console` направляет аутентификацию через консоль Anthropic, которая является путем выставления счетов API. Это правильный выбор для команд и разработчиков, которые получают доступ к Claude Code через ключи API, управляемые на console.anthropic.com, в отличие от стандартной процедуры подписки OAuth на claude.ai. Если ваша организация управляет учетными данными API через консоль Anthropic, а не через отдельные учетные записи claude.ai, используйте `claude auth login --console` для правильной аутентификации.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.79 (2026-03-19)
    anchor: "#v2179-2026-03-19"

questions:
- id: 07-001
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой код завершения должен вернуть перехватчик для БЛОКИРОВКИ операции?
  options:
    a: "0"
    b: "1"
    c: "2"
    d: "255"
  correct: c
  explanation: |-
    Коды выхода из перехватчика имеют особое значение:

    - **Код выхода 0**: успех - разрешить продолжение операции.
    - **Код выхода 2**: Блокировать – запретить выполнение операции.
    - **Другие коды**: Ошибка - Зарегистрируйте ошибку и продолжите.

    Это критически важно для перехватчиков безопасности, которые должны предотвращать опасные команды.
    Например, перехватчик, обнаруживающий `rm -rf /`, должен `exit 2` заблокировать выполнение.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#exit-codes"
- id: 07-002
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое событие ловушки срабатывает ДО запуска инструмента?
  options:
    a: ПреждеToolUse
    b: PreToolUse
    c: ToolStart
    d: OnToolCall
  correct: b
  explanation: |-
    Событие `PreToolUse` срабатывает перед запуском любого инструмента.

    Распространенные типы событий:
    - **PreToolUse**: перед выполнением инструмента (идеально подходит для проверки безопасности).
    - **PostToolUse**: после выполнения инструмента (для форматирования, протоколирования)
    - **UserPromptSubmit**: когда пользователь отправляет сообщение (обогащение контекста).
    - **Notification**: когда Claude отправляет уведомление.
    - **SessionStart/SessionEnd**: события жизненного цикла сеанса.
    - **Stop**: когда пользователь прерывает
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.1 Система событий
    anchor: "#event-types"
- id: 07-003
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как хуки получают входные данные от Claude Code?
  options:
    a: В качестве аргументов командной строки
    b: Как JSON на стандартном вводе
    c: Как переменные среды
    d: Из временного файла
  correct: b
  explanation: |-
    Хуки получают данные JSON на стандартный ввод с информацией о событии.

    Пример структуры ввода:
    ```json
    {
      "tool_name": "Баш",
      "tool_input": {
        "команда": "статус git"
      },
      "session_id": "abc123",
      "cwd": "/project"
    }
    ```

    Хуки обычно анализируют это с помощью: `INPUT=$(cat)`, за которым следует `jq` для извлечения JSON.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#hook-input-stdin-json"
- id: 07-004
  difficulty: senior
  profiles:
  - senior
  - power
  question: В регистрации хука (settings.json), что означает `matcher` поле указать?
  options:
    a: Расширения файлов, которые стоит посмотреть
    b: Шаблон регулярного выражения, для которого инструменты запускают перехват
    c: Уровни разрешений пользователя
    d: Требования к выходному формату
  correct: b
  explanation: |-
    Поле `matcher` представляет собой шаблон регулярного выражения, определяющий, какие инструменты запускают перехват.

    Пример конфигурации:
    ```json
    {
      "matcher": "Bash|Редактировать|Записать",
      "хуки": [{"тип": "команда", "команда": "./hooks/security-check.sh"}]
    }
    ```

    Этот хук сработает для инструментов Bash, Edit или Write.
    Вы можете сопоставить определенные инструменты или использовать `.*` для сопоставления всех инструментов.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#configuration-fields"
- id: 07-005
  difficulty: power
  profiles:
  - power
  question: Каков наилучший вариант использования события-перехвата `UserPromptSubmit`?
  options:
    a: Блокировка опасных команд
    b: Код автоформатирования
    c: Добавление контекста, например статуса git, в каждое приглашение
    d: Воспроизведение звуков уведомлений
  correct: c
  explanation: |-
    Событие `UserPromptSubmit` идеально подходит для обогащения контекста.

    Варианты использования:
    - **UserPromptSubmit**: добавить контекст (статус git, текущая ветка, промежуточные файлы)
    - **PreToolUse**: проверка безопасности (блокировка опасных команд)
    - **PostToolUse**: форматирование, журналирование, проверки качества.
    - **Notification**: звуковые оповещения, уведомления на рабочем столе.

    Пример обогащения контекста добавляет ветку git, последнюю фиксацию и информацию staged/unstaged.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.3 Шаблоны хуков
    anchor: "#template-3-userpromptsubmit-context-enricher"
- id: 07-006
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какой код выхода позволяет продолжить операцию?
  options:
    a: "1"
    b: "0"
    c: "2"
    d: "-1"
  correct: b
  explanation: |-
    Код выхода 0 означает успех и позволяет продолжить операцию.

    Система кодов выхода:
    - **0**: Успех - Разрешить операцию
    - **2**: Блокировать - Запретить работу
    - **Other**: Ошибка. Зарегистрируйтесь и продолжите.

    Всегда заканчивайте свои перехватчики `exit 0`, если хотите разрешить операцию.
    или `exit 2`, чтобы заблокировать его.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#exit-codes"
- id: 07-007
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие команды обычно должен блокировать хук безопасности?
  options:
    a: git status, npm test
    b: rm -rf /, sudo rm, git push --force origin main
    c: компакт-диск, лс, PWD
    d: npm install, pip install
  correct: b
  explanation: |-
    Хуки безопасности должны блокировать такие опасные операции, как:

    - `rm -rf /` или `rm -rf ~` - Уничтожение файловой системы
    - `sudo rm` - Привилегированное удаление
    - `git push --force origin main` - Принудительное нажатие на защищенные ветки
    - `npm publish` - Случайная публикация пакета.
    - `> /dev/sda` или `dd if=` - Прямые операции с диском.

    Должны быть разрешены безопасные команды, такие как `git status`, `npm test`, `ls`.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.4 Хуки безопасности
    anchor: "#recommended-security-rules"
- id: 07-008
  difficulty: power
  profiles:
  - power
  question: Какую структуру JSON должен вернуть перехватчик, чтобы передать сообщение пользователю?
  options:
    a: '{"сообщение": "текст"}'
    b: '{"systemMessage": "текст", "hookSpecificOutput": {...}}'
    c: '{"ответ": "текст"}'
    d: '{"выход": "текст"}'
  correct: b
  explanation: |-
    Хуки возвращают JSON на стандартный вывод с определенными полями:

    ```json
    {
      "systemMessage": "Сообщение, показанное Claude",
      "hookSpecificOutput": {
        "additionalContext": "Дополнительная информация"
      }
    }
    ```

    - `systemMessage`: предупреждающее сообщение, отображаемое пользователю-человеку (не передаваемое в Claude).
    - `hookSpecificOutput.additionalContext`: механизм, который фактически вводит контент в контекстное окно Claude.

    Используйте systemMessage, чтобы предупредить пользователя; используйтеookSpecificOutput.additionalContext (или поле причины решения: блокировать ответ), чтобы передать информацию обратно в Claude.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#hook-output"
- id: 07-009
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков рекомендуемый подход к задачам, требующим «понимания», по сравнению с задачами, основанными на шаблонах?
  options:
    a: Оба должны использовать сценарии Bash
    b: Оба должны использовать агенты ИИ
    c: Использование сценариев bash на основе шаблонов; понимание необходимости использования агентов ИИ
    d: Использование агентов ИИ на основе шаблонов; для понимания необходимо использовать сценарии Bash
  correct: c
  explanation: |-
    Руководство рекомендует правильно выбрать инструмент:

    **Используйте сценарии Bash, когда:**
    - Задачи детерминированы (создать ветку, нажать)
    - На основе шаблонов (проверка секретов с помощью регулярного выражения)
    - Быстро, предсказуемо, без затрат токенов

    **Используйте ИИ-агенты, когда:**
    - Требуется интерпретация (качество проверки кода)
    - Решения, зависящие от контекста
    - Требуется понимание и суждение.

    Правило: «Если вы можете написать для него регулярное выражение, используйте скрипт bash».
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.1 Система событий
    anchor: "#shell-scripts-vs-ai-agents-when-to-use-what"
- id: 07-010
  difficulty: junior
  profiles:
  - junior
  - senior
  - power
  question: Какое событие перехвата срабатывает ПОСЛЕ завершения работы инструмента?
  options:
    a: AfterToolUse
    b: PostToolUse
    c: ИнструментЗавершен
    d: OnToolDone
  correct: b
  explanation: |-
    Событие `PostToolUse` возникает после завершения выполнения любого инструмента.

    Распространенные случаи использования PostToolUse:
    - Автоформатирование кода после правок
    - Запуск линтеров после изменения файлов
    - Использование инструментов регистрации для аудита.
    - Запуск тестов после изменения кода

    Шаблон Auto-Formatter использует PostToolUse для запуска Prettier после операций Edit/Write.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.1 Система событий
    anchor: "#event-types"
- id: 07-011
  difficulty: power
  profiles:
  - power
  question: Как проверить перехватчик безопасности перед его развертыванием?
  options:
    a: Запустите Claude Code и надеюсь, что он сработает.
    b: Протестируйте JSON в скрипте-перехватчике и проверьте код выхода.
    c: Развертывание в рабочей среде и мониторинг
    d: Защитные хуки не могут быть проверены
  correct: b
  explanation: |-
    Протестируйте перехватчики, передав ввод JSON и проверив код выхода:

    ```баш
    # Тестирование с заблокированной командой
    echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"}}' | ./hooks/security-blocker.sh
    echo "Код выхода: $?"  # Должно быть 2

    # Тестируем безопасной командой
    echo '{"tool_name":"Bash","tool_input":{"command":"git status"}}' | ./hooks/security-blocker.sh
    echo "Код выхода: $?"  # Должно быть 0
    ```

    Это гарантирует, что ваш хук правильно блокирует опасные команды перед развертыванием.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.4 Хуки безопасности
    anchor: "#testing-security-hooks"
- id: 07-012
  difficulty: senior
  profiles:
  - senior
  - power
  question: Как следует вызывать перехваты в Windows, чтобы избежать ограничений политики выполнения?
  options:
    a: Запуск от имени администратора
    b: Используйте powershell -ExecutionPolicy Bypass -File script.ps1
    c: Отключить все настройки безопасности
    d: Конвертировать только в пакетные файлы
  correct: b
  explanation: |-
    Хуки Windows должны использовать полный вызов PowerShell:

    ```json
    {
      "тип": "команда",
      "command": "powershell -ExecutionPolicy Bypass -File .claude/hooks/security-check.ps1"
    }
    ```

    Это обходит политику выполнения по умолчанию, которая может блокировать выполнение сценария.
    Пакетные файлы (.cmd) также можно использовать в качестве альтернативы более простым перехватчикам.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.3 Шаблоны хуков
    anchor: "#windows-hook-templates"
- id: 07-013
  difficulty: power
  profiles:
  - power
  question: Что используется в примере перехватчика активности для хранения журналов?
  options:
    a: База данных SQLite
    b: Обычные текстовые файлы
    c: Файлы JSONL (строки JSON)
    d: CSV-файлы
  correct: c
  explanation: |-
    Перехватчик регистрации активности хранит журналы в формате JSONL (строки JSON).

    Ключевые особенности:
    - Логи на `~/.claude/logs/activity-YYYY-MM-DD.jsonl`
    - Каждая запись содержит метку времени, имя инструмента и идентификатор сеанса.
    - Автоматическая очистка логов старше 7 дней.
    - Использует `jq` для конструкции JSON.

    JSONL идеально подходит для файлов журналов, поскольку каждая строка является допустимым объектом JSON.
    что упрощает добавление и анализ.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.5 Примеры хуков
    anchor: "#example-1-activity-logger"
- id: 07-014
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какую единицу измерения использует поле `timeout` при регистрации крюка?
  options:
    a: Миллисекунды
    b: Секунды
    c: Минуты
    d: Токены
  correct: b
  explanation: |-
    Поле `timeout` представляет собой количество секунд до того, как Claude Code отменит перехват.

    ```json
    {
      "тип": "команда",
      "команда": ".claude/hooks/security-check.sh",
      «тайм-аут»: 10
    }
    ```

    Это предотвращает блокировку Claude Code хуком на неопределенный срок. Если это поле опущено, время перехвата команд по умолчанию составляет 600 секунд, перехватов подсказок — 30 секунд, а перехватов агента — 60 секунд. Такое значение, как 5000, будет означать 5000 секунд, а не 5 секунд.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#hook-registration-settingsjson"
- id: 07-015
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какой параметр конфигурации обеспечивает асинхронное выполнение перехватчика (версия 2.1.0+)?
  options:
    a: "фон: правда"
    b: "асинхронный: правда"
    c: "неблокирующий: правда"
    d: "режим: асинхронный"
  correct: b
  explanation: "Начиная с Claude Code v2.1.0, хуки поддерживают `async: true` в своей конфигурации. Это приводит к срабатыванию перехватчика, не блокируя выполнение Claude. Полезно для ведения журналов, уведомлений или аналитических перехватчиков, когда вам не нужно ждать результата, прежде чем продолжить."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Модель выполнения перехвата (v2.1.0+)
    anchor: "#hook-execution-model-v210"
- id: 07-016
  difficulty: power
  profiles:
  - power
  question: Каковы три ограничения асинхронных перехватчиков по сравнению с синхронизирующими перехватчиками?
  options:
    a: Не могу получить доступ к стандартному вводу, не могу записывать файлы, не могу читать переменные среды.
    b: Невозможно заблокировать код выхода 2, не может предоставить обратную связь stdout/systemMessage в реальном времени, не может гарантировать порядок выполнения с другими перехватчиками.
    c: Не могу использовать сеть, не могу запускать процессы, не могу читать файлы
    d: Тайм-аут ограничен 1 с, без захвата stderr, без передачи аргументов.
  correct: b
  explanation: |-
    Асинхронные перехватчики обменивают контроль на скорость. Согласно руководству, они не могут:

    1. **Блокировать Claude при ошибках** - код выхода 2 игнорируется
    2. **Обеспечьте обратную связь в режиме реального времени.** - во время хода нет живого стандартного вывода или системных сообщений.
    3. **Гарантированное выполнение заказа** - заказ с другими хуками не гарантирован.

    Асинхронные перехватчики по-прежнему МОГУТ возвращать дополнительный контекст через вывод JSON; он просто достигает Claude при следующем ходе разговора, а не в реальном времени. Используйте async для некритических операций (ведение журнала, телеметрия). Используйте синхронизацию для шлюзов безопасности, форматирования и проверки.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Ограничения асинхронных хуков
    anchor: "#limitations-of-async-hooks"
- id: 07-017
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какие два события-перехватчика, специфичные для рабочего дерева, добавлены в версии 2.1.50?
  options:
    a: WorktreeInit и WorktreeCleanup (срабатывание сеанса start/end в рабочем дереве)
    b: WorktreeOpen и WorktreeClose (срабатывают, когда вкладка рабочего дерева — opened/closed в VSCode)
    c: WorktreeCreate и WorktreeRemove (срабатывает при создании или удалении рабочего дерева агента, v2.1.50+)
    d: WorktreeMount и WorktreeUnmount (срабатывают при монтировании файловой системы рабочего дерева)
  correct: c
  explanation: |-
    `WorktreeCreate` срабатывает при создании рабочего дерева агента (может блокироваться с ненулевым выходом). `WorktreeRemove` срабатывает, когда рабочее дерево сносится (не может блокироваться). Распространенные случаи использования: `WorktreeCreate` для настройки ветки БД, копирования файлов `.env` или установки зависимостей в новом рабочем дереве. `WorktreeRemove`, чтобы очистить временные учетные данные или удалить соответствующую ветку БД. Эти события включают поля метаданных `worktree` в свою полезную нагрузку JSON.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Типы событий
    anchor: "#event-types"
- id: 07-018
  difficulty: power
  profiles:
  - power
  question: Для чего используются события-перехватчики `TeammateIdle` и `TaskCompleted` в многоагентных рабочих процессах?
  options:
    a: Срабатывает, когда любой фоновый агент приостанавливает работу; срабатывает, когда отмечена задача TodoWrite
    b: TeammateIdle срабатывает, когда член команды агента собирается бездействовать (блокируется); TaskCompleted срабатывает, когда задача помечается как выполненная (блокируемая).
    c: Срабатывает, когда сеанс простаивает в течение 5 минут; срабатывать, когда задание cron завершается
    d: Оба являются перехватчиками уведомлений только для чтения, они не могут блокировать операции.
  correct: b
  explanation: |-
    `TeammateIdle` срабатывает, когда член команды агентов собирается бездействовать, что полезно для координации команды и контроля качества (может блокироваться). `TaskCompleted` срабатывает, когда задача помечается как завершенная, что полезно для обеспечения соблюдения критериев завершения или запуска проверки перед официальным закрытием задачи (может блокироваться). Оба события относятся к многоагентной оркестрации и появляются в таблице типов событий перехватчика вместе с событиями рабочего дерева и жизненного цикла сеанса.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Типы событий
    anchor: "#event-types"
- id: 07-019
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что такое шаблон хука `auto-rename-session.sh` и как он работает?
  options:
    a: Хук PreToolUse, который переименовывает файлы перед тем, как Claude их отредактирует.
    b: Перехватчик SessionStart, который генерирует заголовок сеанса из файла CLAUDE.md.
    c: Перехватчик UserPromptSubmit, который автоматически добавляет к каждому приглашению имя сеанса.
    d: Перехватчик SessionEnd, который считывает JSONL сеанса, вызывает Haiku для создания заголовка и обновляет фрагмент сеанса.
  correct: d
  explanation: |-
    `auto-rename-session.sh` это **Хук SessionEnd** который автоматически генерирует описательный заголовок для каждого сеанса. Он читает файл JSONL сеанса непосредственно из `~/.claude/projects/`, извлекает первые 3 сообщения пользователя, вызывает `claude -p --model claude-haiku-4-5-20251001` создать заголовок из 4-6 слов в `verb + subject` формате, затем обновляет фрагмент сеанса в JSONL для `/resume`. Если Haiku недоступен, он возвращается к очищенному первому сообщению пользователя. Вывод идет через `/dev/tty` обойти Claude Code's JSON parsing.
    ---
  doc_reference:
    file: guide/ultimate-guide.md
    section: Автоматическое переименование сеанса
    anchor: "#session-auto-rename"
- id: 07-020
  difficulty: senior
  profiles:
  - senior
  - power
  question: Какое событие перехвата срабатывает, когда CLAUDE.md или файлы правил загружаются в контекст (v2.1.69+)?
  options:
    a: ConfigChange (срабатывает при каждом изменении файла конфигурации)
    b: InstructionsLoaded (срабатывает, когда файлы CLAUDE.md или .claude/rules/*.md загружаются в контекст, v2.1.69+)
    c: SessionStart (срабатывает при начале сеанса; инструкции являются частью этого события)
    d: PreToolUse (срабатывает перед любым вызовом инструмента, включая чтение файла инструкций)
  correct: b
  explanation: |-
    `InstructionsLoaded` срабатывает, когда файлы CLAUDE.md или `.claude/rules/*.md` загружаются в контекст. Это событие, добавленное в версии 2.1.69, полезно для проверки того, какие инструкции были активны во время сеанса, проверки загрузки необходимых файлов правил или запуска уведомлений при изменении правил. Он срабатывает в начале сеанса (в отличие от `SessionStart`), а также при перезагрузке правил в середине сеанса. Все события перехвата из версии 2.1.69+ также включают поля `agent_id`, `agent_type` и `worktree` для отслеживания субагентов.
    ---
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.69 (2026-03-04)
    anchor: "#v2169-2026-03-04"
- id: 07-021
  difficulty: senior
  profiles:
  - senior
  - power
  question: Поскольку фоновые субагенты по умолчанию начали работать в фоновом режиме, в ловушке уведомлений появилось два новых типа событий, связанных с жизненным циклом агента. Что это такое и когда они стреляют?
  options:
    a: BackgroundStart и BackgroundStop запускаются только для агентов, запущенных с --background.
    b: PermissionRequest и PermissionGranted запускаются, когда фоновый агент получает запрос на разрешение.
    c: SubagentStart и SubagentStop запускаются всякий раз, когда какой-либо субагент создается или завершается.
    d: Agent_needs_input и Agent_completed запускаются, когда фоновому агенту требуется ввод данных или он завершает свою работу.
  correct: d
  explanation: Agent_needs_input срабатывает, когда фоновый сеанс, запущенный из агентов Claude, останавливается и требует ответа пользователя, а Agent_completed срабатывает, когда он завершает свою работу. Оба были добавлены в версии 2.1.198 вместе с субагентами, которые по умолчанию становятся фоновыми, поэтому скрипт-перехватчик может реагировать на эти события вместо того, чтобы пользователь опрашивал панель агентов. SubagentStart/SubagentStop — это отдельная, более старая пара, отслеживающая весь жизненный цикл субагента, а не только уведомления фонового агента, поэтому вариант c неверен. Варианты a и b называют несуществующие типы событий.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.198
- id: 07-022
  difficulty: power
  profiles:
  - senior
  - power
  question: Средство сопоставления перехватов mcp__brave-search перестало ловить все инструменты с этого сервера MCP после обновления до версии 2.1.195. Что изменилось и как восстановить старое покрытие?
  options:
    a: Теперь он более агрессивно сопоставляет подстроки, поэтому «mcp__brave-search» соответствует любому инструменту, содержащему эту строку, включая несвязанные серверы.
    b: Он полностью отключает сопоставление имен, написанных через дефис; дефисы должны быть экранированы обратной косой чертой
    c: Он разбивается на дефисы и сопоставляет каждый сегмент независимо, поэтому «бравый поиск» также соответствует инструменту с именем просто «поиск».
    d: Он переключился на точное сопоставление, поэтому средство сопоставления «mcp__brave-search» больше не перехватывает другие инструменты с этого сервера; вместо этого используйте «mcp__brave-search__.*»
  correct: d
  explanation: В версии 2.1.195 исправлены средства сопоставления перехватчиков для идентификаторов, написанных через дефис, таких как имена серверов и имена инструментов, таких как code-reviewer, которые случайно совпадали с подстроками, а не с точными совпадениями. Средство сопоставления, которое раньше перехватывало все, что содержит mcp__brave-search, теперь соответствует только этой точной строке, поэтому конфигурация, ожидающая широкого охвата сервера MCP с дефисом, молча сужается до ничего полезного. Исправление представляет собой явный шаблон подстановочных знаков mcp__brave-search__.*, который соответствует всем инструментам на этом сервере. Варианты a, b и c описывают поведение сопоставителя, которое никогда не было реализовано.
  doc_reference:
    file: guide/core/claude-code-releases.md
    section: v2.1.195
- id: 07-023
  difficulty: senior
  profiles:
  - senior
  - power
  question: Хук UserPromptSubmit использует лексическую оценку BM25 вместе со средством сопоставления регулярных выражений, чтобы предложить соответствующие навыки. Какую проблему решает BM25, которую не может решить одно только регулярное выражение?
  options:
    a: BM25 оценивает подсказку по сохраненным положительным и отрицательным примерам фраз для каждого навыка, поэтому он улавливает вариации на естественном языке, для предвидения которых никогда не был написан фиксированный шаблон регулярного выражения.
    b: BM25 полностью заменяет средства сопоставления регулярных выражений, поскольку он работает быстрее и не требует настройки для каждого навыка.
    c: BM25 использует нейронную модель внедрения для семантической кластеризации подсказок, требуя сервера вывода на базе графического процессора.
    d: BM25 активируется только тогда, когда в проекте более 50 навыков, поскольку меньшие наборы навыков обрабатываются только с помощью регулярных выражений.
  correct: a
  explanation: Для сопоставления регулярных выражений требуется правило для каждой ожидаемой фразы, поэтому два запроса, означающие одно и то же, но сформулированные по-разному, требуют отдельных шаблонов. Вместо этого BM25 оценивает лексическое совпадение подсказки с тщательно подобранными положительными и отрицательными примерами сценариев, хранящимися для каждого навыка, с пороговыми значениями для каждого навыка, автоматически калибруемыми на основе этого корпуса, поэтому он обобщает фразы, никогда не написанные явно. Он работает вместе с регулярным выражением, а не заменяет его, поскольку регулярное выражение по-прежнему выигрывает для фиксированных шаблонов принудительного применения с высокой степенью достоверности. Это чисто лексический метод оценки без использования встраивания или графического процессора, и он работает всего лишь на основе 8 положительных примеров на каждый навык, а не на пороге размера проекта.
  doc_reference:
    file: guide/workflows/smart-suggest-routing.md
    section: Почему это существует
- id: 07-024
  difficulty: power
  profiles:
  - power
  question: Какую структуру JSON должен вернуть перехватчик, чтобы отправить сообщение обратно в Claude?
  options:
    a: '{"сообщение": "текст"}'
    b: '{"systemMessage": "текст", "hookSpecificOutput": {...}}'
    c: '{"ответ": "текст"}'
    d: '{"выход": "текст"}'
  correct: b
  explanation: |-
    Хуки возвращают JSON на стандартный вывод с определенными полями:

    ```json
    {
      "systemMessage": "Сообщение, показанное Claude",
      "hookSpecificOutput": {
        "additionalContext": "Дополнительная информация"
      }
    }
    ```

    - `systemMessage`: отображается в Claude в качестве контекста.
    - `hookSpecificOutput`: дополнительные структурированные данные.

    Это позволяет хукам предоставлять контекст, который Claude может использовать в своих ответах.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#hook-output"
- id: 07-025
  difficulty: senior
  profiles:
  - senior
  - power
  question: Каков таймаут по умолчанию для перехватчика команды для большинства событий, когда поле `timeout` опущено?
  options:
    a: 5 секунд
    b: 30 секунд
    c: 60 секунд
    d: 600 секунд
  correct: d
  explanation: |-
    Перехваты Command, http и mcp_tool по умолчанию равны 600 секундам. Время перехвата подсказок по умолчанию составляет 30 секунд, а перехватов агента — 60 секунд. В некоторых событиях используются более короткие значения по умолчанию, например `UserPromptSubmit` (30 секунд для перехватчиков команд) и `SessionEnd` (1,5 секунды).

    Задайте `timeout` (в секундах) явно для любого перехвата, который должен быстро завершиться неудачей, например, проверка безопасности, которая выполняется перед каждым вызовом инструмента.
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#hook-registration-settingsjson"
- id: 07-026
  difficulty: power
  profiles:
  - power
  question: 'Хук PreToolUse возвращает `permissionDecision: "defer"`. Что будет дальше и где это работает?'
  options:
    a: Claude в интерактивном режиме запрашивает у пользователя одобрение в любом типе сеанса.
    b: 'Claude приостанавливает работу с помощью stop_reason: "tool_deferred" и ждет --resume; работает только в безголовых сеансах'
    c: Инструмент заблокирован навсегда до конца сеанса.
    d: Claude возвращается к запросу разрешения по умолчанию.
  correct: b
  explanation: 'Решение о разрешении `defer` (v2.1.89+) предназначено исключительно для автономной интеграции. При возврате Claude приостанавливает работу с `stop_reason: "tool_deferred"` и ждет, пока внешний оркестратор соберет входные данные и возобновит сеанс с `--resume <session-id>`. В интерактивных сеансах терминала `defer` игнорируется с предупреждением. Это позволяет осуществлять потоки утверждений, выполняемых человеком, из внешних пользовательских интерфейсов, очередей или систем утверждения, не прерывая сеанс.'
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#hook-output"
- id: 07-027
  difficulty: senior
  profiles:
  - senior
  - power
  question: Когда несколько перехватчиков PreToolUse возвращают конфликтующие решения о разрешениях в версии 2.1.89+, каков правильный порядок приоритета (от самого высокого к самому низкому)?
  options:
    a: разрешить > спросить > отложить > запретить
    b: запретить > спросить > отложить > разрешить
    c: запретить > отложить > спросить > разрешить
    d: спросить > запретить > отложить > разрешить
  correct: c
  explanation: "Начиная с версии 2.1.89, когда несколько перехватчиков PreToolUse возвращают разные значения `permissionDecision`, порядок разрешения следующий: `deny` > `defer` > `ask` > `allow`. Побеждает самое строгое решение. Один перехватчик, возвращающий `deny`, блокирует инструмент, даже если другие перехватчики это позволяют, а `defer` (пауза для внешнего одобрения) имеет приоритет над `ask` (интерактивная подсказка). Проектируйте конвейеры перехватчиков с учетом этого приоритета, чтобы перехватчики безопасности всегда могли переопределить разрешающие."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#hook-output"
- id: 07-028
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что отличает перехватчики в области сеанса от перехватчиков, определенных в settings.json?
  options:
    a: Перехватчики в области сеанса запускаются с повышенными разрешениями и могут обходить шлюзы безопасности.
    b: Перехватчики в области сеанса регистрируются во время выполнения, действуют только для текущего сеанса и никогда не записываются ни в один файл конфигурации.
    c: Перехватчики в области сеанса поддерживают только тип `command`, но не `http` или `agent`.
    d: Перехваты в области сеанса срабатывают до перехватов settings.json во всех событиях.
  correct: b
  explanation: "Перехватчики в области сеанса эфемерны: регистрируются во время выполнения с помощью программного API или навыков во время вызова, они существуют только на время этого сеанса и исчезают, когда он заканчивается. Ничего не пишется ни в `settings.json`, ни в какой-либо конфигурационный файл. Именно так навыки регистрируют временные обратные вызовы во время своего вызова. Как только навык завершится или сессия закончится, эти хуки исчезнут. Перехватчики в области сеанса следуют той же схеме JSON, что и постоянные перехватчики."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.2 Создание хуков
    anchor: "#session-scoped-hooks"
- id: 07-029
  difficulty: power
  profiles:
  - power
  question: Какие пути ВСЕГДА защищены и запрашивают одобрение даже при работе в режиме `bypassPermissions`?
  options:
    a: Файлы .env, пути node_modules/ и /tmp/
    b: .git/, .claude/ (кроме .claude/worktrees/), файлы конфигурации оболочки (.bashrc, .zshrc), .gitconfig, .mcp.json и .claude.json.
    c: Любой файл за пределами текущего рабочего каталога
    d: Только конфигурации производственной базы данных и ключи SSH.
  correct: b
  explanation: "Режим `bypassPermissions` автоматически утверждает все, кроме фиксированного набора всегда защищенных путей. Claude Code всегда будет выдавать запрос перед изменением: каталога `.git/`, каталога `.claude/` (за исключением `.claude/worktrees/`), файлов конфигурации оболочки (`.bashrc`, `.zshrc`, `.bash_profile`, `.profile`) и конфигураций инструментов (`.gitconfig`, `.mcp.json`, `.claude.json`). Этот инвариант безопасности сохраняется независимо от режима разрешений, предотвращая случайное или злонамеренное изменение самого уровня конфигурации."
  doc_reference:
    file: guide/ultimate-guide.md
    section: Режим обхода разрешений (bypassPermissions)
    anchor: "#bypass-permissions-mode-bypasspermissions"
- id: 07-030
  difficulty: senior
  profiles:
  - senior
  - power
  question: Во время чего срабатывает событие перехвата `Setup` и каков его основной вариант использования?
  options:
    a: После первого сообщения пользователя для инициализации инструментов, специфичных для проекта.
    b: На этапе настройки среды в начале сеанса для установки инструментов или проверки предварительных условий до того, как сеанс примет запросы.
    c: При первой загрузке файла CLAUDE.md для проверки содержимого инструкций.
    d: Перед каждым вызовом инструмента для подготовки среды выполнения.
  correct: b
  explanation: Событие `Setup` возникает на этапе настройки среды при запуске сеанса (не после первого сообщения пользователя). Он не может блокировать операции. Его основной вариант использования — установка инструментов, проверка предварительных условий или запуск любой логики инициализации, которая должна завершиться до того, как сеанс начнет принимать запросы пользователя. Это отличается от `SessionStart` (срабатывает при начале или возобновлении сеанса) и от `InstructionsLoaded` (срабатывает при загрузке файла CLAUDE.md).
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.1 Система событий
    anchor: "#event-types"
- id: 07-031
  difficulty: power
  profiles:
  - power
  question: Каков основной выигрыш в производительности от использования поля `if` в перехватчиках по сравнению с обработкой условий внутри сценария перехватчика?
  options:
    a: Поле `if` позволяет параллельное выполнение перехвата для нескольких событий.
    b: Хуки с `if` выполняются в отдельном пуле процессов и никогда не истекают по тайм-ауту.
    c: Поле `if` полностью позволяет избежать создания подпроцесса, когда условие ложно, сокращая накладные расходы, когда события запускаются сотни раз за сеанс.
    d: Поле `if` сжимает выходные данные перехватчика перед отправкой их обратно в Claude.
  correct: c
  explanation: Без `if` каждое событие PostToolUse порождает подпроцесс, даже если логика перехвата немедленно завершает работу, поскольку инструмент не соответствует. В больших репозиториях PostToolUse может запускаться сотни раз за сеанс. Поле `if` оценивается Claude Code перед созданием любого подпроцесса. Когда условие ложно, перехват просто пропускается, полностью исключая порождение подпроцесса. Перемещение фильтра в скрипт-перехватчик с помощью инструкции `case` обеспечивает ту же логику, но все равно требует затрат на каждый раз запуск процесса.
  doc_reference:
    file: guide/ultimate-guide.md
    section: Условные хуки с if (v2.1.85+)
    anchor: "#conditional-hooks-with-if-v2185"
- id: 07-032
  difficulty: senior
  profiles:
  - senior
  - power
  question: Что позволяет сделать событие-перехват `PostCompact`, чего не предоставляет ни один другой перехват жизненного цикла?
  options:
    a: Запретить запуск сжатия контекста, когда контекст все еще мал.
    b: Запуск логики очистки после завершения сеанса и архивации стенограмм
    c: Восстановление метаданных состояния или журнала после завершения сжатия контекста.
    d: Внедрить системные сообщения перед следующим ходом Claude после уплотнения.
  correct: c
  explanation: "`PostCompact` срабатывает после завершения сжатия контекста и не может блокироваться. Это единственное событие-перехватчик, привязанное конкретно к жизненному циклу уплотнения. Его основные случаи использования — восстановление состояния, которое было захвачено перехватчиком `PreCompact` до запуска сжатия, и регистрация метаданных о том, когда и как часто происходит сжатие. Ни `SessionStart`, ни какой-либо другой обработчик жизненного цикла не срабатывает в ответ на событие уплотнения, что делает `PostCompact` подходящим местом для любой логики, которая зависит от знания только что произошедшего уплотнения."
  doc_reference:
    file: guide/ultimate-guide.md
    section: 7.1 Система событий
    anchor: "#event-types"
